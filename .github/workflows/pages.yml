# Déploiement du site sur GitHub Pages.
#
# À utiliser avec Settings → Pages → Source = « GitHub Actions ».
# Contrairement au constructeur historique, chaque exécution est visible dans
# l'onglet Actions avec ses logs : un échec devient diagnosticable.
name: Déploiement Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permet de relancer un déploiement à la main

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploiement:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Envoi du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .           # le dépôt EST le site : rien à construire

      - name: Déploiement
        id: deploiement
        uses: actions/deploy-pages@v4
