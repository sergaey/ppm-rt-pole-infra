  $$('[data-gd]').forEach(el=>el.addEventListener('blur',()=>{const[i,k]=el.dataset.gd.split('|');S.ged[+i][k]=el.textContent.trim();scheduleSave();}));
  $$('[data-gsel]').forEach(sel=>sel.addEventListener('change',()=>{const[i,k]=sel.dataset.gsel.split('|');if(k==='statut'||k==='rubrique'||k==='sousens')logChange('GEDT '+(S.ged[+i].code),k==='sousens'?'sous-ensemble':k,S.ged[+i][k]||'—',sel.value||'—');S.ged[+i][k]=sel.value;renderGED();scheduleSave();}));
  $$('[data-fav]').forEach(b=>b.onclick=()=>{S.ged[+b.dataset.fav].fav=!S.ged[+b.dataset.fav].fav;renderGED();scheduleSave();});
  $$('[data-dl]').forEach(b=>b.onclick=()=>gedDownload(+b.dataset.dl));
  $$('[data-gopen]').forEach(b=>b.onclick=e=>{e.stopPropagation();gedOpen(+b.dataset.gopen);});
  $$('[data-gfn]').forEach(el=>{
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
    el.addEventListener('blur',()=>{ const d=S.ged[+el.dataset.gfn]; if(!d||!d.file) return;
      const anc=d.file.name||''; let nv=el.textContent.trim();
      if(!nv){ el.textContent=anc; return; }
      const extA=(anc.match(/\.[A-Za-z0-9]{1,6}$/)||[''])[0];
      if(extA && !/\.[A-Za-z0-9]{1,6}$/.test(nv)) nv+=extA;   // conserve l'extension
      if(nv===anc){ el.textContent=anc; return; }
      d.file.name=nv; el.textContent=nv;
      logChange('GEDT '+(d.code||''),'renommage fichier',anc,nv);
      renderGED(); scheduleSave(); });
  });
  $$('[data-gpick]').forEach(b=>b.onclick=()=>gedLier([+b.dataset.gpick]));
  // --- Selection multiple : rattacher ou ranger plusieurs documents d'un coup ---
  const gBoxes=()=>$$('[data-gck]');
  const gIdx=()=>gBoxes().filter(c=>c.checked).map(c=>+c.dataset.gck);
  function gSelSync(){
    const n=gIdx().length, bar=$('#gSelBar'); if(!bar) return;
    bar.hidden=!n; const lab=$('#gSelN'); if(lab) lab.textContent=n;
    const all=$('#gAll'); if(all){ const t=gBoxes().length; all.checked=n>0&&n===t; all.indeterminate=n>0&&n<t; }
  }
  gBoxes().forEach(c=>c.addEventListener('change',gSelSync));
  const gAll=$('#gAll'); if(gAll) gAll.addEventListener('change',()=>{ gBoxes().forEach(c=>{c.checked=gAll.checked;}); gSelSync(); });
  const gClear=$('#gSelClear'); if(gClear) gClear.onclick=()=>{ gBoxes().forEach(c=>{c.checked=false;}); gSelSync(); };
  const gLink=$('#gSelLink'); if(gLink) gLink.onclick=()=>gedLier(gIdx());
  /* Telechargement groupe : un seul clic pour toute la selection. Les
     navigateurs refusent une rafale de telechargements simultanes — ils en
     retiennent un seul — d'ou l'envoi espace, un fichier a la fois. */
  const gDl=$('#gSelDl'); if(gDl) gDl.onclick=()=>{
    const idx=gIdx(); if(!idx.length) return;
    if(idx.length>12 && !confirm(idx.length+' téléchargements vont se déclencher l\'un après l\'autre. Continuer ?')) return;
    gDl.disabled=true; const av=gDl.textContent;
    idx.forEach((i,n)=>setTimeout(()=>{
      gedDownload(i);
      gDl.textContent='⭳ '+(n+1)+'/'+idx.length;
      if(n===idx.length-1) setTimeout(()=>{ gDl.disabled=false; gDl.textContent=av; },600);
    }, n*350));
  };
  const gRub=$('#gSelRub'); if(gRub) gRub.onchange=()=>{
    const v=gRub.value; if(!v) return;
    gIdx().forEach(i=>{ const d=S.ged[i]; if(d.rubrique===v) return; logChange('GEDT '+(d.code||''),'rubrique',d.rubrique||'—',v); d.rubrique=v; });
    renderGED(); scheduleSave();
  };
  const gSet=$('#gSelSet'); if(gSet) gSet.onchange=()=>{
    const v=gSet.value; if(!v) return;
    gIdx().forEach(i=>{ const d=S.ged[i]; if(d.sousens===v) return; logChange('GEDT '+(d.code||''),'sous-ensemble',d.sousens||'—',v); d.sousens=v; });
    renderGED(); scheduleSave();
  };
  gSelSync();
  $$('[data-ed]').forEach(b=>b.onclick=()=>gedEdit(+b.dataset.ed));
  $$('[data-gver]').forEach(b=>b.onclick=()=>{const i=+b.dataset.gver;const d=S.ged[i];const nv=(d.version&&/^[A-Y]$/.test(d.version))?String.fromCharCode(d.version.charCodeAt(0)+1):'B';logChange('GEDT '+d.code,'version',d.version,nv);d.statut='Obsolete';S.ged.unshift(Object.assign({},d,{version:nv,statut:'Draft',date:new Date().toLocaleDateString('fr-FR'),file:d.file?Object.assign({},d.file):null}));renderGED();scheduleSave();});
  $$('[data-arch]').forEach(b=>b.onclick=()=>{const d=S.ged[+b.dataset.arch];d.archived=!d.archived;logChange('GEDT '+d.code,'archivage',d.archived?'non':'oui',d.archived?'oui':'non');renderGED();scheduleSave();});
  $$('[data-gdel]').forEach(b=>b.onclick=()=>{const d=S.ged[+b.dataset.gdel];d.deleted=true;d.deletedAt=new Date().toLocaleString('fr-FR');logChange('GEDT '+d.code,'mise à la corbeille',d.code,'');renderGED();scheduleSave();});
  $$('[data-grestore]').forEach(b=>b.onclick=()=>{const d=S.ged[+b.dataset.grestore];d.deleted=false;delete d.deletedAt;logChange('GEDT '+d.code,'restauration','',d.code);renderGED();scheduleSave();});
  $$('[data-gpurge]').forEach(b=>b.onclick=()=>{const d=S.ged[+b.dataset.gpurge];if(confirm('Supprimer DEFINITIVEMENT le document « '+(d.code||'')+' » ? Action irréversible depuis l’appli.')){logChange('GEDT '+d.code,'suppression définitive',d.code,'');S.ged.splice(+b.dataset.gpurge,1);renderGED();scheduleSave();}});
}

/* ---- CDO / CdC / RTM ---- */
const SIG_ROLES=[
  {k:'uf',lab:'Utilisateur final',req:true},
  {k:'hse',lab:'Représentant HSE',reqBpx:false},
  {k:'qo',lab:'Resp. qualité opérationnelle',reqBpx:true},
  {k:'maint',lab:'Resp. maintenance',reqBpx:false},
  {k:'eia',lab:'Représentant EIA',reqBpx:false},
  {k:'qv',lab:'Qualification-Validation',reqBpx:true},
  {k:'cp',lab:'Chef / Directeur de projet',req:true},
  {k:'sp',lab:'Responsable de projet (Sponsor)',req:true}
];
const RTM_COLS=[['cdc','CdC'],['spe','SPE'],['essai','Essai'],['recep','Réception']];
function ensureCDC(id){
  if(!S.cdc)S.cdc={};
  if(!S.cdc[id]){
    const p=S.projects.find(x=>x.id===id)||{};
    const has=norm(p.cdoReal).startsWith('oui');
    S.cdc[id]={cdo:{version:'1.0',statut:has?'Approuvé':'Draft',bpx:true,date:'',auteur:'',sigs:{}},reqs:[]};
  }
  const c=S.cdc[id]; c.cdo=c.cdo||{sigs:{}}; c.cdo.sigs=c.cdo.sigs||{}; c.reqs=c.reqs||[]; return c;
}
function sigRequired(role,bpx){ return role.req || (bpx && role.reqBpx); }
function renderCDC(){
  const opts=S.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===S.currentProj?'selected':''}>${esc(p.shine?p.shine+' — ':'')}${esc(p.nom)}</option>`).join('');
  const p=S.projects.find(x=>x.id===S.currentProj)||S.projects[0];
  if(!p){ view.innerHTML=`<div class="sec-title"><h2>Aucun projet</h2><span class="hint">ajoutez des projets dans &laquo; Project Portfolio &raquo; pour activer cet onglet</span></div><div class="panel"><div class="panel-b"><div class="hint" style="padding:14px 4px">Cet onglet s'appuie sur un projet sélectionné. Commencez par créer un projet.</div></div></div>`; return; }
  const c=ensureCDC(p.id); const cdo=c.cdo;
  const missing=SIG_ROLES.filter(r=>sigRequired(r,cdo.bpx)).filter(r=>!(cdo.sigs[r.k]&&cdo.sigs[r.k].ok&&cdo.sigs[r.k].nom));
  const validable=missing.length===0;
  const covered=c.reqs.filter(r=>RTM_COLS.every(([k])=>r.trace&&r.trace[k])).length;

  view.innerHTML=`
  <div class="sec-title"><h2>CDO / CdC &amp; traçabilité</h2><span class="hint">CDO digital · exigences · matrice Exigence → CdC → SPE → Essai → Réception</span></div>
  <div class="toolbar"><select id="cdcSel" style="min-width:420px;max-width:640px">${opts}</select></div>
  <div class="col3">
    <div class="panel"><div class="panel-h"><h3>CDO digital</h3><span class="meta">CDO fichier : ${esc(p.cdoReal||'—')}</span></div>
      <div class="panel-b">
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px">
          <label>Version <span contenteditable data-cdo="version" style="border-bottom:1px dashed var(--line-2);padding:0 5px" class="mono">${esc(cdo.version)}</span></label>
          <label>Statut <select data-cdostatut style="padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:inherit">${['Draft','En vérification','Approuvé','Obsolete'].map(s=>`<option ${cdo.statut===s?'selected':''}>${s}</option>`).join('')}</select></label>
          <label>Environnement <select data-cdobpx style="padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:inherit"><option value="1" ${cdo.bpx?'selected':''}>BPx</option><option value="0" ${!cdo.bpx?'selected':''}>non-BPx</option></select></label>
          <label>Date <span contenteditable data-cdo="date" class="mono" style="border-bottom:1px dashed var(--line-2);padding:0 5px">${esc(cdo.date||'')}</span></label>
        </div>
        <div class="tblwrap"><table><thead><tr><th>Circuit de signatures</th><th style="width:130px">Nom</th><th style="width:60px">Requis</th><th style="width:56px">Signé</th></tr></thead>
        <tbody>${SIG_ROLES.map(r=>{const req=sigRequired(r,cdo.bpx);const sg=cdo.sigs[r.k]||{};return `<tr>
          <td style="font-size:12.5px">${esc(r.lab)}</td>
          <td contenteditable data-sig="${r.k}|nom">${esc(sg.nom||'')}</td>
          <td>${req?'<span class="pill a">oblig.</span>':'<span class="pill n">si applic.</span>'}</td>
          <td style="text-align:center"><input type="checkbox" data-sigok="${r.k}" ${sg.ok?'checked':''}></td></tr>`;}).join('')}</tbody></table></div>
        <div style="margin-top:10px;font-family:Archivo;font-weight:800;font-size:18px;color:${validable?'var(--good)':'var(--bad)'}">${validable?'✓ CDO validable':'✕ Validation bloquée'}</div>
        ${missing.length?`<div style="font-size:12px;color:var(--bad);margin-top:4px">Signataires obligatoires manquants : ${missing.map(m=>esc(m.lab)).join(', ')}</div>`:''}
        <div class="onepage-note" style="margin-top:8px">Circuit ${cdo.bpx?'<b>BPx</b> : utilisateur final + fonctions soulignées':'<b>non-BPx</b> : utilisateur final + certaines fonctions'} (CDO ETU2601).</div>
      </div></div>
    <div class="panel"><div class="panel-h"><h3>Couverture RTM</h3></div>
      <div class="panel-b">
        <div style="font-family:Archivo;font-weight:800;font-size:30px;color:var(--accent);margin-bottom:2px">${c.reqs.length?fmt(covered/c.reqs.length*100,0):0}%</div>
        <div class="hint">${covered}/${c.reqs.length} exigences couvertes jusqu'à la réception</div>
        <div class="legend" style="margin-top:10px"><span><span class="hdot g"></span>couverte</span><span><span class="hdot r"></span>lacune</span></div>
        <div class="onepage-note" style="margin-top:10px">« Cette exigence du CDO a-t-elle été couverte jusqu'à la réception ? » — matrice ci-dessous.</div>
      </div></div>
  </div>

  <div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Cahier des charges — exigences &amp; traçabilité</h3><button class="iconbtn" id="addReq">+ Exigence</button></div>
    <div class="tblwrap"><table><thead><tr><th style="width:110px">ID</th><th>Description</th><th style="width:90px">Source</th><th style="width:80px">Criticité</th><th style="width:80px">Phase</th>${RTM_COLS.map(c=>`<th style="width:52px;text-align:center">${c[1]}</th>`).join('')}<th style="width:70px">Couv.</th><th style="width:20px"></th></tr></thead>
    <tbody>${c.reqs.length?c.reqs.map((r,i)=>{const cov=RTM_COLS.every(([k])=>r.trace&&r.trace[k]);return `<tr>
      <td class="code" contenteditable data-req="${i}|id">${esc(r.id)}</td>
      <td class="wrap" contenteditable data-req="${i}|desc">${esc(r.desc)}</td>
      <td contenteditable data-req="${i}|source">${esc(r.source||'')}</td>
      <td><select data-reqsel="${i}|crit" style="padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:inherit;font-size:11px">${CRITS.map(x=>`<option ${r.crit===x?'selected':''}>${x}</option>`).join('')}</select></td>
      <td contenteditable data-req="${i}|phase">${esc(r.phase||'')}</td>
      ${RTM_COLS.map(([k])=>`<td style="text-align:center"><input type="checkbox" data-trace="${i}|${k}" ${r.trace&&r.trace[k]?'checked':''}></td>`).join('')}
      <td>${cov?'<span class="pill g">✓</span>':'<span class="pill r">lacune</span>'}</td>
      <td><button class="delbtn" data-reqdel="${i}">×</button></td></tr>`;}).join(''):`<tr><td colspan="11" class="empty">Aucune exigence. « + Exigence ».</td></tr>`}</tbody></table></div>
  </div>
  ${footHTML('cdc',`CDO/CdC · signature liée à la version · matrice de traçabilité exigence → réception (audit &amp; inspection).`)}`;

  $('#cdcSel').addEventListener('change',e=>{S.currentProj=e.target.value;renderCDC();});
  $$('[data-cdo]').forEach(el=>el.addEventListener('blur',()=>{ensureCDC(p.id).cdo[el.dataset.cdo]=el.textContent.trim();scheduleSave();}));
  $('[data-cdostatut]').addEventListener('change',e=>{const c=ensureCDC(p.id);logChange((p.shine||p.nom)+' · CDO','statut',c.cdo.statut,e.target.value);c.cdo.statut=e.target.value;renderCDC();scheduleSave();});
  $('[data-cdobpx]').addEventListener('change',e=>{ensureCDC(p.id).cdo.bpx=e.target.value==='1';renderCDC();scheduleSave();});
  $$('[data-sig]').forEach(el=>el.addEventListener('blur',()=>{const[k]=el.dataset.sig.split('|');const c=ensureCDC(p.id);c.cdo.sigs[k]=c.cdo.sigs[k]||{};c.cdo.sigs[k].nom=el.textContent.trim();scheduleSave();}));
  $$('[data-sigok]').forEach(el=>el.addEventListener('change',()=>{const k=el.dataset.sigok;const c=ensureCDC(p.id);c.cdo.sigs[k]=c.cdo.sigs[k]||{};logChange((p.shine||p.nom)+' · signature '+k,'signé',c.cdo.sigs[k].ok?'oui':'non',el.checked?'oui':'non');c.cdo.sigs[k].ok=el.checked;renderCDC();scheduleSave();}));
  $('#addReq').addEventListener('click',()=>{const c=ensureCDC(p.id);c.reqs.push({id:'EX-'+String(c.reqs.length+1).padStart(3,'0'),desc:'Nouvelle exigence',source:'CDO',crit:'Moyenne',phase:'',trace:{}});renderCDC();scheduleSave();});
  $$('[data-req]').forEach(el=>el.addEventListener('blur',()=>{const[i,k]=el.dataset.req.split('|');ensureCDC(p.id).reqs[+i][k]=el.textContent.trim();scheduleSave();}));
  $$('[data-reqsel]').forEach(sel=>sel.addEventListener('change',()=>{const[i,k]=sel.dataset.reqsel.split('|');ensureCDC(p.id).reqs[+i][k]=sel.value;scheduleSave();}));
  $$('[data-trace]').forEach(el=>el.addEventListener('change',()=>{const[i,k]=el.dataset.trace.split('|');const r=ensureCDC(p.id).reqs[+i];r.trace=r.trace||{};r.trace[k]=el.checked;renderCDC();scheduleSave();}));
  $$('[data-reqdel]').forEach(b=>b.addEventListener('click',()=>{ensureCDC(p.id).reqs.splice(+b.dataset.reqdel,1);renderCDC();scheduleSave();}));
}

});

function setDMsg(el,kind,txt){ if(!el)return; el.className='dmsg '+kind; el.textContent=txt; }
// Enregistre un fichier là où c'est possible : capacité « downloads » de l'artefact
// (fenêtre de confirmation Claude) sinon téléchargement navigateur classique (mode serveur/local).
// Renvoie {ok, how:'capability'|'download', status?, code?}. Aucun repli deviné.
async function saveFile(filename, data){
  let cd=null;
  try{ if(window.claude && typeof window.claude.use==='function') cd=await window.claude.use('downloads'); }catch(_){}
  if(cd){
    try{ const r=await cd.save({filename:filename, data:data}); return {ok:true, how:'capability', status:r&&r.status}; }
    catch(e){ return {ok:false, how:'capability', code:(e&&e.code)||'unavailable'}; }
  }
  try{
    const blob = (data instanceof Blob)? data : new Blob([data],{type:'application/octet-stream'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(_){} },2000);
    return {ok:true, how:'download'};
  }catch(e){ return {ok:false, how:'download', code:String(e&&e.message||e)}; }
}

function wireExportPane(ov){
  const pane=ov.querySelector('[data-dp="export"]');
  const btn=pane.querySelector('[data-xexport]'), msg=pane.querySelector('[data-msg="export"]'),
        stat=pane.querySelector('[data-xstat]'), fb=pane.querySelector('[data-copyfb]'),
        ta=pane.querySelector('[data-copyta]'), cbtn=pane.querySelector('[data-copybtn]');
  stat.textContent=(S.projects||[]).length+' projets · '+(S.members||[]).length+' membres · '+(S.ged||[]).length+' documents · catalogue '+((S.uoCat||[]).length)+' UO';
  cbtn.onclick=()=>{ ta.select(); let done=false; try{ done=document.execCommand('copy'); }catch(_){}
    if(!done && navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(()=>{cbtn.textContent='✓ Copié';},()=>{}); }
    else cbtn.textContent=done?'✓ Copié':'Sélectionnez puis Ctrl+C'; };
  btn.onclick=async()=>{
    fb.hidden=true;
    const data=JSON.stringify(S);
    const fname='ppm_state_'+new Date().toISOString().slice(0,10)+'.json';
    setDMsg(msg,'info','Préparation de l’export ('+Math.round(data.length/1024)+' Ko)…');
    btn.disabled=true;
    const r=await saveFile(fname,data);
    btn.disabled=false;
    if(r.ok){ setDMsg(msg,'ok', r.status==='delivered' ? 'Fichier transmis.' : 'Export réussi : '+fname+'.'); return; }
    if(r.code==='declined'){ setDMsg(msg,'info','Export annulé.'); return; }

    ta.value=data; fb.hidden=false;
    setDMsg(msg,'err','Téléchargement indisponible ('+r.code+'). Copiez le contenu ci-dessous dans un fichier .json.');
  };
}
// Applique un état importé : remplace S puis persiste. Remplacement volontaire =>
// on fait autorité (pas de conflit 409). Aucun confirm() natif (bloqué en artefact).
async function applyStateObject(obj, meta, msgEl){
  // Un import est un remplacement voulu : sa liste de membres fait foi. Sans
  // cela, la mise a niveau du referentiel y reverserait l'amorce du fichier —
  // les membres de demonstration se melangeraient aux vrais.
  if(obj && Array.isArray(obj.members) && obj.members.length) obj.seedRoster=SEED_ROSTER_VERSION;
  try{ S=migrate(obj); }catch(e){ setDMsg(msgEl,'err','Structure inattendue : '+e.message); return; }
  try{ appliquerSeedOP(); migrerBudgetOP(); appliquerCorrSeed(); }
  catch(e){ S._seedErr=String(e&&e.message||e); console.warn('Amorce des One Pages interrompue :',e); }
  S._savedAt=Date.now(); baselineSavedAt=S._savedAt; dirty=false;
  render();
  const ok=await doSave();
  setDMsg(msgEl,'ok','Import réussi : '+meta.n+' projets, '+meta.m+' membres, '+meta.g+' documents chargés.'
                    +(ok?'':' (enregistrement à refaire)'));
}

/* Deux formats circulent : l'export de l'application (l'etat nu) et le
   fichier du serveur local, _ppm_state.json, qui enveloppe ce meme etat dans
   {version, enc, savedAt, state}. Refuser le second n'avait aucun sens : c'est
   precisement le fichier que l'utilisateur a sous la main. */
function etatDuFichier(obj){
  if(!obj || typeof obj!=='object') return null;
  if(Array.isArray(obj.projects)) return obj;
  if(obj.state && Array.isArray(obj.state.projects)) return obj.state;
  return null;
}
function importJSONFile(file, msgEl, confBox){
  if(!file){ return; }
  if(!/\.json$/i.test(file.name)){ setDMsg(msgEl,'err','Sélectionnez un fichier .json.'); return; }
  setDMsg(msgEl,'info','Lecture de « '+file.name+' »…');
  const rd=new FileReader();
  rd.onload=()=>{
    let obj=null; try{ obj=JSON.parse(rd.result); }catch(e){ setDMsg(msgEl,'err','JSON invalide : fichier illisible.'); return; }
    if(obj && obj.enc===1){
      setDMsg(msgEl,'err','Ce fichier est chiffré : il ne peut être lu que par le dossier qui l’a produit. Depuis ce dossier, exportez-le en clair — py -3 _ppm_save_server.py --export-state — ou, dans l’application ouverte par Lancer_PPM.bat, « ⇄ Données → Exporter ».');
      return;
    }
    const etat=etatDuFichier(obj);
    if(!etat){ setDMsg(msgEl,'err','Ce fichier n’est pas un état PPM valide (clé « projects » absente).'); return; }
    askReplace(etat, file.name, msgEl, confBox);
  };
  rd.onerror=()=>setDMsg(msgEl,'err','Lecture du fichier impossible.');
  rd.readAsText(file);
}

  ],

    {k:'nom',lb:'Nom',syn:['nom','name','collaborateur','membre','nomprenom','prenomnom','ressource']},
    {k:'ini',lb:'Initiales',syn:['ini','initiales','trigramme','sigle']},

    {k:'societe',lb:'Société',syn:['societe','entreprise','company','esn','prestataire']},
    {k:'dispo',lb:'Dispo %',syn:['dispo','disponibilite','charge','taux','pourcentage']},
    {k:'depart',lb:'Départ',syn:['depart','sortie','datefin','datesortie']}
  ]
};
const XL_NUM={projects:['c1','c2','b27','act'],members:['dispo']};
// Associe chaque champ cible à la colonne source la plus proche (une colonne = un champ).
function autoMap(headers,target){
  const hn=headers.map(h=>norm(h).replace(/[^a-z0-9]/g,''));
  const used=new Set(), res={};
  XL_FIELDS[target].forEach(f=>{
    let best=-1;
    for(const syn of f.syn){
      for(let i=0;i<hn.length;i++){
        if(used.has(i)||!hn[i]) continue;
        if(hn[i]===syn || (syn.length>=3 && hn[i].indexOf(syn)>=0) || (hn[i].length>=3 && syn.indexOf(hn[i])>=0)){ best=i; break; }
      }
      if(best>=0) break;
    }
    if(best>=0){ res[f.k]=best; used.add(best); }
  });
  return res;
}
// Lit une feuille : détecte la ligne d'en-tête (1re ligne à ≥2 cellules), renvoie {headers, rows}.
function readSheet(XL, wb, name){
  const aoa=XL.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
  let hi=aoa.findIndex(r=>r && r.filter(c=>c!=null&&String(c).trim()!=='').length>=2);
  if(hi<0) hi=0;
  const headers=(aoa[hi]||[]).map((c,i)=>c!=null&&String(c).trim()!==''?String(c).trim():('Colonne '+(i+1)));
  return { headers, rows:aoa.slice(hi+1) };
}
function buildRecords(rows, headers, map, target){
  const numset=new Set(XL_NUM[target]);
  return rows.map(row=>{
    const rec={};
    XL_FIELDS[target].forEach(f=>{
      const ci=map[f.k]; if(ci==null||ci<0) return;
      let v=row?row[ci]:null; if(v==null || String(v).trim()==='') return;
      rec[f.k]= numset.has(f.k) ? parseNum(v) : String(v).trim();
    });
    return rec;
  }).filter(r=> target==='projects' ? (r.nom||r.shine) : (r.nom||r.ini));
}
function normProjectRaw(o){ const p=Object.assign({},o); p.shine=(p.shine==null?'':String(p.shine).trim()); p.id=p.shine||uid(); p.group=poleGroup(p.pole||''); return p; }
function normMemberRaw(o){ const m=Object.assign({},o); if(m.dispo==null||m.dispo==='') m.dispo=100; return m; }
// Câble l'onglet « Importer Excel » de la fenêtre Données (état du classeur en clôture).
function wireExcelPane(ov){
  const pane=ov.querySelector('[data-dp="xlsx"]');
  const inp=pane.querySelector('[data-file="xlsx"]'), drop=pane.querySelector('[data-drop="xlsx"]'),
        msg=pane.querySelector('[data-msg="xlsx"]'), cfg=pane.querySelector('[data-xcfg]'),
        selSheet=pane.querySelector('[data-xsheet]'), mapBox=pane.querySelector('[data-xmap]'), prevBox=pane.querySelector('[data-xprev]');
  let XL=null, wb=null, cur={headers:[],rows:[]};
  const target=()=>pane.querySelector('input[name=xtarget]:checked').value;
  const currentMap=()=>{ const m={}; mapBox.querySelectorAll('select').forEach(s=>{ const v=+s.value; if(v>=0) m[s.dataset.mf]=v; }); return m; };
  function renderPrev(){
    const t=target(), map=currentMap(), fields=XL_FIELDS[t].filter(f=>map[f.k]!=null);
    if(!fields.length){ prevBox.innerHTML='<div style="padding:10px;color:var(--muted);font-size:12px">Aucune colonne associée.</div>'; return; }
    const recs=buildRecords(cur.rows.slice(0,5),cur.headers,map,t);
    prevBox.innerHTML='<table><thead><tr>'+fields.map(f=>`<th>${esc(f.lb)}</th>`).join('')+'</tr></thead><tbody>'+
      (recs.length?recs.map(r=>'<tr>'+fields.map(f=>`<td>${esc(r[f.k]==null?'':r[f.k])}</td>`).join('')+'</tr>').join('')
                  :'<tr><td colspan="'+fields.length+'" style="color:var(--muted)">Aucune ligne exploitable.</td></tr>')+'</tbody></table>';
  }
  function renderMap(){
    const t=target(), auto=autoMap(cur.headers,t);
    mapBox.innerHTML=XL_FIELDS[t].map(f=>{
      const opts=['<option value="-1">(ignorer)</option>'].concat(cur.headers.map((h,i)=>`<option value="${i}"${auto[f.k]===i?' selected':''}>${esc(h)}</option>`)).join('');
      return `<div class="xmap-row"><div class="f">${esc(f.lb)}</div><div class="s"><select data-mf="${f.k}">${opts}</select></div></div>`;
    }).join('');
    mapBox.querySelectorAll('select').forEach(s=>s.onchange=renderPrev);
    renderPrev();
  }
  function loadSheet(name){ try{ cur=readSheet(XL,wb,name); }catch(e){ setDMsg(msg,'err','Feuille illisible : '+e.message); return; } renderMap(); }
  async function onFile(file){
    if(!file) return;
    if(!/\.(xlsx|xls)$/i.test(file.name)){ setDMsg(msg,'err','Sélectionnez un fichier .xlsx ou .xls.'); return; }
    setDMsg(msg,'info','Lecture de « '+file.name+' »…');
    let buf; try{ buf=await file.arrayBuffer(); }catch(e){ setDMsg(msg,'err','Lecture du fichier impossible.'); return; }
    try{ XL=await loadXLSX(); }catch(e){ setDMsg(msg,'err','Bibliothèque Excel indisponible (hors-ligne ?).'); return; }
    try{ wb=XL.read(buf,{type:'array'}); }catch(e){ setDMsg(msg,'err','Fichier Excel illisible.'); return; }
    const names=wb.SheetNames||[]; if(!names.length){ setDMsg(msg,'err','Classeur vide.'); return; }
    selSheet.innerHTML=names.map(n=>`<option>${esc(n)}</option>`).join('');
    cfg.hidden=false; loadSheet(names[0]);
    setDMsg(msg,'info','Vérifiez l’association des colonnes puis cliquez « Importer ».');
  }
  selSheet.onchange=()=>loadSheet(selSheet.value);
  pane.querySelectorAll('input[name=xtarget]').forEach(r=>r.onchange=renderMap);
  drop.onclick=()=>inp.click();
  inp.onchange=()=>{ onFile(inp.files[0]); inp.value=''; };
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');onFile(e.dataTransfer.files[0]);};
  pane.querySelector('[data-ximport]').onclick=async()=>{
    const t=target(), map=currentMap();
    if(!Object.keys(map).length){ setDMsg(msg,'err','Associez au moins une colonne.'); return; }
    let recs=buildRecords(cur.rows,cur.headers,map,t);
    if(!recs.length){ setDMsg(msg,'err','Aucune ligne exploitable détectée.'); return; }
    const mode=pane.querySelector('input[name=xmode]:checked').value;
    if(t==='projects'){ recs=recs.map(normProjectRaw); S.projects = mode==='replace'?recs:(S.projects||[]).concat(recs); }
    else { recs=recs.map(normMemberRaw); S.members = mode==='replace'?recs:(S.members||[]).concat(recs); }
    try{ S=migrate(S); }catch(e){ setDMsg(msg,'err','Normalisation impossible : '+e.message); return; }
    S._savedAt=Date.now(); baselineSavedAt=S._savedAt; dirty=false;
    render(); const ok=await doSave();
    setDMsg(msg,'ok',recs.length+(t==='projects'?' projets':' membres')+' importés ('+(mode==='replace'?'remplacement':'ajout')+').'+(ok?'':' (enregistrement à refaire)'));
  };
}

function wireMajPane(ov){
  const inp=ov.querySelector('[data-file="maj"]'), drop=ov.querySelector('[data-drop="maj"]');
  const msg=ov.querySelector('[data-msg="maj"]'), vz=ov.querySelector('[data-majver]');

  vz.textContent='Version ouverte : '+APP_BUILD_FR+(SRV?'':' · pas de serveur local : rien à remplacer ici.');

    api('/version').then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.build)
      vz.textContent='Version ouverte : '+APP_BUILD_FR+' · fichier du dossier : '+(j.build===APP_BUILD?'la même':j.build)+' ('+j.taille+' octets, '+j.modifie+')';
    }).catch(()=>{});
  }
  const installer=file=>{
    if(!file) return;
    if(!SRV){ dire('err',"Cette fenêtre n'a pas de serveur local : il n'y a pas de dossier où installer le fichier. Passez par Lancer_PPM.bat."); return; }
    if(!/\.html?$/i.test(file.name)){ dire('err','Sélectionnez le fichier .html de l\'application.'); return; }
    dire('info','Lecture de « '+file.name+' » ('+Math.round(file.size/1024)+' Ko)…');
    const rd=new FileReader();
    rd.onerror=()=>dire('err','Lecture du fichier impossible.');
    rd.onload=async()=>{
      const html=String(rd.result||'');
      const m=html.slice(0,4096).match(/PPM_BUILD:(\d{4}-\d{2}-\d{2}(?:\.\d+)?)/);
      if(!m){ dire('err','Ce fichier ne porte pas de marqueur de version PPM : ce n\'est pas l\'application.'); return; }
      const v=m[1].split('.'), vfr=v[0].split('-').reverse().join('/')+(v[1]?' #'+v[1]:'');
      if(m[1]===APP_BUILD && !confirm('Ce fichier porte la version déjà ouverte ('+vfr+').\n\nL\'installer quand même ?')) { dire('info','Installation annulée.'); return; }
      dire('info','Enregistrement des données en cours…');
      if(dirty && !(await doSave())){ dire('err','Vos modifications n\'ont pas pu être enregistrées : installation annulée pour ne rien perdre.'); return; }
      dire('info','Installation de la version '+vfr+'…');
      try{
        const r=await api('/app',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({html:html})});
        const j=await r.json().catch(()=>null);
        if(!r.ok){ dire('err','Installation refusée : '+((j&&j.error)||('erreur '+r.status))); return; }
        dire('ok','Version '+vfr+' installée dans le dossier (ancienne version conservée sous '+(j&&j.garde||'.bak.html')+'). Rechargement…');
        setTimeout(()=>location.replace(location.pathname+'?maj='+Date.now()),1200);
      }catch(e){ dire('err','Serveur injoignable : '+(e&&e.message||e)); }
    };
    rd.readAsText(file);
  };
  drop.onclick=()=>inp.click();
  inp.onchange=()=>{ installer(inp.files[0]); inp.value=''; };
  drop.ondragover=e=>{ e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove('over'); installer(e.dataTransfer.files[0]); };
}
// Onglet « Sécurité » : verrou par mot de passe (chiffrement) de la version autonome.
function wireSecurityPane(ov){
  const host=ov.querySelector('[data-secubody]');
  function view(){
    if(SRV){ host.innerHTML='<p class="lead">Cette application est protégée <b>côté serveur</b> (identifiant + mot de passe). Le verrou local ci-dessous ne concerne que la version autonome (artefact ou fichier ouvert seul).</p>'; return; }
    if(!LOCK_OK){ host.innerHTML='<p class="lead">Le chiffrement local n’est pas disponible dans ce contexte (contexte non sécurisé).</p>'; return; }
    const meta=lockMeta();
    if(LOCK.active || (meta&&meta.active)){
      host.innerHTML=`<p class="lead">🔒 Verrou <b>actif</b>${(meta&&meta.email)?' — compte : <b>'+esc(meta.email)+'</b>':''}. Les données sont chiffrées (AES-256) dans ce navigateur ; le mot de passe est demandé à chaque ouverture.</p>
        <div class="xrow"><button class="af-act" data-lchange>Changer le mot de passe</button><button class="af-act" style="border-color:var(--bad);color:var(--bad)" data-lremove>Retirer le verrou</button></div>
        <div class="dmsg" data-msg="secu"></div>`;
      host.querySelector('[data-lchange]').onclick=()=>form(true);
      host.querySelector('[data-lremove]').onclick=()=>askRemove();
      return;
    }
    form(false);
  }
  function inp(lbl,attr){ return `<label class="lb-f" style="max-width:340px"><span style="display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px">${lbl}</span><input ${attr} style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);font:inherit;font-size:13px"></label>`; }
  function form(isChange){
    host.innerHTML=`<p class="lead">${isChange?'Changer le mot de passe qui chiffre vos données.':'Protège les données de cette version autonome par un mot de passe. Elles seront chiffrées (AES-256) dans ce navigateur — sans le mot de passe, illisibles.'}</p>
      ${inp('E-mail (facultatif, affiché au déverrouillage)','data-le type="email" placeholder="prenom.nom@exemple.com"')}
      ${inp('Mot de passe (12 caractères minimum)','data-lp type="password"')}
      ${inp('Confirmer','data-lp2 type="password"')}
      <button class="savebtn" style="width:auto;padding:9px 18px" data-lgo>${isChange?'Changer':'Activer le verrou'}</button>
      <div class="dmsg" data-msg="secu"></div>`;
    const meta=lockMeta(); if(isChange && meta && meta.email) host.querySelector('[data-le]').value=meta.email;
    const msg=host.querySelector('[data-msg="secu"]');
    host.querySelector('[data-lgo]').onclick=async()=>{
      const email=(host.querySelector('[data-le]').value||'').trim().toLowerCase();
      const p1=host.querySelector('[data-lp]').value, p2=host.querySelector('[data-lp2]').value;
      if(p1.length<12){ setDMsg(msg,'err','Mot de passe : 12 caractères minimum.'); return; }
      if(p1!==p2){ setDMsg(msg,'err','Les deux saisies diffèrent.'); return; }
      try{ await lockActivate(p1,email); }catch(e){ setDMsg(msg,'err','Échec : '+(e&&e.message||e)); return; }
      setDMsg(msg,'ok', isChange?'Mot de passe changé — données re-chiffrées.':'Verrou activé — données chiffrées.');
      setTimeout(view,1000);
    };
  }
  function askRemove(){
    const msg=host.querySelector('[data-msg="secu"]');
    if(host.querySelector('[data-rconf]')) return;
    host.insertAdjacentHTML('beforeend',`<div class="dconf" data-rconf><div class="dconf-t">Retirer le verrou ?</div><div class="dconf-s">Les données ne seront plus chiffrées dans ce navigateur.</div><div class="dconf-b"><button class="af-act" data-rno>Annuler</button><button class="savebtn" style="width:auto;padding:8px 16px" data-ryes>Retirer</button></div></div>`);
    const box=host.querySelector('[data-rconf]');
    box.querySelector('[data-rno]').onclick=()=>box.remove();
    box.querySelector('[data-ryes]').onclick=async()=>{ box.remove(); try{ await lockRemove(); }catch(_){} view(); };
  }
  view();
}

/* ---------- Ouverture directe du fichier : prévenir, faute de pouvoir relier ----------
   Ouvert en file://, le navigateur isole le stockage : cette fenêtre ne voit ni le compte
   ni _ppm_state.json, et rien de ce qui y est saisi ne remonte au dossier partagé. Deux

/* Page en ligne, sans serveur de sauvegarde : dire d'ou viennent les donnees
   affichees et comment charger les siennes. Sans cela, la page donne a croire
   que le portefeuille presente est le vrai. */
function shellWelcome(){

  if(location.protocol==='file:') return;           // cas traite par fileModeWarning()

  const bar=document.createElement('div'); bar.className='filewarn shellwarn';
  bar.innerHTML=`<span class="fw-ic">⇄</span>
    <div class="fw-txt"><b>Version en ligne — vos données ne sont pas ici.</b>
      Cette page est l'application seule ; ce qu'elle affiche est un jeu de démonstration.
      Pour travailler sur vos propres données, chargez votre
      <span class="mono">_ppm_state.json</span> : <b>⇄ Données → Importer JSON</b>.
      Le fichier est lu par votre navigateur et <b>n'est envoyé nulle part</b> ; il reste
      sur ce poste, dans ce navigateur, et se recharge à la visite suivante.</div>
    <button class="fw-go" data-sw-open>⇄ Charger mes données</button>
    <button class="fw-x" title="Ne plus afficher">Masquer</button>`;
  document.body.insertBefore(bar, document.body.firstChild);
  bar.querySelector('[data-sw-open]').onclick=()=>{ openDataHub('json'); };
  bar.querySelector('.fw-x').onclick=()=>{ try{localStorage.setItem('ppm_welcome','0');}catch(_){} bar.remove(); };

/* « MAJ » : l'application ouverte ne sait pas que le fichier HTML a ete
   remplace — le navigateur garde en memoire la page chargee au depart. Ce
   bouton demande sa version au serveur, qui relit le fichier du dossier, et
   recharge la page si elle a change. Rien n'est recharge tant que des
   modifications ne sont pas enregistrees : la mise a jour ne doit jamais
   couter une saisie. */
function majDire(txt){ const b=$('#majBtn'); if(b) b.textContent=txt; }
async function majApp(){
  const b=$('#majBtn'); if(b) b.disabled=true;
  const rendre=()=>{ majDire('⟳ MAJ'); if(b) b.disabled=false; };
  try{
    if(dirty){
      majDire('⟳ enregistrement…');
      const ok=await doSave();
      if(!ok){
        rendre();
        alert("Vos modifications n'ont pas pu être enregistrées : la mise à jour est annulée pour ne rien perdre.\n\nRéessayez « Enregistrer », puis relancez la MAJ.");
        return;
      }
    }
    let dispo=null;
    if(SRV){
      majDire('⟳ vérification…');
      try{ const r=await api('/version'); if(r.ok){ const j=await r.json(); dispo=j&&j.build||null; } }catch(_){}
    }
    if(SRV && dispo && dispo===APP_BUILD){
      // Application deja a jour : il reste a rapatrier l'etat enregistre ailleurs.
      majDire('⟳ synchronisation…');
      await syncFromServer(true);
      majDire('✓ à jour');
      setTimeout(rendre,2500);
      return;   // pour installer une version plus récente : ⇄ Données → Mise à jour
    }
    majDire('⟳ rechargement…');
    if(location.protocol==='file:') location.reload();
    else location.replace(location.pathname+'?maj='+Date.now());
  }catch(e){
    rendre();
    alert('Mise à jour impossible : '+(e&&e.message||e));
  }
}
/* Plein écran. Sur l'écran d'un portable, la barre du navigateur coûte deux
   lignes de tableau ; en projection, elle n'a rien à y faire. On peut en
   sortir par Échap ou F11 sans passer par le bouton : l'état affiché suit donc
   l'état réel, et non ce que le bouton croit avoir fait. */
function pleinEcranActif(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function majPleinEcran(){
  const on=pleinEcranActif();
  const b=document.getElementById('fsBtn');
  if(b){ b.textContent = on?'⛶ Quitter le plein écran':'⛶ Plein écran';
         b.title = on?"Revenir à l'affichage normal (Échap)":"Plein écran : la barre du navigateur disparaît — utile en projection et sur l'écran d'un portable"; }
  const f=document.querySelector('[data-foot-act="fs"]');
  if(f){ f.textContent = on?'⛶ Quitter':'⛶ Plein écran';
         f.title = on?"Revenir à l'affichage normal (Échap)":'Plein écran : la barre du navigateur disparaît — projection, petit écran (F11)'; }
  document.documentElement.classList.toggle('plein', on);
}
async function basculerPleinEcran(){
  try{
    if(pleinEcranActif()){
      const sortie = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      await sortie.call(document);
    } else {
      const e=document.documentElement;
      const entree = e.requestFullscreen || e.webkitRequestFullscreen || e.msRequestFullscreen;
      if(!entree) throw new Error('non pris en charge par ce navigateur');
      await entree.call(e, {navigationUI:'hide'});
    }
  }catch(err){
    alert("Le plein écran n'a pas pu être activé : "+((err&&err.message)||err)
      +"\n\nLa touche F11 fait la même chose, et n'est jamais bloquée.");
  }
  majPleinEcran();
}
['fullscreenchange','webkitfullscreenchange','msfullscreenchange']
  .forEach(ev=>document.addEventListener(ev,majPleinEcran));

      les deux ne peuvent pas être synchronisés. Passez par le serveur pour retrouver votre travail.</div>
    <a class="fw-go" href="${url}">Ouvrir la version partagée →</a>
    <button class="fw-x" title="Masquer cet avertissement">Masquer</button>`;
  document.body.insertBefore(bar, document.body.firstChild);
  bar.querySelector('.fw-x').onclick=()=>bar.remove();
}
