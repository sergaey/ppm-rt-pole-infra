/* Corriger une amorce déjà posée.

   Une donnée fournie se corrige parfois après coup — un numéro WBS qui
   arrive, une enveloppe revue. Reposer l'amorce entière écraserait le travail
   fait depuis ; ne rien faire laisserait la carte fausse. Chaque correction
   dit donc ce qu'elle remplace, et ne s'applique que si la valeur en place est
   encore celle qui avait été semée. Retouchée depuis, elle est laissée telle
   quelle — et la correction est comptée comme traitée, pour ne pas revenir
   dessus à chaque chargement.

   Le chemin désigne un emplacement de la carte : « bucketRef.capex.0 », ou
   sous « lignes », soit « * » pour toutes les lignes, soit le nom d'un
   sous-projet. */
function idcCibles(d,chemin,p){
  const c=chemin.split('.');
  /* « projet.c1 » vise la fiche du projet, « kit.budget.<rôle>.<n> » une ligne
     du bloc budget du One Page ; tout le reste vise la carte elle-même. */
  if(c[0]==='projet') return p?[{o:p, k:c[1]}]:[];
  if(c[0]==='kit'&&c[1]==='budget'&&p){
    const o=opOf(p.id), r=opLigne(o,c[2]);
    return r?[{o:r.values, k:+c[3]||0}]:[];
  }
  if(c[0]!=='lignes') return [{o:idcParent(d,c), k:c[c.length-1]}];
  const sel=c[1], reste=c.slice(2);
  const lot=(sel==='*') ? (d.lignes||[]) : (d.lignes||[]).filter(l=>norm(l.nom||'')===norm(sel));
  return lot.map(l=>({o:idcParent(l,reste), k:reste[reste.length-1]})).filter(x=>x.o);
}
function idcParent(o,c){ return c.slice(0,-1).reduce((x,k)=>(x==null?x:x[k]), o); }
function appliquerCorrSeed(){
  if(typeof SEED_OP!=='object'||!SEED_OP) return 0;
  S.corrSeed=S.corrSeed||{};
  let n=0;
  Object.keys(SEED_OP).forEach(cle=>{
    const e=SEED_OP[cle];
    if(!Array.isArray(e.corr)||!e.corr.length) return;
    const pid=(S.opSeeded||{})[cle];
    if(!pid) return;                                  // amorce jamais posée ici
    const p=S.projects.find(x=>x.id===pid&&!x.deleted);
    if(!p||!(S.idc&&S.idc[pid])) return;
    const d=idcOf(pid);
    e.corr.forEach((c,i)=>{
      const marque=cle+'#'+(c.id||i);
      if(S.corrSeed[marque]) return;
      S.corrSeed[marque]=1;
      let faits=0; const avant=[];
      idcCibles(d,c.quoi,p).forEach(({o,k})=>{
        if(!o) return;
        const av=o[k]==null?'':String(o[k]);
        // « * » : la valeur est posée quelle qu'elle soit. Réservé au cas où
        // l'utilisateur a demandé explicitement ce chiffre-là, et où la valeur
        // en place n'est pas celle qu'on croyait.
        if(c.de!=='*' && av!==String(c.de)) return;   // valeur retouchée : on n'y touche pas
        if(avant.indexOf(av)<0) avant.push(av);       // ce qu'on remplace, pour la trace
        o[k]=(c.type==='n')?(+c.vers):c.vers;         // un budget reste un nombre
        faits++;
      });
      if(faits){ n++;
        logChange('ID Card — '+(p.shine||p.nom),'correction de l’amorce',avant.join(', '),
                  String(c.vers)+(faits>1?' ('+faits+' lignes)':'')); }
    });
  });
  return n;
}
function appliquerSeedOP(){
  if(typeof SEED_OP!=='object'||!SEED_OP) return 0;
  S.opSeeded=S.opSeeded||{};
  let n=0;
  Object.keys(SEED_OP).forEach(cle=>{
    const e=SEED_OP[cle], p=opSeedProjet(e);
    if(!p) return;                                  // projet absent de ce portefeuille
    /* La frise, le budget et le passeport ne se posent qu'une fois : les
       refondre ramènerait des jalons qu'on a retirés depuis. Le cahier des
       objectifs, lui, est retenté à chaque ouverture — il ne comble que le
       vide, donc il n'a rien à écraser, et une zone restée blanche finit par
       recevoir son texte. */
    const neuf=!S.opSeeded[cle];
    const o=opOf(p.id), pp=ensurePP(p.id);
    S.opSeeded[cle]=p.id;
    let pose=[];
    /* Une ID Card fournie — bucket ou projet. Le cahier des objectifs comble
       zone par zone ce qui est resté blanc ; un texte écrit depuis n'est
       jamais remplacé. C'était autrefois tout ou rien : un seul mot posé
       quelque part sur la carte suffisait à écarter le cahier entier, et on
       n'y revenait plus. */
    if(e.idc){
      const d=idcOf(p.id), s=e.idc;
      const comble=(k,v)=>{ if(v && !String(d[k]||'').trim()){ d[k]=v; return 1; } return 0; };
      if(Array.isArray(s.lignes) && s.lignes.length){
        if(!(d.lignes||[]).length){
          d.bucket=true;
          d.lignes=JSON.parse(JSON.stringify(s.lignes)).map(l=>Object.assign({capex:['',''],opex:['','']},l));
          if(s.bucketRef) d.bucketRef=JSON.parse(JSON.stringify(s.bucketRef));
          if(s.gap) d.gap=s.gap;
          comble('nom',p.nom); comble('code',p.shine||p.ishift);
          pose.push(d.lignes.length+' sous-projet'+(d.lignes.length>1?'s':'')+' de la bucket');
        }
      } else {
        const k=idcPoserCDO(d,s,p);
        if(k) pose.push(k+' zone'+(k>1?'s':'')+' de l\u2019ID Card depuis le CDO');
      }
    }
    if(neuf && e.op && opVierge(o)){
      const src=JSON.parse(JSON.stringify(e.op));
      o.wbs=src.wbs.map(w=>{ const r=Object.assign({id:kuid()},w);
        if(r.type==='milestones') r.milestones=(r.milestones||[]).map(m=>Object.assign({id:kuid()},m));
        return r; });
      o.budget={years:src.budget.years.slice(),
        rows:src.budget.rows.map(r=>Object.assign({id:kuid()},r,{values:r.values.slice()}))};
      o.ach=(src.ach||[]).slice();
      o.ganttStart=src.ganttStart||''; o.ganttEnd=src.ganttEnd||''; o.endMarker=src.endMarker||'';
      pose.push('frise, budget et réalisations');
    }
    /* Jalons, risques et prochaines étapes se fondent dans le passeport : on
       ne refond qu'une fois, sans quoi ce qu'on en a retiré reviendrait. */
    if(neuf){
      const q=JSON.parse(JSON.stringify(e.pp||{}));
      const a=opFondre(pp.milestones,q.milestones,x=>x.name);
      const b=opFondre(pp.risks,q.risks,x=>x.desc);
      pp.nextSteps=(pp.nextSteps||[]).map(nsNorm);
      const c=opFondre(pp.nextSteps,(q.nextSteps||[]).map(nsNorm),x=>x.t);
      if(a) pose.push(a+' jalon'+(a>1?'s':''));
      if(b) pose.push(b+' risque'+(b>1?'s':''));
      if(c) pose.push(c+' étape'+(c>1?'s':''));
    }
    if(!pp.statusTxt && e.statusTxt){ pp.statusTxt=e.statusTxt; pose.push('commentaire de statut'); }
    if(!p.hoverride && e.sante){ p.hoverride=e.sante; pose.push('santé'); }
    if(!pose.length) return;                        // tout était déjà là
    logChange('One Page — '+(p.shine||p.nom),'reprise du One Page fourni','',pose.join(' · '));
    n++;
  });
  return n;
}

/* Le kit d'un projet, créé depuis le gabarit à la première ouverture puis
   complété : une structure absente d'un ancien fichier ne doit jamais faire
   échouer le rendu. */
function kitOf(id){
  S.kits=S.kits||{};
  if(!S.kits[id]){
    const t=JSON.parse(JSON.stringify(KIT_TPL)), M=kitMois(12);
    S.kits[id]={
      phases:t.phases.map(p=>({id:kuid(),name:p.name,rows:p.rows.map(r=>({id:kuid(),task:r.task,owner:r.owner,status:r.status,notes:r.notes}))})),
      people:t.people.map(p=>({id:kuid(),role:p.role,name:'',level:p.level})),
      budgetGroups:t.budgetGroups.map(g=>({id:kuid(),name:g.name,section:g.section,rows:[]})),
      months:M,
      groups:t.groups.map(g=>({id:kuid(),name:g.name,rows:g.rows.map(r=>({id:kuid(),name:r.name,values:M.map(()=>0)}))})),
      milestones:t.milestones.map((m,i)=>({id:kuid(),name:m.name,date:'',owner:'',notes:'',colorIndex:i})),
      tasks:[], dnd:0.1, dailyRate:550, jpf:20
    };
  }
  const k=S.kits[id];
  k.phases=Array.isArray(k.phases)?k.phases:[]; k.people=Array.isArray(k.people)?k.people:[];
  k.budgetGroups=Array.isArray(k.budgetGroups)?k.budgetGroups:[]; k.tasks=Array.isArray(k.tasks)?k.tasks:[];
  k.milestones=Array.isArray(k.milestones)?k.milestones:[]; k.groups=Array.isArray(k.groups)?k.groups:[];
  k.months=(Array.isArray(k.months)&&k.months.length)?k.months:kitMois(12);
  if(k.dnd==null)k.dnd=0.1; if(k.dailyRate==null)k.dailyRate=550; if(k.jpf==null)k.jpf=20;
  k.groups.forEach(g=>{ g.rows=g.rows||[]; g.rows.forEach(r=>{
    r.values=Array.isArray(r.values)?r.values:[];
    while(r.values.length<k.months.length) r.values.push(0);
    r.values.length=k.months.length; }); });
  k.milestones.forEach((m,i)=>{ if(!Number.isInteger(m.colorIndex)) m.colorIndex=i; });
  return k;
}

/* ---- Organigramme ----
   Un arbre, et non une grille : le sponsor en tête, puis les niveaux reliés
   par un tronc et une barre de liaison. Chaque fonction est une carte, avec
   ses initiales ; une fonction sans titulaire se voit du premier coup d'œil
   et se compte. Les cartes se déplacent d'un niveau à l'autre à la souris. */
const ORG_INI=n=>{
  /* Un nom saisi à la main porte parfois une civilité et une société :
     « M. Durand (SPIE) ». On ne garde que les mots qui sont des noms. */
  const m=String(n||'').replace(/\([^)]*\)/g,' ').trim().split(/[\s'’-]+/)
    .filter(w=>/^[\p{L}]{2,}$/u.test(w) && !/^(m|mme|mr|dr|monsieur|madame|entreprise|societe|société)$/i.test(w));
  if(!m.length) return '—';
  return ((m[0][0]||'')+(m.length>1?(m[m.length-1][0]||''):'')).toUpperCase();
};
/* Retrouver la fiche du référentiel correspondant à un nom saisi. La casse et
   les accents varient d'une saisie à l'autre ; la comparaison les ignore. */
function memTrouve(nom){
  const k=norm(nom||'').replace(/\s+/g,' ').trim();
  if(!k) return null;
  return (S.members||[]).find(m=>norm(m.nom||'').replace(/\s+/g,' ').trim()===k)||null;
}

/* Rattacher une fonction à un autre niveau en déplaçant sa carte. */
function kitArmerOrga(){

  // pointant vers le vide : seule la première ligne est reliée à la barre.
  $$('#kitPane .orgr').forEach(r=>{

  });
}

/* ---- Macroplanning ---- */
let kitAxe={start:0,end:0};
function kitMacro(k){
  const dd=s=>Date.parse(s+'T00:00:00Z');
  const ok=k.tasks.filter(t=>t.start&&t.end&&t.end>=t.start);
  const dates=[...ok.flatMap(t=>[dd(t.start),dd(t.end)]), ...k.milestones.filter(m=>m.date&&Number.isFinite(dd(m.date))).map(m=>dd(m.date))];
  let lo,hi;
  if(dates.length){ lo=Math.min(...dates); hi=Math.max(...dates); }
  else { lo=Date.now(); hi=lo+864e5*365; }
  const s0=new Date(lo); s0.setUTCDate(1); const e0=new Date(hi); e0.setUTCMonth(e0.getUTCMonth()+1,1);
  const A=+s0, B=+e0; kitAxe={start:A,end:B};
  const pc=v=>(v-A)/(B-A)*100;
  const mois=[]; for(let m=new Date(A); +m<B; m.setUTCMonth(m.getUTCMonth()+1)) mois.push(new Date(m));
  const lignesMois=mois.map(m=>`<i class="kmonth" style="left:${pc(+m)}%"></i>`).join('');
  let g=`<div class="kaxis">${mois.map(m=>{const n=new Date(m);n.setUTCMonth(n.getUTCMonth()+1);
      return `<div style="width:${pc(+n)-pc(+m)}%">${m.toLocaleDateString('fr-FR',{month:'short',year:'2-digit',timeZone:'UTC'})}</div>`;}).join('')}</div>`;
  k.milestones.forEach((m,i)=>{ const pose=m.date&&Number.isFinite(dd(m.date));
    g+=`<div class="krow" data-kms-lane="${i}">${lignesMois}
      <button class="kms${pose?'':' libre'}" data-kms="${i}" style="left:${pose?pc(dd(m.date))+'%':'0'}" title="${esc(m.name)}${pose?' · '+esc(m.date):' — sans date : glissez-le sur la frise ou saisissez la date ci-dessous'}">
      <i></i><span>${esc(m.name)}${pose?' · '+new Date(dd(m.date)).toLocaleDateString('fr-FR',{timeZone:'UTC'}):''}</span></button></div>`; });
  k.tasks.forEach(t=>{
    if(!(t.start&&t.end&&t.end>=t.start)){ g+=`<div class="krow"><span class="knodate">${esc(t.name)} · dates à renseigner</span></div>`; return; }
    const l=pc(dd(t.start)), w=Math.max(.4, pc(dd(t.end)+864e5)-l);
    g+=`<div class="krow">${lignesMois}<div class="kbar ${esc(t.kind||'activity')}" style="left:${l}%;width:${w}%">
      <i style="width:${+t.progress||0}%"></i><span><b>${+t.progress||0} %</b> ${esc(t.name)}</span></div></div>`; });
  if(!k.tasks.length && !k.milestones.length) g+=`<div class="krow"><span class="knodate">Aucune activité ni jalon — ajoutez-en ci-dessous.</span></div>`;
  let h=`<div class="kgantt">${g}</div>
    <div class="klegend"><span><i style="background:var(--accent)"></i>Activité</span>
      <span><i style="background:#b0651f"></i>Coordination</span>
      <span><i style="background:#7d4f9e"></i>Gate</span>
      <span><i style="background:var(--copper);transform:rotate(45deg)"></i>Jalon — glissable</span></div>
    <div class="kbar-tools" style="margin-top:14px"><b>Activités</b>${kbtn('addTask','+ Activité')}</div>
    <table class="ktbl"><thead><tr><th>Activité</th><th style="width:118px">Début</th><th style="width:118px">Fin</th>
      <th style="width:120px">Type</th><th style="width:80px">Avanc. %</th><th style="width:120px">Pilote</th><th style="width:26px"></th></tr></thead><tbody>`;
  k.tasks.forEach((t,i)=>{ const p=`tasks.${i}`;
    h+=`<tr><td>${kinp(p+'.name')}</td><td>${kinp(p+'.start','date','data-kr="macro"')}</td><td>${kinp(p+'.end','date','data-kr="macro"')}</td>
      <td><select class="kin" data-kp="${p}.kind" data-kr="macro">${KIT_KINDS.map(([v,l])=>`<option value="${v}" ${v===(t.kind||'activity')?'selected':''}>${l}</option>`).join('')}</select></td>
      <td>${kinp(p+'.progress','number','data-kr="macro"')}</td><td>${kinp(p+'.owner')}</td>
      <td><button class="kdel" data-ka="delTask|${i}">✕</button></td></tr>`; });
  if(!k.tasks.length) h+=`<tr><td colspan="7" class="empty">Aucune activité.</td></tr>`;

  k.milestones.forEach((m,i)=>{ const p=`milestones.${i}`;
    h+=`<tr><td>${kinp(p+'.name','text','data-kr="macro"')}</td><td>${kinp(p+'.date','date','data-kr="macro"')}</td>

/* ---- Synthèse du kit, reprise dans la fiche projet ---- */
function kitSynthese(k){
  const all=k.phases.flatMap(p=>p.rows), fait=all.filter(r=>r.status==='Fait').length;
  const net=Math.max(1,all.length-all.filter(r=>r.status==='NA').length);
  const bud=ksum(k.budgetGroups.flatMap(g=>g.rows.map(r=>(+r.y1||0)+(+r.y2||0))))+kitDnd(k,'y1')+kitDnd(k,'y2');
  const fte=ksum(k.groups.flatMap(g=>g.rows.flatMap(r=>r.values)));
  const jal=k.milestones.filter(m=>m.date).length;
  return {av:Math.round(fait/net*100), actions:all.length, fait, bud, fte, jours:fte*k.jpf,
          equipe:k.people.filter(p=>String(p.name||'').trim()).length, jal, nbJal:k.milestones.length,
          taches:k.tasks.length};

/* Redessiner le volet sans perdre la frappe : les champs du kit n'ont pas
   d'identifiant, on les retrouve par leur chemin. */
function renderKitGarde(){
  const a=document.activeElement;

/* Glisser un jalon sur la frise pour le dater : le geste de l'outil d'origine. */
function kitArmerJalons(){
  $$('#kitPane [data-kms]').forEach(b=>{
    b.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      const lane=b.closest('.krow'), i=+b.dataset.kms, k=kitOf(S.currentProj);
      const bouger=ev=>{
        const r=lane.getBoundingClientRect();
        const x=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));
        const t=kitAxe.start+(kitAxe.end-kitAxe.start)*x;
        b.style.left=(x*100)+'%';
        b.dataset.kdate=new Date(t).toISOString().slice(0,10);
      };
      const finir=ev=>{
        document.removeEventListener('pointermove',bouger); document.removeEventListener('pointerup',finir);
        if(b.dataset.kdate){ k.milestones[i].date=b.dataset.kdate;
          logChange('Jalon '+(k.milestones[i].name||''),'date','',b.dataset.kdate);
          scheduleSave(); renderKit(); }
      };
      document.addEventListener('pointermove',bouger); document.addEventListener('pointerup',finir);
    });
  });
}

/* ======================= One Page projet =======================
   Reprise de l'outil « One Page Projet — CSD » : la page unique de revue,
   avec sa frise WBS, son statut projet, ses jalons, son budget par exercice,
   ses réalisations, ses risques et ses prochaines étapes.

   Harmonisation plutôt que duplication : les jalons, les risques, les
   prochaines étapes et le commentaire de statut sont ceux de la fiche projet —
   saisis ici, ils s'affichent là, et inversement. Le statut projet pilote le
   forçage de santé du portefeuille. Seuls la frise WBS, le budget par exercice
   et les réalisations sont propres à cette vue. */
const OP_BARC=["#16a34a","#f59e0b","#14b8a6","#ec4899","#3b82f6","#8b5cf6","#a78bfa","#eab308","#ef4444","#64748b"];
const OP_MSC =["#8b5cf6","#ef4444","#f59e0b","#16a34a","#14b8a6","#3b82f6","#eab308","#64748b"];
const OP_ST=["Done","WIP","Not started","Late"];
/* Hauteur de la bande des jalons. Les gates du process RT se suivent de pres :
   sans trois niveaux de pose, leurs libelles se recouvrent et la frise devient
   illisible la ou elle est la plus dense. topPct 0 / 50 / 100 = les trois niveaux. */
const OP_MSH=78;
const OP_PROG=["Done","In progress","Late","Not started"];
const OP_STATUSES=[{k:'ok',c:'ok',l:'On Track',h:'g'},
                   {k:'att',c:'att',l:"Attention point\nadditional actions required",h:'a'},
                   {k:'risk',c:'risk',l:'At Risk, strong action required',h:'r'}];
const opISO=d=>{const z=new Date(d);return isNaN(z)?'':z.toISOString().slice(0,10);};
const opD=s=>{const t=Date.parse(String(s||'')+'T00:00:00Z');return Number.isFinite(t)?t:null;};
const opFR=s=>{const t=opD(s);return t==null?'':new Date(t).toLocaleDateString('fr-FR',{timeZone:'UTC'});};
/* Le volet One Page d'un projet, créé à la première ouverture. Le budget part
   des montants déjà connus du portefeuille : les ressaisir n'aurait aucun sens. */
function opOf(id){
  const k=kitOf(id); const p=S.projects.find(x=>x.id===id)||{};
  if(!k.op){
    const an='Capex '+new Date().getFullYear();
    k.op={ wbs:[{id:kuid(),type:'milestones',name:'RT Process Ingénierie',milestones:[],status:''},
                {id:kuid(),type:'bar',name:'Études',start:'',end:'',label:'',color:OP_BARC[4],status:'WIP'}],
      budget:{years:[an],rows:[
        {id:kuid(),role:'budget',label:'Budget Value',values:[+p.c1||0]},
        {id:kuid(),role:'act',   label:'Actuals Amount',values:[+p.act||0]},
        {id:kuid(),role:'commit',label:'Open Commitments',values:[+p.commit||0]},
        {id:kuid(),role:'dispo', label:'Available Amount',values:[0]},
        {id:kuid(),role:'final', label:'Final Cost',values:[Math.round(atterrissage(p))],total:true}]},
      ach:[], endMarker:'', todayMarker:'' };
  }
  const o=k.op;
  o.wbs=Array.isArray(o.wbs)?o.wbs:[]; o.ach=Array.isArray(o.ach)?o.ach:[];
  o.budget=o.budget||{years:[],rows:[]};
  o.budget.years=Array.isArray(o.budget.years)?o.budget.years:[];
  o.budget.rows=Array.isArray(o.budget.rows)?o.budget.rows:[];
  o.budget.rows.forEach(r=>{ r.values=Array.isArray(r.values)?r.values:[];
    while(r.values.length<o.budget.years.length) r.values.push(0); r.values.length=o.budget.years.length; });
  o.wbs.forEach(r=>{ if(r.type==='milestones') r.milestones=Array.isArray(r.milestones)?r.milestones:[]; });
  return o;
}
/* Le bloc budget porte cinq lignes de sens fixe : la dotation, ce qui est
   dépensé, ce qui est engagé sans l'être encore, ce qui reste et
   l'atterrissage. Le rôle est tenu par la ligne, pas par son libellé — celui-ci
   reste libre, et une page ancienne garde le sien. */
const OP_BROLES=[['budget','Budget Value'],['act','Actuals Amount'],
                 ['commit','Open Commitments'],['dispo','Available Amount'],['final','Final Cost']];
/* Rôle d'une ligne dont le fichier n'en porte pas encore : déduit du libellé,
   y compris des intitulés d'origine (« YTD Commit. », « Spent »). */
function opRole(rw){
  if(rw.role) return rw.role;
  const l=norm(rw.label||'');
  if(l.includes('available')||l.includes('disponible')) return 'dispo';
  if(l.includes('final')||rw.total) return 'final';
  if(l.includes('commit')) return 'commit';
  if(l.includes('actual')||l.includes('spent')||l.includes('depense')) return 'act';
  if(l.startsWith('budget')) return 'budget';
  return '';
}
function opLigne(o,role){ return (o.budget.rows||[]).find(r=>opRole(r)===role)||null; }
function opMontant(o,role,j){ const r=opLigne(o,role); return r?(+r.values[j]||0):0; }
/* Disponible : la dotation moins ce qui est dépensé et ce qui est engagé.
   Calculé, jamais saisi — une valeur recopiée à la main cesse d'être vraie
   dès la première correction d'un des trois autres montants. */
function opDispo(o,j){ return opMontant(o,'budget',j)-opMontant(o,'act',j)-opMontant(o,'commit',j); }

/* Fenêtre de la frise : toutes les dates du WBS, arrondies au mois. */
function opRange(o){
  const ds=[];
  o.wbs.forEach(r=>{ if(r.type==='bar'){ [r.start,r.end].forEach(x=>{const t=opD(x); if(t!=null)ds.push(t);}); }
    else (r.milestones||[]).forEach(m=>{const t=opD(m.date); if(t!=null)ds.push(t);}); });
  [o.endMarker,o.todayMarker].forEach(x=>{const t=opD(x); if(t!=null)ds.push(t);});
  let lo,hi;
  if(ds.length){ lo=Math.min(...ds); hi=Math.max(...ds); }
  else { const n=new Date(); lo=Date.UTC(n.getFullYear(),n.getMonth(),1); hi=lo+864e5*180; }
  const s=new Date(lo), e=new Date(hi);
  // Une fenêtre collée aux dates ne laisse rien glisser : la barre occuperait
  // toute la largeur. On respire d'un mois de part et d'autre, et la fenêtre
  // se fixe à la main quand la revue demande un cadre précis.
  s.setUTCDate(1); s.setUTCMonth(s.getUTCMonth()-1);
  e.setUTCMonth(e.getUTCMonth()+2,1);
  const d1=opD(o.ganttStart), d2=opD(o.ganttEnd);
  const S1=(d1!=null)?new Date(Date.UTC(new Date(d1).getUTCFullYear(),new Date(d1).getUTCMonth(),1)):s;
  const S2=(d2!=null)?new Date(Date.UTC(new Date(d2).getUTCFullYear(),new Date(d2).getUTCMonth()+1,1)):e;
  const a=+S1, b=(+S2>+S1)?+S2:(+S1+864e5*30);
  return {s:a,e:b,span:b-a};
}
const opPct=(v,r)=>{const t=opD(v); return t==null?null:((t-r.s)/r.span*100);};
function opMonths(r){
  const out=[]; for(let m=new Date(r.s); +m<r.e; m.setUTCMonth(m.getUTCMonth()+1))
    out.push({m:m.getUTCMonth(),y:m.getUTCFullYear(),q:Math.floor(m.getUTCMonth()/3)+1});
  return out;
}
const OP_MOIS=['J','F','M','A','M','J','J','A','S','O','N','D'];
function opPill(val,scope,id){
  const c=val==='Done'?'p-done':val==='WIP'?'p-wip':val==='Late'?'p-late':'p-ns';
  return `<select class="pill ${c}" data-ops="${scope}|${id}">${OP_ST.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
}
function opPage(){
  const id=S.currentProj, p=S.projects.find(x=>x.id===id); if(!p) return '<div class="hint">Aucun projet.</div>';
  const o=opOf(id), pp=ensurePP(id), r=opRange(o), MS=opMonths(r);
  const colTpl=`grid-template-columns:repeat(${MS.length},1fr)`;
  const qg=[]; MS.forEach(mo=>{ const k='Q'+mo.q+' '+String(mo.y).slice(2), l=qg[qg.length-1];
    if(l&&l.k===k) l.n++; else qg.push({k,q:mo.q,n:1}); });
  const tod=opPct(o.todayMarker||opISO(new Date()),r), fin=o.endMarker?opPct(o.endMarker,r):null;
  const marq=(h)=>`${tod!=null?`<div class="gmk" style="left:${tod}%">${h?'<span class="lab">Aujourd&rsquo;hui</span>':''}</div>`:''}
    ${fin!=null?`<div class="gmk end" style="left:${fin}%">${h?'<span class="lab">Fin projet</span>':''}</div>`:''}`;
  const fond=`<div class="gbg" style="${colTpl}">${Array(MS.length).fill('<div></div>').join('')}</div>`;
  const lignes=o.wbs.map((w,i)=>{
    if(w.type==='milestones'){
      const dia=(w.milestones||[]).map((m,j)=>{ const x=opPct(m.date,r); if(x==null) return '';

          <div class="gdl" style="left:${x}%;top:${top+15}px">${esc(m.label||'')}</div>

        <td style="width:104px;text-align:center"><button class="pill" data-opa="addDia|${i}">+ jalon</button></td></tr>`;
    }
    const x1=opPct(w.start,r), x2=opPct(w.end,r);
    const bar=(x1!=null&&x2!=null&&x2>x1)
      ? `<div class="gbar" style="left:${x1}%;width:${x2-x1}%;background:${esc(w.color||OP_BARC[4])}" data-opbar="${i}" title="${esc(w.name)} · ${opFR(w.start)} → ${opFR(w.end)} — glissez pour décaler">${esc(w.label||'')}</div>`
      : `<div class="gdl" style="left:6px;top:7px;transform:none;color:var(--faint)">dates à renseigner</div>`;
    return `<tr><td><span contenteditable data-opb="wbs.${i}.name">${esc(w.name)}</span>
        <button class="kdel" data-opa="delWbs|${i}">✕</button>
        <div style="display:flex;gap:4px;margin-top:2px">
          <input class="kin" type="date" value="${esc(w.start||'')}" data-opd="wbs.${i}.start" style="font-size:10px">
          <input class="kin" type="date" value="${esc(w.end||'')}" data-opd="wbs.${i}.end" style="font-size:10px">

      <td style="padding:0"><div class="garea">${fond}${bar}${marq(false)}</div></td>

  }).join('');
  const bud=o.budget;
  const tot=r2=>(opRole(r2)==='dispo') ? ksum(bud.years.map((_,j)=>opDispo(o,j))) : ksum(r2.values);
  const ach=o.ach.map((t,i)=>`<div class="opitem"><span class="b">✓</span><span style="flex:1" contenteditable data-opb="ach.${i}">${esc(t)}</span><button class="kdel" data-opa="delAch|${i}">✕</button></div>`).join('')||'<div class="hint">Aucune réalisation.</div>';
  const ns=(pp.nextSteps||[]).map((x,i)=>{const s2=nsNorm(x);
    return `<div class="opitem ns"><span class="b">→</span><span style="flex:1" contenteditable data-ns="${esc(id)}|${i}">${esc(s2.t)}</span><span class="pill p-ns">${esc(s2.st)}</span></div>`;}).join('')||'<div class="hint">Aucune étape.</div>';
  const km=(pp.milestones||[]).map((m,i)=>{

  const risk=(pp.risks||[]).map((x,i)=>`<tr>

      <td><span contenteditable data-rk="${esc(id)}|${i}|mit" class="rkcell" style="padding:0">${esc(x.mit||'')}</span></td>
      <td><span contenteditable data-rk="${esc(id)}|${i}|owner">${esc(x.owner||'')}</span></td>
      <td><span contenteditable data-rk="${esc(id)}|${i}|date">${esc(x.date||'')}</span></td></tr>`).join('')
    ||'<tr><td colspan="4" class="empty">Aucun risque.</td></tr>';
  const cur=(p.hoverride==='g'?'ok':p.hoverride==='a'?'att':p.hoverride==='r'?'risk':
             (projHealth(p).band==='g'?'ok':projHealth(p).band==='a'?'att':'risk'));
  return `<div class="op">
    <div class="ophead"><span class="pid">${esc(p.shine||p.id)}</span><span>—</span>
      <span class="pname">${esc(p.nom)}</span>${p.ishift?`<span>-</span><span class="pcode">${esc(p.ishift)}</span>`:''}
      <span class="opdate">Auteur : ${esc(S.user||'—')} &nbsp;|&nbsp; ${new Date().toLocaleDateString('fr-FR')}</span></div>
    <div class="opgrid">
      <div class="oppan">
        <div class="oph h-green"><span>WBS TASK</span><span><button class="add" data-opa="addBar" title="Ajouter une activité">+</button> <button class="add" data-opa="addMsRow" title="Ajouter une ligne de jalons">◇</button></span></div>
        <table><thead><tr><th style="width:24%">Task &amp; Activités Projets</th>
          <th style="padding:0"><div class="gq" style="grid-template-columns:${qg.map(g=>g.n+'fr').join(' ')}">${qg.map(g=>`<div style="background:var(--q${g.q})">${esc(g.k)}</div>`).join('')}</div>
            <div class="gm" style="${colTpl}">${MS.map(mo=>`<div>${OP_MOIS[mo.m]}</div>`).join('')}</div></th>
          <th style="width:104px;text-align:center">Status</th></tr></thead>

/* Glisser une barre ou un jalon : le geste de l'outil d'origine, conservé. */
function opArmer(){
  const id=S.currentProj, o=opOf(id), r=opRange(o);
  $$('#kitPane [data-opbar]').forEach(bar=>{
    bar.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      const i=+bar.dataset.opbar, w=o.wbs[i], zone=bar.parentElement;
      const x0=e.clientX, l0=parseFloat(bar.style.left), lg=parseFloat(bar.style.width);
      let bouge=false;
      const mv=ev=>{ const rr=zone.getBoundingClientRect();
        const d=(ev.clientX-x0)/rr.width*100;
        if(Math.abs(ev.clientX-x0)>3) bouge=true;
        bar.style.left=Math.max(0,Math.min(100-lg,l0+d))+'%'; };
      const up=ev=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
        if(!bouge) return;
        const nl=parseFloat(bar.style.left);
        w.start=opISO(new Date(r.s+nl/100*r.span)); w.end=opISO(new Date(r.s+(nl+lg)/100*r.span));
        logChange('WBS '+(w.name||''),'dates','',w.start+' → '+w.end);
        scheduleSave(); renderKit(); };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    });
  });
  $$('#kitPane [data-opdia]').forEach(d=>{
    d.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      const [i,j]=d.dataset.opdia.split('|').map(Number), m=o.wbs[i].milestones[j], zone=d.parentElement;
      const mv=ev=>{ const rr=zone.getBoundingClientRect();
        const x=Math.min(1,Math.max(0,(ev.clientX-rr.left)/rr.width));
        const y=Math.min(1,Math.max(0,(ev.clientY-rr.top)/rr.height));
        d.style.left=(x*100)+'%'; d.style.top=Math.round(y*52)+'px';
        d.dataset.d=opISO(new Date(r.s+x*r.span)); d.dataset.t=Math.round(y*100); };
      const up=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
        if(d.dataset.d){ m.date=d.dataset.d; m.topPct=+d.dataset.t; scheduleSave(); renderKit(); } };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    });
  });
}

/* ======================= ID Card =======================
   Reprise du support « Projects ID Card 2026 ».

   La règle du process, telle qu'elle y est écrite : un projet sous 250 k€ se
   valide par une ID Card ; au-delà, c'est le process de Gate qui s'applique.
   L'onglet lit donc le budget du projet et présente l'instrument qui convient
   — on ne choisit pas, on constate.

   L'ID Card est reproduite à l'identique : mêmes zones (description,
   bénéfices, rationnel, planning, synthèse financière), même en-tête
   (sponsor, PM, approbateurs), même tableau K€. Les écarts n'y sont pas
   saisis mais calculés : besoin moins budget de référence. Elle s'imprime
   telle quelle, pour être diffusée en approbation. */
const IDC_SEUIL=250;                       // k€ — au-delà, process de Gate
const IDC_STATUTS=['To approve','Approved','Rejected'];
const IDC_ANNEES=['26','27','28','29'];
const IDC_REFS=['C2 26','B 27','SP 28','SP 29'];
const IDC_GAP0='Gap vs B26/H27 : Yes or No\nIf yes, justify the gap';

function idcBudget(p){ if(!p) return 0; const c=(p.c2!=null&&p.c2!=='')?p.c2:p.c1; return +c||0; }
/* Le régime d'un projet. Le seuil de 250 k€ porte sur le projet qui passe en
   validation, pas sur une enveloppe : une bucket existe précisément pour
   regrouper des petits projets, et c'est chacun d'eux qui doit rester sous le
   seuil. Juger la bucket sur son total reviendrait à envoyer au process de
   Gate un groupe dont aucun membre n'en relève. */
function idcRegime(p){
  const d=(S.idc&&S.idc[p&&p.id])||null;
  if(d&&d.bucket) return 'bucket';
  return idcBudget(p)<IDC_SEUIL ? 'idcard' : 'gate';
}
/* Montant d'un sous-projet de bucket : tous exercices, CAPEX et OPEX. */
function idcLigneTotal(l){
  let s=0;
  ['capex','opex'].forEach(k=>(l[k]||[]).forEach(v=>{ const n=idcN(v); if(n!=null) s+=n; }));
  return s;
}
function idcBucketTotal(d){ return (d.lignes||[]).reduce((s,l)=>s+idcLigneTotal(l),0); }
function idcOf(id){
  S.idc=S.idc||{};
  if(!S.idc[id]){
    const p=S.projects.find(x=>x.id===id)||{};
    S.idc[id]={
      bucket:false,
      nom:p.nom||'', code:p.shine||p.ishift||'', maj:'', statut:'To approve',
      sponsor:p.sponsor||'', pm:p.pm||'', approvers:'PPM, finance, Resp secteur',
      description:'', benefits:'', rationale:'', timeline:'',
      gap:IDC_GAP0,
      fin:{capex:{b:['','','',''],r:['','','','']}, opex:{b:['','','',''],r:['','','','']}},
      lignes:[], bucketRef:{capex:['',''],opex:['','']},
      diffusions:[]
    };
  }
  const d=S.idc[id];
  d.fin=d.fin||{}; ['capex','opex'].forEach(k=>{ d.fin[k]=d.fin[k]||{};
    ['b','r'].forEach(x=>{ d.fin[k][x]=Array.isArray(d.fin[k][x])?d.fin[k][x]:['','','',''];
      while(d.fin[k][x].length<4) d.fin[k][x].push(''); d.fin[k][x].length=4; }); });
  d.lignes=Array.isArray(d.lignes)?d.lignes:[];
  d.bucketRef=d.bucketRef||{capex:['',''],opex:['','']};
  ['capex','opex'].forEach(k=>{ d.bucketRef[k]=Array.isArray(d.bucketRef[k])?d.bucketRef[k]:['','']; });
  d.diffusions=Array.isArray(d.diffusions)?d.diffusions:[];
  if(!IDC_STATUTS.includes(d.statut)) d.statut='To approve';
  return d;
}
const idcN=v=>{ if(v==null||v==='')return null; const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isFinite(n)?n:null; };
const idcF=v=>v==null?'' : (Math.round(v*100)/100).toLocaleString('fr-FR');
const idcSigne=v=>v==null?'—' : (v>0?'+':'')+idcF(v);
/* L'écart d'un exercice : le besoin exprimé moins le budget de référence.
   Tant que la référence n'est pas saisie, il n'y a rien à comparer — afficher
   le besoin comme un dépassement ferait crier une carte simplement en cours
   de remplissage. */
function idcEcart(d,k,j){ const r=idcN(d.fin[k].r[j]);
  if(r==null) return null; return (idcN(d.fin[k].b[j])||0)-r; }
function idcTotalLignes(d,k,j){
  let s=null;
  d.lignes.forEach(l=>{ const v=idcN((l[k]||[])[j]); if(v!=null) s=(s||0)+v; });
  return s;
}
function idcEcartBucket(d,k,j){
  const r=idcN(d.bucketRef[k][j]);
  if(r==null) return null; return (idcTotalLignes(d,k,j)||0)-r;
}

/* La carte d'un sous-projet de bucket.

   Une bucket groupe des projets pour le budget ; chacun peut avoir besoin de
   sa propre ID Card pour passer en validation. Elle est amorcée depuis la
   ligne — nom, WBS, description, bénéfices, planning, montants — pour que le
   PM parte de ce qui est déjà saisi plutôt que d'une page blanche. */
function idcCarteSous(d,i){
  const l=(d.lignes||[])[i]; if(!l) return null;
  if(!l.card){
    l.card={ nom:l.nom||'', code:l.wbs||'', maj:'', statut:'To approve',
      sponsor:d.sponsor||'', pm:d.pm||'', approvers:d.approvers||'PPM, finance, Resp secteur',
      description:l.description||'', benefits:l.benefits||'', rationale:'', timeline:l.timeline||'',
      gap:IDC_GAP0,
      fin:{capex:{b:[],r:[]}, opex:{b:[],r:[]}}, diffusions:[] };
    idcCarteSousSync(d,i);
  }
  const c=l.card;
  c.fin=c.fin||{};
  ['capex','opex'].forEach(k=>{ c.fin[k]=c.fin[k]||{};
    ['b','r'].forEach(x=>{ c.fin[k][x]=Array.isArray(c.fin[k][x])?c.fin[k][x]:['','','',''];
      while(c.fin[k][x].length<4) c.fin[k][x].push(''); c.fin[k][x].length=4; }); });
  c.diffusions=Array.isArray(c.diffusions)?c.diffusions:[];
  if(!IDC_STATUTS.includes(c.statut)) c.statut='To approve';
  return c;
}
/* Reprendre la ligne : ce que la bucket sait du sous-projet redescend dans sa
   carte, sans écraser ce qui y a été écrit depuis. */
function idcCarteSousSync(d,i){
  const l=(d.lignes||[])[i], c=l&&l.card; if(!c) return 0;
  let n=0;
  const poser=(champ,val)=>{ const v=String(val||'').trim();
    if(v && !String(c[champ]||'').trim()){ c[champ]=v; n++; } };
  poser('nom',l.nom); poser('code',l.wbs);
  poser('description',l.description); poser('benefits',l.benefits); poser('timeline',l.timeline);
  [0,1].forEach(j=>{
    if(!String(c.fin.capex.b[j]||'').trim() && String((l.capex||[])[j]||'').trim()){ c.fin.capex.b[j]=l.capex[j]; n++; }
    if(!String(c.fin.opex.b[j]||'').trim() && String((l.opex||[])[j]||'').trim()){ c.fin.opex.b[j]=l.opex[j]; n++; }
  });
  return n;
}
/* Une carte porte-t-elle du contenu ? Sert à ne pas écraser un texte déjà
   écrit, et à signaler une ID Card rédigée sur un projet qui relève du Gate. */
function idcRempli(d){
  if(!d) return false;
  if((d.lignes||[]).length) return true;
  return ['description','benefits','rationale','timeline'].some(k=>String(d[k]||'').trim().length>0);
}
function idcSousOuverte(p){
  const s=S.idcSub;
  if(!s||s.id!==p.id) return -1;
  const d=idcOf(p.id);
  return (s.i>=0 && s.i<(d.lignes||[]).length) ? s.i : -1;
}
function kitIdCard(){
  const p=S.projects.find(x=>x.id===S.currentProj); if(!p) return '<div class="hint">Aucun projet.</div>';
  const d=idcOf(p.id), bud=idcBudget(p), reg=idcRegime(p);
  const bascule=`<label class="iconbtn" style="gap:6px" title="Une bucket regroupe plusieurs petits projets sous une même enveloppe : le seuil s'applique alors à chaque sous-projet"><input type="checkbox" id="idcBucket" ${d.bucket?'checked':''}> Bucket</label>`;
  const horsSeuil=(d.lignes||[]).filter(l=>idcLigneTotal(l)>=IDC_SEUIL);
  const bandeau = reg==='gate'
    ? `<div class="idcnote gate"><span class="ic">🚦</span>
        <div><b>Budget ${idcF(bud)} k€ — au-delà de ${IDC_SEUIL} k€, l'ID Card ne suffit pas.</b>
          Le process de Gate s'applique : G0 Cadrage → G5 Clôture. Les six gates de ce projet sont
          ci-dessous ; leurs supports de passage seront déposés ici dès qu'ils seront fournis.</div>
        <button class="iconbtn" id="idcGates">🚦 Ouvrir le suivi des gates</button>${bascule}</div>`
    : reg==='bucket'
    ? `<div class="idcnote ${horsSeuil.length?'gate':''}"><span class="ic">🗂</span>
        <div><b>Enveloppe de ${idcF(bud)} k€ répartie entre ${(d.lignes||[]).length} sous-projet${(d.lignes||[]).length>1?'s':''}.</b>
          Le seuil de ${IDC_SEUIL} k€ s'applique à chaque sous-projet, pas à l'enveloppe : c'est l'objet
          même d'une bucket.${horsSeuil.length?` <b>${horsSeuil.length} sous-projet${horsSeuil.length>1?'s atteignent':' atteint'} le seuil</b> et relève${horsSeuil.length>1?'nt':''} du process de Gate.`:''}</div>
        ${bascule}</div>`
    : `<div class="idcnote"><span class="ic">🪪</span>
        <div><b>Budget ${idcF(bud)} k€ — sous ${IDC_SEUIL} k€, le projet se valide par une ID Card.</b>
          Rédigée par le PM, envoyée au responsable de secteur, au PPM et à la finance ; une fois
          validée, elle ouvre la SPE.</div>
        ${bascule}</div>`;
  /* Sous-carte ouverte : on laisse la bucket de côté le temps de la remplir. */
  const si=idcSousOuverte(p);
  if(si>=0){
    const l=d.lignes[si], c=idcCarteSous(d,si), m=idcLigneTotal(l);
    return `<div class="idc">
      <div class="idcnote ${m>=IDC_SEUIL?'gate':''}"><span class="ic">🪪</span>
        <div><b>${esc(l.nom||'Sous-projet '+(si+1))} — ${idcF(m)} k€.</b>
          Sous-projet ${si+1} sur ${d.lignes.length} de la bucket « ${esc(d.nom||p.nom)} ».
          ${m>=IDC_SEUIL?`Au-delà de ${IDC_SEUIL} k€ : ce sous-projet relève du process de Gate.`
                        :`Sous ${IDC_SEUIL} k€ : il se valide par sa propre ID Card.`}</div>
        <button class="iconbtn" id="idcRetour">← Retour à la bucket</button></div>
      <div class="idcbar"><span class="idcquoi">Project ID Card</span>
        <span class="sp"></span>
        <button class="iconbtn" id="idcPrint">⎙ Diffuser pour approbation</button>
        <button class="iconbtn" id="idcSync" title="Reprendre de la ligne de bucket ce qui manque dans la carte, sans rien écraser">⟲ Reprendre la ligne</button>
        <button class="iconbtn" id="idcPrev" ${si<=0?'disabled':''} title="Sous-projet précédent">‹</button>
        <span class="hint">${si+1} / ${d.lignes.length}</span>
        <button class="iconbtn" id="idcNext" ${si>=d.lignes.length-1?'disabled':''} title="Sous-projet suivant">›</button>
      </div>
      ${idcProjetHTML(p,c)}
    </div>`;
  }
  /* Un cahier des objectifs attend ce projet et comblerait des zones encore
     vides : on le dit dans la carte, là où on regarde — un bouton rangé dans
     une barre d'outils, ça se manque. */
  const cdo=idcCDOde(p);
  const aPrendre=cdo?idcPoserCDO(d,cdo.e.idc,p,true):0;
  const noteCDO=aPrendre?`<div class="idcnote cdo"><span class="ic">📄</span>
      <div><b>Le cahier des objectifs de ce projet est disponible.</b>
        Il remplirait ${aPrendre} zone${aPrendre>1?'s':''} restée${aPrendre>1?'s':''} vide${aPrendre>1?'s':''}
        — description, bénéfices, rationnel, planning — sans toucher à ce qui est déjà écrit.</div>
      <button class="iconbtn" id="idcCDO2">📄 Reprendre le CDO</button></div>`:'';
  return `<div class="idc">
    ${bandeau}
    ${noteCDO}
    <div class="idcbar">
      <span class="idcquoi">${reg==='gate'?'Process de Gate':reg==='bucket'?'Bucket ID Card':'Project ID Card'}</span>
      <span class="sp"></span>
      ${reg==='gate'?'':`<button class="iconbtn" id="idcPrint">⎙ Diffuser pour approbation</button>`}
      ${idcCDOde(p)?`<button class="iconbtn" id="idcCDO" title="Reprendre le cahier des objectifs de ce projet : il ne remplit que les zones restées vides">📄 Reprendre le CDO</button>`:''}

/* ---- Timeline : le planning du support, deux exercices au mois ----
   Le support pose vingt-quatre mois en deux bandes d'année, des lignes dont
   le libellé vient buter contre le début de la première barre, et des barres
   au bout pointu — droit quand la barre suivante prend le relais au même
   mois. Ici elles se déplacent et s'allongent à la souris, et leur texte
   s'écrit au double-clic : c'est un planning qu'on tient, pas une image. */
const IDC_TLM=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const IDC_TLMF=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
/* Teinte pleine puis teinte pâle : les deux tons du support pour un même ton. */
const IDC_TLC=[['#00B0F0','#CCEEFC'],['#FF4FC3','#FFD3F0'],['#9933FF','#E0CCFF'],
               ['#00B050','#CCEBD8'],['#FFC000','#FFECC2'],['#4472C4','#D8E2F5']];
function idcTL(d){
  const an=new Date().getFullYear();
  if(!d.tl||typeof d.tl!=='object'||!Array.isArray(d.tl.rows)){
    /* Une bucket connaît déjà ses lignes : ce sont ses sous-projets. On les
       pose telles quelles, chacune avec les deux phases du support — il ne
       reste qu'à tirer les dates. */
    const base=(i)=>[{lab:'Faisa/APS/APD/DCE',a:2,b:6,c:i%IDC_TLC.length,t:0},
                     {lab:'Travaux',a:6,b:11,c:i%IDC_TLC.length,t:1}];
    d.tl=(d.lignes&&d.lignes.length)
      ? {y0:an,rows:d.lignes.map((l,i)=>({nom:l.nom||'',bars:base(i)}))}
      : {y0:an,rows:[{nom:'',bars:base(0)}]};
  }
  d.tl.y0=+d.tl.y0||an;
  d.tl.rows.forEach(r=>{ r.bars=Array.isArray(r.bars)?r.bars:[];
    r.bars.forEach(b=>{ b.a=Math.max(0,Math.min(23,Math.round(+b.a||0)));
                        b.b=Math.max(b.a+1,Math.min(24,Math.round(+b.b||b.a+1))); }); });
  return d.tl;
}
/* Une période, dite comme on la dit à l'oral — pour le journal des changements. */
function idcTLQuand(t,a,b){ const f=m=>IDC_TLMF[m%12]+' '+(t.y0+Math.floor(m/12));
  return f(a)+' → '+f(Math.max(a,b-1)); }
function idcTLPc(n){ return (n/24*100).toFixed(4)+'%'; }

function idcTLHTML(d){
  const t=idcTL(d);
  const sel=(S.idcBar&&t.rows[S.idcBar.i]&&t.rows[S.idcBar.i].bars[S.idcBar.j])?S.idcBar:null;
  const bs=sel?t.rows[sel.i].bars[sel.j]:null;
  const lignes=t.rows.map((r,i)=>{
    /* Le libellé s'arrête là où commence la première barre. Sans barre, on le
       pose au quart de la bande : il reste lisible et prêt à être rempli. */
    const prem=r.bars.length?Math.min.apply(null,r.bars.map(b=>b.a)):6;
    const barres=r.bars.map((b,j)=>{
      const colle=r.bars.some((o,k)=>k!==j&&o.a===b.b);
      const c=IDC_TLC[(+b.c||0)%IDC_TLC.length];
      const fond=(+b.t)?'linear-gradient(90deg,'+c[1]+','+c[0]+')'
                       :'linear-gradient(90deg,#fff,'+c[1]+')';
      const on=sel&&sel.i===i&&sel.j===j;
      return `<div class="idctlb${on?' sel':''}" data-tlb="${i}|${j}"
        style="left:${idcTLPc(b.a)};width:${idcTLPc(b.b-b.a)}"
        title="${esc(idcTLQuand(t,b.a,b.b))} — glisser pour déplacer, les bords pour allonger, double-clic pour écrire">
        <span class="bg${colle?'':' fl'}" style="background:${fond}"></span>
        <span class="l" data-tlab="${i}|${j}" data-vide="Phase">${esc(b.lab||'')}</span>
        <i class="g" data-tlp="a"></i><i class="d" data-tlp="b"></i></div>`;}).join('');
    return `<div class="idctlr" data-tlr="${i}">
      <span class="idctlnom" contenteditable data-tlnom="${i}" data-vide="Projet"
        style="right:${idcTLPc(24-prem)}">${esc(r.nom||'')}</span>${barres}
      <span class="act noprint"><button class="iconbtn mini" data-tladd="${i}" title="Ajouter une barre">+</button>
        <button class="delbtn" data-tlrdel="${i}" title="Supprimer la ligne">×</button></span></div>`;}).join('')
    ||`<div class="idctlr"><span class="idctlnom" style="right:60%">Aucune ligne.</span></div>`;
  const outils=`<div class="idctlbarre noprint">
    <button class="iconbtn mini" id="tlAddR">+ Ligne</button>
    ${bs?`<span class="hint">Barre « ${esc(bs.lab||'sans titre')} » :</span>
      ${IDC_TLC.map((c,k)=>`<button class="idctlsw${(+bs.c||0)===k?' on':''}" data-tlc="${k}"
        style="background:linear-gradient(90deg,${c[1]},${c[0]})" title="Teinte ${k+1}"></button>`).join('')}
      <button class="iconbtn mini" id="tlTon">${(+bs.t)?'● teinte pleine':'○ teinte pâle'}</button>
      <button class="iconbtn mini" id="tlDel">Supprimer la barre</button>`
    :`<span class="hint">Glissez une barre pour la déplacer, ses bords pour l'allonger, double-cliquez pour écrire dedans.</span>`}
  </div>`;
  return outils+`<div class="idctl">
    <div class="idctlan"><span contenteditable data-tly="0">${t.y0}</span><span contenteditable data-tly="1">${t.y0+1}</span></div>
    <div class="idctlm">${[0,1].map(()=>IDC_TLM.map(m=>`<span>${m}</span>`).join('')).join('')}</div>
    <div class="idctlcorps"><div class="idctlgrid">${Array(24).join('.').split('.').map(()=>'<i></i>').join('')}</div>
      ${lignes}</div></div>`;
}

/* Le glisser-déposer vit sur le document — une barre qu'on tire suit la souris
   même quand elle sort du cadre. On ne laisse jamais deux jeux d'écouteurs :
   chaque rendu remplace les précédents. */
let IDC_TLDOC=null;
function idcTLBind(p,d,rr){
  const corps=$('#kitPane .idctlcorps'); if(!corps) return;
  const t=idcTL(d), nom=(p&&(p.shine||p.nom))||'';
  const trace=(q,av,ap)=>{ logChange('ID Card — '+nom,'planning · '+q,av,ap); scheduleSave(); };
  let dr=null, tSel=null;

  corps.addEventListener('mousedown',e=>{
    const el=e.target.closest('.idctlb');
    if(!el){ if(S.idcBar){ S.idcBar=null; rr(); } return; }
    if(e.target.isContentEditable) return;                 /* on est en train d'écrire */
    const ij=el.dataset.tlb.split('|').map(Number);
    const bar=t.rows[ij[0]]&&t.rows[ij[0]].bars[ij[1]]; if(!bar) return;
    dr={el,bar,i:ij[0],j:ij[1],poi:e.target.dataset.tlp||'m',x0:e.clientX,
        a0:bar.a,b0:bar.b,na:bar.a,nb:bar.b,bouge:false,
        pas:el.parentNode.getBoundingClientRect().width/24};
    el.style.cursor='grabbing'; e.preventDefault();
  });

  const bouger=e=>{
    if(!dr) return;
    const dm=Math.round((e.clientX-dr.x0)/dr.pas); if(dm) dr.bouge=true;
    const L=dr.b0-dr.a0; let a=dr.a0,b=dr.b0;
    if(dr.poi==='m'){ a=Math.max(0,Math.min(24-L,dr.a0+dm)); b=a+L; }
    else if(dr.poi==='a'){ a=Math.max(0,Math.min(dr.b0-1,dr.a0+dm)); }
    else { b=Math.max(dr.a0+1,Math.min(24,dr.b0+dm)); }
    dr.na=a; dr.nb=b;
    dr.el.style.left=idcTLPc(a); dr.el.style.width=idcTLPc(b-a);
  };

  const lacher=()=>{
    if(!dr) return;
    const c=dr; dr=null; c.el.style.cursor='';
    if(c.bouge){
      if(c.na!==c.bar.a||c.nb!==c.bar.b){
        const av=idcTLQuand(t,c.bar.a,c.bar.b);
        c.bar.a=c.na; c.bar.b=c.nb;
        trace(c.bar.lab||'barre',av,idcTLQuand(t,c.bar.a,c.bar.b));
      }
      rr();
    } else {
      /* Un clic sans déplacement sélectionne la barre — mais on laisse au
         double-clic le temps d'arriver : redessiner tout de suite arracherait
         la barre sous la souris avant qu'on ait pu écrire dedans. */
      S.idcBar=(S.idcBar&&S.idcBar.i===c.i&&S.idcBar.j===c.j)?null:{i:c.i,j:c.j};
      clearTimeout(tSel); tSel=setTimeout(rr,230);
    }
  };
  if(IDC_TLDOC){ document.removeEventListener('mousemove',IDC_TLDOC.m);
                 document.removeEventListener('mouseup',IDC_TLDOC.u); }
  IDC_TLDOC={m:bouger,u:lacher};
  document.addEventListener('mousemove',bouger);
  document.addEventListener('mouseup',lacher);

  /* Le texte d'une barre s'écrit au double-clic : le simple clic sert à tirer. */
  corps.addEventListener('dblclick',e=>{
    const l=e.target.closest('[data-tlab]'); if(!l) return;
    clearTimeout(tSel);                                    /* on écrit, on ne redessine pas */
    l.setAttribute('contenteditable','true'); l.focus();
    const r=document.createRange(); r.selectNodeContents(l);
    const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r);
  });
  $$('#kitPane [data-tlab]').forEach(l=>{
    l.addEventListener('blur',()=>{
      l.removeAttribute('contenteditable');
      const ij=l.dataset.tlab.split('|').map(Number);
      const bar=t.rows[ij[0]]&&t.rows[ij[0]].bars[ij[1]]; if(!bar) return;
      const v=l.innerText.replace(/ /g,' ').trim();
      if(String(bar.lab||'')===v) return;
      trace('intitulé',bar.lab||'',v); bar.lab=v; rr();
    });
    l.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); l.blur(); } });
  });

  $$('#kitPane [data-tlnom]').forEach(el=>el.addEventListener('blur',()=>{
    const r=t.rows[+el.dataset.tlnom]; if(!r) return;
    const v=el.innerText.replace(/ /g,' ').trim();
    if(String(r.nom||'')===v) return;
    trace('ligne',r.nom||'',v); r.nom=v;
  }));

  /* Changer l'exercice de départ : on saisit l'une ou l'autre des deux bandes. */
  $$('#kitPane [data-tly]').forEach(el=>el.addEventListener('blur',()=>{
    const an=parseInt(el.innerText.replace(/[^0-9]/g,''),10);
    const y0=(+el.dataset.tly===1)?an-1:an;
    if(!an||y0===t.y0||y0<2000||y0>2100){ el.innerText=t.y0+(+el.dataset.tly); return; }
    trace('exercices',t.y0+' | '+(t.y0+1),y0+' | '+(y0+1)); t.y0=y0; rr();
  }));

  const lier=(sel,fn)=>{const n=$(sel); if(n)n.addEventListener('click',fn);};
  lier('#tlAddR',()=>{ t.rows.push({nom:'',bars:[{lab:'Faisa/APS/APD/DCE',a:2,b:6,c:t.rows.length%IDC_TLC.length,t:0},
                                                 {lab:'Travaux',a:6,b:11,c:t.rows.length%IDC_TLC.length,t:1}]});
    trace('ligne','',"ajoutée"); S.idcBar=null; rr(); });
  $$('#kitPane [data-tladd]').forEach(b=>b.onclick=()=>{
    const r=t.rows[+b.dataset.tladd]; if(!r) return;
    const fin=r.bars.length?Math.max.apply(null,r.bars.map(x=>x.b)):0;
    const a=Math.min(23,fin), c=r.bars.length?(+r.bars[r.bars.length-1].c||0):0;
    r.bars.push({lab:'Travaux',a,b:Math.min(24,a+4),c,t:1});
    trace('barre','',"ajoutée à « "+(r.nom||'ligne')+" »"); S.idcBar={i:+b.dataset.tladd,j:r.bars.length-1}; rr(); });
  $$('#kitPane [data-tlrdel]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.tlrdel, r=t.rows[i]; if(!r) return;
    if(!confirm('Supprimer la ligne « '+(r.nom||(i+1))+' » du planning ?')) return;
    t.rows.splice(i,1); trace('ligne',r.nom||String(i+1),'supprimée'); S.idcBar=null; rr(); });

  /* Les retouches de la barre sélectionnée. */
  const bs=(S.idcBar&&t.rows[S.idcBar.i])?t.rows[S.idcBar.i].bars[S.idcBar.j]:null;
  $$('#kitPane [data-tlc]').forEach(b=>b.onclick=()=>{
    if(!bs) return; const k=+b.dataset.tlc; if((+bs.c||0)===k) return;
    trace('teinte de « '+(bs.lab||'barre')+' »',String(+bs.c||0),String(k)); bs.c=k; rr(); });
  lier('#tlTon',()=>{ if(!bs) return; bs.t=(+bs.t)?0:1;
    trace('teinte de « '+(bs.lab||'barre')+' »','',(+bs.t)?'pleine':'pâle'); rr(); });
  lier('#tlDel',()=>{ if(!bs) return;
    const r=t.rows[S.idcBar.i];
    if(!confirm('Supprimer la barre « '+(bs.lab||'sans titre')+' » ?')) return;
    r.bars.splice(S.idcBar.j,1); trace('barre',bs.lab||'sans titre','supprimée'); S.idcBar=null; rr(); });
}

/* ---- Saisie ---- */
function idcSet(d,chemin,v){
  const c=chemin.split('.'), last=c.pop();
  const o=c.reduce((x,k)=>x[k], d); if(o) o[last]=v;
}
function idcGet(d,chemin){ return chemin.split('.').reduce((o,k)=>(o==null?o:o[k]), d); }
function kitArmerIdCard(){
  const p=S.projects.find(x=>x.id===S.currentProj); if(!p) return;
  const d=idcOf(p.id);
  const rr=()=>renderGardeFocus(()=>{ renderKit(); });
  /* Une sous-carte ouverte : la saisie vise sa fiche à elle, pas celle de la bucket. */
  const si=idcSousOuverte(p);
  const cible=(si>=0)?idcCarteSous(d,si):d;
  $$('#kitPane [data-idc]').forEach(el=>{
    const ev=(el.tagName==='SELECT'||el.type==='date')?'change':(el.tagName==='INPUT'?'change':'blur');
    el.addEventListener(ev,()=>{
      const ch=el.dataset.idc;
      const v=(el.tagName==='INPUT'||el.tagName==='SELECT')?el.value:el.innerText.replace(/ /g,' ').trim();
      const av=idcGet(cible,ch);
      if(String(av==null?'':av)===String(v)) return;
      idcSet(cible,ch,v);
      logChange('ID Card — '+(p.shine||p.nom)+((si>=0)?' › '+(cible.nom||'sous-projet '+(si+1)):''), ch, av, v);
      scheduleSave();
      if(/^fin\.|^bucketRef\./.test(ch)) rr();
    });
    if(el.isContentEditable) el.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.altKey&&!e.shiftKey){ e.preventDefault(); el.blur(); }
      if(e.key==='Escape'){ el.innerText=String(idcGet(cible,el.dataset.idc)||''); el.blur(); } });
  });
  $$('#kitPane [data-idcl]').forEach(el=>{
    const ev=el.tagName==='INPUT'?'change':'blur';
    el.addEventListener(ev,()=>{
      const [i,k,j]=el.dataset.idcl.split('|');
      const l=d.lignes[+i]; if(!l) return;
      const v=(el.tagName==='INPUT')?el.value:el.innerText.replace(/ /g,' ').trim();
      if(j!==undefined){ l[k]=Array.isArray(l[k])?l[k]:['','']; if(String(l[k][+j]||'')===String(v))return; l[k][+j]=v; }
      else { if(String(l[k]||'')===String(v))return; l[k]=v; }
      logChange('ID Card bucket — '+(p.shine||p.nom), k, '', v);
      scheduleSave(); if(j!==undefined) rr();
    });
  });
  const lier=(sel,ev,fn)=>{const n=$(sel); if(n)n.addEventListener(ev,fn);};
  lier('#idcBucket','change',e=>{ d.bucket=e.target.checked;
    logChange('ID Card — '+(p.shine||p.nom),'type',d.bucket?'projet':'bucket',d.bucket?'bucket':'projet');
    scheduleSave(); renderKit(); });
  lier('#idcAdd','click',()=>{ d.lignes.push({nom:'',wbs:'',description:'',benefits:'',timeline:'',capex:['',''],opex:['','']});
    scheduleSave(); renderKit(); });
  $$('#kitPane [data-idcdel]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.idcdel, l=d.lignes[i]; if(!l) return;
    if(!confirm('Retirer « '+(l.nom||'cette ligne')+' » de la bucket ?')) return;
    d.lignes.splice(i,1); scheduleSave(); renderKit(); });
  /* Reprendre le cahier des objectifs à la demande. L'amorce automatique
     passe par un appariement — un code, sinon un mot-clé — et un mot-clé qui
     désigne deux projets n'en désigne aucun. Ici il n'y a rien à apparier :
     c'est ce projet-ci qu'on regarde. */
  const reprendreCDO=()=>{
    const src=idcCDOde(p);
    if(!src){ alert("Aucun cahier des objectifs n'est fourni pour ce projet."); return; }
    const k=idcPoserCDO(cible,src.e.idc,p);
    if(!k){ alert("Le cahier des objectifs n'apporte rien de plus : les zones qu'il renseigne sont déjà écrites.\n\nVidez une zone puis relancez pour la faire reprendre."); return; }
    logChange('ID Card — '+(p.shine||p.nom),'reprise du CDO','',k+' zone'+(k>1?'s':'')+' remplie'+(k>1?'s':''));
    scheduleSave(); renderKit();
  };
  lier('#idcCDO','click',reprendreCDO);
  lier('#idcCDO2','click',reprendreCDO);
  lier('#idcMaj','click',()=>{
    const av=[d.nom,d.code,d.pm,d.sponsor].join('|');
    d.nom=p.nom||d.nom; d.code=p.shine||p.ishift||d.code; d.pm=p.pm||d.pm; d.sponsor=p.sponsor||d.sponsor;
    if([d.nom,d.code,d.pm,d.sponsor].join('|')!==av){ logChange('ID Card — '+(p.shine||p.nom),'reprise de la fiche','',d.nom); scheduleSave(); }
    renderKit(); });
  lier('#idcGates','click',()=>{ S.tab='gates'; S.navKey=''; render(); });
  lier('#idcPrint','click',()=>idcDiffuser(p,cible));
  /* Navigation entre la bucket et les cartes de ses sous-projets. */
  $$('#kitPane [data-idccard]').forEach(b=>b.onclick=e=>{
    e.preventDefault(); e.stopPropagation();
    S.idcSub={id:p.id,i:+b.dataset.idccard};
    idcCarteSous(d,S.idcSub.i); scheduleSave(); renderKit(); });
  lier('#idcRetour','click',()=>{ S.idcSub=null; renderKit(); });
  const saut=k=>{ const n=(d.lignes||[]).length; const j=si+k;
    if(j>=0&&j<n){ S.idcSub={id:p.id,i:j}; idcCarteSous(d,j); scheduleSave(); renderKit(); } };
  lier('#idcPrev','click',()=>saut(-1));
  lier('#idcNext','click',()=>saut(1));
  idcTLBind(p,cible,rr);
  lier('#idcSync','click',()=>{
    const n=idcCarteSousSync(d,si);
    if(n){ logChange('ID Card — '+(p.shine||p.nom),'reprise de la ligne de bucket','',String(n)+' champ(s)'); scheduleSave(); }
    renderKit();
    if(!n) alert('Rien à reprendre : la carte porte déjà ce que la ligne de bucket contient.');
  });
}

      @page{size:A4 landscape;margin:8mm}
    </style></head><body>

    <div class="idcfoot"><span>${esc((d.bucket?'Bucket':'Project')+' ID Card — '+(d.code||'')+' '+(d.nom||p.nom))}</span>
      <span>Approbateurs : ${esc(d.approvers||'—')} · édité le ${new Date().toLocaleDateString('fr-FR')} par ${esc(S.user||'—')}</span></div>
    </body></html>`);
  w.document.close();
  d.diffusions=d.diffusions||[];

  scheduleSave();
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(_){} },400);
}

/* ======================= CSD — Comité Schéma Directeur =======================
   Reprise de l'outil « Comité Schéma Directeur » : la revue de portefeuille
   telle qu'elle se tient en comité — cartes de synthèse, alertes, fiches ou
   liste, par pôle, avec les champs de suivi propres au comité (CDO, SPE, CER,
   process ingénierie, étape, délais, sujets, responsables).

   Le portefeuille est celui de la plateforme : un projet y est un projet, et
   non une ligne recopiée. Les champs du comité vivent dans S.csd[idProjet] ;
   les montants, le pôle et l'intitulé restent ceux du projet. */
const CSD_ST=["On Track","Risque","Focus","Bloquant","En évaluation","En attente","Terminé","Clôturé","Dépriorisé","Migré en projet","En cours","Retard","OK"];
const CSD_ROUGE=["bloquant","focus"], CSD_RISQUE=["bloquant","focus","risque","retard","en attente"];
const CSD_OK=["on track","ok","vert","en cours"], CSD_FIN=["termine","termine","cloture","clôturé","terminé"];
const CSD_CHAMPS=[["etu","ETU"],["wbsInv","WBS | INV"],["localisation","Localisation"],["engineering","Engineering"],
  ["initiateur","Initiateur"],["etape","Étape"],["cdo","CDO"],["spe","SPE"],["cer","CER"],["rtProcess","RT Process Ingénierie"],
  ["responsables","Responsables"],["delais","Délais"],["dateDebut","Date de début"],["dateFin","Date de fin"]];
const CSD_LONGS=[["sujets","Sujets"],["actionSuivi","Action de suivi"],["remarques","Remarques"],["commentaires","Commentaires"]];
function csdOf(id){ S.csd=S.csd||{}; if(!S.csd[id]) S.csd[id]={}; return S.csd[id]; }
function csdStatut(p){ const c=csdOf(p.id); return c.statut||p.statut||''; }
function csdConf(st){
  const s=norm(st);
  if(CSD_ROUGE.includes(s)) return {b:'var(--bad)',i:'⛔',bg:'var(--bad)'};
  if(CSD_RISQUE.includes(s)) return {b:'var(--warn)',i:'⚠',bg:'var(--warn)'};
  if(CSD_FIN.includes(s)) return {b:'var(--muted)',i:'✓',bg:'var(--muted)'};
  if(CSD_OK.includes(s)) return {b:'var(--good)',i:'✓',bg:'var(--good)'};
  return {b:'var(--line-2)',i:'•',bg:'var(--faint)'};
}
/* « Délais » porte une date : on en tire le retard, comme en comité. */
function csdDelai(p){
  const c=csdOf(p.id), t=String(c.delais||'');
  const m=t.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
  if(!m) return null;
  const an=+m[3]<100?2000+ +m[3]:+m[3];
  const d=Date.UTC(an,+m[2]-1,+m[1]);
  const j=Math.round((d-Date.now())/864e5);
  if(j<0) return {lb:Math.abs(j)+' j de retard',c:'var(--bad)',bg:'var(--bad-soft)',urgent:true};
  if(j<=15) return {lb:'échéance dans '+j+' j',c:'var(--warn)',bg:'var(--warn-soft)',urgent:true};
  return {lb:'échéance dans '+j+' j',c:'var(--good)',bg:'var(--good-soft)',urgent:false};
}
function csdFiltres(){ S.csdF=S.csdF||{q:'',st:'all',vue:'grid',pole:''}; return S.csdF; }
function csdListe(){
  const f=csdFiltres(), q=norm(f.q);
  return PROJ().filter(p=>{
    const c=csdOf(p.id);
    if(f.pole && p.group!==f.pole) return false;
    if(f.st!=='all' && norm(csdStatut(p))!==norm(f.st)) return false;
    if(!q) return true;
    return norm([p.shine,p.nom,p.pm,p.pl,c.etu,c.localisation,c.initiateur,c.etape,c.responsables,c.sujets].join(' ')).includes(q);
  });
}
function csdCarte(p){
  const c=csdOf(p.id), cf=csdConf(csdStatut(p)), d=csdDelai(p);
  const dates=(c.dateDebut||c.dateFin)?`<div class="rw"><span>📅 ${esc(c.dateDebut||'—')} → ${esc(c.dateFin||'—')}</span></div>`:'';
  const del=d?`<div class="dl" style="background:${d.bg};color:${d.c}">⏱ ${d.lb}${d.urgent?' ⚠':''}</div>`
            :(c.delais?`<div class="rw" style="color:var(--muted)">🕐 ${esc(c.delais)}</div>`:'');
  return `<div class="pcard" style="border-left-color:${cf.b}" data-csdp="${esc(p.id)}">
    <div class="tr"><div class="ti">${esc(c.etu||p.shine||'—')} – ${esc(p.nom)}</div>
      <div class="dot" style="background:${cf.bg}" title="${esc(csdStatut(p)||'—')}">${cf.i}</div></div>
    <div class="bd">
      <div class="rw"><span>📍 ${esc(c.localisation||p.secteur||'—')}</span><span class="bg2">${esc(c.engineering||p.group||'—')}</span></div>
      <div class="rw"><span>💰 ${p.c1?fmt(p.c1)+' k€':'—'}</span><span style="font-weight:600">${esc(c.etape||p.statut||'—')}</span></div>
      <div>👤 ${esc(c.initiateur||p.pm||'—')}</div>${dates}${del}
    </div></div>`;
}
function csdLigne(p){
  const c=csdOf(p.id), cf=csdConf(csdStatut(p)), d=csdDelai(p);
  return `<div class="plist" data-csdp="${esc(p.id)}">
    <div class="dot" style="background:${cf.b}"></div>
    <div style="flex:1;min-width:0"><div class="n">${esc(c.etu||p.shine||'—')} – ${esc(p.nom)}</div>
      <div class="s">${esc(c.localisation||p.secteur||'—')} • ${esc(c.etape||p.statut||'—')}</div></div>
    <span class="s">${p.c1?fmt(p.c1)+' k€':'—'}</span>
    ${d?`<span class="dl" style="background:${d.bg};color:${d.c}">${d.lb}</span>`:''}
    <span class="bg2">${esc(csdStatut(p)||'—')}</span></div>`;
}
function renderCSD(){
  const f=csdFiltres(), tous=csdListe();
  const nb=s=>tous.filter(p=>s.includes(norm(csdStatut(p)))).length;
  const alertes=tous.filter(p=>CSD_RISQUE.includes(norm(csdStatut(p)))).slice(0,6);
  const poles=[...new Set(PROJ().map(p=>p.group).filter(Boolean))].sort();
  const sections=f.pole?[f.pole]:poles;
  const cartes=[['Total projets',tous.length,'💼','var(--accent-soft)','var(--accent-ink)'],
                ['On Track',nb(CSD_OK),'🕐','var(--good-soft)','var(--good)'],
                ['À risque',nb(CSD_RISQUE),'⚠️','var(--bad-soft)','var(--bad)'],
                ['Terminés',nb(CSD_FIN),'✅','var(--panel-3)','var(--muted)']];
  view.innerHTML=`
  <div class="sec-title"><h2>CSD — Comité Schéma Directeur</h2><span class="hint">revue de portefeuille · fiches, alertes et suivi par pôle</span></div>
  <div class="csd-cards">${cartes.map(([t,v,i,bg,cl])=>`<div class="csd-card">
    <div class="h"><span class="t">${t}</span><div class="ic" style="background:${bg}">${i}</div></div>
    <div class="v" style="color:${cl}">${v}</div></div>`).join('')}</div>
  <div class="toolbar">
    <input class="search" id="csdQ" placeholder="Rechercher — ETU, projet, localisation, initiateur, responsable…" value="${esc(f.q)}">
    <select id="csdSt"><option value="all">Tous statuts</option>${CSD_ST.map(s=>`<option ${norm(f.st)===norm(s)?'selected':''}>${s}</option>`).join('')}</select>
    <select id="csdPole"><option value="">Tous pôles</option>${poles.map(g=>`<option ${f.pole===g?'selected':''}>${esc(g)}</option>`).join('')}</select>
    <button class="iconbtn" id="csdVue">${f.vue==='grid'?'▤ Liste':'▦ Fiches'}</button>
    <span class="sp"></span>
    <button class="iconbtn" id="csdImp" title="Importer un fichier CSD (HTML ou JSON) : les projets et leurs champs de comité rejoignent le portefeuille">⇱ Importer un CSD</button>
    <span class="hint">${tous.length} / ${PROJ().length}</span>
  </div>
  <div class="cols-dash" style="align-items:start">
    <div>${sections.map(g=>{
      const l=tous.filter(p=>p.group===g);
      return `<div class="csd-sec"><div class="csd-sech"><span style="font-size:17px">🏗</span>
        <div><div class="ti">${esc(g)}</div><div class="su">${l.length} projet(s)</div></div></div>
        ${l.length?(f.vue==='grid'?`<div class="csd-grid">${l.map(csdCarte).join('')}</div>`
                                  :`<div class="csd-list">${l.map(csdLigne).join('')}</div>`)
                 :'<div class="empty" style="padding:14px">Aucun projet pour ces filtres.</div>'}</div>`;}).join('')}
    </div>
    <div class="csd-alerts"><div class="ah">⚠️ Alertes projets ${alertes.length?`<span class="badge">${alertes.length}</span>`:''}</div>
      ${alertes.length?alertes.map(p=>{const c=csdOf(p.id), d=csdDelai(p);
        return `<div class="csd-alert" data-csdp="${esc(p.id)}">
          <div class="dot" style="background:${CSD_ROUGE.includes(norm(csdStatut(p)))?'var(--bad)':'var(--warn)'}"></div>
          <div><div class="n">${esc(c.etu||p.shine||'')} – ${esc(p.nom)}</div>
            <div class="s">🕐 ${esc(c.etape||p.statut||'—')}${d?' • '+d.lb:(c.delais?' • '+esc(c.delais):'')}</div></div></div>`;}).join('')
        :'<div class="empty" style="padding:16px">✅ Aucune alerte en cours</div>'}
    </div>
  </div>
  ${footHTML('csd','CSD · revue de portefeuille en comité · les champs de suivi complètent la fiche projet, les montants et les pôles restent ceux du portefeuille.')}`;
  $('#csdQ').addEventListener('input',e=>{f.q=e.target.value; renderGardeFocus(renderCSD);});
  $('#csdSt').addEventListener('change',e=>{f.st=e.target.value; renderCSD();});
  $('#csdPole').addEventListener('change',e=>{f.pole=e.target.value; renderCSD();});
  $('#csdVue').addEventListener('click',()=>{f.vue=f.vue==='grid'?'list':'grid'; scheduleSave(); renderCSD();});
  $('#csdImp').addEventListener('click',csdImporter);
  $$('[data-csdp]').forEach(el=>el.addEventListener('click',()=>csdFiche(el.dataset.csdp)));
}
/* Fiche de comité : les champs de suivi, à côté de ce que porte déjà le projet. */
function csdFiche(id){
  const p=S.projects.find(x=>x.id===id); if(!p) return;
  const c=csdOf(id);
  const ov=document.createElement('div'); ov.className='dmodal'; ov.id='csdBox';
  ov.innerHTML=`<div class="dbox" style="width:min(880px,96vw)">
    <div class="dhead"><span class="af-mk">🏗</span><h4>${esc(c.etu||p.shine||'')} — ${esc(p.nom)}</h4>
      <button class="dclose" data-cdc title="Fermer">×</button></div>
    <div class="dbody" style="overflow:auto">
      <div class="csd-det">
        <div class="csd-f"><label>Statut comité</label>
          <select class="kin" data-cdf="statut">${['',...CSD_ST].map(s=>`<option ${s===csdStatut(p)?'selected':''}>${s}</option>`).join('')}</select></div>
        ${CSD_CHAMPS.map(([k,l])=>`<div class="csd-f"><label>${l}</label><input class="kin" value="${esc(c[k]||'')}" data-cdf="${k}"></div>`).join('')}

      if(k==='statut'){ c.statut=v; logChange('CSD '+(c.etu||p.shine||p.nom),'statut',csdStatut(p),v); }
      else c[k]=v;
      scheduleSave(); };

}
/* Import d'un fichier CSD : les tableaux de données y sont des littéraux
   JavaScript (INFRA_RAW, EE_RAW…). On les lit sans exécuter le fichier. */
function csdImporter(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.html,.htm,.json';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let lots=[];
      const t=String(rd.result||'');
      try{
        const j=JSON.parse(t);
        lots=Array.isArray(j)?[j]:Object.values(j).filter(Array.isArray);
      }catch(_){ lots=csdTableaux(t); }
      const lignes=lots.flat().filter(x=>x&&typeof x==='object');
      if(!lignes.length){ alert("Aucun tableau de projets reconnu dans ce fichier.\n\nAttendu : un export CSD (HTML contenant INFRA_RAW, EE_RAW…) ou un JSON de projets."); return; }
      csdAppliquer(lignes, f.name);
    };
    rd.readAsText(f);
  };
  inp.click();
}
/* Les tableaux du CSD sont des littéraux JavaScript, parfois tenus sur une
   seule ligne de 80 Ko : une expression régulière s'y perd d'un tableau à
   l'autre. On suit les crochets, en ignorant ceux qui sont dans une chaîne. */
function csdTableaux(t){
  const out=[], re=/const\s+[A-Za-z0-9_]*RAW\s*=\s*\[/g; let m;
  while((m=re.exec(t))){
    const deb=m.index+m[0].length-1;
    let i=deb, prof=0, chaine=false, ech=false;
    for(; i<t.length; i++){
      const c=t[i];
      if(chaine){ if(ech) ech=false; else if(c==='\\') ech=true; else if(c==='"') chaine=false; continue; }
      if(c==='"') chaine=true;
      else if(c==='[') prof++;
      else if(c===']'){ prof--; if(prof===0){ i++; break; } }
    }
    try{ const a=JSON.parse(t.slice(deb,i)); if(Array.isArray(a)&&a.length) out.push(a); }catch(e){}
    re.lastIndex=i;
  }
  return out;
}
function csdNombre(v){
  const t=String(v==null?'':v).replace(/[^\d,.-]/g,'').replace(/\s/g,'').replace(',','.');
  const x=parseFloat(t); if(!Number.isFinite(x)) return null;
  return Math.round(x>=10000? x/1000 : x);     // les montants du CSD sont en euros, le portefeuille en k€
}
function csdAppliquer(lignes,nom){
  const cle=s=>norm(s).replace(/[^a-z0-9]/g,'');
  let crees=0, maj=0;
  lignes.forEach(r=>{
    const etu=String(r.etu||'').trim(), shine=String(r.shine||'').trim(), titre=String(r.projets||r.nom||'').trim();
    if(!etu && !shine && !titre) return;
    let p=S.projects.find(x=>!x.deleted && ((shine && cle(x.shine)===cle(shine)) ||
        (etu && cle((csdOf(x.id).etu)||x.ishift||'')===cle(etu)) || (titre && cle(x.nom)===cle(titre))));
    if(!p){
      const pole=String(r.entite||'').split('|')[0].trim()||'INFRA';
      p={id:shine||etu||uid(), shine:shine, nom:titre||etu||shine, pole:pole, group:poleGroup(pole),
         secteur:String(r.localisation||''), pm:String(r.responsables||'').trim(), pl:'', sponsor:String(r.initiateur||'').trim(),
         statut:String(r.statut||'En cours'), actif:true, hoverride:null, ishift:etu,
         c1:csdNombre(r.budget)||0, c2:csdNombre(r.budgetC2), b27:0,
         act:csdNombre(r.actuals)||0, commit:csdNombre(r.commitments)};
      S.projects.push(p); crees++;
    } else {
      maj++;
      if(!p.shine && shine) p.shine=shine;
      if(!p.ishift && etu) p.ishift=etu;
      const n=(v,cur)=>{ const x=csdNombre(v); return x==null?cur:x; };
      p.c1=n(r.budget,p.c1); p.c2=n(r.budgetC2,p.c2); p.act=n(r.actuals,p.act); p.commit=n(r.commitments,p.commit);
    }
    const c=csdOf(p.id);
    [['etu',r.etu],['wbsInv',r.wbsInv],['localisation',r.localisation],['engineering',r.engineering],
     ['initiateur',r.initiateur],['etape',r.etape],['cdo',r.cdo],['spe',r.spe],['cer',r.cer],
     ['rtProcess',r.rtProcessCer],['responsables',r.responsables],['delais',r.delais],
     ['dateDebut',r.dateDebut],['dateFin',r.dateFin],['sujets',r.sujets],['actionSuivi',r.actionSuivi],
     ['remarques',r.remarques],['commentaires',r.actions],['statut',r.statut]
    ].forEach(([k,v])=>{ if(v!=null && String(v).trim()!=='') c[k]=String(v); });
  });
  logChange('CSD '+(nom||''),'import',' ',crees+' créés, '+maj+' mis à jour');
  scheduleSave(); renderCSD();
  alert('Import CSD terminé.\n\n'+crees+' projet(s) créé(s), '+maj+' mis à jour.\n\nLes montants en euros ont été convertis en k€. Vérifiez le portefeuille, puis enregistrez.');
}


/* ======================= Achats & Engagements =======================
   Reprise du module « Achats » de l'outil CSD. Une ligne d'achat est une
   demande d'achat, une commande passée ou une imputation directe, rattachée
   à un projet du portefeuille. Trois agrégats en découlent :

     Réalisé    = montants réceptionnés des commandes + imputations
     Engagé     = commandé non encore réceptionné (hors commandes soldées)
     Disponible = budget de référence (C2 à défaut C1) − Réalisé − Engagé

   Le budget projet est tenu en k€ dans la plateforme, les achats en € :
   la conversion est faite ici, une fois, et signalée dans l'écran.
   Le rapprochement avec les colonnes « Actuals » et « Open Commitments »
   du suivi financier signale les projets dont les deux sources divergent. */
const ACH_TYPES=['Commande',"Demande d'achat",'Imputation'];
const ACH_TICON={'Commande':'🧾',"Demande d'achat":'📝','Imputation':'📌'};
const ACH_ST={'Commande':['Commandée','Partiellement réceptionnée','Réceptionnée','Facturée','Soldée','Annulée'],
  "Demande d'achat":['DA émise','DA validée','DA refusée','Transformée en commande'],
  'Imputation':['Imputée','Annulée']};
const ACH_ST_DEF={'Commande':'Commandée',"Demande d'achat":'DA émise','Imputation':'Imputée'};
const ACH_DEAD=['Annulée','DA refusée','Transformée en commande'];
const ACH_NATURES=['CAPEX','OPEX'];
const ACH_VIEWS=[['synth','📁 Par projet'],['lines','☰ Toutes les lignes'],['four','🏭 Par fournisseur'],['mois','📅 Par mois']];
const ACH_FIELDS={projId:'Projet',type:'Type',statut:'Statut',numDA:'N° DA',numCmd:'N° commande',fournisseur:'Fournisseur',
  objet:'Objet',montant:'Montant HT',recu:'Montant réceptionné',facture:'Montant facturé',dateDA:'Date DA',
  dateCmd:'Date commande',dateLiv:'Livraison prévue',dateRecep:'Date réception',wbs:'WBS | INV',
  compte:'Compte / nature comptable',nature:'CAPEX / OPEX',demandeur:'Demandeur',commentaire:'Commentaire'};

const achEur=v=>v==null?'—':(+v||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
function achNum(v){ if(v==null||v==='')return 0; if(typeof v==='number')return isFinite(v)?v:0;
  const s=String(v).replace(/[^0-9,.\-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.');
  const n=parseFloat(s); return isFinite(n)?n:0; }
function achToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function achJours(iso){ if(!iso)return null; const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m)return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]), t=new Date(); return Math.round((d-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5); }
function achFR(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?m[3]+'/'+m[2]+'/'+m[1]:''; }

/* Une ligne pèse sur le budget selon son type : une DA n'est pas un engagement
   ferme, une imputation est déjà dépensée, une commande se partage entre
   réceptionné (réalisé) et reste à recevoir (engagé). */
function achCalc(l){
  const z={dem:0,cmd:0,real:0,eng:0,fact:0,mort:ACH_DEAD.includes(l.statut)};
  if(z.mort) return z;
  const m=achNum(l.montant), r=achNum(l.recu), f=achNum(l.facture);
  if(l.type==="Demande d'achat"){ z.dem=m; return z; }
  if(l.type==='Imputation'){ z.real=m; z.fact=f||m; return z; }
  z.cmd=m; z.real=r; z.fact=f; z.eng=(l.statut==='Soldée')?0:Math.max(0,m-r);
  return z;
}
function achRetard(l){ return l.type==='Commande' && ['Commandée','Partiellement réceptionnée'].includes(l.statut)
  && !!l.dateLiv && achJours(l.dateLiv)<0; }
function achSomme(lignes){
  const s={dem:0,cmd:0,real:0,eng:0,fact:0,n:0,retard:0,ouvert:0};
  lignes.forEach(l=>{ const c=achCalc(l); s.dem+=c.dem; s.cmd+=c.cmd; s.real+=c.real; s.eng+=c.eng; s.fact+=c.fact; s.n++;
    if(achRetard(l))s.retard++; if(c.eng>0||c.dem>0)s.ouvert++; });
  return s;
}
function achProjets(){ return S.projects.filter(p=>!p.deleted); }
function achProj(id){ return id?S.projects.find(p=>p.id===id&&!p.deleted):null; }
function achLibelle(l){ const p=achProj(l.projId); return p?(p.shine?p.shine+' — ':'')+p.nom:'— non rattaché —'; }
/* Budget de référence : la même règle que le suivi financier (C2, C1 à défaut),
   convertie des k€ du portefeuille vers les € des lignes d'achat. */
function achBase(p){ const c=(p.c2!=null&&p.c2!=='')?p.c2:p.c1; return (c==null||c==='')?null:(+c||0)*1000; }
function achProjSomme(p,lignes){
  const s=achSomme(lignes||S.achats.filter(l=>l.projId===p.id));
  const base=achBase(p), dispo=base==null?null:base-s.real-s.eng;
  return {...s, base, dispo, dispoDA:dispo==null?null:dispo-s.dem,
    pct:base>0?(s.real+s.eng)/base*100:null, finA:(+p.act||0)*1000, finC:(+p.commit||0)*1000};
}
/* Écart de rapprochement : les achats saisis ne disent pas la même chose que
   les colonnes Actuals / Commitments. Tolérance de 500 € pour ne pas crier
   sur un arrondi de saisie. */
function achEcart(s){ return s.n>0 && (Math.abs(s.finA-s.real)>500 || Math.abs(s.finC-s.eng)>500); }

function achFiltre(l){
  const f=S.ach.f, p=achProj(l.projId);
  if(S.ach.pid){ if(l.projId!==S.ach.pid) return false; }
  else if(S.ach.pole && (!p||p.group!==S.ach.pole)) return false;
  if(f.type && l.type!==f.type) return false;
  if(f.statut){
    if(f.statut==='__retard'){ if(!achRetard(l)) return false; }
    else if(f.statut==='__ouvert'){ const c=achCalc(l); if(!(c.eng>0||c.dem>0)) return false; }
    else if(l.statut!==f.statut) return false;
  }
  if(f.four && norm(l.fournisseur)!==norm(f.four)) return false;
  if(f.nature && l.nature!==f.nature) return false;
  const q=norm(S.ach.q||'').trim();
  if(q.length>1){
    const foin=norm([achLibelle(l),l.numDA,l.numCmd,l.fournisseur,l.objet,l.wbs,l.compte,l.demandeur,l.commentaire].join(' '));
    if(!q.split(/\s+/).every(w=>foin.includes(w))) return false;
  }
  return true;
}
function achLignes(){ return S.achats.filter(achFiltre); }
function achNouvelle(projId){
  const l={id:'ach'+Math.random().toString(36).slice(2,9), projId:projId||S.ach.pid||'', type:'Commande',
    statut:'Commandée', numDA:'', numCmd:'', fournisseur:'', objet:'', montant:0, recu:0, facture:0,
    dateDA:'', dateCmd:achToday(), dateLiv:'', dateRecep:'', wbs:'', compte:'', nature:'CAPEX', demandeur:S.user||'', commentaire:''};
  S.achats.unshift(l); logChange('Achats','création','', (l.objet||'nouvelle ligne')); return l;
}

  lier('#achAdd','click',()=>{achNouvelle();S.ach.view='lines';scheduleSave();rr();});
  lier('#achImp','click',()=>achImportDlg());
  /* saisie dans la table des lignes */
  $$('[data-achf]').forEach(el=>{

      const av=l[k];
      let v = el.tagName==='SELECT' ? el.value : (el.tagName==='INPUT'?el.value:el.textContent.trim());
      if(['montant','recu','facture'].includes(k)) v=achNum(v);
      if(String(av)===String(v)) return;
      l[k]=v;
      if(k==='type' && !(ACH_ST[v]||[]).includes(l.statut)) l.statut=ACH_ST_DEF[v];
      logChange('Achat '+(l.numCmd||l.numDA||l.objet||l.id), ACH_FIELDS[k]||k, av, v);
      scheduleSave(); rr();
    };
    el.addEventListener(el.tagName==='SELECT'?'change':'blur',maj);
  });

  const r=p(s.real), e=p(s.eng), d=p(s.dem), reste=Math.max(0,100-r-e-d);
