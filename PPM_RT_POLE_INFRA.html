<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPM RT Pôle INFRA — Pilotage portefeuille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#eaeff5; --panel:#ffffff; --panel-2:#eef3f7; --panel-3:#e4ebf1;
    --ink:#11202e; --ink-2:#33485a; --muted:#5e7485; --faint:#8499a7;
    --line:#e0e7ee; --line-2:#ccd7e0;
    --accent:#115e75; --accent-soft:#e1edf1; --accent-ink:#0b4658;
    --copper:#b0651f; --copper-soft:#f5e9dd;
    --good:#1d7a52; --good-soft:#e0f0e8;
    --warn:#bd8413; --warn-soft:#f7edd7;
    --bad:#c0392b; --bad-soft:#f8e3e0;
    --radius:10px;
    --sidebar-bg:linear-gradient(180deg,#ffffff 0%,#f3f8fc 100%); --app-bg:linear-gradient(180deg,#f2f6fa 0%,#e8eef5 100%);
    --shadow:0 1px 2px rgba(16,42,67,.05), 0 6px 18px rgba(16,42,67,.07);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --ground:#0c1620; --panel:#12202c; --panel-2:#0f1b25; --panel-3:#172835;
    --ink:#e8eef2; --ink-2:#bccdd7; --muted:#8ba1ad; --faint:#637885;
    --line:#24363f; --line-2:#31454f;
    --accent:#4fb3cf; --accent-soft:#11323d; --accent-ink:#9ad7e6;
    --copper:#d99a5b; --copper-soft:#3a2a19;
    --good:#57c394; --good-soft:#113026;
    --warn:#e0b45a; --warn-soft:#33280f;
    --bad:#e8766a; --bad-soft:#381e1b;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.25); --sidebar-bg:var(--panel); --app-bg:var(--ground);
  }}
  :root[data-theme="dark"]{
    --ground:#0c1620; --panel:#12202c; --panel-2:#0f1b25; --panel-3:#172835;
    --ink:#e8eef2; --ink-2:#bccdd7; --muted:#8ba1ad; --faint:#637885;
    --line:#24363f; --line-2:#31454f;
    --accent:#4fb3cf; --accent-soft:#11323d; --accent-ink:#9ad7e6;
    --copper:#d99a5b; --copper-soft:#3a2a19;
    --good:#57c394; --good-soft:#113026;
    --warn:#e0b45a; --warn-soft:#33280f;
    --bad:#e8766a; --bad-soft:#381e1b;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.25); --sidebar-bg:var(--panel); --app-bg:var(--ground);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--ink);overflow-x:hidden;
    font-family:"IBM Plex Sans",system-ui,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.5}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  h1,h2,h3,.ar{font-family:"Archivo",system-ui,sans-serif}
  button{font:inherit;cursor:pointer;color:inherit}
  [hidden]{display:none!important}
  ::selection{background:var(--accent-soft)}

  /* Top bar */
  .app{display:flex;min-height:100vh}
  .sidebar{flex:0 0 262px;width:262px;background:var(--sidebar-bg);border-right:1px solid var(--line);box-shadow:2px 0 16px rgba(16,42,67,.05);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:14px 0;overflow:hidden;z-index:30}
  .sb-brand{position:relative;display:flex;align-items:center;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--accent-soft) 0%,transparent 70%)}
  .sb-brand::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 55%,var(--copper) 100%)}
  .sb-brand .mk{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));box-shadow:0 3px 10px rgba(17,94,117,.4);display:grid;place-items:center;color:#fff;font-family:Archivo;font-weight:800;font-size:18px;flex:0 0 auto}
  .sb-brand .bt{font-family:Archivo;font-weight:800;font-size:16.5px;letter-spacing:.2px;line-height:1.05;color:var(--ink)}
  .sb-brand .bs{font-size:10.5px;color:var(--muted);line-height:1.3;margin-top:2px}
  .sb-nav{flex:1;min-height:0;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
  .sb-sec{display:flex;align-items:center;font-family:Archivo;font-size:13px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);padding:15px 8px 6px 10px;cursor:pointer;user-select:none}
  .sb-sec:hover{color:var(--accent-ink)}
  .sb-sec .sb-chev{color:var(--muted);font-size:10px}
  .sb-secwrap{position:relative;margin:2px 0 4px 10px;border-left:2px solid var(--line-2);display:flex;flex-direction:column;gap:1px}
  .sb-secwrap.collapsed{display:none}
  .sb-secwrap > button{position:relative;padding-left:16px}
  .sb-secwrap > button::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:9px;height:2px;background:var(--line-2)}
  .sb-secwrap .sb-subwrap{margin-left:9px}
  .nav-ic{flex:0 0 auto;width:18px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1;margin-right:3px}
  .sb-sec .nav-ic{font-size:14px;width:20px}
  .sb-nav button{display:flex;align-items:center;gap:9px;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px;color:var(--ink-2);width:100%;transition:background .13s,color .13s,box-shadow .13s}
  .sb-nav button:hover{background:var(--panel-2);color:var(--ink)}
  .sb-nav button.on{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 3px 0 0 var(--accent)}
  .sb-nav .step{font-family:"IBM Plex Mono";font-size:10px;font-weight:600;color:var(--faint);width:15px;text-align:center;flex:0 0 auto}
  .sb-nav button.on .step{color:var(--accent)}
  .sb-chev{margin-left:auto;font-size:9px;color:var(--faint);transition:transform .15s;padding:0 2px;cursor:pointer}
  .sb-chev:hover{color:var(--ink)}
  .sb-chev.rot{transform:rotate(-90deg)}
  .sb-subwrap{position:relative;margin:1px 0 1px 19px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:1px}
  .sb-subwrap.collapsed{display:none}
  .sb-nav .sb-sub{position:relative;padding:5px 10px 5px 18px;font-size:12px;font-weight:500;color:var(--muted)}
  .sb-nav .sb-sub::before{content:"";position:absolute;left:0;top:50%;width:11px;height:1px;background:var(--line-2)}
  .sb-nav .sb-sub:hover{background:var(--panel-2);color:var(--ink)}
  .sb-nav .sb-sub.on{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 3px 0 0 var(--accent)}
  .sb-nav .sb-sub.on::before{background:var(--accent)}
  .sb-nav .sb-par{font-weight:600;color:var(--ink-2)}
  .sb-nav .sb-par:hover{background:var(--panel-2);color:var(--ink)}
  .sb-nav .sb-par .sb-chev{color:var(--muted)}
  .sb-foot{padding:10px 12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .sb-endline{height:3px;border-radius:2px;margin:8px -12px -10px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 55%,var(--copper) 100%)}
  .sb-foot .row{display:flex;gap:8px}
  .sb-foot .iconbtn{flex:1;justify-content:center}
  .main{flex:1;min-width:0;height:100vh;overflow:hidden;background:var(--app-bg);display:flex;flex-direction:column}
  @media (max-width:820px){
    .app{flex-direction:column}
    .sidebar{width:auto;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:0;overflow:visible}
    .sb-brand::before{display:none}
    .sb-endline{display:none}
    .sb-brand{border-bottom:0;padding:8px 12px}
    .sb-nav{flex-direction:row;flex-wrap:wrap;flex:1 1 100%;order:3;padding:6px 8px;overflow:visible;min-height:0}
    .sb-sec{width:100%;padding:6px 6px 2px}
    .sb-nav button{width:auto}
    .sb-foot{border-top:0;flex-direction:row;align-items:center;padding:8px 12px;order:2;margin-left:auto;gap:8px}
    .sb-foot .iconbtn{flex:none}
    .main{height:auto;overflow:visible}
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mk{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;
    color:#fff;font-family:Archivo;font-weight:800;font-size:15px}
  .brand .bt{font-family:Archivo;font-weight:800;font-size:15px;letter-spacing:.2px}
  .brand .bs{font-size:11px;color:var(--muted)}
  .tabs{display:flex;flex-wrap:wrap;gap:3px;margin-left:6px}
  .tabs button{border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 13px;
    font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
  .tabs button:hover{background:var(--panel-2);color:var(--ink)}
  .tabs button.on{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
  .tabs button .mono{font-size:10px;opacity:.7}
  .topright{margin-left:auto;display:flex;align-items:center;gap:10px}
  .savestate{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-width:92px;justify-content:flex-end}
  .savestate .d{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .savestate.ok .d{background:var(--good)} .savestate.ok{color:var(--good)}
  .savestate.pend .d{background:var(--warn)} .savestate.pend{color:var(--warn)}
  .savestate.err .d{background:var(--bad)} .savestate.err{color:var(--bad)}
  .iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
  .iconbtn:hover{background:var(--panel-2)}
  .savebtn{width:100%;border:0;border-radius:9px;padding:9px 12px;font-family:Archivo,inherit;font-size:12.5px;font-weight:800;letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-ink));box-shadow:0 2px 8px rgba(17,94,117,.35);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .07s,box-shadow .14s,filter .12s}
  .savebtn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(17,94,117,.45)}
  .savebtn:active{transform:translateY(0)}
  .savebtn.saved{background:linear-gradient(135deg,var(--good),#155e3f)}
  .savebtn.dirty{background:linear-gradient(135deg,var(--warn),var(--copper))}
  @media(max-width:1000px){.sb-foot .savebtn{width:auto}}

  .view{padding:12px 14px 16px;max-width:1680px;margin:0;flex:1;overflow-y:auto;display:flex;flex-direction:column}
  .view>*{flex:0 0 auto}
  .sec-title{position:relative;order:-3;display:flex;align-items:baseline;gap:12px;margin:2px 0 16px;padding:13px 14px 0}
  #bddMembres{order:-2} #planPresence{order:-1}
  .sec-title::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 55%,var(--copper) 100%)}
  .sec-title h2{font-size:19px;margin:0;font-weight:700}
  .sec-title .hint{color:var(--muted);font-size:12.5px}

  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:11px;margin-bottom:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
  .tile .lab{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .tile .big{font-family:Archivo;font-weight:800;font-size:26px;margin-top:5px;line-height:1;font-variant-numeric:tabular-nums}
  .tile .u{font-size:12px;color:var(--faint);font-weight:600;margin-left:3px}
  .tile .sub{font-size:11.5px;color:var(--muted);margin-top:4px}
  .tile.a .big{color:var(--accent)} .tile.c .big{color:var(--copper)}
  .tile.good .big{color:var(--good)} .tile.bad .big{color:var(--bad)} .tile.warn .big{color:var(--warn)}
  .tile.click{cursor:pointer;transition:border-color .12s,transform .05s}
  .tile.click:hover{border-color:var(--accent);transform:translateY(-1px)}
  /* ===== Cockpit hero header ===== */
  .dash-hero{position:relative;border:1px solid var(--line);border-radius:16px;background:radial-gradient(130% 150% at 0% 0%,var(--accent-soft) 0%,transparent 52%),linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);box-shadow:var(--shadow);padding:18px 20px 16px;margin:2px 0 16px;overflow:hidden}
  .dash-hero::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 55%,var(--copper) 100%)}
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-bottom:15px}
  .hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:9px}
  .hero-eyebrow::before{content:"";width:22px;height:2px;background:var(--accent);border-radius:2px}
  .hero-title{font-family:Archivo;font-weight:800;font-size:26px;line-height:1.04;margin:8px 0 5px;letter-spacing:-.01em;color:var(--ink)}
  .hero-sub{font-size:12.5px;color:var(--muted)}
  .hero-gauge{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px 16px 9px 11px;box-shadow:var(--shadow)}
  .gauge-ring{width:54px;height:54px;border-radius:50%;flex:0 0 auto;position:relative;display:grid;place-items:center;background:conic-gradient(var(--good) 0 calc(var(--g,0)*1deg),var(--warn) calc(var(--g,0)*1deg) calc(var(--a,0)*1deg),var(--bad) calc(var(--a,0)*1deg) 360deg)}
  .gauge-ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel)}
  .gauge-ring b{position:relative;z-index:1;font-family:Archivo;font-weight:800;font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .gauge-meta .gm-t{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .gauge-meta .gm-v{font-family:Archivo;font-weight:800;font-size:15px;color:var(--ink);margin-top:2px}
  .gauge-legend{display:flex;gap:11px;margin-top:5px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .gauge-legend span{display:inline-flex;align-items:center;gap:4px}
  .gauge-legend i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .hero-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px}
  @media(max-width:1180px){.hero-kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:680px){.hero-kpis{grid-template-columns:repeat(2,1fr)}}
  .hero-kpis .tile{position:relative;padding:12px 13px 12px 16px;border-radius:11px;overflow:hidden}
  .hero-kpis .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.9}
  .hero-kpis .tile.c::before{background:var(--copper)}
  .hero-kpis .tile.good::before{background:var(--good)}
  .hero-kpis .tile.warn::before{background:var(--warn)}
  .hero-kpis .tile.bad::before{background:var(--bad)}
  .hero-kpis .tile.click{cursor:pointer;transition:transform .09s,box-shadow .14s,border-color .14s}
  .hero-kpis .tile.click:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 5px 18px rgba(16,42,67,.13)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .col3{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:16px}
  .cols-dash{display:grid;grid-template-columns:minmax(0,1fr) 224px 224px;gap:10px;margin-bottom:8px;align-items:stretch}
  .cols-dash>div{display:flex;flex-direction:column;gap:12px}
  .cols-dash>div:nth-child(2)>.panel:nth-child(1){order:2;flex:1;margin-bottom:0!important}
  .cols-dash>div:nth-child(2)>.panel:nth-child(2){order:1;margin-bottom:0}
  .cols-dash>div:nth-child(3)>.panel{flex:1}
  @media(max-width:1200px){.cols-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
  @media(max-width:880px){.cols-dash{grid-template-columns:1fr}}
  @media (max-width:900px){.cols,.col3{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .panel-h h3{margin:0;font-size:13.5px;font-weight:700}
  .panel-h .meta{font-size:11px;color:var(--muted);font-weight:600}
  .panel-b{padding:11px 12px}

  /* bar chart */
  .bars{display:flex;flex-direction:column;gap:8px}
  .bar-row{display:grid;grid-template-columns:84px 1fr 44px;align-items:center;gap:6px;font-size:11.5px}
  .bar-row .nm{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .bar-row .nm:hover{color:var(--accent)}
  .bar-track{height:18px;background:var(--panel-3);border-radius:5px;overflow:hidden;position:relative}
  .bar-fill{height:100%;border-radius:5px;background:var(--accent)}
  .bar-row .val{text-align:right;font-family:"IBM Plex Mono";font-size:11px;color:var(--ink-2)}

  /* tables */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:13px}
  .toolbar input.search{min-width:220px}
  .toolbar .sp{margin-left:auto}
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  thead th{background:var(--panel-2);font-family:Archivo;font-size:11px;letter-spacing:.03em;text-transform:uppercase;
    color:var(--ink-2);font-weight:700;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
  thead th .sortar{opacity:.4;font-size:9px;margin-left:3px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--accent-soft)}
  tbody tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono";font-size:12px}
  td.wrap{white-space:normal;min-width:160px;max-width:300px}
  .code{font-family:"IBM Plex Mono";font-size:11.5px;color:var(--accent-ink)}
  .hdot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px}
  .hdot.g{background:var(--good)} .hdot.a{background:var(--warn)} .hdot.r{background:var(--bad)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
  .pill.g{background:var(--good-soft);color:var(--good)} .pill.a{background:var(--warn-soft);color:var(--warn)}
  .pill.r{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--panel-3);color:var(--muted)}
  [contenteditable]{outline:none;border-radius:4px}
  [contenteditable]:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
  [contenteditable]:focus{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--panel)}

  /* heatmap */
  .heat td.hc{text-align:center;font-family:"IBM Plex Mono";font-size:11.5px;min-width:44px}
  .heat td.rname{font-weight:600;color:var(--ink-2);position:sticky;left:0;background:var(--panel);z-index:1}
  .heat thead th.num{text-align:center}

  /* passport */
  .pp-grid{display:grid;grid-template-columns:1fr 250px;gap:14px}
  @media (max-width:860px){.pp-grid{grid-template-columns:1fr}}
  .pp-id{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
  .pp-id .c{font-family:"IBM Plex Mono";color:var(--accent-ink);font-size:15px;font-weight:600}

S = (function(){
  // Verrou local actif : ne rien charger en clair au démarrage (données chiffrées en IndexedDB,

  let emb=null, lsv=null;

function migrate(saved){
  const base=buildFromSeed();
  const r=Object.assign(base, saved, {
    config:Object.assign(base.config,saved.config||{}),
    months:saved.months||base.months,

  r.cers=r.cers||{}; r.gates=r.gates||{}; r.hse=r.hse||{}; r.actions=r.actions||seedActions(); if(!r.navKey)r.navKey='ppole';
  r.scenario=r.scenario||{budgetCut:0,capCut:0,excluded:{},added:[],q:''}; r.audit=r.audit||[]; if(!r.user)r.user='SGD RT Infra';
  r.ged=r.ged||seedGED(); r.cdc=r.cdc||{}; r.uoEst=r.uoEst||[]; if(r.activeOnly===undefined)r.activeOnly=true;
  (r.ged||[]).forEach(dd=>{if(dd.sousens===undefined)dd.sousens='Études';if(dd.phase===undefined)dd.phase='APD';if(dd.fav===undefined)dd.fav=false;if(dd.archived===undefined)dd.archived=false;if(dd.file===undefined)dd.file=null;if(dd.html===undefined)dd.html=null;});
  r.uoFilter=r.uoFilter||{scope:'',q:''}; r.gedFilter=r.gedFilter||{proj:'',dossier:'',statut:'',q:''}; r.footNotes=r.footNotes||{};
  if(!r.phScope) r.phScope='__all__'; if(!r.actFilter) r.actFilter={proj:'',statut:'',crit:''};
  (r.projects||[]).forEach(p=>{ if(!p.ph && p.shine && SEED_PHASING[p.shine]) p.ph=SEED_PHASING[p.shine];
    const gc=matchGateCdo(p); if(gc){if(!p.cdoReal)p.cdoReal=gc.cdo; if(!p.gateRealRaw)p.gateRealRaw=gc.gate;} if(p.actif===undefined)p.actif=isActif(p); if(p.group==='Site')p.group='INFRA'; if(p.pole&&/plan tr/i.test(p.pole))p.group='Plan Transfo'; });
  // Membres retires a la main. Sans cette memoire, le rapprochement ci-dessous
  // recreerait a chaque chargement tout PM|PL d'un projet, et une suppression
  // dans BDD Membres paraitrait ne jamais s'enregistrer.
  r.membersRemoved = Array.isArray(r.membersRemoved) ? r.membersRemoved : [];
  r.members = (r.members && r.members.length) ? r.members
            : (r.membersRemoved.length ? [] : SEED_MEMBERS.map(m=>({...m})));
  r.presence = r.presence || {};
  (function(){ const key=s=>norm(s).replace(/[^a-z0-9]/g,'');

/* ======================= Health engine ======================= */
// Finance-driven (real data); planning/risk/res/qual/doc use passport signal or neutral.
function financeHealth(p){
  const c1=p.c1||0, c2=(p.c2!=null?p.c2:p.c1)||0, act=p.act||0;
  if(!c1 && !c2) return {score:70,label:'n/a'};
  const dev = c1? Math.abs((c2-c1)/c1)*100 : 0;      // révision budgétaire vs C1
  const conso = c1? (act/c1)*100 : 0;                 // consommation
  let score=100;
  score -= Math.min(50, dev*2);                       // 5% écart => -10
  if(conso>100) score -= Math.min(30,(conso-100));
  return {score:Math.max(0,Math.round(score)), dev:Math.round(dev), conso:Math.round(conso)};
}
function projHealth(p){
  const w=S.config.weights;
  const fin=financeHealth(p);
  // neutral baselines where no operational data yet
  const pp=S.passports[p.id];
  const planning = pp? 78 : 75;
  const risk = pp&&pp.risks&&pp.risks.length? Math.max(40,90-pp.risks.length*12):80;
  const res=80, qual=85, doc = pp?85:70;
  let composite = (w.plan*planning + w.fin*fin.score + w.risk*risk + w.res*res + w.qual*qual + w.doc*doc)/(w.plan+w.fin+w.risk+w.res+w.qual+w.doc);
  composite=Math.round(composite);
  let band = composite>=75?'g':composite>=55?'a':'r';
  // statut override
  const st=norm(p.statut);
  if(st && st!=='ok' && st!=='' ) { if(band==='g') band='a'; }
  if(p.hoverride) band=p.hoverride;
  if(pp&&pp.health&&pp.health.override) band=pp.health.override;
  return {composite,band,fin,planning,risk,res,qual,doc};
}
const bandLabel={g:'On Track',a:'Attention',r:'At Risk'};
function isLate(p){ const h=projHealth(p); return h.band==='r'; }

/* ======================= Save ======================= */
let saveTimer=null, dirty=false, baselineSavedAt=0;
try{ baselineSavedAt=(S&&S._savedAt)||0; }catch(_){}
const hhmm=()=>new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const SRV='';  // coquille artefact : stockage navigateur uniquement

/* ---- Persistance navigateur : IndexedDB (l'état dépasse le plafond ~5 Mo de localStorage) ----
   Utilisé UNIQUEMENT en mode coquille (sans serveur, SRV vide) : sauvegarde et
   rechargement des données importées. En mode serveur, la source de vérité reste le fichier. */
const IDB_NAME='ppm_store', IDB_STORE='kv', IDB_KEY='state';
function idbOpen(){
  return new Promise((res,rej)=>{
    let r; try{ r=indexedDB.open(IDB_NAME,1); }catch(e){ return rej(e); }
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function idbSave(obj){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(obj,IDB_KEY);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  }));
}
function idbLoad(){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const g=tx.objectStore(IDB_STORE).get(IDB_KEY);
    g.onsuccess=()=>res(g.result||null); g.onerror=()=>rej(g.error);
  }));
}
/* ---- Verrou par mot de passe (mode coquille uniquement) : WebCrypto AES-256-GCM ----
   Sans serveur, la seule vraie protection est de CHIFFRER les données. La clé est
   dérivée du mot de passe (PBKDF2 210k, SHA-256) et n'est jamais stockée ; un mot de
   passe faux échoue au déchiffrement (pas de hash à comparer). Métadonnée en clair
   (sel + e-mail affiché) dans localStorage ('ppm_lock') ; données chiffrées dans
   IndexedDB. Sans serveur, aucune copie localStorage en clair. */
const LOCK={active:false, key:null, email:'', salt:''};
const LOCK_OK=!!(window.crypto && window.crypto.subtle);
function lockB64(buf){ let s='', b=new Uint8Array(buf); for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function lockB64d(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
function lockMeta(){ try{ return JSON.parse(localStorage.getItem('ppm_lock')||'null'); }catch(_){ return null; } }
async function lockDeriveKey(password, saltB64){
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:lockB64d(saltB64), iterations:210000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function lockEncrypt(stateObj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, LOCK.key, new TextEncoder().encode(JSON.stringify(stateObj)));
  return { enc:1, email:LOCK.email||'', salt:LOCK.salt, iv:lockB64(iv), ct:lockB64(ct) };
}
async function lockDecrypt(blob, key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:lockB64d(blob.iv)}, key, lockB64d(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
// Active le verrou : dérive la clé, chiffre l'état courant, purge tout clair local.
async function lockActivate(password, email){
  const salt=lockB64(crypto.getRandomValues(new Uint8Array(16)));
  LOCK.key=await lockDeriveKey(password, salt); LOCK.salt=salt; LOCK.email=email||''; LOCK.active=true;
  try{ localStorage.setItem('ppm_lock', JSON.stringify({active:true, salt:salt, email:LOCK.email})); }catch(_){}
  try{ localStorage.removeItem('ppm_vitry_state'); }catch(_){}
  await doSave();
}
async function lockRemove(){
  LOCK.active=false; LOCK.key=null; LOCK.salt=''; LOCK.email='';
  try{ localStorage.removeItem('ppm_lock'); }catch(_){}
  await doSave();
}
// Au démarrage en mode coquille : si un verrou existe -> écran de déverrouillage ;
// sinon adopte l'état IndexedDB s'il est plus récent que l'amorçage.
async function idbHydrate(){
  if(SRV) return;
  const lk=lockMeta();
  if(lk && lk.active){ showUnlock(lk); return; }
  let rec=null; try{ rec=await idbLoad(); }catch(_){}
  if(!rec) return;
  const st = (rec.enc===0) ? rec.state : (rec.enc===1 ? null : rec);   // enc:0 = clair enveloppé ; sinon état brut hérité
  if(st && (st._savedAt||0) > ((S&&S._savedAt)||0)) adoptServerState(st,'Données locales chargées '+hhmm());
}

// Adopte un état venu du serveur (plus récent) — ne écrase jamais silencieusement.
function adoptServerState(st,msg){
  try{ S=migrate(st); }catch(_){ return false; }
  baselineSavedAt=(S&&S._savedAt)||0; dirty=false;
  // Aucune copie navigateur en clair quand l'auth serveur OU le verrou local est actif.
  if(!AUTH.enforced && !(typeof LOCK!=='undefined' && LOCK.active)){ try{ localStorage.setItem('ppm_vitry_state',JSON.stringify(S)); }catch(_){} }
  try{ render(); }catch(_){}
  setSave('ok', msg||('Synchronisé '+hhmm()));
  return true;
}
// Au démarrage : récupère l'état partagé (_ppm_state.json) — continuité multi-postes.
// force=true : le serveur fait autorite quoi qu'il arrive (juste apres connexion).
// Sinon une copie navigateur plus recente mais perimee gagnerait, puis ecraserait
// le fichier partage a la sauvegarde suivante.
async function syncFromServer(force){
  try{
    const r=await api('/state?_ts='+Date.now());
    if(r.status===401){ showLogin('Session expirée. Reconnectez-vous.'); return; }
    if(!r.ok) return;
    const j=await r.json(); const st=j&&j.state;
    if(!st) return;
    if(force || (st._savedAt||0) > ((S&&S._savedAt)||0)) adoptServerState(st,'À jour (serveur) '+hhmm());
    else baselineSavedAt=Math.max(baselineSavedAt,(st._savedAt||0));
  }catch(_){ /* serveur absent : mode local seul */ }
}
function setSave(state,txt){
  const el=$('#saveState'); if(el){ el.className='savestate '+state; const t=$('.t',el); if(t)t.textContent=txt; }
  const b=document.getElementById('saveBtn');
  if(b){ b.classList.toggle('dirty',state==='pend'||state==='err'); b.classList.toggle('saved',state==='ok');
    b.textContent = state==='pend'?'💾 Enregistrer •' : state==='err'?'⚠ Réessayer' : state==='ok'?'✓ Enregistré':'💾 Enregistrer'; }
}
function scheduleSave(){
  dirty=true; setSave('pend','Modifié…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,1000);
}
// Enregistrement en profondeur : localStorage TOUJOURS (copie de secours, même hors-ligne)
// PUIS le fichier via le serveur local. Horodatage pour départager les sources au chargement.
async function doSave(){
  clearTimeout(saveTimer);
  if(typeof AUTH!=='undefined' && AUTH.locked) return false;   // pas de session : aucune ecriture
  S._savedAt=Date.now();
  const payload=JSON.stringify(S);
  let ls=false;
  if(!AUTH.enforced){
    if(!SRV && LOCK.active && LOCK.key){
      try{ await idbSave(await lockEncrypt(S)); ls=true; }catch(_){}       // coquille verrouillée : chiffré
    } else {
      try{ localStorage.setItem('ppm_vitry_state',payload); ls=true; }catch(_){}
      if(!SRV){ try{ await idbSave({enc:0,state:S}); ls=true; }catch(_){} } // coquille : IndexedDB (>5 Mo)
    }
  }
  try{
    if(!SRV) throw new Error('mode-coquille');                // pas de serveur : persistance navigateur seule
    const r=await api('/save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({baseSavedAt:baselineSavedAt,state:S})});
    if(r.status===401){ setSave('err','Session expirée'); showLogin('Session expirée. Reconnectez-vous.'); return false; }
    if(r.status===409){ // ANTI-ÉCRASEMENT : un autre poste a enregistré plus récemment
      const j=await r.json().catch(()=>null);
      try{ localStorage.setItem('ppm_vitry_state_conflit',payload); }catch(_){}
      if(j&&j.state){
        adoptServerState(j.state,'Conflit — version serveur chargée');
        alert("Un autre poste a enregistré des données plus récentes.\n\nLa version du serveur vient d'être chargée (rien n'a été écrasé).\nVotre saisie non enregistrée est sauvegardée localement sous « ppm_vitry_state_conflit ».");
      } else setSave('err','Conflit — rechargez');
      return false;
    }
    if(r.ok){ dirty=false; baselineSavedAt=S._savedAt; setSave('ok','Enregistré '+hhmm()); return true; }
  }catch(_){ /* serveur injoignable → repli local */ }
  if(ls){ dirty=false; baselineSavedAt=S._savedAt; setSave('ok','Enregistré (local) '+hhmm()); return true; }
  setSave('err','Échec — non enregistré'); return false;
}

async function doLogin(user,pass){
  let j=null, st=0;
  try{ const r=await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},
         body:JSON.stringify({user:user,pass:pass})});
       st=r.status; j=await r.json().catch(()=>null); }catch(_){ }
  if(st===200 && j && j.ok){
    AUTH.user=j.user; AUTH.expiresAt=j.expiresAt; AUTH.warnShown=false; AUTH.locked=false;
    hideLogin(); startSessionWatch(); await syncFromServer(); render(); setSave('ok','Connecté '+hhmm());
    return null;
  }
  if(st===0) return 'Serveur injoignable. Lancez Lancer_PPM.bat.';
  return (j&&j.error)||'Identifiants invalides.';
}

  document.body.appendChild(w); blankApp();

    try{
      const key=await lockDeriveKey(pass, lk.salt);
      const st=await lockDecrypt(rec, key);                 // échoue si mot de passe faux (tag GCM)
      LOCK.active=true; LOCK.key=key; LOCK.salt=lk.salt; LOCK.email=lk.email||'';
      AUTH.locked=false; w.remove();
      adoptServerState(st,'Déverrouillé '+hhmm());
    }catch(err){
      btn.disabled=false; btn.textContent='Déverrouiller';
      document.getElementById('ulPass').value='';
      setBoxErr('ulErr','Mot de passe incorrect.');
    }
  });

async function logout(){ try{ await api('/logout',{method:'POST'}); }catch(_){ }

function startSessionWatch(){
  clearInterval(AUTH.watch);

    if(!AUTH.expiresAt) return;
    const rest=AUTH.expiresAt-Date.now();
    if(rest<=0){ clearInterval(AUTH.watch); AUTH.expiresAt=0; showLogin('Session expirée. Reconnectez-vous.'); return; }
    if(rest<=5*60000 && !AUTH.warnShown) showSessionWarning();
  },15000);
}
function showSessionWarning(){
  AUTH.warnShown=true;
  if(document.getElementById('sessWrap')) return;
  const w=document.createElement('div'); w.className='sesswrap'; w.id='sessWrap';
  const left=()=>{ const r=Math.max(0,AUTH.expiresAt-Date.now());
    return Math.floor(r/60000)+' min '+String(Math.floor(r/1000)%60).padStart(2,'0')+' s'; };
  w.innerHTML=`<div class="sessbox">
      <div style="font-family:Archivo;font-weight:800;font-size:15px;color:var(--ink);margin-bottom:9px">Votre session va expirer</div>

        <button class="savebtn" id="sessGo" style="width:auto;padding:9px 18px">Continuer la session</button></div></div>`;
  document.body.appendChild(w);
  const t=setInterval(()=>{ const el=document.getElementById('sessLeft'); if(el) el.textContent=left(); },1000);
  document.getElementById('sessGo').onclick=async()=>{ clearInterval(t); w.remove();
    try{ const r=await api('/renew',{method:'POST'}); const j=await r.json();
         if(j&&j.ok){ AUTH.expiresAt=j.expiresAt; AUTH.warnShown=false; setSave('ok','Session prolongée '+hhmm()); } }catch(_){ } };
  document.getElementById('sessOut').onclick=()=>{ clearInterval(t); w.remove(); logout(); };
}
async function initAuth(){
  const s=await apiSession();

    startSessionWatch();

}

    const g=par.dataset.grp; const w=document.querySelector('[data-grpwrap="'+g+'"]'); if(w){const col=w.classList.toggle('collapsed'); const c=par.querySelector('.sb-chev'); if(c)c.classList.toggle('rot',col); saveNavState();} return;
  }
  const _cv=e.target.closest('.sb-chev'); if(_cv){e.stopPropagation(); const w=document.getElementById('gedSub'); const col=w.classList.toggle('collapsed'); _cv.classList.toggle('rot',col); try{localStorage.setItem('ppm_ged_nav',col?'0':'1');}catch(_){} return;}

  else if(b.dataset.tab==='ged'){S.gedFilter=S.gedFilter||{proj:'',sousens:'',phase:'',statut:'',q:'',fav:false,arch:false};S.gedFilter.sousens='';}
  render();
});

/* ---------- helpers: aggregates ---------- */
function totals(list){
  const t={c1:0,c2:0,b27:0,act:0,spe:0,n:list.length,red:0,amber:0};
  list.forEach(p=>{t.c1+=p.c1||0;t.c2+=(p.c2!=null?p.c2:p.c1)||0;t.b27+=p.b27||0;t.act+=p.act||0;t.spe+=p.spe||0;
    const h=projHealth(p).band; if(h==='r')t.red++; else if(h==='a')t.amber++;});
  return t;
}
function filtered(){
  const f=S.filters;
  return PROJ().filter(p=>{
    if(f.pole){ if(p.group!==f.pole) return false; }
    if(f.statut && p.statut!==f.statut) return false;
    if(f.q){const q=norm(f.q); if(!(norm(p.nom).includes(q)||norm(p.shine).includes(q)||norm(p.pm).includes(q)||norm(p.ishift).includes(q)))return false;}
    return true;
  });
}

function th(lbl,k,w){return `<th data-k="${k}" ${w?`style="width:${w}px"`:''}>${lbl}${sortar(k)}</th>`;}
function thn(lbl,k){return `<th class="num" data-k="${k}">${lbl}${sortar(k)}</th>`;}
function sortar(k){return S.sort.key===k?`<span class="sortar">${S.sort.dir<0?'▼':'▲'}</span>`:'<span class="sortar">↕</span>';}
function toggleSort(which,k){const s=S[which]; if(s.key===k)s.dir*=-1; else {s.key=k;s.dir=-1;}}
function projRows(list){
  let rows=[...list];
  const s=S.sort, k=s.key;
  if(k==='ecart') rows.sort((a,b)=>((( (b.c2!=null?b.c2:b.c1)||0)-(b.c1||0)) - (((a.c2!=null?a.c2:a.c1)||0)-(a.c1||0)))*( -s.dir? 1: -1));
  rows.sort((a,b)=>{
    let av,bv;
    if(k==='ecart'){av=ecartV(a);bv=ecartV(b);}
    else if(['c1','c2','b27','act'].includes(k)){av=a[k]||0;bv=b[k]||0;}
    else if(k==='_h'){av=hord(a);bv=hord(b);}
    else {av=norm(a[k]||'');bv=norm(b[k]||'');}
    if(av<bv)return s.dir; if(av>bv)return -s.dir; return 0;
  });
  if(S._hfilter) rows=rows.filter(p=>projHealth(p).band===S._hfilter);
  if(!rows.length) return `<tr><td colspan="11" class="empty">Aucun projet.</td></tr>`;
  return rows.map(p=>{const h=projHealth(p);const ec=ecartV(p);
    return `<tr data-id="${esc(p.id)}">
      <td><span class="hdot ${h.band}" title="${bandLabel[h.band]} · score ${h.composite}"></span></td>
      <td class="code">${esc(p.shine||'—')}</td>
      <td class="wrap">${esc(p.nom)}</td>
      <td>${esc(p.group)}</td>
      <td class="edc" contenteditable data-dpf="pm|${esc(p.id)}" title="Cliquez pour modifier · deux noms possibles, séparés par «  /  »">${esc(p.pm||'')}</td>
      <td class="edc" contenteditable data-dpf="pl|${esc(p.id)}" title="Cliquez pour modifier · deux noms possibles, séparés par «  /  »">${esc(p.pl||'')}</td>
      <td class="num">${fmt(p.c1)}</td>
      <td class="num">${fmt(p.c2!=null?p.c2:p.c1)}</td>
      <td class="num">${fmt(p.b27)}</td>
      <td class="num">${fmt(p.act)}</td>
      <td class="num" style="color:${ec>0?'var(--bad)':ec<0?'var(--good)':'inherit'}">${p.c1?((ec>=0?'+':'')+fmt(ec/ (p.c1||1)*100,1)+'%'):'—'}</td>
    </tr>`;}).join('');
}
function ecartV(p){return ((p.c2!=null?p.c2:p.c1)||0)-(p.c1||0);}
function hord(p){return {r:0,a:1,g:2}[projHealth(p).band];}

function renderFin(){
  const list=PROJ().filter(p=>(p.c1||p.c2||p.act));
  const t=totals(PROJ());
  // sort
  const s=S.finSort;
  const val=(p,k)=>k==='ecart'?ecartV(p):k==='conso'?(p.c1?(p.act||0)/p.c1*100:0):(['c1','c2','b27','act'].includes(k)?(p[k]||0):norm(p[k]||''));
  list.sort((a,b)=>{const av=val(a,s.key),bv=val(b,s.key); if(av<bv)return s.dir; if(av>bv)return -s.dir; return 0;});
  const ecartPct=t.c1?((t.c2-t.c1)/t.c1*100):0;
  // top deltas C2 vs C1
  const deltas=[...PROJ()].map(p=>({p,d:ecartV(p)})).filter(x=>x.d).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,8);
  const maxD=Math.max(1,...deltas.map(x=>Math.abs(x.d)));

  view.innerHTML=`
  <div class="sec-title"><h2>Cockpit Finance — CAPEX</h2><span class="hint">C1 Alloué · C2 révisé · B27 · réalisé · atterrissage · k€</span></div>
  <div class="kpis">
    <div class="tile"><div class="lab">C1 Alloué FY</div><div class="big">${fmt(t.c1)}<span class="u">k€</span></div></div>
    <div class="tile c"><div class="lab">C2 révisé FY</div><div class="big">${fmt(t.c2)}<span class="u">k€</span></div><div class="sub">${ecartPct>=0?'+':''}${fmt(ecartPct,1)}% vs C1</div></div>
    <div class="tile"><div class="lab">B27 (budget N+1)</div><div class="big">${fmt(t.b27)}<span class="u">k€</span></div></div>
    <div class="tile"><div class="lab">Réalisé YTD</div><div class="big">${fmt(t.act)}<span class="u">k€</span></div></div>
    <div class="tile ${Math.abs(ecartPct)>S.config.seuilEcart?'bad':'good'}"><div class="lab">Écart atterrissage</div><div class="big">${fmt(ecartPct,1)}<span class="u">%</span></div><div class="sub">cible ≤ ${S.config.seuilEcart}%</div></div>
  </div>
  <div class="col3">
    <div class="panel"><div class="panel-h"><h3>Suivi budgétaire par projet</h3><span class="meta">conso = ACT / C1 · alerte ≥ 80/95/100%</span></div>
      <div class="panel-b"><div class="tblwrap" style="max-height:560px;overflow-y:auto"><table id="finTbl"><thead><tr>
        ${fth('Code','shine')}${fth('Projet','nom')}${fth('Pôle','group')}
        ${fthn('C1','c1')}${fthn('C2','c2')}${fthn('B27','b27')}${fthn('ACT','act')}${fthn('Écart','ecart')}${fthn('Conso%','conso')}<th>Alerte</th>
      </tr></thead><tbody>${finRows(list)}</tbody></table></div></div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Top écarts C2 vs C1</h3><span class="meta">k€</span></div>
      <div class="panel-b"><div class="bars">${deltas.map(x=>`
        <div class="bar-row"><span class="nm" title="${esc(x.p.nom)}" data-fid="${esc(x.p.id)}">${esc((x.p.shine||x.p.nom).slice(0,16))}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.abs(x.d)/maxD*100}%;background:${x.d>0?'var(--bad)':'var(--good)'}"></div></div>
        <span class="val" style="color:${x.d>0?'var(--bad)':'var(--good)'}">${x.d>0?'+':''}${fmt(x.d)}</span></div>`).join('')}</div>
        <div class="onepage-note" style="margin-top:12px;margin-bottom:0">L'atterrissage consolidé vise un écart ≤ ${S.config.seuilEcart}% vs budget alloué (cible CDO). Les dépassements orientent les arbitrages C2/B27.</div>
      </div></div>
  </div>
  ${footHTML('fin',`Finance · source de référence ERP pour engagements/factures ; la plateforme consolide et projette l'atterrissage.`)}`;
  $$('#finTbl thead th[data-k]').forEach(th=>th.addEventListener('click',()=>{if(S.finSort.key===th.dataset.k)S.finSort.dir*=-1;else{S.finSort.key=th.dataset.k;S.finSort.dir=-1;}renderFin();}));
  $$('#finTbl tbody tr[data-id]').forEach(tr=>tr.addEventListener('click',()=>{S.currentProj=tr.dataset.id;S.tab='pass';render();}));
  $$('[data-fid]').forEach(el=>el.addEventListener('click',()=>{S.currentProj=el.dataset.fid;S.tab='pass';render();}));
  bindFinEdit();
}

      <td class="num">${p.c1?fmt(conso,0)+'%':'—'}</td><td>${al}</td></tr>`;}).join('');
}

  $$('[data-fin]').forEach(el=>{
    el.addEventListener('click',e=>e.stopPropagation());

  // --- BDD membres : édition ---
  $$('[data-mf]').forEach(el=>el.addEventListener('blur',()=>{const[f,i]=el.dataset.mf.split('|');if(S.members[+i]){S.members[+i][f]=el.textContent.trim();
    // Re-saisir un nom ecarte la marque de suppression : la personne redevient
    // rapprochable du portefeuille.
    if(f==='nom'&&S.membersRemoved&&S.membersRemoved.length){const k=mkey(S.members[+i].nom);S.membersRemoved=S.membersRemoved.filter(x=>x!==k);}
    scheduleSave();}}));
  $$('[data-mfn]').forEach(el=>el.addEventListener('blur',()=>{const[f,i]=el.dataset.mfn.split('|');const v=parseFloat(el.textContent.replace(',','.'));if(S.members[+i]){S.members[+i][f]=isNaN(v)?null:v;scheduleSave();}}));
  $$('[data-msel]').forEach(sel=>sel.addEventListener('change',()=>{const[f,i]=sel.dataset.msel.split('|');if(S.members[+i]){S.members[+i][f]=sel.value;renderRes();scheduleSave();}}));
  // Marque un membre comme retire a la main, pour que le rapprochement
  // PM|PL du portefeuille ne le recree pas au chargement suivant.
  function memForget(m){
    const k=mkey((m&&m.nom)||''); if(!k) return;
    S.membersRemoved=S.membersRemoved||[];
    if(!S.membersRemoved.includes(k)) S.membersRemoved.push(k);

  // --- BDD membres : sélection multiple et suppression groupée ---
  const memBoxes=()=>$$('.msel');
  function memSelSync(){
    const boxes=memBoxes(), n=boxes.filter(c=>c.checked).length;
    boxes.forEach(c=>c.closest('tr').classList.toggle('selrow',c.checked));
    const bar=$('#memSelBar');
    if(bar){ bar.hidden = n===0; const lab=$('#memSelN'); if(lab) lab.textContent=n; }
    const all=$('#memAll');
    // « indeterminate » : la case d'en-tête reflète une sélection partielle.
    if(all){ all.checked = n>0 && n===boxes.length; all.indeterminate = n>0 && n<boxes.length; }
  }
  memBoxes().forEach(c=>c.addEventListener('change',memSelSync));
  const memAll=$('#memAll');
  if(memAll) memAll.addEventListener('change',()=>{ memBoxes().forEach(c=>{c.checked=memAll.checked;}); memSelSync(); });
  const memClr=$('#memSelClear');
  if(memClr) memClr.addEventListener('click',()=>{ memBoxes().forEach(c=>{c.checked=false;}); memSelSync(); });
  const memDel=$('#memSelDel');
  if(memDel) memDel.addEventListener('click',()=>{
    // Tri décroissant : chaque splice ne décale que des indices déjà traités.
    const idx=memBoxes().filter(c=>c.checked).map(c=>+c.dataset.sel).sort((a,b)=>b-a);
    if(!idx.length) return;
    const noms=idx.slice().reverse().map(i=>(S.members[i]&&S.members[i].nom)||'(sans nom)');
    const apercu=noms.slice(0,10).map(n=>'\u2022 '+n).join('\n');
    const reste=noms.length>10 ? '\n\u2026 et '+(noms.length-10)+' autre(s)' : '';
    if(!confirm('Supprimer '+idx.length+' membre(s) ?\n\n'+apercu+reste+'\n\nCette action est irréversible.')) return;
    idx.forEach(i=>{ memForget(S.members[i]); S.members.splice(i,1); });
    renderRes(); scheduleSave();
  });
  memSelSync();
  const addB=$('#addMember'); if(addB) addB.addEventListener('click',()=>{S.members.push({nom:'Nouveau membre',ini:'',role:'',pole:'INFRA',type:'Interne',societe:'',tel:'',dispo:100,depart:''});renderRes();scheduleSave();});
  // --- Planning présence : cycle de statut au clic ---
  $$('[data-pc]').forEach(el=>el.addEventListener('click',()=>{const idx=el.dataset.pc.lastIndexOf('|');const nom=el.dataset.pc.slice(0,idx),w=el.dataset.pc.slice(idx+1);S.presence[nom]=S.presence[nom]||{};const cur=S.presence[nom][w]||'';const next=PRES_ORDER[(PRES_ORDER.indexOf(cur)+1)%PRES_ORDER.length];if(next)S.presence[nom][w]=next;else delete S.presence[nom][w];const info=PRESMAP[next];el.textContent=next;el.style.background=info?info.c:'transparent';el.style.color=info?'#fff':'';el.title=info?info.lb:'Non renseigné';scheduleSave();}));
}
function occColor(v){ if(!v)return 'var(--panel-3)'; if(v>100)return 'var(--bad)'; if(v>=80&&v<=95)return 'var(--good)'; return 'var(--warn-soft)'; }
function chargeColor(v){ if(!v)return 'transparent'; const a=Math.min(.85,.12+v*0.5); return `color-mix(in srgb, var(--accent) ${Math.round(a*100)}%, transparent)`; }

const LOT_TEMPLATE = ['Génie civil','CVC / Salles propres','Tuyauterie / Utilités','Électricité / Instrumentation','Automatisme / CSV'];
const DA_STATUTS = ['DA','Validée','PO','Réception','Facturée','Soldée'];
const DA_ENGAGED = ['PO','Réception','Facturée','Soldée'];

function ensureCER(id){
  if(!S.cers) S.cers={};
  if(!S.cers[id]){
    const p=S.projects.find(x=>x.id===id)||{};
    S.cers[id]={ approuvee:(p.c1!=null?p.c1:0), avenants:0, engage:(p.act||0), facture:0, depense:(p.act||0), lots:[], da:[] };
  }
  const c=S.cers[id]; c.lots=c.lots||[]; c.da=c.da||[]; return c;
}
function lotEngage(cer,lotName){
  return cer.da.filter(d=>d.lot===lotName && DA_ENGAGED.includes(d.statut)).reduce((a,d)=>a+(+d.montant||0),0);
}
function cerConso(cer){ const env=(+cer.approuvee||0)+(+cer.avenants||0); return env? (+cer.depense||0)/env*100 : 0; }
function parseNum(txt){ const v=parseFloat(String(txt).replace(/\s/g,'').replace(',','.')); return isNaN(v)?0:v; }

function renderCER(){

function addDA(id){
  const c=ensureCER(id);

  c.da.push({ref:'DA-'+String(c.da.length+1).padStart(3,'0'),lot:lot,fourn:'',montant:0,statut:'DA',date:''});

function cerMiniPass(p){
  const cer=ensureCER(p.id);
  const alloue=(p.c2!=null?p.c2:p.c1)||0;                 // budget alloué du projet : C2 révisé sinon C1
  const base=(p.c2!=null?'C2 révisé':'C1 Alloué');
  const manuel=(+cer.approuvee||0)+(+cer.avenants||0);    // enveloppe CER saisie manuellement (prioritaire si > 0)
  const env=manuel>0?manuel:alloue;                        // SPE = budget alloué (ou enveloppe CER si renseignée)
  const src=manuel>0?'CER saisie':base;
  const depense=(+cer.depense>0?+cer.depense:(p.act||0));  // réalisé : CER si renseigné, sinon ACT du projet
  const conso=env?Math.round((depense/env)*100):0;

  return `<div class="tblwrap" style="margin-top:12px"><table class="budget-mini"><tbody>

    <td class="num">conso <span class="pill ${cls}">${fmt(conso,0)}%</span></td></tr></tbody></table></div>`;
}

  <div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Détail mensuel</h3><span class="meta">k€</span></div>
    <div class="tblwrap"><table class="heat"><thead><tr><th class="rname" style="position:sticky;left:0">Mesure</th>${months.map(m=>`<th class="num">${m}</th>`).join('')}<th class="num">Total</th></tr></thead>
    <tbody>
      <tr><td class="rname">Mensuel</td>${series.map(v=>`<td class="hc" style="background:${chargeColor(v/((Math.max(1,...series))||1))}">${v?fmt(v,0):''}</td>`).join('')}<td class="hc" style="font-weight:700">${fmt(total)}</td></tr>

  $('#phSel').addEventListener('change',e=>{S.phScope=e.target.value;renderPhasing();});
}
function phasingSVG(series,cum,total,months){
  const W=760,H=240,padL=12,padR=12,padT=16,padB=28;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const n=series.length, slot=plotW/n, bw=slot*0.56;
  const maxM=Math.max(1,...series);
  let bars='',lbls=''; const pts=[];
  for(let i=0;i<n;i++){
    const x=padL+slot*i+slot*0.22;
    const bh=series[i]/maxM*plotH, y=padT+plotH-bh;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="2" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>`;
    lbls+=`<text x="${(padL+slot*i+slot/2).toFixed(1)}" y="${H-9}" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="var(--muted)">${months[i]}</text>`;
    pts.push([padL+slot*i+slot/2, padT+plotH-(total?cum[i]/total*plotH:0)]);
  }
  const poly=pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--copper)"/>`).join('');
  const last=pts[pts.length-1];
  return `<figure style="margin:0"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe en S du CAPEX phasé, barres mensuelles et ligne cumulée" style="width:100%;height:auto">
    <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--line-2)"/>
    ${bars}${lbls}
    <polyline points="${poly}" fill="none" stroke="var(--copper)" stroke-width="2"/>
    ${dots}
    <text x="${(last[0]-4).toFixed(1)}" y="${Math.max(12,last[1]-8).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="600" fill="var(--copper)">cumulé ${fmt(total)} k€</text>
  </svg></figure>`;
}

const TRANSFER_ITEMS=[['asbuilt','Dossier As-Built'],['notices','Notices'],['pieces','Pièces de rechange'],['gammes','Gammes préventives'],['formation','Formation'],['garanties','Garanties'],['pv','PV transfert Maintenance'],['gmao','Mise à jour GMAO']];

function parseFR(s){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(String(s||'').trim());if(!m)return null;let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);}
function isOverdue(s){const d=parseFR(s);return d? d<new Date(new Date().toDateString()):false;}
function derivePhase(p){const rg=realGatePhase(p.gateRealRaw); if(rg!=null) return rg;
  const s=norm(p.statut||'');
  if(s.includes('clotur')||s.includes('termin')||s.includes('migr')||s.includes('supprim')) return 5;
  if(s.includes('commission')) return 4;
  if(s.includes('travaux')) return 3;
  if(s==='apd'||s.includes(' apd')) return 2;
  if(s==='aps'||s.includes(' aps')) return 1;
  if(s.includes('cadrage')||s.includes('idee')||s.includes('evalu')) return 0;
  const ym=/(20\d\d)/.exec(p.nom||''); const y=ym?+ym[1]:0;
  if(y>=2028) return 0; if(y===2027) return 1;
  const c1=p.c1||0, act=p.act||0, conso=c1>0?act/c1:(act>0?1:0);
  if(conso>=0.95) return 5; if(conso>=0.6) return 4; if(conso>=0.25) return 3; if(conso>=0.05) return 2; return 1;}

function seedActions(){
  const out=[];
  try{ Object.values(SEED_PASSPORTS).forEach(pp=>{
    (pp.risks||[]).forEach(r=>out.push({origine:'Risque',projet:pp.code,desc:(r.desc||'')+(r.mit?(' — '+r.mit):''),pilote:r.owner||'',echeance:r.date||'',crit:'Haute',statut:'En cours'}));
  }); }catch(e){}
  return out;
}

/* ---------- HSE & Réception ---------- */
function ensureHSE(id){
  if(!S.hse) S.hse={};
  if(!S.hse[id]) S.hse[id]={pdp:[],permits:[],reserves:[],transfer:{}};
  const h=S.hse[id]; h.pdp=h.pdp||[]; h.permits=h.permits||[]; h.reserves=h.reserves||[]; h.transfer=h.transfer||{}; return h;
}
function permitStatus(h,pm){
  const pdp=h.pdp.find(x=>x.entreprise&&norm(x.entreprise)===norm(pm.entreprise));
  const ok=pdp&&pdp.accueil&&pdp.habil&&pdp.validite&&!isOverdue(pdp.validite);
  return ok?'AUTORISÉ':'BLOCKED';
}
function clotureStatus(h){
  const reasons=[];
  h.reserves.forEach(r=>{if(r.bloquante&&!r.levee)reasons.push('Réserve bloquante non levée : '+(r.desc||'—'));});
  TRANSFER_ITEMS.forEach(([k,lb])=>{if(!h.transfer[k])reasons.push('Transfert incomplet : '+lb);});
  return {ok:reasons.length===0, reasons};
}

function logChange(objet,champ,oldv,newv){
  if(String(oldv)===String(newv))return;
  if(!S.audit)S.audit=[];
  S.audit.unshift({ts:new Date().toISOString().slice(0,19).replace('T',' '),user:(S.user||'—'),objet:objet,champ:champ,old:String(oldv==null?'':oldv),neu:String(newv==null?'':newv)});
  if(S.audit.length>800)S.audit.length=800;
}

/* ---------- Scénarios What-if ---------- */
function scnFinBand(p,cut){
  const c1=p.c1||0; let c2=(p.c2!=null?p.c2:p.c1)||0; c2=c2*(1-cut/100);
  if(!c1&&!c2) return 'g';
  const dev=c1?Math.abs((c2-c1)/c1)*100:0; let score=100-Math.min(50,dev*2);
  const conso=c1?(p.act||0)/c1*100:0; if(conso>100)score-=Math.min(30,conso-100);
  return score>=75?'g':score>=55?'a':'r';
}

/* ---- vrai cycle de vie : parse de la colonne Gate réelle ---- */
function realGatePhase(raw){
  const s=norm(raw); if(!s) return null;
  if(/g\s*5|gate\s*5|clotur/.test(s)) return 5;
  if(/g\s*4|gate\s*4|commission/.test(s)) return 4;
  if(/g\s*3|gate\s*3|travaux/.test(s)) return 3;
  if(/g\s*2|gate\s*2/.test(s)) return 2;
  if(/0\/1|g\s*1|gate\s*1|g\s*0\/1|aps/.test(s)) return 1;
  if(/g\s*0|gate\s*0|cadrage/.test(s)) return 0;
  if(/^\d+$/.test(s)){const n=+s; if(n>=0&&n<=5) return n;}
  return null; // "oui/non/na" → non concluant → proxy budgétaire
}
function matchGateCdo(p){
  const G=(typeof SEED_GATECDO!=='undefined')?SEED_GATECDO:{byShine:{},byName:{},byIshift:{}};
  return (p.shine&&G.byShine[p.shine]) || (p.ishift&&G.byIshift[p.ishift]) || (p.nom&&G.byName[norm(p.nom)]) || null;
}
function isActif(p){
  if(!/^P\d{5,}/.test(p.shine||'')) return false;
  const n=norm(p.nom);
  if(!n||n.includes('total')||n.includes('#ref')||n.includes('a creer')||n.includes('vide')) return false;
  if(((p.c2!=null?p.c2:p.c1)||0)<=0) return false;      // budget revise actif
  if(derivePhase(p)>=5) return false;                    // exclut cloture
  const ym=/(20\d\d)/.exec(p.nom||''); const y=ym?+ym[1]:0;
  if(y && y<2025) return false;                          // portefeuille courant (>=2025)
  return true;
}

    } else {
      let src=d.file.data;
      try{ const b=await (await fetch(d.file.data)).blob(); objUrl=URL.createObjectURL(new Blob([b],{type:mime||b.type||'application/octet-stream'})); src=objUrl; }catch(_){}
      if(/^image\//.test(mime)){ const im=document.createElement('img'); im.src=src; body.appendChild(im); }
      else if(/^video\//.test(mime)){ const v=document.createElement('video'); v.src=src; v.controls=true; body.appendChild(v); }
      else if(/^audio\//.test(mime)){ const a2=document.createElement('audio'); a2.src=src; a2.controls=true; body.appendChild(a2); }
      else if(/^(application\/pdf|text\/)/.test(mime)||/\.(pdf|txt|html?|svg)$/i.test(name)){ const f=document.createElement('iframe'); f.src=src; body.appendChild(f); }
      else if(/wordprocessingml/i.test(mime)||/\.docx$/i.test(name)){
        try{ await renderDocx(body,d); }
        catch(err){ body.innerHTML=`<div style="margin:auto;padding:28px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6">
            Impossible d'afficher ce document Word (${esc(err.message)}).<br>La lecture .docx nécessite un accès Internet la première fois.<br><br>
            Utilisez <b>⭳ Télécharger</b> pour l'ouvrir dans Word.</div>`; } }
      else if(/sheet|excel|ms-excel|spreadsheet/i.test(mime)||/\.(xls|xlsx|xlsm|xlsb|csv|ods)$/i.test(name)){
        try{ await renderSheet(body,d,mime,name); }
        catch(err){ body.innerHTML=`<div style="margin:auto;padding:28px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6">
            Impossible d'afficher ce tableur (${esc(err.message)}).<br>La lecture .xls/.xlsx nécessite un accès Internet la première fois.<br><br>
            Utilisez <b>⭳ Télécharger</b> pour l'ouvrir dans Excel.</div>`; } }
      else { body.innerHTML=`<div style="margin:auto;padding:28px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6">
          Le navigateur ne sait pas afficher ce format<br><b style="color:var(--ink)">${esc(mime||d.type||'inconnu')}</b><br><br>
          Utilisez <b>⭳ Télécharger</b> pour l'ouvrir dans Word / Excel / PowerPoint.</div>`; }
    }
    logChange('GEDT '+(d.code||''),'ouverture','',name);
  }catch(e){ body.innerHTML=`<div style="margin:auto;padding:28px;color:var(--bad)">Impossible d'ouvrir ce document : ${esc(e.message)}</div>`; }
}
function gedUpload(){
  const f=S.gedFilter||{}; S.gedFilter=f;
  const inp=document.createElement('input'); inp.type='file';
  inp.onchange=()=>{ const file=inp.files&&inp.files[0]; if(!file) return;
    const mo=file.size/1048576;
    if(mo>8 && !confirm('Fichier volumineux ('+mo.toFixed(1)+' Mo). L\'intégrer alourdira la sauvegarde du fichier de suivi. Continuer ?')) return;
    const rd=new FileReader();
    rd.onload=()=>{ S.ged.unshift({code:(file.name.replace(/\.[^.]+$/,'').slice(0,40))||('DOC-'+(S.ged.length+1)),projet:f.proj||'',sousens:f.sousens||'Études',phase:f.phase||'APD',dossier:'10_ETUDES',type:(file.name.split('.').pop()||'').toUpperCase(),version:'A',statut:'Draft',auteur:S.user||'',date:new Date().toLocaleDateString('fr-FR'),fav:false,archived:false,file:{name:file.name,mime:file.type,size:file.size,data:rd.result},html:null});
      const _nd=S.ged[0]; f.sousens=_nd.sousens; f.q=''; f.fav=false; f.arch=false;
      logChange('GEDT '+file.name,'téléversement','',fmtSize(file.size)); renderGED(); scheduleSave();
      alert('✓ « '+file.name+' » ajouté dans le sous-ensemble « '+_nd.sousens+' »'+(_nd.projet?(' (projet '+_nd.projet+')'):' (aucun projet)')+'.'); };
    rd.readAsDataURL(file);
  };
  inp.click();
}

const SIG_ROLES=[
  {k:'uf',lab:'Utilisateur final',req:true},
  {k:'hse',lab:'Représentant HSE',reqBpx:false},
  {k:'qo',lab:'Resp. qualité opérationnelle',reqBpx:true},
  {k:'maint',lab:'Resp. maintenance',reqBpx:false},
  {k:'eia',lab:'Représentant EIA',reqBpx:false},

];
const RTM_COLS=[['cdc','CdC'],['spe','SPE'],['essai','Essai'],['recep','Réception']];
function ensureCDC(id){
  if(!S.cdc)S.cdc={};
  if(!S.cdc[id]){
    const p=S.projects.find(x=>x.id===id)||{};
    const has=norm(p.cdoReal).startsWith('oui');
    S.cdc[id]={cdo:{version:'1.0',statut:has?'Approuvé':'Draft',bpx:true,date:'',auteur:'',sigs:{}},reqs:[]};
  }
  const c=S.cdc[id]; c.cdo=c.cdo||{sigs:{}}; c.cdo.sigs=c.cdo.sigs||{}; c.reqs=c.reqs||[]; return c;
}
function sigRequired(role,bpx){ return role.req || (bpx && role.reqBpx); }
function renderCDC(){
  const opts=S.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===S.currentProj?'selected':''}>${esc(p.shine?p.shine+' — ':'')}${esc(p.nom)}</option>`).join('');

  const c=ensureCDC(p.id); const cdo=c.cdo;
  const missing=SIG_ROLES.filter(r=>sigRequired(r,cdo.bpx)).filter(r=>!(cdo.sigs[r.k]&&cdo.sigs[r.k].ok&&cdo.sigs[r.k].nom));
  const validable=missing.length===0;
  const covered=c.reqs.filter(r=>RTM_COLS.every(([k])=>r.trace&&r.trace[k])).length;

function setDMsg(el,kind,txt){ if(!el)return; el.className='dmsg '+kind; el.textContent=txt; }
// Enregistre un fichier là où c'est possible : capacité « downloads » de l'artefact
// (fenêtre de confirmation Claude) sinon téléchargement navigateur classique (mode serveur/local).
// Renvoie {ok, how:'capability'|'download', status?, code?}. Aucun repli deviné.
async function saveFile(filename, data){
  let cd=null;
  try{ if(window.claude && typeof window.claude.use==='function') cd=await window.claude.use('downloads'); }catch(_){}
  if(cd){
    try{ const r=await cd.save({filename:filename, data:data}); return {ok:true, how:'capability', status:r&&r.status}; }
    catch(e){ return {ok:false, how:'capability', code:(e&&e.code)||'unavailable'}; }
  }
  try{
    const blob = (data instanceof Blob)? data : new Blob([data],{type:'application/octet-stream'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(_){} },2000);
    return {ok:true, how:'download'};
  }catch(e){ return {ok:false, how:'download', code:String(e&&e.message||e)}; }
}

function importJSONFile(file, msgEl, confBox){
  if(!file){ return; }

  setDMsg(msgEl,'info','Lecture de « '+file.name+' »…');

  rd.onload=()=>{
    let obj=null; try{ obj=JSON.parse(rd.result); }catch(e){ setDMsg(msgEl,'err','JSON invalide : fichier illisible.'); return; }

// Associe chaque champ cible à la colonne source la plus proche (une colonne = un champ).
function autoMap(headers,target){
  const hn=headers.map(h=>norm(h).replace(/[^a-z0-9]/g,''));
  const used=new Set(), res={};
  XL_FIELDS[target].forEach(f=>{
    let best=-1;
    for(const syn of f.syn){
      for(let i=0;i<hn.length;i++){
        if(used.has(i)||!hn[i]) continue;
        if(hn[i]===syn || (syn.length>=3 && hn[i].indexOf(syn)>=0) || (hn[i].length>=3 && syn.indexOf(hn[i])>=0)){ best=i; break; }
      }
      if(best>=0) break;
    }
    if(best>=0){ res[f.k]=best; used.add(best); }
  });
  return res;
}
// Lit une feuille : détecte la ligne d'en-tête (1re ligne à ≥2 cellules), renvoie {headers, rows}.
function readSheet(XL, wb, name){
  const aoa=XL.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
  let hi=aoa.findIndex(r=>r && r.filter(c=>c!=null&&String(c).trim()!=='').length>=2);
  if(hi<0) hi=0;
  const headers=(aoa[hi]||[]).map((c,i)=>c!=null&&String(c).trim()!==''?String(c).trim():('Colonne '+(i+1)));
  return { headers, rows:aoa.slice(hi+1) };
}
function buildRecords(rows, headers, map, target){
  const numset=new Set(XL_NUM[target]);
  return rows.map(row=>{
    const rec={};
    XL_FIELDS[target].forEach(f=>{
      const ci=map[f.k]; if(ci==null||ci<0) return;
      let v=row?row[ci]:null; if(v==null || String(v).trim()==='') return;
      rec[f.k]= numset.has(f.k) ? parseNum(v) : String(v).trim();
    });
    return rec;
  }).filter(r=> target==='projects' ? (r.nom||r.shine) : (r.nom||r.ini));
}

    if(!fields.length){ prevBox.innerHTML='<div style="padding:10px;color:var(--muted);font-size:12px">Aucune colonne associée.</div>'; return; }
    const recs=buildRecords(cur.rows.slice(0,5),cur.headers,map,t);
    prevBox.innerHTML='<table><thead><tr>'+fields.map(f=>`<th>${esc(f.lb)}</th>`).join('')+'</tr></thead><tbody>'+
      (recs.length?recs.map(r=>'<tr>'+fields.map(f=>`<td>${esc(r[f.k]==null?'':r[f.k])}</td>`).join('')+'</tr>').join('')
                  :'<tr><td colspan="'+fields.length+'" style="color:var(--muted)">Aucune ligne exploitable.</td></tr>')+'</tbody></table>';
  }
  function renderMap(){
    const t=target(), auto=autoMap(cur.headers,t);
    mapBox.innerHTML=XL_FIELDS[t].map(f=>{
      const opts=['<option value="-1">(ignorer)</option>'].concat(cur.headers.map((h,i)=>`<option value="${i}"${auto[f.k]===i?' selected':''}>${esc(h)}</option>`)).join('');
      return `<div class="xmap-row"><div class="f">${esc(f.lb)}</div><div class="s"><select data-mf="${f.k}">${opts}</select></div></div>`;
    }).join('');
    mapBox.querySelectorAll('select').forEach(s=>s.onchange=renderPrev);
    renderPrev();
  }
  function loadSheet(name){ try{ cur=readSheet(XL,wb,name); }catch(e){ setDMsg(msg,'err','Feuille illisible : '+e.message); return; } renderMap(); }
  async function onFile(file){
    if(!file) return;
    if(!/\.(xlsx|xls)$/i.test(file.name)){ setDMsg(msg,'err','Sélectionnez un fichier .xlsx ou .xls.'); return; }
    setDMsg(msg,'info','Lecture de « '+file.name+' »…');
    let buf; try{ buf=await file.arrayBuffer(); }catch(e){ setDMsg(msg,'err','Lecture du fichier impossible.'); return; }
    try{ XL=await loadXLSX(); }catch(e){ setDMsg(msg,'err','Bibliothèque Excel indisponible (hors-ligne ?).'); return; }
    try{ wb=XL.read(buf,{type:'array'}); }catch(e){ setDMsg(msg,'err','Fichier Excel illisible.'); return; }
    const names=wb.SheetNames||[]; if(!names.length){ setDMsg(msg,'err','Classeur vide.'); return; }
    selSheet.innerHTML=names.map(n=>`<option>${esc(n)}</option>`).join('');
    cfg.hidden=false; loadSheet(names[0]);
    setDMsg(msg,'info','Vérifiez l’association des colonnes puis cliquez « Importer ».');
  }
  selSheet.onchange=()=>loadSheet(selSheet.value);
  pane.querySelectorAll('input[name=xtarget]').forEach(r=>r.onchange=renderMap);
  drop.onclick=()=>inp.click();
  inp.onchange=()=>{ onFile(inp.files[0]); inp.value=''; };
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');onFile(e.dataTransfer.files[0]);};
  pane.querySelector('[data-ximport]').onclick=async()=>{
    const t=target(), map=currentMap();
    if(!Object.keys(map).length){ setDMsg(msg,'err','Associez au moins une colonne.'); return; }
    let recs=buildRecords(cur.rows,cur.headers,map,t);
    if(!recs.length){ setDMsg(msg,'err','Aucune ligne exploitable détectée.'); return; }
    const mode=pane.querySelector('input[name=xmode]:checked').value;
    if(t==='projects'){ recs=recs.map(normProjectRaw); S.projects = mode==='replace'?recs:(S.projects||[]).concat(recs); }
    else { recs=recs.map(normMemberRaw); S.members = mode==='replace'?recs:(S.members||[]).concat(recs); }
    try{ S=migrate(S); }catch(e){ setDMsg(msg,'err','Normalisation impossible : '+e.message); return; }
    S._savedAt=Date.now(); baselineSavedAt=S._savedAt; dirty=false;
    render(); const ok=await doSave();
    setDMsg(msg,'ok',recs.length+(t==='projects'?' projets':' membres')+' importés ('+(mode==='replace'?'remplacement':'ajout')+').'+(ok?'':' (enregistrement à refaire)'));
  };
}

// Onglet « Sécurité » : verrou par mot de passe (chiffrement) de la version autonome.
function wireSecurityPane(ov){
  const host=ov.querySelector('[data-secubody]');
  function view(){
    if(SRV){ host.innerHTML='<p class="lead">Cette application est protégée <b>côté serveur</b> (identifiant + mot de passe). Le verrou local ci-dessous ne concerne que la version autonome (artefact ou fichier ouvert seul).</p>'; return; }
    if(!LOCK_OK){ host.innerHTML='<p class="lead">Le chiffrement local n’est pas disponible dans ce contexte (contexte non sécurisé).</p>'; return; }
    const meta=lockMeta();
    if(LOCK.active || (meta&&meta.active)){
      host.innerHTML=`<p class="lead">🔒 Verrou <b>actif</b>${(meta&&meta.email)?' — compte : <b>'+esc(meta.email)+'</b>':''}. Les données sont chiffrées (AES-256) dans ce navigateur ; le mot de passe est demandé à chaque ouverture.</p>
        <div class="xrow"><button class="af-act" data-lchange>Changer le mot de passe</button><button class="af-act" style="border-color:var(--bad);color:var(--bad)" data-lremove>Retirer le verrou</button></div>
        <div class="dmsg" data-msg="secu"></div>`;
      host.querySelector('[data-lchange]').onclick=()=>form(true);
      host.querySelector('[data-lremove]').onclick=()=>askRemove();
      return;
    }
    form(false);
  }
  function inp(lbl,attr){ return `<label class="lb-f" style="max-width:340px"><span style="display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px">${lbl}</span><input ${attr} style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);font:inherit;font-size:13px"></label>`; }
  function form(isChange){
    host.innerHTML=`<p class="lead">${isChange?'Changer le mot de passe qui chiffre vos données.':'Protège les données de cette version autonome par un mot de passe. Elles seront chiffrées (AES-256) dans ce navigateur — sans le mot de passe, illisibles.'}</p>
      ${inp('E-mail (facultatif, affiché au déverrouillage)','data-le type="email" placeholder="prenom.nom@exemple.com"')}
      ${inp('Mot de passe (12 caractères minimum)','data-lp type="password"')}
      ${inp('Confirmer','data-lp2 type="password"')}
      <button class="savebtn" style="width:auto;padding:9px 18px" data-lgo>${isChange?'Changer':'Activer le verrou'}</button>
      <div class="dmsg" data-msg="secu"></div>`;
    const meta=lockMeta(); if(isChange && meta && meta.email) host.querySelector('[data-le]').value=meta.email;
    const msg=host.querySelector('[data-msg="secu"]');
    host.querySelector('[data-lgo]').onclick=async()=>{
      const email=(host.querySelector('[data-le]').value||'').trim().toLowerCase();
      const p1=host.querySelector('[data-lp]').value, p2=host.querySelector('[data-lp2]').value;
      if(p1.length<12){ setDMsg(msg,'err','Mot de passe : 12 caractères minimum.'); return; }
      if(p1!==p2){ setDMsg(msg,'err','Les deux saisies diffèrent.'); return; }
      try{ await lockActivate(p1,email); }catch(e){ setDMsg(msg,'err','Échec : '+(e&&e.message||e)); return; }
      setDMsg(msg,'ok', isChange?'Mot de passe changé — données re-chiffrées.':'Verrou activé — données chiffrées.');
      setTimeout(view,1000);
    };
  }
  function askRemove(){
    const msg=host.querySelector('[data-msg="secu"]');
    if(host.querySelector('[data-rconf]')) return;
    host.insertAdjacentHTML('beforeend',`<div class="dconf" data-rconf><div class="dconf-t">Retirer le verrou ?</div><div class="dconf-s">Les données ne seront plus chiffrées dans ce navigateur.</div><div class="dconf-b"><button class="af-act" data-rno>Annuler</button><button class="savebtn" style="width:auto;padding:8px 16px" data-ryes>Retirer</button></div></div>`);
    const box=host.querySelector('[data-rconf]');
    box.querySelector('[data-rno]').onclick=()=>box.remove();
    box.querySelector('[data-ryes]').onclick=async()=>{ box.remove(); try{ await lockRemove(); }catch(_){} view(); };
  }
  view();
}
