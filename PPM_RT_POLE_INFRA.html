const ACH_SYN={numCmd:['n° commande','no commande','n commande','numero de commande','commande','bon de commande','n° bc','bc','po','po number','purchase order','document achat'],
  numDA:["n° da","no da","n da","demande d'achat","demande achat","da","pr","purchase requisition"],
  fournisseur:['fournisseur','supplier','vendor','prestataire','nom fournisseur'],
  objet:['objet','libelle','libellé','designation','désignation','description','intitule','intitulé','texte'],
  montant:['montant','montant ht','montant net','valeur','net order value','prix','total ht','montant commande'],
  recu:['receptionne','réceptionné','montant receptionne','montant réceptionné','recu','reçu','livre','livré','gr value','quantite receptionnee'],
  facture:['facture','facturé','facture ht','montant facture','invoice','ir value'],
  dateCmd:['date commande','date de commande','date bc','date po','date','date document'],
  dateDA:['date da','date demande'],
  dateLiv:['date livraison','livraison prevue','livraison prévue','date de livraison','delivery date','date livr'],
  dateRecep:['date reception','date réception','date receptionne','date de réception','gr date'],
  wbs:['wbs','inv','wbs inv','wbs | inv','imputation','element dotp','élément dotp','ordre'],
  compte:['compte','nature comptable','compte general','compte général','gl account','poste'],
  nature:['nature','capex','opex','capex opex','type budget'],
  demandeur:['demandeur','requester','acheteur','createur','créateur'],
  statut:['statut','status','etat','état'],
  type:['type','categorie','catégorie'],
  commentaire:['commentaire','remarque','note','observations']};
function achDevine(entete){
  const n=norm(entete).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  if(!n) return '';
  for(const [k,syns] of Object.entries(ACH_SYN)){ if(syns.some(s=>n===norm(s))) return k; }
  for(const [k,syns] of Object.entries(ACH_SYN)){ if(syns.some(s=>n.includes(norm(s)))) return k; }
  return '';
}
function achDecoupe(txt){
  const lignes=String(txt).replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
  if(!lignes.length) return [];
  const sep=(lignes[0].match(/\t/g)||[]).length >= (lignes[0].match(/;/g)||[]).length
    ? '\t' : ((lignes[0].match(/;/g)||[]).length >= (lignes[0].match(/,/g)||[]).length ? ';' : ',');
  /* champs entre guillemets : un séparateur y perd son rôle */
  return lignes.map(l=>{
    const out=[]; let cur='', q=false;
    for(let i=0;i<l.length;i++){ const c=l[i];
      if(c==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
      else if(c===sep&&!q){ out.push(cur); cur=''; }
      else cur+=c; }
    out.push(cur); return out.map(x=>x.trim());
  });
}
function achDateAuto(v){
  if(v==null||v==='') return '';
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){ const y=+m[3]<100?2000+ +m[3]:+m[3]; return y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'); }
  const n=+s;                                     // numéro de série Excel
  if(isFinite(n)&&n>20000&&n<80000){ const d=new Date(Math.round((n-25569)*864e5));
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
  return '';
}

  ov.innerHTML=`<div class="dbox" style="width:min(980px,96vw)">
    <div class="dhead"><span class="af-mk">P</span><h4>⤓ Importer des lignes d'achat</h4><button class="dclose" data-x>×</button></div>

      <div id="achImpApercu" class="hint" style="margin-top:10px"></div>

    <div class="dfoot"><button class="iconbtn" data-x>Annuler</button>
      <button class="iconbtn" id="achImpGo" style="background:var(--accent);color:#fff;border-color:var(--accent)">Importer</button></div></div>`;
  document.body.appendChild(ov);

  $$('[data-x]',ov).forEach(b=>b.onclick=fermer);

  const ta=$('#achImpTxt',ov), ap=$('#achImpApercu',ov);
  const lire=()=>{
    const t=achDecoupe(ta.value); if(t.length<2){ ap.textContent=''; return null; }
    const map=t[0].map(achDevine);
    const connues=map.map((k,i)=>k?`<b>${esc(t[0][i]||'')}</b> → ${esc(ACH_FIELDS[k]||k)}`:null).filter(Boolean);
    ap.innerHTML=`${t.length-1} ligne(s) lue(s) · ${connues.length} colonne(s) reconnue(s) sur ${map.length}<br>${connues.join(' · ')||'<span style="color:var(--bad)">aucune colonne reconnue — vérifiez la ligne d’en-tête</span>'}`;
    return {t,map};
  };
  ta.addEventListener('input',lire);
  $('#achImpGo',ov).onclick=()=>{
    const r=lire(); if(!r){ alert("Collez au moins une ligne d'en-tête et une ligne de données."); return; }
    const {t,map}=r;
    if(!map.some(Boolean)){ alert("Aucune colonne n'a été reconnue : vérifiez que la première ligne collée est bien l'en-tête."); return; }
    const forceProj=$('#achImpProj',ov).value, devType=$('#achImpType',ov).checked;
    let n=0;
    t.slice(1).forEach(cells=>{
      const l=achNouvelle(forceProj); n++;
      map.forEach((k,i)=>{ if(!k)return; const v=cells[i]; if(v==null||v==='')return;
        if(['montant','recu','facture'].includes(k)) l[k]=achNum(v);
        else if(k.startsWith('date')) l[k]=achDateAuto(v);
        else if(k==='nature') l[k]=/opex/i.test(v)?'OPEX':'CAPEX';
        else l[k]=String(v); });
      if(devType){
        if(l.numCmd) l.type='Commande';
        else if(l.numDA) l.type="Demande d'achat";
        else l.type='Imputation';
      }
      if(!(ACH_ST[l.type]||[]).includes(l.statut)) l.statut=ACH_ST_DEF[l.type];
      if(l.type==='Commande'&&achNum(l.recu)>0&&achNum(l.recu)>=achNum(l.montant)) l.statut='Réceptionnée';
      else if(l.type==='Commande'&&achNum(l.recu)>0) l.statut='Partiellement réceptionnée';
      if(!l.objet&&l.fournisseur) l.objet=l.fournisseur;
    });
    logChange('Achats','import',''+n+' ligne(s)','');
    fermer(); scheduleSave(); S.ach.view='lines'; renderAch();
    alert(n+' ligne(s) importée(s).\n\nVérifiez le rattachement aux projets dans « Toutes les lignes », puis enregistrez.');
  };
  ta.focus();
}

/* ======================= Actions de suivi =======================
   Reprise de l'« Action Tracker » de l'outil CSD, appliquée au registre déjà
   tenu ici : voir → comprendre → agir → suivre → alerter → décider.

   Le registre d'origine ne portait qu'une criticité et un statut libre. Il
   gagne une priorité, un avancement, une phase, une dépendance bloquante et
   une date de réalisation — sans rien perdre : la migration ci-dessous
   convertit chaque ancienne fiche plutôt que d'ouvrir un second registre.

   L'alerte n'est pas un simple « en retard » : elle suit des seuils
   paramétrables (J-7 / J-3 / J-1 avant l'échéance, relance J+1 / J+3 / J+7
   après, escalade au-delà), pour que la revue hebdomadaire parte d'un ordre
   de priorité et non d'un tri par date. */
const AT_STATUTS=['À faire','En cours','Bloqué','En attente','Fait'];
const AT_ST_ICON={'À faire':'☐','En cours':'◐','Bloqué':'⛔','En attente':'⏸','Fait':'☑'};
const AT_ST_CLS={'À faire':'todo','En cours':'doing','Bloqué':'blocked','En attente':'wait','Fait':'done'};
const AT_PRIOS=['Basse','Normale','Haute','Critique'];
const AT_PRIO_W={Basse:0,Normale:1,Haute:2,Critique:3};
const AT_TYPES=['Action','Tâche','Décision','Livrable'];
const AT_ORIG=['COPIL','COPROJ','Revue projet','Gate','CER','Audit','PVRT','CAPA','HSE','Chantier','Risque','Autre'];
const AT_PHASES=['Ph 0 — Évaluation','Ph 1 — Lancement','Ph 2 — URS | CDO','Ph 3 — AR & qualification',
  'Ph 4 — Construction & MES','Ph 5 — Démarrage & QP','Ph 6 — Clôture & bénéfices'];
const AT_VUES=[['table','☰ Tableau'],['kanban','▦ Kanban'],['pilotes','👥 Pilotes'],
  ['cal','📅 Calendrier'],['exec','🎯 Revue de direction']];

function atCfg(){ const c=(S.atCfg&&typeof S.atCfg==='object')?S.atCfg:{};
  const nums=(a,d)=>Array.isArray(a)&&a.length?a.map(Number).filter(n=>n>=0&&isFinite(n)):d;
  return {pre:nums(c.pre,[7,3,1]), post:nums(c.post,[1,3,7]), esc:(isFinite(+c.esc)&&+c.esc>0)?+c.esc:7}; }
function atToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function atD(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function atFR(iso){ const d=atD(iso); return d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():''; }
function atJours(iso){ const d=atD(iso); if(!d)return null; const t=new Date();
  return Math.round((d-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5); }
/* accepte ISO, jj/mm/aaaa et le numéro de série d'un export Excel */
function atDateAuto(v){
  if(v==null||v==='') return '';
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){ const y=+m[3]<100?2000+ +m[3]:+m[3]; return y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'); }
  return '';
}
function atUid(){ let m=0; (S.actions||[]).forEach(a=>{ const n=parseInt(String(a.id||'').replace(/\D/g,''),10); if(n>m)m=n; });
  return 'A-'+String(m+1).padStart(4,'0'); }
function atProjets(){ return S.projects.filter(p=>!p.deleted); }
function atProjOf(a){ return a.projId?S.projects.find(p=>p.id===a.projId&&!p.deleted):null; }
function atProjLbl(a){ const p=atProjOf(a); return p?((p.shine?p.shine+' — ':'')+p.nom):(a.projet||'—'); }
function atFini(a){ return a.statut==='Fait'; }

/* État d'une action : ce qu'il faut savoir avant d'ouvrir la fiche. */
function atInfo(a){
  const fini=atFini(a), j=fini?null:atJours(a.echeance);
  const retard=!fini&&j!=null&&j<0, proche=!fini&&j!=null&&j>=0&&j<=7;
  const crit=a.priorite==='Critique'&&!fini, bloque=a.statut==='Bloqué';
  let sante='green';
  if(fini) sante='grey';
  else if((retard&&-j>7)||bloque||crit) sante='red';
  else if(proche||retard) sante='orange';
  return {fini,j,retard,proche,crit,bloque,sante};
}
function atAlerte(a,i){
  i=i||atInfo(a); if(i.fini||i.j==null) return null; const c=atCfg();
  if(i.j<0){ const r=-i.j;
    if(r>=c.esc) return {lvl:'esc',txt:'Escalade · retard de '+r+' j (≥ J+'+c.esc+')'};
    const pas=[...c.post].sort((x,y)=>y-x).find(p=>r>=p);
    return {lvl:'late',txt:'Retard J+'+r+(pas?' · relance J+'+pas:'')}; }
  if(i.j===0) return {lvl:'due',txt:"Échéance aujourd'hui"};
  const pre=[...c.pre].sort((x,y)=>x-y).find(p=>i.j<=p);
  return pre!=null?{lvl:'soon',txt:'J-'+i.j+' (seuil J-'+pre+')'}:null;
}
/* Score de priorisation : il ordonne la revue. Le détail est affiché en
   infobulle, sinon un classement sans justification ne se discute pas. */
function atScore(a){
  const i=atInfo(a); if(i.fini) return null;
  let s=0; const r=[];
  if(a.priorite==='Critique'){ s+=40; r.push('Action critique'); }
  else if(a.priorite==='Haute'){ s+=15; r.push('Priorité haute'); }
  if(i.retard){ s+=Math.min(45,10+(-i.j)); r.push('Retard de '+(-i.j)+' j'); }
  else if(i.proche){ s+=15-i.j; r.push(i.j===0?"Échéance aujourd'hui":'Échéance dans '+i.j+' j'); }
  if(i.bloque){ s+=25; const d=a.dependance&&(S.actions||[]).find(x=>x.id===a.dependance);
    r.push('Bloquée'+(d?' par '+d.id:'')); }
  if(a.statut==='En attente'){ s+=5; r.push('En attente'); }
  const av=+a.avancement||0;
  if(av>0&&av<100&&i.retard){ s+=5; r.push('Avancement '+av+' % malgré le retard'); }
  const p=atProjOf(a); if(p&&typeof projHealth==='function'){ const h=projHealth(p);
    if(h&&h.band==='r'){ s+=10; r.push('Projet en rouge'); } }
  return {s:Math.round(s), r};
}
function atBloquees(a){ return (S.actions||[]).filter(x=>x.dependance===a.id&&!atFini(x)); }

function atFiltre(a){
  const f=S.at.f;
  const p=atProjOf(a);
  if(f.pole && (!p||p.group!==f.pole)) return false;
  if(f.projId && a.projId!==f.projId) return false;
  if(f.pilote && norm(a.pilote||'')!==norm(f.pilote)) return false;
  if(f.phase && a.phase!==f.phase) return false;
  if(f.statut && a.statut!==f.statut) return false;
  if(f.priorite && a.priorite!==f.priorite) return false;
  if(f.origine && a.origine!==f.origine) return false;
  const i=atInfo(a);
  if(S.at.rapide==='ouvertes' && i.fini) return false;
  if(S.at.rapide==='retard' && !i.retard) return false;
  if(S.at.rapide==='semaine' && !(!i.fini&&i.j!=null&&i.j>=0&&i.j<=7)) return false;
  if(S.at.rapide==='bloquees' && !i.bloque) return false;
  if(S.at.rapide==='miennes' && norm(a.pilote||'')!==norm(S.user||'')) return false;
  const q=norm(S.at.q||'').trim();
  if(q.length>1){
    const foin=norm([a.id,a.titre,a.desc,a.pilote,a.origine,a.ref,a.commentaire,atProjLbl(a),a.phase].join(' '));
    if(!q.split(/\s+/).every(w=>foin.includes(w))) return false;
  }
  return true;
}
function atListe(){
  const l=S.actions.filter(atFiltre);
  const k=S.at.sort.k, d=S.at.sort.d;
  const val=a=>{ const i=atInfo(a);
    if(k==='score'){ const s=atScore(a); return s?s.s:-1; }
    if(k==='jours') return i.j==null?99999:i.j;
    if(k==='priorite') return AT_PRIO_W[a.priorite]||0;
    if(k==='projet') return norm(atProjLbl(a));
    if(k==='avancement') return +a.avancement||0;
    return norm(a[k]||''); };
  return l.sort((a,b)=>{ const x=val(a),y=val(b);
    return (typeof x==='string'?x.localeCompare(y,'fr'):x-y)*d; });
}
function atNouvelle(projId){
  const a={id:atUid(), projId:projId||S.at.f.projId||'', projet:'', phase:'', titre:'Nouvelle action', desc:'',
    type:'Action', pilote:'', priorite:'Normale', debut:atToday(), echeance:'', faitLe:'', statut:'À faire',
    avancement:0, dependance:'', origine:'COPROJ', ref:'', commentaire:'',
    creeLe:atToday(), majLe:new Date().toISOString().slice(0,19).replace('T',' '), majPar:S.user||''};
  S.actions.unshift(a); logChange('Actions','création','',a.titre); return a;
}
function atMaj(a,k,v){
  const av=a[k]; if(String(av)===String(v)) return false;
  a[k]=v;
  if(k==='statut'){
    if(v==='Fait'){ if(!a.faitLe)a.faitLe=atToday(); a.avancement=100; }
    else if(av==='Fait'){ a.faitLe=''; if(+a.avancement>=100)a.avancement=90; }
  }
  if(k==='avancement'){ const n=Math.max(0,Math.min(100,+v||0)); a.avancement=n;
    if(n>=100&&a.statut!=='Fait'){ a.statut='Fait'; a.faitLe=a.faitLe||atToday(); }
    else if(n>0&&n<100&&a.statut==='À faire') a.statut='En cours'; }
  a.majLe=new Date().toISOString().slice(0,19).replace('T',' '); a.majPar=S.user||'';
  logChange('Action '+a.id, k, av, a[k]);
  return true;
}

function renderActions(){
  S.at=S.at||{vue:'table',rapide:'ouvertes',q:'',f:{pole:'',projId:'',pilote:'',phase:'',statut:'',priorite:'',origine:''},sort:{k:'score',d:-1}};

  const bloquees=ouvertes.filter(a=>a.statut==='Bloqué');
  const liste=atListe();
  const poles=[...new Set(atProjets().map(p=>p.group).filter(Boolean))].sort();
  const pilotes=[...new Set(tous.map(a=>a.pilote).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));
  const avg=ouvertes.length?Math.round(ouvertes.reduce((s,a)=>s+(+a.avancement||0),0)/ouvertes.length):0;

  const rap=(k,l,n,cls)=>`<button class="${S.at.rapide===k?'on':''}" data-atr="${k}">${l}${n!=null?` <b class="atn ${cls||''}">${n}</b>`:''}</button>`;

  view.innerHTML=`
  <div class="sec-title"><h2>Actions de suivi</h2><span class="hint">registre unique du portefeuille · relances J-${atCfg().pre.join('/J-')} · escalade à J+${atCfg().esc}</span></div>

    <div class="tile ${retard.length?'bad':'good'} click" data-atr="retard"><div class="lab">En retard</div><div class="big">${retard.length}</div></div>
    <div class="tile ${esc7.length?'bad':''}"><div class="lab">À escalader <span class="bmini">≥ J+${atCfg().esc}</span></div><div class="big">${esc7.length}</div></div>
    <div class="tile ${semaine.length?'warn':''} click" data-atr="semaine"><div class="lab">Échéance ≤ 7 j</div><div class="big">${semaine.length}</div></div>
    <div class="tile ${bloquees.length?'warn':''} click" data-atr="bloquees"><div class="lab">Bloquées</div><div class="big">${bloquees.length}</div></div>
    <div class="tile"><div class="lab">Avancement moyen <span class="bmini">actions ouvertes</span></div><div class="big">${avg} %</div></div>
  </div>
  <div class="panel"><div class="panel-h"><h3>Registre des actions</h3>

    <button class="iconbtn" id="atAdd">+ Action</button>

    <button class="iconbtn" id="atCfgB" title="Seuils de relance et d'escalade">⚙ Seuils</button></div>
    <div class="panel-b">

      </div>
      <div class="toolbar">
        <select id="atPole"><option value="">Tous pôles</option>${poles.map(g=>`<option value="${esc(g)}" ${S.at.f.pole===g?'selected':''}>${esc(g)}</option>`).join('')}</select>

  lier('#atProj','change',e=>{S.at.f.projId=e.target.value;rr();});
  lier('#atPil','change',e=>{S.at.f.pilote=e.target.value;rr();});
  lier('#atPh','change',e=>{S.at.f.phase=e.target.value;rr();});
  lier('#atSt','change',e=>{S.at.f.statut=e.target.value;rr();});
  lier('#atPr','change',e=>{S.at.f.priorite=e.target.value;rr();});

  $$('[data-atf]').forEach(el=>{
    const maj=()=>{ const [id,k]=el.dataset.atf.split('|'); const a=S.actions.find(x=>x.id===id); if(!a)return;
      let v = el.tagName==='SELECT'||el.tagName==='INPUT' ? el.value : el.textContent.trim();

  });
  $$('[data-atdel]').forEach(b=>b.onclick=()=>{
    const a=S.actions.find(x=>x.id===b.dataset.atdel); if(!a)return;
    const bl=atBloquees(a);
    if(!confirm('Supprimer l’action '+a.id+' ?\n\n'+(a.titre||'')+(bl.length?('\n\n⚠ '+bl.length+' action(s) la déclarent comme dépendance : elles resteront bloquées sans objet.'):'')))return;
    S.actions=S.actions.filter(x=>x.id!==a.id); logChange('Actions','suppression',a.id+' — '+(a.titre||''),''); scheduleSave(); rr();

  $$('[data-atgo]').forEach(b=>b.onclick=()=>{ S.currentProj=b.dataset.atgo; S.tab='pass'; S.kitTab='synthese'; S.navKey=''; scheduleSave(); render(); });
}

function atPuce(a){
  const i=atInfo(a), al=atAlerte(a,i);
  const cls=i.fini?'done':al?('al-'+al.lvl):'ok';
  const t=i.fini?('Clôturée'+(a.faitLe?' le '+atFR(a.faitLe):'')):(al?al.txt:(i.j==null?'Sans échéance':'J-'+i.j));
  return `<span class="atdot ${cls}" title="${esc(t)}"></span>`;
}
function atScoreHTML(a){
  const s=atScore(a); if(!s) return '<span class="hint">—</span>';
  const cls=s.s>=50?'r':s.s>=25?'o':'g';
  return `<span class="atscore ${cls}" title="${esc(s.r.join(' · ')||'Aucun facteur aggravant')}">${s.s}</span>`;
}

function atVueCal(liste){

function atReprendre(){

  S.projects.filter(p=>!p.deleted).forEach(p=>{
    const pp=S.passports&&(S.passports[p.id]||S.passports[p.shine]); if(!pp)return;
    (pp.risks||[]).forEach(r=>{
      const t=String(r.desc||'').trim(); if(!t)return;
      const k=p.id+'|'+norm(t); if(vu.has(k))return; vu.add(k);
      const a=atNouvelle(p.id);
      a.titre=t; a.desc=r.mit?('Mitigation : '+r.mit):''; a.pilote=r.owner||p.pl||p.pm||'';
      a.echeance=atDateAuto(r.date)||''; a.priorite='Haute'; a.origine='Risque'; a.type='Action';
      a.statut='En cours'; a.avancement=0; n++;
    });
    (pp.nextSteps||[]).forEach(x=>{
      const s=nsNorm(x), t=s.t.trim(); if(!t)return;
      const k=p.id+'|'+norm(t); if(vu.has(k))return; vu.add(k);
      const st=s.st||'';
      const a=atNouvelle(p.id);
      a.titre=t; a.pilote=p.pl||p.pm||''; a.origine='COPROJ'; a.type='Tâche';

  });
  if(n){ scheduleSave(); renderActions();
    alert(n+' action(s) reprise(s) des fiches projet (risques et « Next Steps »).\n\nElles sont au registre, à compléter : pilote, échéance, priorité.'); }
  else alert('Rien à reprendre : les risques et les étapes « Next Steps » des fiches sont déjà au registre.');
}

/* ======================= Macroplanning portefeuille =======================
   Reprise du macroplanning de l'outil CSD : une frise hebdomadaire ISO
   (S1…S52/53) où chaque ligne est un projet du portefeuille, les barres des
   activités et les losanges des jalons.

   Rien n'y est stocké en propre. Les barres sont les activités du kit projet
   (kitOf(id).tasks) et les losanges ses jalons : ce qui est planifié ici
   apparaît dans le macroplanning du projet, et réciproquement. L'outil
   d'origine tenait un second planning par semaine, qu'il fallait ressaisir ;
   la semaine n'est plus qu'une façon de regarder les mêmes dates.

   Glisser dans la grille crée une activité · glisser une barre la déplace ·
   les poignées en changent la durée · double-clic ouvre l'éditeur. */
const MP_W=24;                 /* largeur d'une semaine, en pixels */
const MP_LANE=22;              /* hauteur d'une ligne d'activité */
const MP_COLORS=['#2f6f9f','#1d7a52','#bd8413','#c0392b','#7d4f9e','#5a6b78'];
const MP_MOIS=['Janv.','Févr.','Mars','Avr.','Mai','Juin','Juil.','Août','Sept.','Oct.','Nov.','Déc.'];
const MP_SEM=[[1,'1er semestre','janv. → juin'],[2,'2e semestre','juil. → déc.']];
const MP_KIND={activity:'Activité',coordination:'Coordination',gate:'Gate'};

function mpAn(){ const a=+(S.mp&&S.mp.an); return (a>=2000&&a<=2100)?a:(new Date().getFullYear()); }
function mpLundi(w,an){ an=an||mpAn(); const j4=new Date(an,0,4); const d=(j4.getDay()+6)%7;
  return new Date(an,0,4-d+(w-1)*7); }
function mpNbSem(an){ an=an||mpAn();
  const d=new Date(an,11,28), t=new Date(d); t.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const j4=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-j4)/864e5-3+((j4.getDay()+6)%7))/7); }
/* mois d'une semaine = mois de son jeudi (convention ISO) */
function mpMoisDe(w,an){ const m=mpLundi(w,an); m.setDate(m.getDate()+3); return m.getMonth(); }
function mpPhases(an){ an=an||mpAn(); const n=mpNbSem(an), a=[], b=[];
  for(let w=1;w<=n;w++)(mpMoisDe(w,an)<=5?a:b).push(w);
  return {1:{from:a[0],to:a[a.length-1]}, 2:{from:b[0],to:b[b.length-1]}}; }
function mpSemaineDe(iso,an){ an=an||mpAn();
  const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  const j=new Date(d); j.setDate(d.getDate()+3-((d.getDay()+6)%7));
  if(j.getFullYear()!==an) return (j.getFullYear()<an)?0:999;   // avant / après l'exercice
  const j4=new Date(an,0,4);
  return 1+Math.round(((j-j4)/864e5-3+((j4.getDay()+6)%7))/7); }
function mpISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mpDebutSem(w,an){ return mpISO(mpLundi(w,an)); }
function mpFinSem(w,an){ const d=mpLundi(w,an); d.setDate(d.getDate()+4); return mpISO(d); }   // vendredi
function mpClamp(w,an){ return Math.max(1,Math.min(mpNbSem(an),w)); }
function mpJJMM(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function mpPlage(w,an){ const m=mpLundi(w,an), f=new Date(m); f.setDate(m.getDate()+6); return mpJJMM(m)+' → '+mpJJMM(f); }
function mpSemCourante(an){ an=an||mpAn();
  const n=new Date(), d=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  if(d.getFullYear()!==an) return null;
  const j4=new Date(an,0,4); return 1+Math.round(((d-j4)/864e5-3+((j4.getDay()+6)%7))/7); }

/* Les activités d'un projet, ramenées à des semaines de l'exercice affiché.
   Une activité sans dates, ou hors de l'exercice, n'a pas de barre. */
function mpTaches(p){
  const an=mpAn(), k=kitOf(p.id), n=mpNbSem(an);
  return (k.tasks||[]).map((t,i)=>{
    if(!t.start||!t.end) return null;
    let s=mpSemaineDe(t.start,an), e=mpSemaineDe(t.end,an);
    if(s==null||e==null) return null;
    if(s===999||e===0) return null;                  // entièrement hors exercice
    const coupeG=(s===0), coupeD=(e===999);
    s=coupeG?1:s; e=coupeD?n:e;
    if(e<s) e=s;
    return {t,i,s,e,coupeG,coupeD,id:t.id||('t'+i)};
  }).filter(Boolean);
}
function mpJalons(p){
  const an=mpAn(), k=kitOf(p.id);
  return (k.milestones||[]).map((m,i)=>{
    if(!m.date) return null;
    const w=mpSemaineDe(m.date,an);
    if(w==null||w===0||w===999) return null;
    return {m,i,w,id:m.id||('m'+i)};
  }).filter(Boolean);
}
function mpCouleur(t,i){ return MP_COLORS.includes(t.color)?t.color
  : (t.kind==='gate'?MP_COLORS[4]:t.kind==='coordination'?MP_COLORS[2]:MP_COLORS[i%2?1:0]); }
function mpProjets(){
  let l=S.projects.filter(p=>!p.deleted);
  if(S.mp.pole) l=l.filter(p=>p.group===S.mp.pole);
  if(S.mp.q){ const q=norm(S.mp.q);
    l=l.filter(p=>norm([p.nom,p.shine,p.pm,p.pl,p.group].join(' ')).includes(q)); }
  if(S.mp.avecSeuls) l=l.filter(p=>mpTaches(p).length||mpJalons(p).length);
  return l;
}
function mpProjOf(id){ return S.projects.find(p=>p.id===id&&!p.deleted); }

function mpLigne(p,ph,an,cw){
  const nW=ph.to-ph.from+1, taches=mpTaches(p), jalons=mpJalons(p);
  const voies=[];                                    /* empilement : une barre par voie libre */
  taches.forEach(o=>{ let v=0; while(voies[v]!=null&&voies[v]>=o.s) v++; voies[v]=o.e; o.voie=v; });
  const nV=Math.max(1,voies.length);
  const h=nV*MP_LANE+(jalons.length?20:0)+8;
  let reperes='';
  for(let w=ph.from+1;w<=ph.to;w++) if(mpMoisDe(w,an)!==mpMoisDe(w-1,an))
    reperes+=`<i class="mp-ml" style="left:${(w-ph.from)*MP_W}px"></i>`;
  if(cw&&cw>=ph.from&&cw<=ph.to) reperes+=`<i class="mp-now" style="left:${(cw-ph.from)*MP_W+MP_W/2}px" title="Semaine en cours · S${cw}"></i>`;
  let barres='';
  taches.forEach(o=>{
    const s=Math.max(o.s,ph.from), e=Math.min(o.e,ph.to);
    if(s>e) return;
    const cg=o.coupeG||o.s<ph.from, cd=o.coupeD||o.e>ph.to;
    const col=mpCouleur(o.t,o.i), av=Math.max(0,Math.min(100,+o.t.progress||0));
    const bulle=`${o.t.name||'Activité'} — S${o.s} → S${o.e} (${mpPlage(o.s,an)} … ${mpPlage(o.e,an)}) · ${MP_KIND[o.t.kind]||'Activité'} · ${av} %${o.t.owner?' · '+o.t.owner:''}`;
    barres+=`<div class="mp-bar${cg?' cg':''}${cd?' cd':''}" data-mpt="${esc(p.id)}|${o.i}"
      style="left:${(s-ph.from)*MP_W+1}px;width:${(e-s+1)*MP_W-2}px;top:${4+o.voie*MP_LANE}px;background:${col}" title="${esc(bulle)}">
      ${cg?'':'<span class="mp-h l" data-mph="l"></span>'}<i class="mp-av" style="width:${av}%"></i>
      <span class="mp-lb">${esc(o.t.name||'Activité')}</span>${cd?'':'<span class="mp-h r" data-mph="r"></span>'}</div>`;
  });
  let dias='';
  jalons.forEach(o=>{ if(o.w<ph.from||o.w>ph.to) return;
    dias+=`<i class="mp-dia" style="left:${(o.w-ph.from)*MP_W+MP_W/2}px;top:${nV*MP_LANE+8}px"
      title="${esc((o.m.name||'Jalon')+' · '+(o.m.date||'')+(o.m.owner?' · '+o.m.owner:''))}"></i>`; });
  /* période couverte, lue sur l'exercice entier et non sur le semestre affiché */
  const toutes=mpTaches(p);
  const per=toutes.length?('S'+Math.min(...toutes.map(o=>o.s))+' → S'+Math.max(...toutes.map(o=>o.e))):'—';
  return `<div class="mp-ln">
    <div class="mp-nom"><button class="lnk" data-mpgo="${esc(p.id)}" title="Ouvrir le macroplanning de ce projet">${esc(p.shine?p.shine+' — ':'')}${esc(p.nom)}</button>
      <span class="mp-sub">${esc(p.group||'')}${p.pl?' · '+esc(p.pl):''}</span></div>
    <div class="mp-ax"><div class="mp-grid" data-mprow="${esc(p.id)}" data-mpph="${S.mp.phase}" style="width:${nW*MP_W}px;height:${h}px">
      ${reperes}${taches.length||jalons.length?'':'<span class="mp-vide">glissez pour planifier une activité</span>'}${barres}${dias}</div></div>
    <div class="mp-tot">${per}<span class="mp-sub">${toutes.length} act.${jalons.length?' · '+jalons.length+' jal.':''}</span></div></div>`;
}

/* ---- Créer, déplacer, redimensionner ---- */
let _mpD=null;
function mpSemAt(grid,x){ const ph=mpPhases()[+grid.dataset.mpph], r=grid.getBoundingClientRect();
  return mpClamp(ph.from+Math.floor((x-r.left)/MP_W)); }
function mpPoser(el,grid,s,e,voie){
  const ph=mpPhases()[+grid.dataset.mpph], a=Math.max(s,ph.from), b=Math.min(e,ph.to);
  if(a>b){ el.style.display='none'; return; }
  el.style.display=''; el.style.left=((a-ph.from)*MP_W+1)+'px'; el.style.width=((b-a+1)*MP_W-2)+'px';
  if(voie!=null) el.style.top=(4+voie*MP_LANE)+'px';
}
function mpArmer(){
  const zone=$('.mptbl'); if(!zone||zone._mpOn) return; zone._mpOn=true;
  zone.addEventListener('mousedown',e=>{ if(e.target.closest('.mp-grid')) e.preventDefault(); },true);
  zone.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    const grid=e.target.closest&&e.target.closest('.mp-grid'); if(!grid) return;
    const p=mpProjOf(grid.dataset.mprow); if(!p) return;
    const bar=e.target.closest('.mp-bar');
    if(bar){
      const [pid,idx]=bar.dataset.mpt.split('|'); const t=(kitOf(pid).tasks||[])[+idx]; if(!t) return;
      const o=mpTaches(p).find(x=>x.i===+idx); if(!o) return;
      const poi=e.target.closest('.mp-h');
      _mpD={mode:poi?(poi.dataset.mph==='l'?'g':'d'):'move', grid, p, t, el:bar, x0:e.clientX, s0:o.s, e0:o.e, bouge:false};
    } else {
      const w=mpSemAt(grid,e.clientX);
      const g=document.createElement('div'); g.className='mp-bar fant';
      /* la voie du fantôme : sous les barres déjà posées dans ce semestre */
      const nV=grid.querySelectorAll('.mp-bar').length
        ? Math.max(...[...grid.querySelectorAll('.mp-bar')].map(b=>Math.round(((parseFloat(b.style.top)||0)-4)/MP_LANE)))+1 : 0;
      g.style.top=(4+nV*MP_LANE)+'px'; grid.appendChild(g);
      const besoin=(nV+1)*MP_LANE+8; if(grid.offsetHeight<besoin) grid.style.height=besoin+'px';
      mpPoser(g,grid,w,w);
      _mpD={mode:'trace', grid, p, el:g, x0:e.clientX, w0:w, s:w, e:w, bouge:false, h0:grid.style.height};
    }
    _mpD.pid=e.pointerId;
  });
  zone.addEventListener('pointermove',e=>{
    const d=_mpD; if(!d) return;
    if(!d.bouge&&Math.abs(e.clientX-d.x0)>3){ d.bouge=true; document.body.classList.add('mp-drag');
      try{ d.grid.setPointerCapture(d.pid); }catch(_){} }
    if(!d.bouge) return;
    if(d.mode==='trace'){ const w=mpSemAt(d.grid,e.clientX);
      d.s=Math.min(d.w0,w); d.e=Math.max(d.w0,w); mpPoser(d.el,d.grid,d.s,d.e); return; }
    const dw=Math.round((e.clientX-d.x0)/MP_W); let s=d.s0, f=d.e0, n=mpNbSem();
    if(d.mode==='move'){ const len=d.e0-d.s0; s=mpClamp(d.s0+dw); if(s+len>n) s=n-len; f=s+len; }
    else if(d.mode==='g') s=Math.min(mpClamp(d.s0+dw),d.e0);
    else f=Math.max(mpClamp(d.e0+dw),d.s0);
    d.ns=s; d.ne=f; mpPoser(d.el,d.grid,s,f);
    d.el.title=`${d.t.name||'Activité'} — S${s} → S${f}`;
  });
  const fin=()=>{
    const d=_mpD; if(!d) return; _mpD=null; document.body.classList.remove('mp-drag');
    const an=mpAn();
    if(d.mode==='trace'){
      d.el.remove();
      if(!d.bouge){ d.grid.style.height=d.h0; return; }
      const k=kitOf(d.p.id);
      const t={id:kuid(), name:'', start:mpDebutSem(d.s,an), end:mpFinSem(d.e,an), kind:'activity', progress:0, owner:d.p.pl||d.p.pm||''};
      k.tasks.push(t);
      logChange('Macroplanning — '+(d.p.shine||d.p.nom),'activité créée','', 'S'+d.s+' → S'+d.e);
      scheduleSave(); renderMacro(); mpEditeur(d.p.id, k.tasks.length-1, true);
      return;
    }
    if(!d.bouge) return;
    if(d.ns!=null&&(d.ns!==d.s0||d.ne!==d.e0)){
      const av=(d.t.start||'')+' → '+(d.t.end||'');
      d.t.start=mpDebutSem(d.ns,an); d.t.end=mpFinSem(d.ne,an);
      logChange('Macroplanning — '+(d.p.shine||d.p.nom),(d.t.name||'activité')+' · dates', av, d.t.start+' → '+d.t.end);
      scheduleSave();
    }
    renderMacro();
  };
  zone.addEventListener('pointerup',fin);
  zone.addEventListener('pointercancel',fin);
  zone.addEventListener('dblclick',e=>{
    const grid=e.target.closest&&e.target.closest('.mp-grid'); if(!grid) return;
    const p=mpProjOf(grid.dataset.mprow); if(!p) return;
    const cible=document.elementFromPoint(e.clientX,e.clientY);
    const bar=(cible&&cible.closest&&cible.closest('.mp-bar'))||e.target.closest('.mp-bar');
    if(bar&&bar.dataset.mpt){ const [pid,idx]=bar.dataset.mpt.split('|'); mpEditeur(pid,+idx,false); return; }
    const an=mpAn(), w=mpSemAt(grid,e.clientX), k=kitOf(p.id);
    k.tasks.push({id:kuid(), name:'', start:mpDebutSem(w,an), end:mpFinSem(mpClamp(w+1),an), kind:'activity', progress:0, owner:p.pl||p.pm||''});
    logChange('Macroplanning — '+(p.shine||p.nom),'activité créée','','S'+w);
    scheduleSave(); renderMacro(); mpEditeur(p.id, k.tasks.length-1, true);
  });
}

  const sw=MP_COLORS.map(c=>`<label class="mp-sw" style="background:${c}"><input type="radio" name="mpc" value="${c}" ${((t.color||mpCouleur(t,idx))===c)?'checked':''}></label>`).join('');

    <div class="dbody">
      <p class="lead">${esc(p.shine?p.shine+' — ':'')}${esc(p.nom)} · cette activité est celle du kit projet : la modifier ici la modifie dans la fiche.</p>
      <div class="xrow"><label style="flex:1">Libellé<br>
        <input id="mpL" value="${esc(t.name||'')}" placeholder="ex. Études, Consultation, Travaux, Réception…" style="width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font:inherit"></label></div>
      <div class="xrow"><label style="flex:1">Début<br><select id="mpS" style="width:100%">${opts(ws)}</select></label>
        <label style="flex:1">Fin<br><select id="mpE" style="width:100%">${opts(we)}</select></label></div>
      <div class="xrow"><label style="flex:1">Type<br><select id="mpK" style="width:100%">${Object.entries(MP_KIND).map(([v,l])=>`<option value="${v}" ${(t.kind||'activity')===v?'selected':''}>${l}</option>`).join('')}</select></label>
        <label style="flex:1">Avancement %<br><input id="mpA" type="number" min="0" max="100" step="5" value="${+t.progress||0}" style="width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font:inherit"></label>
        <label style="flex:1">Pilote<br><input id="mpO" value="${esc(t.owner||'')}" style="width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font:inherit"></label></div>
      <div class="xrow"><label>Couleur</label><div style="display:flex;gap:8px">${sw}</div></div>
      <p class="hint" style="margin:6px 0 0">Les dates réelles vont du lundi de la semaine de début au vendredi de la semaine de fin.</p>

    <div class="dfoot"><button class="iconbtn" id="mpDel" style="margin-right:auto;color:var(--bad);border-color:var(--bad)">🗑 Supprimer</button>
      <button class="iconbtn" data-x>Fermer</button>
      <button class="iconbtn" id="mpOk" style="background:var(--accent);color:#fff;border-color:var(--accent)">✓ Enregistrer</button></div></div>`;
  document.body.appendChild(ov);
  const fermer=()=>ov.remove();
  $$('[data-x]',ov).forEach(b=>b.onclick=fermer);

  const enreg=()=>{
    let s=+$('#mpS',ov).value, e=+$('#mpE',ov).value; if(e<s){ const x=s; s=e; e=x; }
    const av=(t.name||'')+' · '+(t.start||'')+' → '+(t.end||'');

function renderPass(){

     et deux flèches permettent de les parcourir dans l'ordre — une revue
     INFRA s'enchaîne sans repasser par le portefeuille. */
  const vivants=S.projects.filter(x=>!x.deleted);
  const poles=[...new Set(vivants.map(x=>x.group).filter(Boolean))].sort();
  if(S.ppPole && !poles.includes(S.ppPole)) S.ppPole='';
  let lot=S.ppPole? vivants.filter(x=>x.group===S.ppPole) : vivants;
  if(!lot.length) lot=vivants;
  if(!lot.some(x=>x.id===S.currentProj) && lot.length) S.currentProj=lot[0].id;

  const rang=lot.findIndex(x=>x.id===S.currentProj)+1;

  const pp=S.passports[p.id]||S.passports[p.shine];
  const h=projHealth(p);
  const c2=(p.c2!=null?p.c2:p.c1);
  const atter=atterrissage(p);
  view.innerHTML=`
  <div class="sec-title"><h2>Pilotage projet</h2><span class="hint">fiche synthétique unique · support d'arbitrage</span></div>
  <div class="toolbar"><button class="iconbtn" id="ppBack" title="Enregistrer et revenir au portefeuille">← Retour au portefeuille</button>

function subHealth(lb,sc){const b=sc>=75?'g':sc>=55?'a':'r';return `<div class="ht ${b}"><span class="dot"></span><span class="lb">${lb}</span><span class="sc">${Math.round(sc)}</span></div>`;}
/* Atterrissage : ce que le projet aura coûté en fin de course. Au minimum son
   budget révisé — un projet consomme ce qui lui est alloué — et davantage dès
   que le facturé et l'engagé le dépassent. Avec des engagements nuls, c'est
   exactement l'estimation d'avant. */
function atterrissage(p){
  const c2=(p.c2!=null?p.c2:p.c1)||0;
  return Math.max(c2, (p.act||0)+(p.commit||0));
}
function budgetBlock(p,pp,atter){
  const c1=p.c1||0, c2=(p.c2!=null?p.c2:p.c1), ec=(c2||0)-c1;
  const act=p.act||0, com=p.commit||0, engage=act+com;     // consommé : facturé + engagé
  const dispo1=c1-engage, dispo2=(c2||0)-engage;           // Available Amount, base C1 puis C2
  const pc=(v,base)=>base?fmt(v/base*100,1)+' %':'—';
  const teinte=v=>v<0?'var(--bad)':'var(--good)';
  return `<div class="tblwrap" style="margin-top:12px"><table class="budget-mini"><thead><tr><th>Budget (k€)</th><th class="num">C1 Alloué</th><th class="num">C2 révisé</th><th class="num">B27</th></tr></thead>
  <tbody>
    <tr><td>CAPEX FY</td><td class="num" contenteditable data-pfn="c1">${p.c1!=null?fmtSaisie(p.c1):''}</td><td class="num" contenteditable data-pfn="c2">${c2!=null?fmtSaisie(c2):''}</td><td class="num" contenteditable data-pfn="b27">${p.b27!=null?fmtSaisie(p.b27):''}</td></tr>
    <tr class="tot"><td>Atterrissage estimé</td><td class="num">—</td><td class="num" colspan="2" style="color:var(--accent)">${fmt(atter)} k€ &nbsp; <span style="color:${ec>0?'var(--bad)':'var(--good)'};font-weight:600">écart C2 vs C1 ${ec>=0?'+':''}${fmt(ec)}</span></td></tr>
  </tbody></table></div>
  <div class="tblwrap" style="margin-top:10px"><table class="budget-mini"><thead><tr><th>Consommation (k€)</th><th class="num">Montant</th><th class="num">% de la base</th></tr></thead>
  <tbody>
    <tr><td>Actuals Amount <span class="bmini">facturé</span></td><td class="num" contenteditable data-pfn="act" title="Cliquez pour saisir">${p.act!=null?fmtSaisie(p.act):''}</td><td class="num">${pc(act,c2||c1)}</td></tr>
    <tr><td>Open Commitments <span class="bmini">engagé non facturé</span></td><td class="num" contenteditable data-pfn="commit" title="Cliquez pour saisir">${p.commit!=null?fmtSaisie(p.commit):''}</td><td class="num">${pc(com,c2||c1)}</td></tr>
    <tr class="tot"><td>Engagé + facturé</td><td class="num" style="color:var(--accent)">${fmt(engage)}</td><td class="num">${pc(engage,c2||c1)}</td></tr>
    <tr><td>Available Amount <span class="bmini">C1 − (actuals + commitments)</span></td><td class="num" style="color:${teinte(dispo1)};font-weight:600">${fmt(dispo1)}</td><td class="num">${pc(dispo1,c1)}</td></tr>
    <tr><td>Available Amount <span class="bmini">C2 − (actuals + commitments)</span></td><td class="num" style="color:${teinte(dispo2)};font-weight:600">${fmt(dispo2)}</td><td class="num">${pc(dispo2,c2)}</td></tr>
  </tbody></table></div>`;
}

/* Statuts des jalons et des étapes. Le vert pour ce qui est tenu, l'ambre pour
   ce qui glisse, le rouge pour ce qui ne passera pas en l'état. */
const MS_ST=['Not started','In progress','On track','At risk','Delayed','Done'];
const NS_ST=['À faire','En cours','Fait','Décalé','Reporté'];
function stTeinte(v){
  const t=norm(v);
  if(t==='done'||t==='on track'||t==='fait') return ['var(--good-soft)','var(--good)'];
  if(t==='at risk'||t==='reporte') return ['var(--bad-soft)','var(--bad)'];
  if(t==='in progress'||t==='delayed'||t==='en cours'||t==='decale') return ['var(--warn-soft)','var(--warn)'];
  return ['var(--panel-2)','var(--muted)'];
}
/* Un statut saisi hors liste — repris d'un ancien fichier — ne doit pas
   disparaître parce qu'il ne figure pas dans le menu : on l'y ajoute. */
function stSelect(attr,cle,liste,val){
  // Statut vide : pas d'option fantôme, le premier de la liste s'affiche.
  const c=stTeinte(val), opts=(!val||liste.includes(val))?liste:liste.concat([val]);
  return `<select data-${attr}="${esc(cle)}" style="width:100%;padding:2px 5px;border:1px solid var(--line);border-radius:6px;background:${c[0]};color:${c[1]};font-size:11px;font-weight:600">`
    + opts.map(o=>`<option ${o===(val||'')?'selected':''}>${esc(o)}</option>`).join('') + `</select>`;
}
/* Les étapes étaient de simples textes ; elles portent maintenant un statut. */
function nsNorm(x){
  return (x && typeof x==='object') ? {t:String(x.t||''), st:x.st||'À faire'}
                                    : {t:String(x==null?'':x), st:'À faire'};
}
function pill(st){const s=norm(st); if(s==='done')return '<span class="pill g">Done</span>'; if(s.includes('progress'))return '<span class="pill a">In progress</span>'; if(s.includes('late')||s.includes('retard'))return '<span class="pill r">Late</span>'; return `<span class="pill n">${esc(st||'—')}</span>`;}
function risksBlock(p,pp){

function orgBlock(pp){

function ensurePP(id){
  if(!S.passports[id]){ const p=S.projects.find(x=>x.id===id); S.passports[id]={milestones:[],risks:[],nextSteps:[],statusTxt:(p&&p.comment)||''}; }
  const pp=S.passports[id]; pp.milestones=pp.milestones||[]; pp.risks=pp.risks||[];
  pp.nextSteps=(pp.nextSteps||[]).map(nsNorm); return pp;
}
function bindEditables(){
  $$('[data-editpp]').forEach(el=>el.addEventListener('blur',()=>{const pp=ensurePP(S.currentProj); pp[el.dataset.editpp]=el.textContent.trim(); scheduleSave();}));
  $$('[data-pf]').forEach(el=>el.addEventListener('blur',()=>{const p=S.projects.find(x=>x.id===S.currentProj); if(p){p[el.dataset.pf]=el.textContent.trim(); scheduleSave();}}));
  $$('[data-ppf]').forEach(el=>el.addEventListener('blur',()=>{const pp=ensurePP(S.currentProj); pp[el.dataset.ppf]=el.textContent.trim(); scheduleSave();}));
  $$('[data-pfn]').forEach(el=>el.addEventListener('blur',()=>{const p=S.projects.find(x=>x.id===S.currentProj); if(!p)return; const t=el.textContent.replace(/\s/g,'').replace(',','.'); const v=t===''?null:parseFloat(t); p[el.dataset.pfn]=(v==null||isNaN(v))?null:v; scheduleSave(); renderPass();}));
  $$('[data-km]').forEach(el=>el.addEventListener('blur',()=>{const[id,i,f]=el.dataset.km.split('|');const pp=ensurePP(id);pp.milestones[+i][f]=el.textContent.trim();scheduleSave();}));
  $$('[data-rk]').forEach(el=>{
    const avant=el.innerText;
    el.addEventListener('blur',()=>{
      const[id,i,f]=el.dataset.rk.split('|'); const pp=ensurePP(id); const r=pp.risks[+i]; if(!r) return;
      // innerText, et non textContent : lui seul rend les retours à la ligne
      // tels qu'ils ont été saisis. Les espaces insécables du presse-papier
      // sont ramenés à des espaces ordinaires.
      const t=el.innerText.replace(/\u00a0/g,' ').replace(/\r/g,'').replace(/\n{3,}/g,'\n\n').replace(/[ \t]+$/gm,'').trim();
      if(r[f]===t) return;
      r[f]=t; scheduleSave();
    });
    el.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ e.preventDefault(); el.innerText=avant; el.blur(); return; }
      if(e.key!=='Enter') return;
      e.preventDefault();
      if(e.altKey||e.shiftKey||e.ctrlKey||e.metaKey){      // Alt+Entrée : nouvelle ligne, comme dans un tableur
        if(!document.execCommand('insertText',false,'\n')) document.execCommand('insertLineBreak');
      } else el.blur();                                    // Entrée seule : on valide
    });
  });
  $$('[data-ns]').forEach(el=>el.addEventListener('blur',()=>{const[id,i]=el.dataset.ns.split('|');const pp=ensurePP(id);const o=nsNorm(pp.nextSteps[+i]);o.t=el.textContent.trim();pp.nextSteps[+i]=o;scheduleSave();}));
  $$('[data-kmst]').forEach(sel=>sel.addEventListener('change',()=>{const[id,i]=sel.dataset.kmst.split('|');const pp=ensurePP(id);const m=pp.milestones[+i];if(!m)return;
    logChange('Jalon '+(m.name||''),'statut',m.st||'—',sel.value); m.st=sel.value; renderPass(); scheduleSave();}));
  $$('[data-nsst]').forEach(sel=>sel.addEventListener('change',()=>{const[id,i]=sel.dataset.nsst.split('|');const pp=ensurePP(id);const o=nsNorm(pp.nextSteps[+i]);
    logChange('Étape '+(o.t||''),'statut',o.st||'—',sel.value); o.st=sel.value; pp.nextSteps[+i]=o; renderPass(); scheduleSave();}));
  $$('[data-addkm]').forEach(b=>b.addEventListener('click',()=>{ensurePP(b.dataset.addkm).milestones.push({name:'Nouveau jalon',ini:'',neu:'',st:'In progress'});renderPass();scheduleSave();}));
  $$('[data-addrk]').forEach(b=>b.addEventListener('click',()=>{ensurePP(b.dataset.addrk).risks.push({desc:'Nouveau risque',mit:'',owner:'',date:''});renderPass();scheduleSave();}));
  $$('[data-addns]').forEach(b=>b.addEventListener('click',()=>{ensurePP(b.dataset.addns).nextSteps.push({t:'Nouvelle étape',st:'À faire'});renderPass();scheduleSave();}));
  $$('[data-delkm]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const[id,i]=b.dataset.delkm.split('|');ensurePP(id).milestones.splice(+i,1);renderPass();scheduleSave();}));
  $$('[data-delrk]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const[id,i]=b.dataset.delrk.split('|');ensurePP(id).risks.splice(+i,1);renderPass();scheduleSave();}));
  $$('[data-delns]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const[id,i]=b.dataset.delns.split('|');ensurePP(id).nextSteps.splice(+i,1);renderPass();scheduleSave();}));
}

/* ======================= TAB 3 — Finance ======================= */
function renderFin(){
  const list=PROJ().filter(p=>(p.c1||p.c2||p.act));
  const t=totals(PROJ());
  // sort
  const s=S.finSort;
  const val=(p,k)=>k==='ecart'?ecartV(p):k==='conso'?(p.c1?(p.act||0)/p.c1*100:0):(['c1','c2','b27','act'].includes(k)?(p[k]||0):norm(p[k]||''));
  list.sort((a,b)=>{const av=val(a,s.key),bv=val(b,s.key); if(av<bv)return s.dir; if(av>bv)return -s.dir; return 0;});
  const ecartPct=t.c1?((t.c2-t.c1)/t.c1*100):0;
  // top deltas C2 vs C1
  const deltas=[...PROJ()].map(p=>({p,d:ecartV(p)})).filter(x=>x.d).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,8);
  const maxD=Math.max(1,...deltas.map(x=>Math.abs(x.d)));

  view.innerHTML=`
  <div class="sec-title"><h2>Cockpit Finance — CAPEX</h2><span class="hint">C1 Alloué · C2 révisé · B27 · réalisé · atterrissage · k€</span></div>
  <div class="kpis">
    <div class="tile"><div class="lab">C1 Alloué FY</div><div class="big">${fmt(t.c1)}<span class="u">k€</span></div></div>
    <div class="tile c"><div class="lab">C2 révisé FY</div><div class="big">${fmt(t.c2)}<span class="u">k€</span></div><div class="sub">${ecartPct>=0?'+':''}${fmt(ecartPct,1)}% vs C1</div></div>

  let body='';
  if(navSec==='membres'||navSec==='cdp'||navSec==='pm'){

    else if(navSec==='pm'){

      const rolePM=r=>/\bpm\b/i.test(r)||/chef\s+de\s+projet/i.test(r)||/project\s+manager/i.test(r);
      const roleCA=r=>/\bca\b/i.test(r)||/charg[ée]\s*d[e']?\s*affaire/i.test(r);
      rows=rows.filter(o=>{ const r=o.m.role||''; return pmset.has(mkey(o.m.nom))||rolePM(r)||roleCA(r); });

    const meta = navSec==='membres' ? `${mem.length} membres · ${nInt} internes · ${nPre} prestataires` : `${rows.length} membre(s)`;
    body = `<div class="panel" id="bddMembres" style="margin-bottom:14px"><div class="panel-h"><h3>${SEC[navSec][0]}</h3><span class="meta">${meta}</span></div>
      <div class="panel-b">
        ${navSec==='membres'?`<div class="toolbar"><button class="iconbtn" id="addMember">＋ Ajouter un membre</button><span class="sp"></span><span class="hint">Repris de « Planning Présence Ingénierie » + PM|Owner / PL|Leader du portefeuille · cellules éditables · un membre supprimé n'est pas réintégré</span></div>`:`<div class="hint" style="margin-bottom:8px">Vue filtrée de la BDD Membres · les rôles/types se modifient dans « BDD Membres ».</div>`}
        ${rows.length?membersTableHTML(rows):`<div class="hint" style="padding:12px 2px">Aucun membre${navSec==='cdp'?" avec le rôle « Coordinateur / CDP » — renseignez-le dans BDD Membres.":navSec==='pm'?" reconnu comme PM | Owner d'un projet.":'.'}</div>`}
      </div></div>`;
  } else if(navSec==='presence'){
    const nOuvre=CAL.filter(j=>j.ouvre).length, nFer=CAL.filter(j=>j.ferie).length;
    // Un en-tête à deux étages : la semaine coiffe ses jours, chaque jour porte

    const parSem={}; CAL.forEach(j=>{ (parSem[j.sem]=parSem[j.sem]||[]).push(j); });
    // Le premier jour de chaque semaine porte le trait de separation.
    const debSem=new Set(Object.values(parSem).map(l=>l[0].iso));
    const enteteSem=weeks.map(w=>`<th class="psem" colspan="${parSem[w].length}">S${w}</th>`).join('');
    const enteteJour=CAL.map(j=>`<th class="pjour${debSem.has(j.iso)?' pw1':''}${j.we?' pwe':''}${j.ferie?' pfer':''}" title="${JOURS_NOM[j.jour]} ${j.num} ${MOIS_CT[j.mois]}${j.ferie?' — '+esc(j.ferie):''}">${JOURS_LB[j.jour]}<span class="pnum">${j.num}</span></th>`).join('');
    body = `<div class="panel" id="planPresence" style="margin-bottom:14px"><div class="panel-h"><h3>Planning présence ingénierie — ${PRES_ANNEE}</h3><span class="meta">${mem.length} membres × ${CAL.length} jours · ${nOuvre} ouvrés · ${nFer} fériés</span></div>
      <div class="panel-b">
        <div class="pleg">${Object.entries(PRESMAP).map(([k,v])=>`<span><span class="pdot" style="background:${v.c}"></span>${v.lb} <b>(${k})</b></span>`).join('')}<span><span class="pdot" style="background:var(--panel-3)"></span>Non renseigné</span><span><span class="pdot pdot-off"></span>Week-end ou férié — non saisissable</span></div>
        <div class="tblwrap" style="max-height:600px;overflow:auto"><table class="ptbl">
          <thead>
            <tr><th class="rname" rowspan="2">Membre</th>${enteteSem}</tr>
            <tr>${enteteJour}</tr>
          </thead>
          <tbody>${mem.map(m=>{const pr=S.presence[m.nom]||{};return `<tr><td class="rname">${esc(m.nom)}${m.ini?` <span style="color:var(--faint)">[${esc(m.ini)}]</span>`:''}</td>${CAL.map(j=>{
            if(!j.ouvre) return `<td class="pcell poff${debSem.has(j.iso)?' pw1':''}${j.ferie?' pfer':''}" title="${JOURS_NOM[j.jour]} ${j.num} ${MOIS_CT[j.mois]}${j.ferie?' — '+esc(j.ferie):''}"></td>`;
            const code=pr[j.iso]||''; const info=PRESMAP[code];
            const lj=`${JOURS_NOM[j.jour]} ${j.num} ${MOIS_CT[j.mois]}`;
            return `<td class="pcell${debSem.has(j.iso)?' pw1':''}" data-pc="${esc(m.nom)}|${j.iso}" data-pj="${lj}" style="background:${info?info.c:'transparent'};${info?'color:#fff':''}" title="${lj} — ${info?info.lb:'Non renseigné'}">${code}</td>`;
          }).join('')}</tr>`;}).join('')}</tbody>
        </table></div>
      </div></div>`;
  } else {
    body = `<div class="kpis">
      <div class="tile a"><div class="lab">Rôles suivis</div><div class="big">${roles.length}</div></div>
      <div class="tile"><div class="lab">Capacité RT moy.</div><div class="big">${fmt(avgCap,1)}<span class="u">ETP</span></div><div class="sub">ING + AUTOM</div></div>
      <div class="tile"><div class="lab">Demande moy.</div><div class="big">${fmt(avgDem,1)}<span class="u">ETP</span></div></div>
      <div class="tile ${avgOcc>100?'bad':avgOcc>=80?'good':'warn'}"><div class="lab">Occupation moy.</div><div class="big">${fmt(avgOcc,0)}<span class="u">%</span></div><div class="sub">cible 80–95%</div></div>
      <div class="tile c"><div class="lab">Rôle le + chargé</div><div class="big" style="font-size:15px;margin-top:9px">${esc(peakRole?peakRole.r:'—')}</div><div class="sub">${peakRole?fmt(peakRole.t,1)+' ETP·mois':''}</div></div>
    </div>
    <div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>Plan de ressources — charge vs capacité (RT Ingénierie)</h3><span class="meta">ETP par mois · source Bilan RT</span></div>
      <div class="panel-b"><div class="tblwrap"><table class="heat"><thead><tr><th class="rname" style="position:sticky;left:0">Mesure</th>${months.map(m=>`<th class="num">${m}</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td class="rname">Demande</td>${demand.map(v=>`<td class="hc">${fmt(v,1)}</td>`).join('')}</tr>
        <tr><td class="rname">Capacité</td>${cap.map(v=>`<td class="hc">${fmt(v,1)}</td>`).join('')}</tr>
        <tr><td class="rname">Occupation</td>${occ.map(v=>`<td class="hc" style="background:${occColor(v)};color:${v>95||(v>0&&v<1)?'#fff':'inherit'};font-weight:600">${v?fmt(v,0)+'%':'—'}</td>`).join('')}</tr>
      </tbody></table></div>
      <div class="legend"><span><span class="hdot g"></span>80–95% cible</span><span><span class="hdot a"></span>&lt;80% ou 95–100%</span><span><span class="hdot r"></span>&gt;100% surcharge</span></div>
      </div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Charge par rôle</h3><span class="meta">ETP · éditable</span></div>
      <div class="panel-b"><div class="tblwrap" style="max-height:460px;overflow-y:auto"><table class="heat"><thead><tr><th class="rname" style="position:sticky;left:0">Rôle</th>${months.map(m=>`<th class="num">${m}</th>`).join('')}<th class="num">Total</th></tr></thead>
      <tbody>${roles.map(r=>{const tot=S.chargeByRole[r].reduce((a,b)=>a+b,0);return `<tr><td class="rname">${esc(r)}</td>${S.chargeByRole[r].map((v,i)=>`<td class="hc" contenteditable data-ch="${esc(r)}|${i}" style="background:${chargeColor(v)}">${v?fmt(v,2):''}</td>`).join('')}<td class="hc" style="font-weight:700">${fmt(tot,1)}</td></tr>`;}).join('')}</tbody></table></div></div>
    </div>`;
  }
  view.innerHTML = `<div class="sec-title"><h2>${SEC[navSec][0]}</h2><span class="hint">${SEC[navSec][1]}</span></div>${body}${footHTML('res',`Capacité · membres repris de « Planning Présence Ingénierie » &amp; PM/PL du portefeuille · présence au jour, week-ends et fériés exclus · plan de charge (Bilan RT + charge par rôle).`)}`;
  $$('[data-ch]').forEach(el=>el.addEventListener('blur',()=>{const[r,i]=el.dataset.ch.split('|');const v=parseFloat(el.textContent.replace(',','.'));S.chargeByRole[r][+i]=isNaN(v)?0:v;renderRes();scheduleSave();}));
  // --- BDD membres : édition ---
  $$('[data-mf]').forEach(el=>el.addEventListener('blur',()=>{const[f,i]=el.dataset.mf.split('|');if(S.members[+i]){S.members[+i][f]=el.textContent.trim();
    // Re-saisir un nom ecarte la marque de suppression : la personne redevient
    // rapprochable du portefeuille.
    if(f==='nom'&&S.membersRemoved&&S.membersRemoved.length){const k=mkey(S.members[+i].nom);S.membersRemoved=S.membersRemoved.filter(x=>x!==k);}
    scheduleSave();}}));
  $$('[data-mfn]').forEach(el=>el.addEventListener('blur',()=>{const[f,i]=el.dataset.mfn.split('|');const v=parseFloat(el.textContent.replace(',','.'));if(S.members[+i]){S.members[+i][f]=isNaN(v)?null:v;scheduleSave();}}));
  $$('[data-msel]').forEach(sel=>sel.addEventListener('change',()=>{const[f,i]=sel.dataset.msel.split('|');if(S.members[+i]){S.members[+i][f]=sel.value;renderRes();scheduleSave();}}));
  // Marque un membre comme retire a la main, pour que le rapprochement
  // PM|PL du portefeuille ne le recree pas au chargement suivant.
  function memForget(m){
    const k=mkey((m&&m.nom)||''); if(!k) return;
    S.membersRemoved=S.membersRemoved||[];
    if(!S.membersRemoved.includes(k)) S.membersRemoved.push(k);
  }
  $$('[data-delm]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.delm;const nm=S.members[i]&&S.members[i].nom;if(confirm('Supprimer '+(nm||'ce membre')+' ?')){memForget(S.members[i]);S.members.splice(i,1);renderRes();scheduleSave();}}));
  // --- BDD membres : sélection multiple et suppression groupée ---
  const memBoxes=()=>$$('.msel');
  function memSelSync(){
    const boxes=memBoxes(), n=boxes.filter(c=>c.checked).length;
    boxes.forEach(c=>c.closest('tr').classList.toggle('selrow',c.checked));
    const bar=$('#memSelBar');
    if(bar){ bar.hidden = n===0; const lab=$('#memSelN'); if(lab) lab.textContent=n; }
    const all=$('#memAll');
    // « indeterminate » : la case d'en-tête reflète une sélection partielle.
    if(all){ all.checked = n>0 && n===boxes.length; all.indeterminate = n>0 && n<boxes.length; }
  }
  memBoxes().forEach(c=>c.addEventListener('change',memSelSync));
  const memAll=$('#memAll');
  if(memAll) memAll.addEventListener('change',()=>{ memBoxes().forEach(c=>{c.checked=memAll.checked;}); memSelSync(); });
  const memClr=$('#memSelClear');
  if(memClr) memClr.addEventListener('click',()=>{ memBoxes().forEach(c=>{c.checked=false;}); memSelSync(); });
  const memDel=$('#memSelDel');
  if(memDel) memDel.addEventListener('click',()=>{
    // Tri décroissant : chaque splice ne décale que des indices déjà traités.
    const idx=memBoxes().filter(c=>c.checked).map(c=>+c.dataset.sel).sort((a,b)=>b-a);
    if(!idx.length) return;
    const noms=idx.slice().reverse().map(i=>(S.members[i]&&S.members[i].nom)||'(sans nom)');
    const apercu=noms.slice(0,10).map(n=>'\u2022 '+n).join('\n');

    if(!confirm('Supprimer '+idx.length+' membre(s) ?\n\n'+apercu+reste+'\n\nCette action est irréversible.')) return;
    idx.forEach(i=>{ memForget(S.members[i]); S.members.splice(i,1); });
    renderRes(); scheduleSave();
  });
  memSelSync();

function ensureCER(id){
  if(!S.cers) S.cers={};

function cerMiniPass(p){
  const cer=ensureCER(p.id);

  const base=(p.c2!=null?'C2 révisé':'C1 Alloué');
  const manuel=(+cer.approuvee||0)+(+cer.avenants||0);    // enveloppe CER saisie manuellement (prioritaire si > 0)
  const env=manuel>0?manuel:alloue;                        // SPE = budget alloué (ou enveloppe CER si renseignée)

/* ======================= Phasing budgétaire ======================= */
function projPhasing(p){ return (p.ph&&p.ph.b27&&p.ph.b27.some(v=>v))?p.ph.b27:null; }
function renderPhasing(){
  const scope=S.phScope||'__all__';
  const months=S.months;
  let series, title, act=0, c2tail=0;
  if(scope==='__all__'){
    series=Array(12).fill(0);
    PROJ().forEach(p=>{const ph=projPhasing(p); if(ph) ph.forEach((v,i)=>series[i]+=v); if(p.ph){act+=p.ph.act||0; c2tail+=(p.ph.c2tail||[]).reduce((a,b)=>a+b,0);} });
    title='Portefeuille — tous projets';
  } else {
    const p=S.projects.find(x=>x.id===scope)||{};
    series=projPhasing(p)||Array(12).fill(0);
    act=p.ph?p.ph.act||0:0; c2tail=p.ph?(p.ph.c2tail||[]).reduce((a,b)=>a+b,0):0;
    title=(p.shine?p.shine+' — ':'')+(p.nom||'');
  }
  const total=series.reduce((a,b)=>a+b,0);
  const cum=[]; series.reduce((a,b,i)=>{cum[i]=a+b;return cum[i];},0);
  const peak=series.indexOf(Math.max(...series));
  const phased=PROJ().filter(p=>projPhasing(p));
  const opts=`<option value="__all__" ${scope==='__all__'?'selected':''}>Portefeuille — tous projets</option>`+
    phased.map(p=>`<option value="${esc(p.id)}" ${p.id===scope?'selected':''}>${esc(p.shine?p.shine+' — ':'')}${esc(p.nom)}</option>`).join('');

  view.innerHTML=`
  <div class="sec-title"><h2>Phasing budgétaire</h2><span class="hint">CAPEX mensuel B27 (2027) · courbe en S · k€</span></div>
  <div class="toolbar"><select id="phSel" style="min-width:420px;max-width:640px">${opts}</select><span class="sp"></span>
    <span class="hint">${phased.length} projets phasés</span></div>
  <div class="kpis">
    <div class="tile a"><div class="lab">Total B27 phasé</div><div class="big">${fmt(total)}<span class="u">k€</span></div><div class="sub">exercice 2027</div></div>
    <div class="tile"><div class="lab">Pic mensuel</div><div class="big">${fmt(Math.max(0,...series))}<span class="u">k€</span></div><div class="sub">${months[peak]||''}</div></div>
    <div class="tile"><div class="lab">Réalisé 2026 (YTD)</div><div class="big">${fmt(act)}<span class="u">k€</span></div></div>
    <div class="tile c"><div class="lab">Forecast C2 fin 2026</div><div class="big">${fmt(c2tail)}<span class="u">k€</span></div><div class="sub">M08–M12</div></div>
  </div>
  <div class="panel"><div class="panel-h"><h3>Courbe en S — ${esc(title)}</h3><span class="meta">barres = mensuel · ligne = cumulé</span></div>
    <div class="panel-b" style="overflow-x:auto">${phasingSVG(series,cum,total,months)}</div></div>
  <div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Détail mensuel</h3><span class="meta">k€</span></div>
    <div class="tblwrap"><table class="heat"><thead><tr><th class="rname" style="position:sticky;left:0">Mesure</th>${months.map(m=>`<th class="num">${m}</th>`).join('')}<th class="num">Total</th></tr></thead>
    <tbody>
      <tr><td class="rname">Mensuel</td>${series.map(v=>`<td class="hc" style="background:${chargeColor(v/((Math.max(1,...series))||1))}">${v?fmt(v,0):''}</td>`).join('')}<td class="hc" style="font-weight:700">${fmt(total)}</td></tr>
      <tr><td class="rname">Cumulé</td>${cum.map(v=>`<td class="hc">${fmt(v,0)}</td>`).join('')}<td></td></tr>
    </tbody></table></div></div>
  ${footHTML('phasing',`Phasing · CAPEX B27 mensuel réel (Prépa C2-B26) · courbe en S = cumul.`)}`;
  $('#phSel').addEventListener('change',e=>{S.phScope=e.target.value;renderPhasing();});
}
function phasingSVG(series,cum,total,months){
  const W=760,H=240,padL=12,padR=12,padT=16,padB=28;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const n=series.length, slot=plotW/n, bw=slot*0.56;
  const maxM=Math.max(1,...series);
  let bars='',lbls=''; const pts=[];
  for(let i=0;i<n;i++){
    const x=padL+slot*i+slot*0.22;
    const bh=series[i]/maxM*plotH, y=padT+plotH-bh;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="2" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>`;
    lbls+=`<text x="${(padL+slot*i+slot/2).toFixed(1)}" y="${H-9}" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="var(--muted)">${months[i]}</text>`;
    pts.push([padL+slot*i+slot/2, padT+plotH-(total?cum[i]/total*plotH:0)]);
  }
  const poly=pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--copper)"/>`).join('');
  const last=pts[pts.length-1];
  return `<figure style="margin:0"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe en S du CAPEX phasé, barres mensuelles et ligne cumulée" style="width:100%;height:auto">

    ${bars}${lbls}
    <polyline points="${poly}" fill="none" stroke="var(--copper)" stroke-width="2"/>
    ${dots}
    <text x="${(last[0]-4).toFixed(1)}" y="${Math.max(12,last[1]-8).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="600" fill="var(--copper)">cumulé ${fmt(total)} k€</text>
  </svg></figure>`;
}

function parseFR(s){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(String(s||'').trim());if(!m)return null;let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);}
function isOverdue(s){const d=parseFR(s);return d? d<new Date(new Date().toDateString()):false;}
function derivePhase(p){const rg=realGatePhase(p.gateRealRaw); if(rg!=null) return rg;
  const s=norm(p.statut||'');
  if(s.includes('clotur')||s.includes('termin')||s.includes('migr')||s.includes('supprim')) return 5;
  if(s.includes('commission')) return 4;
  if(s.includes('travaux')) return 3;
  if(s==='apd'||s.includes(' apd')) return 2;
  if(s==='aps'||s.includes(' aps')) return 1;
  if(s.includes('cadrage')||s.includes('idee')||s.includes('evalu')) return 0;
  const ym=/(20\d\d)/.exec(p.nom||''); const y=ym?+ym[1]:0;
  if(y>=2028) return 0; if(y===2027) return 1;
  const c1=p.c1||0, act=p.act||0, conso=c1>0?act/c1:(act>0?1:0);
  if(conso>=0.95) return 5; if(conso>=0.6) return 4; if(conso>=0.25) return 3; if(conso>=0.05) return 2; return 1;}

function seedActions(){
  const out=[];
  try{ Object.values(SEED_PASSPORTS).forEach(pp=>{
    (pp.risks||[]).forEach(r=>out.push({origine:'Risque',projet:pp.code,desc:(r.desc||'')+(r.mit?(' — '+r.mit):''),pilote:r.owner||'',echeance:r.date||'',crit:'Haute',statut:'En cours'}));
  }); }catch(e){}
  return out;
}

function logChange(objet,champ,oldv,newv){
  if(String(oldv)===String(newv))return;
  if(!S.audit)S.audit=[];
  S.audit.unshift({ts:new Date().toISOString().slice(0,19).replace('T',' '),user:(S.user||'—'),objet:objet,champ:champ,old:String(oldv==null?'':oldv),neu:String(newv==null?'':newv)});
  if(S.audit.length>800)S.audit.length=800;
}

/* ---------- Scénarios What-if ---------- */
function scnFinBand(p,cut){
  const c1=p.c1||0; let c2=(p.c2!=null?p.c2:p.c1)||0; c2=c2*(1-cut/100);
  if(!c1&&!c2) return 'g';
  const dev=c1?Math.abs((c2-c1)/c1)*100:0; let score=100-Math.min(50,dev*2);
  const conso=c1?(p.act||0)/c1*100:0; if(conso>100)score-=Math.min(30,conso-100);
  return score>=75?'g':score>=55?'a':'r';
}
function renderScenario(){
  const sc=S.scenario; const q=sc.q||'';
  const included=PROJ().filter(p=>!sc.excluded[p.id]);
  const baseCapex=PROJ().reduce((a,p)=>a+((p.c2!=null?p.c2:p.c1)||0),0);
  const scnCapex=included.reduce((a,p)=>a+(((p.c2!=null?p.c2:p.c1)||0)*(1-sc.budgetCut/100)),0)
                 + sc.added.reduce((a,x)=>a+(+x.budget||0)*(1-sc.budgetCut/100),0);
  const months=S.months;

/* ======================= Extensions — actif / UO / GED / CDO-CdC ======================= */
/* ---- vrai cycle de vie : parse de la colonne Gate réelle ---- */
function realGatePhase(raw){
  const s=norm(raw); if(!s) return null;
  if(/g\s*5|gate\s*5|clotur/.test(s)) return 5;
  if(/g\s*4|gate\s*4|commission/.test(s)) return 4;
  if(/g\s*3|gate\s*3|travaux/.test(s)) return 3;
  if(/g\s*2|gate\s*2/.test(s)) return 2;
  if(/0\/1|g\s*1|gate\s*1|g\s*0\/1|aps/.test(s)) return 1;
  if(/g\s*0|gate\s*0|cadrage/.test(s)) return 0;
  if(/^\d+$/.test(s)){const n=+s; if(n>=0&&n<=5) return n;}
  return null; // "oui/non/na" → non concluant → proxy budgétaire
}
function matchGateCdo(p){
  const G=(typeof SEED_GATECDO!=='undefined')?SEED_GATECDO:{byShine:{},byName:{},byIshift:{}};
  return (p.shine&&G.byShine[p.shine]) || (p.ishift&&G.byIshift[p.ishift]) || (p.nom&&G.byName[norm(p.nom)]) || null;
}
function isActif(p){
  if(!/^P\d{5,}/.test(p.shine||'')) return false;
  const n=norm(p.nom);
  if(!n||n.includes('total')||n.includes('#ref')||n.includes('a creer')||n.includes('vide')) return false;
  if(((p.c2!=null?p.c2:p.c1)||0)<=0) return false;      // budget revise actif
  if(derivePhase(p)>=5) return false;                    // exclut cloture
  const ym=/(20\d\d)/.exec(p.nom||''); const y=ym?+ym[1]:0;
  if(y && y<2025) return false;                          // portefeuille courant (>=2025)
  return true;
}
/* Trois états pour un projet : vivant, archivé (actif=false, écarté par la
   case « Projets actifs ») et en corbeille (deleted, écarté de partout mais
   conservé dans le fichier, donc restaurable). Aucune suppression n'est
   définitive sans un passage par la corbeille. */
function PROJ(){ const v=S.projects.filter(p=>!p.deleted); return S.activeOnly? v.filter(p=>p.actif) : v; }
/* Doublons : même code SHINE ou même intitulé, aux accents et à la ponctuation
   près. Renvoie les rangs dans S.projects — deux projets de même code portent
   le même id, lequel ne les distinguerait donc pas. */
function doublonInfo(){
  const parCode={}, parNom={}, info=new Map();
  S.projects.forEach((p,i)=>{
    if(p.deleted) return;                       // la corbeille ne compte pas
    const c=norm(p.shine).replace(/[^a-z0-9]/g,''); if(c) (parCode[c]=parCode[c]||[]).push(i);
    const n=norm(p.nom).replace(/[^a-z0-9]/g,''); if(n) (parNom[n]=parNom[n]||[]).push(i);
  });
  const noter=(groupes,quoi)=>Object.keys(groupes).forEach(k=>{
    const l=groupes[k]; if(l.length<2) return;
    l.forEach(i=>{ const e=info.get(i)||{code:[],nom:[]}; e[quoi]=l.filter(j=>j!==i); info.set(i,e); });
  });
  noter(parCode,'code'); noter(parNom,'nom');
  return info;
}
function doublonIdx(){ return new Set(doublonInfo().keys()); }
/* Ce que dit la marque : sur quoi porte la collision, et avec quel projet. Un
   doublon dont on ne voit pas le jumeau — archivé, ou plus bas dans une liste
   filtrée — n'est qu'une énigme. */
function doublonLib(e){
  if(!e) return null;
  const etiq = (e.code.length && e.nom.length) ? 'même code et même intitulé'
             : e.code.length ? 'même code SHINE' : 'même intitulé';
  const court = (e.code.length && e.nom.length) ? 'doublon'
             : e.code.length ? 'même code' : 'même intitulé';
  const jumeaux=[...new Set(e.code.concat(e.nom))].map(j=>{

/* Choisir un projet en le cherchant, plutot qu'en le deroulant : le
   portefeuille compte trop de lignes pour une liste deroulante. Chaque mot
   saisi doit se retrouver quelque part dans la fiche — code SHINE, intitule,
   pole, secteur, PM ou PL — accents et casse indifferents. */
function projSearch(q){
  const mots=norm(q).split(/\s+/).filter(Boolean);
  const tous=(S.projects||[]).filter(p=>p.shine);
  if(!mots.length) return tous;
  return tous.filter(p=>{
    const t=norm([p.shine,p.nom,p.pole,p.group,p.secteur,p.pm,p.pl,p.ishift,p.sponsor].join(' '));
    return mots.every(m=>t.includes(m));
  });
}

    }).join('')
      : (!roster.length
        ? `<div class="empty" style="padding:16px;line-height:1.5">Le référentiel est vide. Renseignez-le dans <b>Capacité › BDD Membres</b>, ou saisissez un nom libre.</div>`
        : `<div class="empty" style="padding:16px">Personne ne correspond à &laquo; ${esc(q.value)} &raquo;.</div>`);
    L.querySelectorAll('[data-nom]').forEach(b=>b.onclick=()=>{ ov.remove(); onPick(b.dataset.nom); });
  };
  q.oninput=dessiner; dessiner();
  ov.querySelector('[data-mk="none"]').onclick=()=>{ ov.remove(); onPick(''); };
  ov.querySelector('[data-mk="libre"]').onclick=()=>{
    const v=prompt('Nom de la personne (hors référentiel) :', courant||'');
    if(v==null) return; ov.remove(); onPick(v.trim());
  };
  ov.querySelector('[data-mk="close"]').onclick=()=>ov.remove();
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ ov.remove(); return; }

}

// Chargement a la demande de SheetJS (lecture .xls/.xlsx). Repli si indisponible (hors-ligne/bloque).

// Affiche un classeur Excel sous forme de tableau (onglets de feuilles)
async function renderSheet(body,d,mime,name){
  body.innerHTML='<div style="margin:auto;color:var(--muted);font-size:13px">Lecture du tableur…</div>';
  const XL=await loadXLSX();
  const buf=await (await fetch(d.file.data)).arrayBuffer();
  const wb=XL.read(buf,{type:'array'});
  const names=wb.SheetNames||[];
  if(!names.length) throw new Error('classeur vide');
  body.innerHTML='<div class="xlsview"><div class="xlsbar"></div><div class="xlswrap"></div></div>';
  const bar=body.querySelector('.xlsbar'), wrap=body.querySelector('.xlswrap');

    wrap.innerHTML=XL.utils.sheet_to_html(wb.Sheets[names[k]],{editable:false});
    [...bar.children].forEach((b,j)=>b.classList.toggle('on',j===k));
    wrap.scrollTop=0; wrap.scrollLeft=0;
  };
  names.forEach((n,k)=>{ const b=document.createElement('button'); b.className='xlstab'; b.textContent=n;
    b.onclick=()=>show(k); bar.appendChild(b); });
  if(names.length===1) bar.style.display='none';

async function gedOpen(i){
  const d=S.ged[i]; if(!d) return;
  const name=(d.file&&d.file.name)||((d.code||'document')+'.html');
  const mime=(d.file&&(d.file.mime||''))||'text/html';
  const ov=document.createElement('div'); ov.className='gmodal';
  ov.innerHTML=`<div class="gmbox">
      <div class="gmhead"><h4>${esc(name)}</h4>
        <span class="gmeta">${esc(d.code||'')}${d.version?(' · v'+esc(d.version)):''}${d.file?(' · '+fmtSize(d.file.size)):''}</span>
        <button class="iconbtn" data-gm="dl">⭳ Télécharger</button>
        <button class="iconbtn" data-gm="close">✕ Fermer</button></div>
      <div class="gmbody"></div></div>`;
  document.body.appendChild(ov);
  const body=ov.querySelector('.gmbody');
  let objUrl=null;
  const close=()=>{ if(objUrl) URL.revokeObjectURL(objUrl); ov.remove(); document.removeEventListener('keydown',onEsc); };
  const onEsc=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',onEsc);
  ov.addEventListener('click',e=>{ const a=e.target.dataset?e.target.dataset.gm:null;
    if(e.target===ov||a==='close') close(); else if(a==='dl') gedDownload(i); });
  try{
    if(!d.file){ // document HTML créé depuis un modèle
      const f=document.createElement('iframe'); f.srcdoc='<!DOCTYPE html><meta charset="UTF-8">'+(d.html||'<p style="font-family:sans-serif;color:#666">(document vide)</p>'); body.appendChild(f);
    } else {
      let src=d.file.data;
      try{ const b=await (await fetch(d.file.data)).blob(); objUrl=URL.createObjectURL(new Blob([b],{type:mime||b.type||'application/octet-stream'})); src=objUrl; }catch(_){}
      if(/^image\//.test(mime)){ const im=document.createElement('img'); im.src=src; body.appendChild(im); }
      else if(/^video\//.test(mime)){ const v=document.createElement('video'); v.src=src; v.controls=true; body.appendChild(v); }
      else if(/^audio\//.test(mime)){ const a2=document.createElement('audio'); a2.src=src; a2.controls=true; body.appendChild(a2); }
      else if(/^(application\/pdf|text\/)/.test(mime)||/\.(pdf|txt|html?|svg)$/i.test(name)){ const f=document.createElement('iframe'); f.src=src; body.appendChild(f); }
      else if(/wordprocessingml/i.test(mime)||/\.docx$/i.test(name)){
        try{ await renderDocx(body,d); }
        catch(err){ body.innerHTML=`<div style="margin:auto;padding:28px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6">
            Impossible d'afficher ce document Word (${esc(err.message)}).<br>La lecture .docx nécessite un accès Internet la première fois.<br><br>
            Utilisez <b>⭳ Télécharger</b> pour l'ouvrir dans Word.</div>`; } }
      else if(/sheet|excel|ms-excel|spreadsheet/i.test(mime)||/\.(xls|xlsx|xlsm|xlsb|csv|ods)$/i.test(name)){
        try{ await renderSheet(body,d,mime,name); }
        catch(err){ body.innerHTML=`<div style="margin:auto;padding:28px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6">
            Impossible d'afficher ce tableur (${esc(err.message)}).<br>La lecture .xls/.xlsx nécessite un accès Internet la première fois.<br><br>
            Utilisez <b>⭳ Télécharger</b> pour l'ouvrir dans Excel.</div>`; } }
      else { body.innerHTML=`<div style="margin:auto;padding:28px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6">
          Le navigateur ne sait pas afficher ce format<br><b style="color:var(--ink)">${esc(mime||d.type||'inconnu')}</b><br><br>
          Utilisez <b>⭳ Télécharger</b> pour l'ouvrir dans Word / Excel / PowerPoint.</div>`; }
    }
    logChange('GEDT '+(d.code||''),'ouverture','',name);
  }catch(e){ body.innerHTML=`<div style="margin:auto;padding:28px;color:var(--bad)">Impossible d'ouvrir ce document : ${esc(e.message)}</div>`; }
}
/* Televersement en vrac : plusieurs fichiers d'un coup, sans projet impose.
   Le tri vient ensuite, par selection dans le registre. */
function gedUpload(){
  const f=S.gedFilter||{}; S.gedFilter=f;
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true;
  inp.onchange=()=>{
    const files=Array.from(inp.files||[]); if(!files.length) return;
    const mo=files.reduce((a,x)=>a+x.size,0)/1048576;
    if(mo>8 && !confirm(files.length+' fichier(s), '+mo.toFixed(1)+' Mo au total. Les intégrer alourdira la sauvegarde du fichier de suivi. Continuer ?')) return;
    const sous=f.sousens||'Divers';     // sans sous-ensemble choisi, le vrac va dans « Divers »
    let reste=files.length; const ajoutes=[];
    const fin=()=>{
      f.q=''; f.fav=false; f.arch=false; f.trash=false;
      renderGED(); scheduleSave();
      alert('✓ '+ajoutes.length+' document(s) ajouté(s) dans « '+sous+' »'
        +(f.proj?(' — projet '+f.proj+'.'):'.\n\nAucun projet associé : cochez-les dans le registre, puis « 🔗 Lier à un projet » pour les rattacher.'));
    };
    files.forEach(file=>{
      const rd=new FileReader();
      rd.onload=()=>{
        S.ged.unshift({code:(file.name.replace(/\.[^.]+$/,'').slice(0,40))||('DOC-'+(S.ged.length+1)),projet:f.proj||'',sousens:sous,rubrique:f.rubrique||'',phase:f.phase||'APD',dossier:'10_ETUDES',type:(file.name.split('.').pop()||'').toUpperCase(),version:'A',statut:'Draft',auteur:S.user||'',date:new Date().toLocaleDateString('fr-FR'),fav:false,archived:false,file:{name:file.name,mime:file.type,size:file.size,data:rd.result},html:null});
        ajoutes.push(file.name);
        logChange('GEDT '+file.name,'téléversement','',fmtSize(file.size));
        if(--reste===0) fin();
      };
      rd.onerror=()=>{ if(--reste===0) fin(); };
      rd.readAsDataURL(file);
    });
    f.sousens=sous;
  };
  inp.click();
}
