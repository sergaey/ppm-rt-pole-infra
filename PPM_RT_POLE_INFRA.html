/* ---- Macroplanning ---- */
let kitAxe={start:0,end:0};
function kitMacro(k){
  const dd=s=>Date.parse(s+'T00:00:00Z');
  const ok=k.tasks.filter(t=>t.start&&t.end&&t.end>=t.start);
  const dates=[...ok.flatMap(t=>[dd(t.start),dd(t.end)]), ...k.milestones.filter(m=>m.date&&Number.isFinite(dd(m.date))).map(m=>dd(m.date))];
  let lo,hi;
  if(dates.length){ lo=Math.min(...dates); hi=Math.max(...dates); }
  else { lo=Date.now(); hi=lo+864e5*365; }
  const s0=new Date(lo); s0.setUTCDate(1); const e0=new Date(hi); e0.setUTCMonth(e0.getUTCMonth()+1,1);
  const A=+s0, B=+e0; kitAxe={start:A,end:B};
  const pc=v=>(v-A)/(B-A)*100;
  const mois=[]; for(let m=new Date(A); +m<B; m.setUTCMonth(m.getUTCMonth()+1)) mois.push(new Date(m));
  const lignesMois=mois.map(m=>`<i class="kmonth" style="left:${pc(+m)}%"></i>`).join('');
  let g=`<div class="kaxis">${mois.map(m=>{const n=new Date(m);n.setUTCMonth(n.getUTCMonth()+1);
      return `<div style="width:${pc(+n)-pc(+m)}%">${m.toLocaleDateString('fr-FR',{month:'short',year:'2-digit',timeZone:'UTC'})}</div>`;}).join('')}</div>`;
  k.milestones.forEach((m,i)=>{ const pose=m.date&&Number.isFinite(dd(m.date));
    g+=`<div class="krow" data-kms-lane="${i}">${lignesMois}
      <button class="kms${pose?'':' libre'}" data-kms="${i}" style="left:${pose?pc(dd(m.date))+'%':'0'}" title="${esc(m.name)}${pose?' · '+esc(m.date):' — sans date : glissez-le sur la frise ou saisissez la date ci-dessous'}">
      <i></i><span>${esc(m.name)}${pose?' · '+new Date(dd(m.date)).toLocaleDateString('fr-FR',{timeZone:'UTC'}):''}</span></button></div>`; });
  k.tasks.forEach(t=>{
    if(!(t.start&&t.end&&t.end>=t.start)){ g+=`<div class="krow"><span class="knodate">${esc(t.name)} · dates à renseigner</span></div>`; return; }
    const l=pc(dd(t.start)), w=Math.max(.4, pc(dd(t.end)+864e5)-l);
    g+=`<div class="krow">${lignesMois}<div class="kbar ${esc(t.kind||'activity')}" style="left:${l}%;width:${w}%">
      <i style="width:${+t.progress||0}%"></i><span><b>${+t.progress||0} %</b> ${esc(t.name)}</span></div></div>`; });
  if(!k.tasks.length && !k.milestones.length) g+=`<div class="krow"><span class="knodate">Aucune activité ni jalon — ajoutez-en ci-dessous.</span></div>`;
  let h=`<div class="kgantt">${g}</div>
    <div class="klegend"><span><i style="background:var(--accent)"></i>Activité</span>
      <span><i style="background:#b0651f"></i>Coordination</span>
      <span><i style="background:#7d4f9e"></i>Gate</span>
      <span><i style="background:var(--copper);transform:rotate(45deg)"></i>Jalon — glissable</span></div>
    <div class="kbar-tools" style="margin-top:14px"><b>Activités</b>${kbtn('addTask','+ Activité')}</div>
    <table class="ktbl"><thead><tr><th>Activité</th><th style="width:118px">Début</th><th style="width:118px">Fin</th>
      <th style="width:120px">Type</th><th style="width:80px">Avanc. %</th><th style="width:120px">Pilote</th><th style="width:26px"></th></tr></thead><tbody>`;
  k.tasks.forEach((t,i)=>{ const p=`tasks.${i}`;
    h+=`<tr><td>${kinp(p+'.name')}</td><td>${kinp(p+'.start','date','data-kr="macro"')}</td><td>${kinp(p+'.end','date','data-kr="macro"')}</td>
      <td><select class="kin" data-kp="${p}.kind" data-kr="macro">${KIT_KINDS.map(([v,l])=>`<option value="${v}" ${v===(t.kind||'activity')?'selected':''}>${l}</option>`).join('')}</select></td>
      <td>${kinp(p+'.progress','number','data-kr="macro"')}</td><td>${kinp(p+'.owner')}</td>
      <td><button class="kdel" data-ka="delTask|${i}">✕</button></td></tr>`; });
  if(!k.tasks.length) h+=`<tr><td colspan="7" class="empty">Aucune activité.</td></tr>`;
  h+=`</tbody></table>
    <div class="kbar-tools" style="margin-top:14px"><b>Jalons du process ingénierie</b>${kbtn('addMs','+ Jalon')}</div>
    <table class="ktbl"><thead><tr><th>Jalon</th><th style="width:140px">Date</th><th style="width:140px">Pilote</th><th>Commentaires</th><th style="width:26px"></th></tr></thead><tbody>`;
  k.milestones.forEach((m,i)=>{ const p=`milestones.${i}`;
    h+=`<tr><td>${kinp(p+'.name','text','data-kr="macro"')}</td><td>${kinp(p+'.date','date','data-kr="macro"')}</td>
      <td>${kinp(p+'.owner')}</td><td>${kta(p+'.notes')}</td>
      <td><button class="kdel" data-ka="delMs|${i}">✕</button></td></tr>`; });
  if(!k.milestones.length) h+=`<tr><td colspan="5" class="empty">Aucun jalon.</td></tr>`;
  return h+'</tbody></table>';
}
/* ---- Synthèse du kit, reprise dans la fiche projet ---- */
function kitSynthese(k){
  const all=k.phases.flatMap(p=>p.rows), fait=all.filter(r=>r.status==='Fait').length;
  const net=Math.max(1,all.length-all.filter(r=>r.status==='NA').length);
  const bud=ksum(k.budgetGroups.flatMap(g=>g.rows.map(r=>(+r.y1||0)+(+r.y2||0))))+kitDnd(k,'y1')+kitDnd(k,'y2');
  const fte=ksum(k.groups.flatMap(g=>g.rows.flatMap(r=>r.values)));
  const jal=k.milestones.filter(m=>m.date).length;
  return {av:Math.round(fait/net*100), actions:all.length, fait, bud, fte, jours:fte*k.jpf,
          equipe:k.people.filter(p=>String(p.name||'').trim()).length, jal, nbJal:k.milestones.length,
          taches:k.tasks.length};
}

/* ======================= One Page projet =======================
   Reprise de l'outil « One Page Projet — CSD » : la page unique de revue,
   avec sa frise WBS, son statut projet, ses jalons, son budget par exercice,
   ses réalisations, ses risques et ses prochaines étapes.

   Harmonisation plutôt que duplication : les jalons, les risques, les
   prochaines étapes et le commentaire de statut sont ceux de la fiche projet —
   saisis ici, ils s'affichent là, et inversement. Le statut projet pilote le
   forçage de santé du portefeuille. Seuls la frise WBS, le budget par exercice
   et les réalisations sont propres à cette vue. */
const OP_BARC=["#16a34a","#f59e0b","#14b8a6","#ec4899","#3b82f6","#8b5cf6","#a78bfa","#eab308","#ef4444","#64748b"];
const OP_MSC =["#8b5cf6","#ef4444","#f59e0b","#16a34a","#14b8a6","#3b82f6","#eab308","#64748b"];
const OP_ST=["Done","WIP","Not started","Late"];
const OP_PROG=["Done","In progress","Late","Not started"];
const OP_STATUSES=[{k:'ok',c:'ok',l:'On Track',h:'g'},
                   {k:'att',c:'att',l:"Attention point\nadditional actions required",h:'a'},
                   {k:'risk',c:'risk',l:'At Risk, strong action required',h:'r'}];
const opISO=d=>{const z=new Date(d);return isNaN(z)?'':z.toISOString().slice(0,10);};
const opD=s=>{const t=Date.parse(String(s||'')+'T00:00:00Z');return Number.isFinite(t)?t:null;};
const opFR=s=>{const t=opD(s);return t==null?'':new Date(t).toLocaleDateString('fr-FR',{timeZone:'UTC'});};
/* Le volet One Page d'un projet, créé à la première ouverture. Le budget part
   des montants déjà connus du portefeuille : les ressaisir n'aurait aucun sens. */
function opOf(id){
  const k=kitOf(id); const p=S.projects.find(x=>x.id===id)||{};
  if(!k.op){
    const an='Capex '+new Date().getFullYear();
    k.op={ wbs:[{id:kuid(),type:'milestones',name:'RT Process Ingénierie',milestones:[],status:''},
                {id:kuid(),type:'bar',name:'Études',start:'',end:'',label:'',color:OP_BARC[4],status:'WIP'}],
      budget:{years:[an],rows:[
        {id:kuid(),label:'Budget',values:[+p.c1||0]},
        {id:kuid(),label:'YTD Commit.',values:[+p.commit||0]},
        {id:kuid(),label:'Spent',values:[+p.act||0]},
        {id:kuid(),label:'Final Cost',values:[Math.round(atterrissage(p))],total:true}]},
      ach:[], endMarker:'', todayMarker:'' };
  }
  const o=k.op;
  o.wbs=Array.isArray(o.wbs)?o.wbs:[]; o.ach=Array.isArray(o.ach)?o.ach:[];
  o.budget=o.budget||{years:[],rows:[]};
  o.budget.years=Array.isArray(o.budget.years)?o.budget.years:[];
  o.budget.rows=Array.isArray(o.budget.rows)?o.budget.rows:[];
  o.budget.rows.forEach(r=>{ r.values=Array.isArray(r.values)?r.values:[];
    while(r.values.length<o.budget.years.length) r.values.push(0); r.values.length=o.budget.years.length; });
  o.wbs.forEach(r=>{ if(r.type==='milestones') r.milestones=Array.isArray(r.milestones)?r.milestones:[]; });
  return o;
}
/* Fenêtre de la frise : toutes les dates du WBS, arrondies au mois. */
function opRange(o){
  const ds=[];
  o.wbs.forEach(r=>{ if(r.type==='bar'){ [r.start,r.end].forEach(x=>{const t=opD(x); if(t!=null)ds.push(t);}); }
    else (r.milestones||[]).forEach(m=>{const t=opD(m.date); if(t!=null)ds.push(t);}); });
  [o.endMarker,o.todayMarker].forEach(x=>{const t=opD(x); if(t!=null)ds.push(t);});
  let lo,hi;
  if(ds.length){ lo=Math.min(...ds); hi=Math.max(...ds); }
  else { const n=new Date(); lo=Date.UTC(n.getFullYear(),n.getMonth(),1); hi=lo+864e5*180; }
  const s=new Date(lo), e=new Date(hi);
  // Une fenêtre collée aux dates ne laisse rien glisser : la barre occuperait
  // toute la largeur. On respire d'un mois de part et d'autre, et la fenêtre
  // se fixe à la main quand la revue demande un cadre précis.
  s.setUTCDate(1); s.setUTCMonth(s.getUTCMonth()-1);
  e.setUTCMonth(e.getUTCMonth()+2,1);
  const d1=opD(o.ganttStart), d2=opD(o.ganttEnd);
  const S1=(d1!=null)?new Date(Date.UTC(new Date(d1).getUTCFullYear(),new Date(d1).getUTCMonth(),1)):s;
  const S2=(d2!=null)?new Date(Date.UTC(new Date(d2).getUTCFullYear(),new Date(d2).getUTCMonth()+1,1)):e;
  const a=+S1, b=(+S2>+S1)?+S2:(+S1+864e5*30);
  return {s:a,e:b,span:b-a};
}
const opPct=(v,r)=>{const t=opD(v); return t==null?null:((t-r.s)/r.span*100);};
function opMonths(r){
  const out=[]; for(let m=new Date(r.s); +m<r.e; m.setUTCMonth(m.getUTCMonth()+1))
    out.push({m:m.getUTCMonth(),y:m.getUTCFullYear(),q:Math.floor(m.getUTCMonth()/3)+1});
  return out;
}
const OP_MOIS=['J','F','M','A','M','J','J','A','S','O','N','D'];

/* Glisser une barre ou un jalon : le geste de l'outil d'origine, conservé. */
function opArmer(){
  const id=S.currentProj, o=opOf(id), r=opRange(o);
  $$('#kitPane [data-opbar]').forEach(bar=>{
    bar.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      const i=+bar.dataset.opbar, w=o.wbs[i], zone=bar.parentElement;
      const x0=e.clientX, l0=parseFloat(bar.style.left), lg=parseFloat(bar.style.width);
      let bouge=false;
      const mv=ev=>{ const rr=zone.getBoundingClientRect();
        const d=(ev.clientX-x0)/rr.width*100;
        if(Math.abs(ev.clientX-x0)>3) bouge=true;
        bar.style.left=Math.max(0,Math.min(100-lg,l0+d))+'%'; };
      const up=ev=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
        if(!bouge) return;
        const nl=parseFloat(bar.style.left);
        w.start=opISO(new Date(r.s+nl/100*r.span)); w.end=opISO(new Date(r.s+(nl+lg)/100*r.span));
        logChange('WBS '+(w.name||''),'dates','',w.start+' → '+w.end);
        scheduleSave(); renderKit(); };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    });
  });
  $$('#kitPane [data-opdia]').forEach(d=>{
    d.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      const [i,j]=d.dataset.opdia.split('|').map(Number), m=o.wbs[i].milestones[j], zone=d.parentElement;
      const mv=ev=>{ const rr=zone.getBoundingClientRect();
        const x=Math.min(1,Math.max(0,(ev.clientX-rr.left)/rr.width));
        const y=Math.min(1,Math.max(0,(ev.clientY-rr.top)/rr.height));
        d.style.left=(x*100)+'%'; d.style.top=Math.round(y*52)+'px';
        d.dataset.d=opISO(new Date(r.s+x*r.span)); d.dataset.t=Math.round(y*100); };
      const up=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
        if(d.dataset.d){ m.date=d.dataset.d; m.topPct=+d.dataset.t; scheduleSave(); renderKit(); } };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    });
  });
}
/* Saisie du volet One Page : textes au blur, dates et nombres à la volée. */
document.addEventListener('blur',e=>{

  else { const c=b.split('.'), last=c.pop();

    if(racine) racine[last]=(/values|y[12]/.test(last)? (+v||0) : v); }
  scheduleSave();
},true);
document.addEventListener('input',e=>{
  const t=e.target, p=t.dataset&&t.dataset.opd; if(!p) return;
  const o=opOf(S.currentProj), c=p.split('.'), last=c.pop();
  const racine=c.length?c.reduce((x,k)=>x&&x[k],o):o;
  if(!racine) return;
  racine[last]= t.type==='number' ? (parseFloat(String(t.value).replace(',','.'))||0) : t.value;
  scheduleSave();
  if(t.dataset.opr) renderKitGarde(); else if(t.type!=='number') renderKit();
});
document.addEventListener('change',e=>{

document.addEventListener('click',e=>{

       w.milestones.push({id:kuid(),date:opISO(new Date(r.s+r.span/2)),label:'Jalon',sub:'',color:OP_MSC[w.milestones.length%8],topPct:15}); },
     addYear:()=>{ o.budget.years.push('Capex '+(new Date().getFullYear()+o.budget.years.length));
       o.budget.rows.forEach(r=>r.values.push(0)); },
     delBudRow:()=>o.budget.rows.splice(n[0],1),

     addNs:()=>pp.nextSteps.push({t:'Nouvelle étape',st:'À faire'})

  scheduleSave(); renderKit();

/* ======================= CSD — Comité Schéma Directeur =======================
   Reprise de l'outil « Comité Schéma Directeur » : la revue de portefeuille
   telle qu'elle se tient en comité — cartes de synthèse, alertes, fiches ou
   liste, par pôle, avec les champs de suivi propres au comité (CDO, SPE, CER,
   process ingénierie, étape, délais, sujets, responsables).

   Le portefeuille est celui de la plateforme : un projet y est un projet, et
   non une ligne recopiée. Les champs du comité vivent dans S.csd[idProjet] ;
   les montants, le pôle et l'intitulé restent ceux du projet. */
const CSD_ST=["On Track","Risque","Focus","Bloquant","En évaluation","En attente","Terminé","Clôturé","Dépriorisé","Migré en projet","En cours","Retard","OK"];
const CSD_ROUGE=["bloquant","focus"], CSD_RISQUE=["bloquant","focus","risque","retard","en attente"];
const CSD_OK=["on track","ok","vert","en cours"], CSD_FIN=["termine","termine","cloture","clôturé","terminé"];
const CSD_CHAMPS=[["etu","ETU"],["wbsInv","WBS | INV"],["localisation","Localisation"],["engineering","Engineering"],
  ["initiateur","Initiateur"],["etape","Étape"],["cdo","CDO"],["spe","SPE"],["cer","CER"],["rtProcess","RT Process Ingénierie"],
  ["responsables","Responsables"],["delais","Délais"],["dateDebut","Date de début"],["dateFin","Date de fin"]];
const CSD_LONGS=[["sujets","Sujets"],["actionSuivi","Action de suivi"],["remarques","Remarques"],["commentaires","Commentaires"]];
function csdOf(id){ S.csd=S.csd||{}; if(!S.csd[id]) S.csd[id]={}; return S.csd[id]; }
function csdStatut(p){ const c=csdOf(p.id); return c.statut||p.statut||''; }
function csdConf(st){
  const s=norm(st);
  if(CSD_ROUGE.includes(s)) return {b:'var(--bad)',i:'⛔',bg:'var(--bad)'};
  if(CSD_RISQUE.includes(s)) return {b:'var(--warn)',i:'⚠',bg:'var(--warn)'};
  if(CSD_FIN.includes(s)) return {b:'var(--muted)',i:'✓',bg:'var(--muted)'};
  if(CSD_OK.includes(s)) return {b:'var(--good)',i:'✓',bg:'var(--good)'};
  return {b:'var(--line-2)',i:'•',bg:'var(--faint)'};
}
/* « Délais » porte une date : on en tire le retard, comme en comité. */
function csdDelai(p){
  const c=csdOf(p.id), t=String(c.delais||'');
  const m=t.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
  if(!m) return null;
  const an=+m[3]<100?2000+ +m[3]:+m[3];
  const d=Date.UTC(an,+m[2]-1,+m[1]);
  const j=Math.round((d-Date.now())/864e5);
  if(j<0) return {lb:Math.abs(j)+' j de retard',c:'var(--bad)',bg:'var(--bad-soft)',urgent:true};
  if(j<=15) return {lb:'échéance dans '+j+' j',c:'var(--warn)',bg:'var(--warn-soft)',urgent:true};
  return {lb:'échéance dans '+j+' j',c:'var(--good)',bg:'var(--good-soft)',urgent:false};
}
function csdFiltres(){ S.csdF=S.csdF||{q:'',st:'all',vue:'grid',pole:''}; return S.csdF; }
function csdListe(){
  const f=csdFiltres(), q=norm(f.q);
  return PROJ().filter(p=>{
    const c=csdOf(p.id);
    if(f.pole && p.group!==f.pole) return false;
    if(f.st!=='all' && norm(csdStatut(p))!==norm(f.st)) return false;
    if(!q) return true;
    return norm([p.shine,p.nom,p.pm,p.pl,c.etu,c.localisation,c.initiateur,c.etape,c.responsables,c.sujets].join(' ')).includes(q);
  });
}
function csdCarte(p){
  const c=csdOf(p.id), cf=csdConf(csdStatut(p)), d=csdDelai(p);
  const dates=(c.dateDebut||c.dateFin)?`<div class="rw"><span>📅 ${esc(c.dateDebut||'—')} → ${esc(c.dateFin||'—')}</span></div>`:'';
  const del=d?`<div class="dl" style="background:${d.bg};color:${d.c}">⏱ ${d.lb}${d.urgent?' ⚠':''}</div>`
            :(c.delais?`<div class="rw" style="color:var(--muted)">🕐 ${esc(c.delais)}</div>`:'');
  return `<div class="pcard" style="border-left-color:${cf.b}" data-csdp="${esc(p.id)}">
    <div class="tr"><div class="ti">${esc(c.etu||p.shine||'—')} – ${esc(p.nom)}</div>
      <div class="dot" style="background:${cf.bg}" title="${esc(csdStatut(p)||'—')}">${cf.i}</div></div>
    <div class="bd">

      <div class="rw"><span>💰 ${p.c1?fmt(p.c1)+' k€':'—'}</span><span style="font-weight:600">${esc(c.etape||p.statut||'—')}</span></div>
      <div>👤 ${esc(c.initiateur||p.pm||'—')}</div>${dates}${del}
    </div></div>`;
}
function csdLigne(p){
  const c=csdOf(p.id), cf=csdConf(csdStatut(p)), d=csdDelai(p);
  return `<div class="plist" data-csdp="${esc(p.id)}">
    <div class="dot" style="background:${cf.b}"></div>
    <div style="flex:1;min-width:0"><div class="n">${esc(c.etu||p.shine||'—')} – ${esc(p.nom)}</div>
      <div class="s">${esc(c.localisation||p.secteur||'—')} • ${esc(c.etape||p.statut||'—')}</div></div>
    <span class="s">${p.c1?fmt(p.c1)+' k€':'—'}</span>
    ${d?`<span class="dl" style="background:${d.bg};color:${d.c}">${d.lb}</span>`:''}
    <span class="bg2">${esc(csdStatut(p)||'—')}</span></div>`;
}
function renderCSD(){

    <select id="csdPole"><option value="">Tous pôles</option>${poles.map(g=>`<option ${f.pole===g?'selected':''}>${esc(g)}</option>`).join('')}</select>

/* Import d'un fichier CSD : les tableaux de données y sont des littéraux
   JavaScript (INFRA_RAW, EE_RAW…). On les lit sans exécuter le fichier. */
function csdImporter(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.html,.htm,.json';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let lots=[];
      const t=String(rd.result||'');
      try{
        const j=JSON.parse(t);
        lots=Array.isArray(j)?[j]:Object.values(j).filter(Array.isArray);
      }catch(_){ lots=csdTableaux(t); }
      const lignes=lots.flat().filter(x=>x&&typeof x==='object');
      if(!lignes.length){ alert("Aucun tableau de projets reconnu dans ce fichier.\n\nAttendu : un export CSD (HTML contenant INFRA_RAW, EE_RAW…) ou un JSON de projets."); return; }
      csdAppliquer(lignes, f.name);
    };
    rd.readAsText(f);
  };
  inp.click();
}
/* Les tableaux du CSD sont des littéraux JavaScript, parfois tenus sur une
   seule ligne de 80 Ko : une expression régulière s'y perd d'un tableau à
   l'autre. On suit les crochets, en ignorant ceux qui sont dans une chaîne. */
function csdTableaux(t){
  const out=[], re=/const\s+[A-Za-z0-9_]*RAW\s*=\s*\[/g; let m;
  while((m=re.exec(t))){
    const deb=m.index+m[0].length-1;
    let i=deb, prof=0, chaine=false, ech=false;
    for(; i<t.length; i++){
      const c=t[i];
      if(chaine){ if(ech) ech=false; else if(c==='\\') ech=true; else if(c==='"') chaine=false; continue; }
      if(c==='"') chaine=true;
      else if(c==='[') prof++;
      else if(c===']'){ prof--; if(prof===0){ i++; break; } }
    }
    try{ const a=JSON.parse(t.slice(deb,i)); if(Array.isArray(a)&&a.length) out.push(a); }catch(e){}
    re.lastIndex=i;
  }
  return out;
}
function csdNombre(v){
  const t=String(v==null?'':v).replace(/[^\d,.-]/g,'').replace(/\s/g,'').replace(',','.');
  const x=parseFloat(t); if(!Number.isFinite(x)) return null;
  return Math.round(x>=10000? x/1000 : x);     // les montants du CSD sont en euros, le portefeuille en k€
}
function csdAppliquer(lignes,nom){
  const cle=s=>norm(s).replace(/[^a-z0-9]/g,'');
  let crees=0, maj=0;
  lignes.forEach(r=>{
    const etu=String(r.etu||'').trim(), shine=String(r.shine||'').trim(), titre=String(r.projets||r.nom||'').trim();
    if(!etu && !shine && !titre) return;
    let p=S.projects.find(x=>!x.deleted && ((shine && cle(x.shine)===cle(shine)) ||
        (etu && cle((csdOf(x.id).etu)||x.ishift||'')===cle(etu)) || (titre && cle(x.nom)===cle(titre))));
    if(!p){
      const pole=String(r.entite||'').split('|')[0].trim()||'INFRA';
      p={id:shine||etu||uid(), shine:shine, nom:titre||etu||shine, pole:pole, group:poleGroup(pole),
         secteur:String(r.localisation||''), pm:String(r.responsables||'').trim(), pl:'', sponsor:String(r.initiateur||'').trim(),
         statut:String(r.statut||'En cours'), actif:true, hoverride:null, ishift:etu,
         c1:csdNombre(r.budget)||0, c2:csdNombre(r.budgetC2), b27:0,
         act:csdNombre(r.actuals)||0, commit:csdNombre(r.commitments)};
      S.projects.push(p); crees++;
    } else {
      maj++;
      if(!p.shine && shine) p.shine=shine;
      if(!p.ishift && etu) p.ishift=etu;
      const n=(v,cur)=>{ const x=csdNombre(v); return x==null?cur:x; };
      p.c1=n(r.budget,p.c1); p.c2=n(r.budgetC2,p.c2); p.act=n(r.actuals,p.act); p.commit=n(r.commitments,p.commit);
    }
    const c=csdOf(p.id);
    [['etu',r.etu],['wbsInv',r.wbsInv],['localisation',r.localisation],['engineering',r.engineering],
     ['initiateur',r.initiateur],['etape',r.etape],['cdo',r.cdo],['spe',r.spe],['cer',r.cer],
     ['rtProcess',r.rtProcessCer],['responsables',r.responsables],['delais',r.delais],
     ['dateDebut',r.dateDebut],['dateFin',r.dateFin],['sujets',r.sujets],['actionSuivi',r.actionSuivi],
     ['remarques',r.remarques],['commentaires',r.actions],['statut',r.statut]
    ].forEach(([k,v])=>{ if(v!=null && String(v).trim()!=='') c[k]=String(v); });
  });
  logChange('CSD '+(nom||''),'import',' ',crees+' créés, '+maj+' mis à jour');
  scheduleSave(); renderCSD();
  alert('Import CSD terminé.\n\n'+crees+' projet(s) créé(s), '+maj+' mis à jour.\n\nLes montants en euros ont été convertis en k€. Vérifiez le portefeuille, puis enregistrez.');
}

function subHealth(lb,sc){const b=sc>=75?'g':sc>=55?'a':'r';return `<div class="ht ${b}"><span class="dot"></span><span class="lb">${lb}</span><span class="sc">${Math.round(sc)}</span></div>`;}
/* Atterrissage : ce que le projet aura coûté en fin de course. Au minimum son
   budget révisé — un projet consomme ce qui lui est alloué — et davantage dès
   que le facturé et l'engagé le dépassent. Avec des engagements nuls, c'est
   exactement l'estimation d'avant. */
function atterrissage(p){
  const c2=(p.c2!=null?p.c2:p.c1)||0;
  return Math.max(c2, (p.act||0)+(p.commit||0));
}

/* Statuts des jalons et des étapes. Le vert pour ce qui est tenu, l'ambre pour
   ce qui glisse, le rouge pour ce qui ne passera pas en l'état. */
const MS_ST=['Not started','In progress','On track','At risk','Delayed','Done'];
const NS_ST=['À faire','En cours','Fait','Décalé','Reporté'];
function stTeinte(v){
  const t=norm(v);
  if(t==='done'||t==='on track'||t==='fait') return ['var(--good-soft)','var(--good)'];
  if(t==='at risk'||t==='reporte') return ['var(--bad-soft)','var(--bad)'];
  if(t==='in progress'||t==='delayed'||t==='en cours'||t==='decale') return ['var(--warn-soft)','var(--warn)'];
  return ['var(--panel-2)','var(--muted)'];
}
/* Un statut saisi hors liste — repris d'un ancien fichier — ne doit pas
   disparaître parce qu'il ne figure pas dans le menu : on l'y ajoute. */
function stSelect(attr,cle,liste,val){
  // Statut vide : pas d'option fantôme, le premier de la liste s'affiche.
  const c=stTeinte(val), opts=(!val||liste.includes(val))?liste:liste.concat([val]);
  return `<select data-${attr}="${esc(cle)}" style="width:100%;padding:2px 5px;border:1px solid var(--line);border-radius:6px;background:${c[0]};color:${c[1]};font-size:11px;font-weight:600">`

function nsNorm(x){
  return (x && typeof x==='object') ? {t:String(x.t||''), st:x.st||'À faire'}
                                    : {t:String(x==null?'':x), st:'À faire'};
}
function pill(st){const s=norm(st); if(s==='done')return '<span class="pill g">Done</span>'; if(s.includes('progress'))return '<span class="pill a">In progress</span>'; if(s.includes('late')||s.includes('retard'))return '<span class="pill r">Late</span>'; return `<span class="pill n">${esc(st||'—')}</span>`;}
function risksBlock(p,pp){
  const rs=(pp&&pp.risks)||[];
  return `<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Risques / Problèmes</h3><span class="meta">${rs.length}</span></div>
  <div class="tblwrap"><table class="rktbl"><thead><tr><th style="width:42%">Description</th><th style="width:42%">Mitigation</th><th style="width:96px">Owner</th><th style="width:96px">Date</th><th style="width:24px"></th></tr></thead>
  <tbody>${rs.length?rs.map((r,i)=>`<tr>
    <td class="rkcell" contenteditable data-rk="${p.id}|${i}|desc" data-vide="Décrire le risque ou le problème…">${esc(r.desc||'')}</td>
    <td class="rkcell" contenteditable data-rk="${p.id}|${i}|mit" data-vide="Action de mitigation, décision, parade…">${esc(r.mit||'')}</td>
    <td class="rkmeta" contenteditable data-rk="${p.id}|${i}|owner" data-vide="Pilote">${esc(r.owner||'')}</td>
    <td class="rkmeta mono" contenteditable data-rk="${p.id}|${i}|date" data-vide="jj/mm">${esc(r.date||'')}</td>
    <td style="vertical-align:top;padding-top:8px"><button class="delbtn" data-delrk="${p.id}|${i}">×</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">Aucun risque enregistré.</td></tr>`}</tbody></table></div>
  <div class="panel-b addrow"><button data-addrk="${p.id}">+ Ajouter un risque</button><span class="hint" style="margin-left:10px">Saisie libre · <b>Alt + Entrée</b> pour aller à la ligne · <b>Entrée</b> pour valider · <b>Échap</b> pour annuler</span></div></div>`;
}
function nextStepsBlock(p,pp){
  const ns=((pp&&pp.nextSteps)||[]).map(nsNorm);
  const faits=ns.filter(x=>norm(x.st)==='fait').length;
  return `<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Next Steps</h3><span class="meta">${ns.length} étape(s)${ns.length?' · '+faits+' faite(s)':''}</span></div>
  <div class="panel-b"><ul style="list-style:none;padding:0;margin:0">${ns.length?ns.map((s,i)=>`<li style="display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)">
    <span style="color:var(--accent);font-weight:700">→</span><span style="flex:1;${norm(s.st)==='fait'?'text-decoration:line-through;color:var(--muted)':''}" contenteditable data-ns="${p.id}|${i}">${esc(s.t)}</span>
    <span style="flex:0 0 118px">${stSelect('nsst',p.id+'|'+i,NS_ST,s.st)}</span>
    <button class="delbtn" data-delns="${p.id}|${i}">×</button></li>`).join(''):'<li class="empty">Aucune action.</li>'}</ul>
  <div class="addrow"><button data-addns="${p.id}">+ Ajouter une étape</button></div></div></div>`;
}
function orgBlock(pp){
  return `<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Organigramme projet</h3></div>
  <div class="tblwrap"><table><tbody>${pp.org.map(o=>`<tr><td style="font-weight:600;color:var(--muted)">${esc(o[0])}</td><td>${esc(o[1])}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function ensurePP(id){
  if(!S.passports[id]){ const p=S.projects.find(x=>x.id===id); S.passports[id]={milestones:[],risks:[],nextSteps:[],statusTxt:(p&&p.comment)||''}; }
  const pp=S.passports[id]; pp.milestones=pp.milestones||[]; pp.risks=pp.risks||[];
  pp.nextSteps=(pp.nextSteps||[]).map(nsNorm); return pp;
}
function bindEditables(){
  $$('[data-editpp]').forEach(el=>el.addEventListener('blur',()=>{const pp=ensurePP(S.currentProj); pp[el.dataset.editpp]=el.textContent.trim(); scheduleSave();}));
  $$('[data-pf]').forEach(el=>el.addEventListener('blur',()=>{const p=S.projects.find(x=>x.id===S.currentProj); if(p){p[el.dataset.pf]=el.textContent.trim(); scheduleSave();}}));
  $$('[data-ppf]').forEach(el=>el.addEventListener('blur',()=>{const pp=ensurePP(S.currentProj); pp[el.dataset.ppf]=el.textContent.trim(); scheduleSave();}));
  $$('[data-pfn]').forEach(el=>el.addEventListener('blur',()=>{const p=S.projects.find(x=>x.id===S.currentProj); if(!p)return; const t=el.textContent.replace(/\s/g,'').replace(',','.'); const v=t===''?null:parseFloat(t); p[el.dataset.pfn]=(v==null||isNaN(v))?null:v; scheduleSave(); renderPass();}));
  $$('[data-km]').forEach(el=>el.addEventListener('blur',()=>{const[id,i,f]=el.dataset.km.split('|');const pp=ensurePP(id);pp.milestones[+i][f]=el.textContent.trim();scheduleSave();}));
  $$('[data-rk]').forEach(el=>{
    const avant=el.innerText;
    el.addEventListener('blur',()=>{
      const[id,i,f]=el.dataset.rk.split('|'); const pp=ensurePP(id); const r=pp.risks[+i]; if(!r) return;
      // innerText, et non textContent : lui seul rend les retours à la ligne
      // tels qu'ils ont été saisis. Les espaces insécables du presse-papier
      // sont ramenés à des espaces ordinaires.
      const t=el.innerText.replace(/\u00a0/g,' ').replace(/\r/g,'').replace(/\n{3,}/g,'\n\n').replace(/[ \t]+$/gm,'').trim();
      if(r[f]===t) return;
      r[f]=t; scheduleSave();
    });
    el.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ e.preventDefault(); el.innerText=avant; el.blur(); return; }
      if(e.key!=='Enter') return;
      e.preventDefault();
      if(e.altKey||e.shiftKey||e.ctrlKey||e.metaKey){      // Alt+Entrée : nouvelle ligne, comme dans un tableur
        if(!document.execCommand('insertText',false,'\n')) document.execCommand('insertLineBreak');
      } else el.blur();                                    // Entrée seule : on valide
    });
  });
  $$('[data-ns]').forEach(el=>el.addEventListener('blur',()=>{const[id,i]=el.dataset.ns.split('|');const pp=ensurePP(id);const o=nsNorm(pp.nextSteps[+i]);o.t=el.textContent.trim();pp.nextSteps[+i]=o;scheduleSave();}));
  $$('[data-kmst]').forEach(sel=>sel.addEventListener('change',()=>{const[id,i]=sel.dataset.kmst.split('|');const pp=ensurePP(id);const m=pp.milestones[+i];if(!m)return;
    logChange('Jalon '+(m.name||''),'statut',m.st||'—',sel.value); m.st=sel.value; renderPass(); scheduleSave();}));
  $$('[data-nsst]').forEach(sel=>sel.addEventListener('change',()=>{const[id,i]=sel.dataset.nsst.split('|');const pp=ensurePP(id);const o=nsNorm(pp.nextSteps[+i]);
    logChange('Étape '+(o.t||''),'statut',o.st||'—',sel.value); o.st=sel.value; pp.nextSteps[+i]=o; renderPass(); scheduleSave();}));
  $$('[data-addkm]').forEach(b=>b.addEventListener('click',()=>{ensurePP(b.dataset.addkm).milestones.push({name:'Nouveau jalon',ini:'',neu:'',st:'In progress'});renderPass();scheduleSave();}));
  $$('[data-addrk]').forEach(b=>b.addEventListener('click',()=>{ensurePP(b.dataset.addrk).risks.push({desc:'Nouveau risque',mit:'',owner:'',date:''});renderPass();scheduleSave();}));
  $$('[data-addns]').forEach(b=>b.addEventListener('click',()=>{ensurePP(b.dataset.addns).nextSteps.push({t:'Nouvelle étape',st:'À faire'});renderPass();scheduleSave();}));
  $$('[data-delkm]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const[id,i]=b.dataset.delkm.split('|');ensurePP(id).milestones.splice(+i,1);renderPass();scheduleSave();}));
  $$('[data-delrk]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const[id,i]=b.dataset.delrk.split('|');ensurePP(id).risks.splice(+i,1);renderPass();scheduleSave();}));
  $$('[data-delns]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const[id,i]=b.dataset.delns.split('|');ensurePP(id).nextSteps.splice(+i,1);renderPass();scheduleSave();}));
}

/* ======================= TAB 3 — Finance ======================= */
function renderFin(){
  const list=PROJ().filter(p=>(p.c1||p.c2||p.act));
  const t=totals(PROJ());
  // sort
  const s=S.finSort;
  const val=(p,k)=>k==='ecart'?ecartV(p):k==='conso'?(p.c1?(p.act||0)/p.c1*100:0):(['c1','c2','b27','act'].includes(k)?(p[k]||0):norm(p[k]||''));
  list.sort((a,b)=>{const av=val(a,s.key),bv=val(b,s.key); if(av<bv)return s.dir; if(av>bv)return -s.dir; return 0;});
  const ecartPct=t.c1?((t.c2-t.c1)/t.c1*100):0;
  // top deltas C2 vs C1
  const deltas=[...PROJ()].map(p=>({p,d:ecartV(p)})).filter(x=>x.d).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,8);
  const maxD=Math.max(1,...deltas.map(x=>Math.abs(x.d)));

  view.innerHTML=`
  <div class="sec-title"><h2>Cockpit Finance — CAPEX</h2><span class="hint">C1 Alloué · C2 révisé · B27 · réalisé · atterrissage · k€</span></div>
  <div class="kpis">
    <div class="tile"><div class="lab">C1 Alloué FY</div><div class="big">${fmt(t.c1)}<span class="u">k€</span></div></div>
    <div class="tile c"><div class="lab">C2 révisé FY</div><div class="big">${fmt(t.c2)}<span class="u">k€</span></div><div class="sub">${ecartPct>=0?'+':''}${fmt(ecartPct,1)}% vs C1</div></div>
    <div class="tile"><div class="lab">B27 (budget N+1)</div><div class="big">${fmt(t.b27)}<span class="u">k€</span></div></div>
    <div class="tile"><div class="lab">Réalisé YTD</div><div class="big">${fmt(t.act)}<span class="u">k€</span></div></div>
    <div class="tile ${Math.abs(ecartPct)>S.config.seuilEcart?'bad':'good'}"><div class="lab">Écart atterrissage</div><div class="big">${fmt(ecartPct,1)}<span class="u">%</span></div><div class="sub">cible ≤ ${S.config.seuilEcart}%</div></div>
  </div>
  <div class="col3">
    <div class="panel"><div class="panel-h"><h3>Suivi budgétaire par projet</h3><span class="meta">conso = ACT / C1 · alerte ≥ 80/95/100%</span></div>
      <div class="panel-b"><div class="tblwrap" style="max-height:560px;overflow-y:auto"><table id="finTbl"><thead><tr>
        ${fth('Code','shine')}${fth('Projet','nom')}${fth('Pôle','group')}
        ${fthn('C1','c1')}${fthn('C2','c2')}${fthn('B27','b27')}${fthn('ACT','act')}${fthn('Écart','ecart')}${fthn('Conso%','conso')}<th>Alerte</th>
      </tr></thead><tbody>${finRows(list)}</tbody></table></div></div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Top écarts C2 vs C1</h3><span class="meta">k€</span></div>
      <div class="panel-b"><div class="bars">${deltas.map(x=>`
        <div class="bar-row"><span class="nm" title="${esc(x.p.nom)}" data-fid="${esc(x.p.id)}">${esc((x.p.shine||x.p.nom).slice(0,16))}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.abs(x.d)/maxD*100}%;background:${x.d>0?'var(--bad)':'var(--good)'}"></div></div>
        <span class="val" style="color:${x.d>0?'var(--bad)':'var(--good)'}">${x.d>0?'+':''}${fmt(x.d)}</span></div>`).join('')}</div>
        <div class="onepage-note" style="margin-top:12px;margin-bottom:0">L'atterrissage consolidé vise un écart ≤ ${S.config.seuilEcart}% vs budget alloué (cible CDO). Les dépassements orientent les arbitrages C2/B27.</div>
      </div></div>
  </div>
  ${footHTML('fin',`Finance · source de référence ERP pour engagements/factures ; la plateforme consolide et projette l'atterrissage.`)}`;
  $$('#finTbl thead th[data-k]').forEach(th=>th.addEventListener('click',()=>{if(S.finSort.key===th.dataset.k)S.finSort.dir*=-1;else{S.finSort.key=th.dataset.k;S.finSort.dir=-1;}renderFin();}));
  $$('#finTbl tbody tr[data-id]').forEach(tr=>tr.addEventListener('click',()=>{S.currentProj=tr.dataset.id;S.tab='pass';render();}));
  $$('[data-fid]').forEach(el=>el.addEventListener('click',()=>{S.currentProj=el.dataset.fid;S.tab='pass';render();}));
  bindFinEdit();
}
function fth(l,k){return `<th data-k="${k}">${l}${S.finSort.key===k?(S.finSort.dir<0?' ▼':' ▲'):''}</th>`;}
function fthn(l,k){return `<th class="num" data-k="${k}">${l}${S.finSort.key===k?(S.finSort.dir<0?' ▼':' ▲'):''}</th>`;}
function finRows(list){
  return list.map(p=>{const c2=(p.c2!=null?p.c2:p.c1);const ec=ecartV(p);const conso=p.c1?(p.act||0)/p.c1*100:0;
    let al=''; if(conso>=100)al='<span class="pill r">≥100%</span>'; else if(conso>=95)al='<span class="pill a">≥95%</span>'; else if(conso>=80)al='<span class="pill a">≥80%</span>'; else al='<span class="pill g">OK</span>';
    return `<tr data-id="${esc(p.id)}">
      <td class="code">${esc(p.shine||'—')}</td><td class="wrap">${esc(p.nom)}</td><td>${esc(p.group)}</td>
      <td class="num" contenteditable data-fin="${esc(p.id)}|c1">${p.c1!=null?fmt(p.c1):''}</td>
      <td class="num" contenteditable data-fin="${esc(p.id)}|c2">${c2!=null?fmt(c2):''}</td>
      <td class="num" contenteditable data-fin="${esc(p.id)}|b27">${p.b27!=null?fmt(p.b27):''}</td>
      <td class="num" contenteditable data-fin="${esc(p.id)}|act">${p.act!=null?fmt(p.act):''}</td>
      <td class="num" style="color:${ec>0?'var(--bad)':ec<0?'var(--good)':'inherit'}">${ec>=0?'+':''}${fmt(ec)}</td>
      <td class="num">${p.c1?fmt(conso,0)+'%':'—'}</td><td>${al}</td></tr>`;}).join('');
}
function bindFinEdit(){
  $$('[data-fin]').forEach(el=>{
    el.addEventListener('click',e=>e.stopPropagation());
    el.addEventListener('blur',()=>{const[id,f]=el.dataset.fin.split('|');const p=S.projects.find(x=>x.id===id);
      const v=parseFloat(el.textContent.replace(/\s/g,'').replace(',','.')); p[f]=isNaN(v)?null:v; renderFin(); scheduleSave();});
  });
}

/* ======================= TAB 4 — Ressources ======================= */
const PRESMAP={P:{lb:'Présent sur site',c:'var(--good)'},T:{lb:'Télétravail',c:'var(--accent)'},C:{lb:'Congé',c:'var(--warn)'},F:{lb:'Férié / site fermé',c:'var(--faint)'}};
const PRES_ORDER=['','P','T','C','F'];
// '' en tête : sans elle, un membre au pôle non renseigne affichait « INFRA »,
// la premiere option etant selectionnee par defaut faute de correspondance.
const MPOLES=['','INFRA','EE','BLP','Plan Transfo','SC/QC/FU','INSTRUM.','AMS','Digital','Transverse','Autres'];
const MTYPES=['','Interne','Prestataire'];
function mSelect(kind,val,i){const opts=(kind==='pole'?MPOLES:MTYPES);return `<select data-msel="${kind}|${i}">${opts.map(o=>`<option value="${esc(o)}" ${o===(val||'')?'selected':''}>${o?esc(o):'—'}</option>`).join('')}</select>`;}
function renderRes(){
  const months=S.months, roles=Object.keys(S.chargeByRole);
  S.members=S.members||SEED_MEMBERS.map(m=>({...m})); S.presence=S.presence||{};
  const mem=S.members, nInt=mem.filter(m=>m.type==='Interne').length, nPre=mem.filter(m=>m.type==='Prestataire').length;
  const chargeTot=months.map((_,i)=>roles.reduce((a,r)=>a+(S.chargeByRole[r][i]||0),0));
  const demand=S.demandRT, cap=S.capacityRT;
  const occ=months.map((_,i)=>cap[i]?demand[i]/cap[i]*100:0);
  const avgOcc=occ.filter(x=>x).reduce((a,b)=>a+b,0)/(occ.filter(x=>x).length||1);
  const avgCap=cap.reduce((a,b)=>a+b,0)/12, avgDem=demand.reduce((a,b)=>a+b,0)/12;
  const peakRole=roles.map(r=>({r,t:S.chargeByRole[r].reduce((a,b)=>a+b,0)})).sort((a,b)=>b.t-a.t)[0];

  const navSec = ({p4a:'membres',p4b:'cdp',p4c:'pm',p4d:'presence',p4e:'charge'})[S.navKey] || 'membres';
  const SEC={membres:['BDD Membres',"base de l'équipe projet · cellules éditables"],cdp:['CDP — Coordinateurs','membres dont le rôle contient « Coordinateur / CDP »'],pm:['PM | CA — Chefs de projet et chargés d\'affaires','PM d\'au moins un projet, ou rôle contenant « PM » / « chef de projet » / « CA » / « chargé d\'affaires »'],presence:['Planning présence ingénierie — au jour','clic sur une case ouvrée = statut suivant · week-ends et fériés grisés'],charge:['Plan de charge','Charge par rôle & Plan de ressources · ETP · cible 80–95%']};
  const mkey=s=>norm(s).replace(/[^a-z0-9]/g,'');
  const membersTableHTML=rows=>`<div class="selbar" id="memSelBar" hidden>
    <span><b id="memSelN">0</b> membre(s) sélectionné(s)</span>
    <span class="sp"></span>
    <button class="iconbtn" id="memSelClear">Annuler la sélection</button>
    <button class="iconbtn danger" id="memSelDel">🗑 Supprimer la sélection</button>
  </div>
  <div class="tblwrap" style="max-height:560px;overflow:auto"><table class="mtbl">
    <thead><tr><th class="selc"><input type="checkbox" id="memAll" title="Tout sélectionner / désélectionner"></th><th>#</th><th>Nom</th><th>Rôle / métier</th><th>Pôle</th><th>Type</th><th>Société</th><th>Dispo %</th><th>Départ</th><th></th></tr></thead>
    <tbody>${rows.map(({m,gi},n)=>`<tr>
      <td class="selc"><input type="checkbox" class="msel" data-sel="${gi}" title="Sélectionner ${esc(m.nom||'ce membre')}"></td>
      <td style="color:var(--faint)">${n+1}</td>
      <td class="mce" contenteditable data-mf="nom|${gi}">${esc(m.nom||'')}</td>
      <td class="mce" contenteditable data-mf="role|${gi}">${esc(m.role||'')}</td>
      <td>${mSelect('pole',m.pole,gi)}</td>
      <td>${mSelect('type',m.type,gi)} ${m.type?`<span class="mtag ${m.type==='Interne'?'int':'pre'}">${m.type==='Interne'?'INT':'PRE'}</span>`:''}</td>
      <td class="mce" contenteditable data-mf="societe|${gi}">${esc(m.societe||'')}</td>
      <td class="mce" contenteditable data-mfn="dispo|${gi}" style="text-align:right">${m.dispo!=null?m.dispo:''}</td>
      <td class="mce" contenteditable data-mf="depart|${gi}">${esc(m.depart||'')}</td>
      <td><button class="xdel" data-delm="${gi}" title="Supprimer ce membre">✕</button></td></tr>`).join('')}</tbody>
  </table></div>`;
  let body='';
  if(navSec==='membres'||navSec==='cdp'||navSec==='pm'){
    let rows=mem.map((m,i)=>({m,gi:i}));
    if(navSec==='cdp') rows=rows.filter(o=>/coord|cdp|sdp/i.test(o.m.role||''));
    else if(navSec==='pm'){
      // Deux façons d'être PM : porter un projet, ou avoir le rôle. La seconde
      // manquait, si bien qu'un chef de projet sans projet affecté n'apparaissait
      // nulle part. « CA » s'entend au rôle uniquement.
      const pmset=new Set();
      (S.projects||[]).forEach(p=>{ if(p.pm) String(p.pm).split('/').forEach(n=>{const k=mkey(n); if(k) pmset.add(k);}); });
      const rolePM=r=>/\bpm\b/i.test(r)||/chef\s+de\s+projet/i.test(r)||/project\s+manager/i.test(r);
      const roleCA=r=>/\bca\b/i.test(r)||/charg[ée]\s*d[e']?\s*affaire/i.test(r);
      rows=rows.filter(o=>{ const r=o.m.role||''; return pmset.has(mkey(o.m.nom))||rolePM(r)||roleCA(r); });
    }
    const meta = navSec==='membres' ? `${mem.length} membres · ${nInt} internes · ${nPre} prestataires` : `${rows.length} membre(s)`;
    body = `<div class="panel" id="bddMembres" style="margin-bottom:14px"><div class="panel-h"><h3>${SEC[navSec][0]}</h3><span class="meta">${meta}</span></div>
      <div class="panel-b">
        ${navSec==='membres'?`<div class="toolbar"><button class="iconbtn" id="addMember">＋ Ajouter un membre</button><span class="sp"></span><span class="hint">Repris de « Planning Présence Ingénierie » + PM|Owner / PL|Leader du portefeuille · cellules éditables · un membre supprimé n'est pas réintégré</span></div>`:`<div class="hint" style="margin-bottom:8px">Vue filtrée de la BDD Membres · les rôles/types se modifient dans « BDD Membres ».</div>`}
        ${rows.length?membersTableHTML(rows):`<div class="hint" style="padding:12px 2px">Aucun membre${navSec==='cdp'?" avec le rôle « Coordinateur / CDP » — renseignez-le dans BDD Membres.":navSec==='pm'?" reconnu comme PM | Owner d'un projet.":'.'}</div>`}
      </div></div>`;
  } else if(navSec==='presence'){
    const nOuvre=CAL.filter(j=>j.ouvre).length, nFer=CAL.filter(j=>j.ferie).length;
    // Un en-tête à deux étages : la semaine coiffe ses jours, chaque jour porte
    // sa lettre et son quantième. La première et la dernière semaine sont
    // tronquées par le changement d'année, d'où le colspan calculé.
    const parSem={}; CAL.forEach(j=>{ (parSem[j.sem]=parSem[j.sem]||[]).push(j); });
    // Le premier jour de chaque semaine porte le trait de separation.

  // Marque un membre comme retire a la main, pour que le rapprochement
  // PM|PL du portefeuille ne le recree pas au chargement suivant.
  function memForget(m){
    const k=mkey((m&&m.nom)||''); if(!k) return;
    S.membersRemoved=S.membersRemoved||[];
    if(!S.membersRemoved.includes(k)) S.membersRemoved.push(k);

  // --- BDD membres : sélection multiple et suppression groupée ---
  const memBoxes=()=>$$('.msel');
  function memSelSync(){
    const boxes=memBoxes(), n=boxes.filter(c=>c.checked).length;
    boxes.forEach(c=>c.closest('tr').classList.toggle('selrow',c.checked));
    const bar=$('#memSelBar');
    if(bar){ bar.hidden = n===0; const lab=$('#memSelN'); if(lab) lab.textContent=n; }
    const all=$('#memAll');
    // « indeterminate » : la case d'en-tête reflète une sélection partielle.
    if(all){ all.checked = n>0 && n===boxes.length; all.indeterminate = n>0 && n<boxes.length; }
  }
  memBoxes().forEach(c=>c.addEventListener('change',memSelSync));
  const memAll=$('#memAll');
  if(memAll) memAll.addEventListener('change',()=>{ memBoxes().forEach(c=>{c.checked=memAll.checked;}); memSelSync(); });
  const memClr=$('#memSelClear');
  if(memClr) memClr.addEventListener('click',()=>{ memBoxes().forEach(c=>{c.checked=false;}); memSelSync(); });
  const memDel=$('#memSelDel');
  if(memDel) memDel.addEventListener('click',()=>{
    // Tri décroissant : chaque splice ne décale que des indices déjà traités.
    const idx=memBoxes().filter(c=>c.checked).map(c=>+c.dataset.sel).sort((a,b)=>b-a);
    if(!idx.length) return;
    const noms=idx.slice().reverse().map(i=>(S.members[i]&&S.members[i].nom)||'(sans nom)');
    const apercu=noms.slice(0,10).map(n=>'\u2022 '+n).join('\n');
    const reste=noms.length>10 ? '\n\u2026 et '+(noms.length-10)+' autre(s)' : '';
    if(!confirm('Supprimer '+idx.length+' membre(s) ?\n\n'+apercu+reste+'\n\nCette action est irréversible.')) return;
    idx.forEach(i=>{ memForget(S.members[i]); S.members.splice(i,1); });
    renderRes(); scheduleSave();
  });
  memSelSync();
  const addB=$('#addMember'); if(addB) addB.addEventListener('click',()=>{S.members.push({nom:'Nouveau membre',ini:'',role:'',pole:'INFRA',type:'Interne',societe:'',tel:'',dispo:100,depart:''});renderRes();scheduleSave();});
  // --- Planning présence : cycle de statut au clic ---
  $$('[data-pc]').forEach(el=>el.addEventListener('click',()=>{const idx=el.dataset.pc.lastIndexOf('|');const nom=el.dataset.pc.slice(0,idx),w=el.dataset.pc.slice(idx+1);/* w : date ISO du jour */S.presence[nom]=S.presence[nom]||{};const cur=S.presence[nom][w]||'';const next=PRES_ORDER[(PRES_ORDER.indexOf(cur)+1)%PRES_ORDER.length];if(next)S.presence[nom][w]=next;else delete S.presence[nom][w];const info=PRESMAP[next];el.textContent=next;el.style.background=info?info.c:'transparent';el.style.color=info?'#fff':'';el.title=(el.dataset.pj?el.dataset.pj+' — ':'')+(info?info.lb:'Non renseigné');scheduleSave();}));
}
function occColor(v){ if(!v)return 'var(--panel-3)'; if(v>100)return 'var(--bad)'; if(v>=80&&v<=95)return 'var(--good)'; return 'var(--warn-soft)'; }
function chargeColor(v){ if(!v)return 'transparent'; const a=Math.min(.85,.12+v*0.5); return `color-mix(in srgb, var(--accent) ${Math.round(a*100)}%, transparent)`; }

const LOT_TEMPLATE = ['Génie civil','CVC / Salles propres','Tuyauterie / Utilités','Électricité / Instrumentation','Automatisme / CSV'];
const DA_STATUTS = ['DA','Validée','PO','Réception','Facturée','Soldée'];
const DA_ENGAGED = ['PO','Réception','Facturée','Soldée'];

function ensureCER(id){
  if(!S.cers) S.cers={};
  if(!S.cers[id]){
    const p=S.projects.find(x=>x.id===id)||{};
    S.cers[id]={ approuvee:(p.c1!=null?p.c1:0), avenants:0, engage:(p.act||0), facture:0, depense:(p.act||0), lots:[], da:[] };
  }
  const c=S.cers[id]; c.lots=c.lots||[]; c.da=c.da||[]; return c;
}
function lotEngage(cer,lotName){
  return cer.da.filter(d=>d.lot===lotName && DA_ENGAGED.includes(d.statut)).reduce((a,d)=>a+(+d.montant||0),0);
}
function cerConso(cer){ const env=(+cer.approuvee||0)+(+cer.avenants||0); return env? (+cer.depense||0)/env*100 : 0; }
function parseNum(txt){ const v=parseFloat(String(txt).replace(/\s/g,'').replace(',','.')); return isNaN(v)?0:v; }

  const reste=env-(+cer.engage||0);

    <div class="tile ${alertClass}"><div class="lab">Consommation CER</div><div class="big">${fmt(conso,0)}<span class="u">%</span></div><div class="sub">${alertPill} · seuils 80/95/100</div></div>

/* ======================= Phasing budgétaire ======================= */
function projPhasing(p){ return (p.ph&&p.ph.b27&&p.ph.b27.some(v=>v))?p.ph.b27:null; }
function renderPhasing(){

    title='Portefeuille — tous projets';

    act=p.ph?p.ph.act||0:0; c2tail=p.ph?(p.ph.c2tail||[]).reduce((a,b)=>a+b,0):0;
    title=(p.shine?p.shine+' — ':'')+(p.nom||'');
  }
  const total=series.reduce((a,b)=>a+b,0);
  const cum=[]; series.reduce((a,b,i)=>{cum[i]=a+b;return cum[i];},0);
  const peak=series.indexOf(Math.max(...series));
  const phased=PROJ().filter(p=>projPhasing(p));
  const opts=`<option value="__all__" ${scope==='__all__'?'selected':''}>Portefeuille — tous projets</option>`+
    phased.map(p=>`<option value="${esc(p.id)}" ${p.id===scope?'selected':''}>${esc(p.shine?p.shine+' — ':'')}${esc(p.nom)}</option>`).join('');

  view.innerHTML=`
  <div class="sec-title"><h2>Phasing budgétaire</h2><span class="hint">CAPEX mensuel B27 (2027) · courbe en S · k€</span></div>
  <div class="toolbar"><select id="phSel" style="min-width:420px;max-width:640px">${opts}</select><span class="sp"></span>

  <div class="kpis">
    <div class="tile a"><div class="lab">Total B27 phasé</div><div class="big">${fmt(total)}<span class="u">k€</span></div><div class="sub">exercice 2027</div></div>
    <div class="tile"><div class="lab">Pic mensuel</div><div class="big">${fmt(Math.max(0,...series))}<span class="u">k€</span></div><div class="sub">${months[peak]||''}</div></div>
    <div class="tile"><div class="lab">Réalisé 2026 (YTD)</div><div class="big">${fmt(act)}<span class="u">k€</span></div></div>
    <div class="tile c"><div class="lab">Forecast C2 fin 2026</div><div class="big">${fmt(c2tail)}<span class="u">k€</span></div><div class="sub">M08–M12</div></div>
  </div>
  <div class="panel"><div class="panel-h"><h3>Courbe en S — ${esc(title)}</h3><span class="meta">barres = mensuel · ligne = cumulé</span></div>
    <div class="panel-b" style="overflow-x:auto">${phasingSVG(series,cum,total,months)}</div></div>
  <div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Détail mensuel</h3><span class="meta">k€</span></div>
    <div class="tblwrap"><table class="heat"><thead><tr><th class="rname" style="position:sticky;left:0">Mesure</th>${months.map(m=>`<th class="num">${m}</th>`).join('')}<th class="num">Total</th></tr></thead>
    <tbody>
      <tr><td class="rname">Mensuel</td>${series.map(v=>`<td class="hc" style="background:${chargeColor(v/((Math.max(1,...series))||1))}">${v?fmt(v,0):''}</td>`).join('')}<td class="hc" style="font-weight:700">${fmt(total)}</td></tr>
      <tr><td class="rname">Cumulé</td>${cum.map(v=>`<td class="hc">${fmt(v,0)}</td>`).join('')}<td></td></tr>
    </tbody></table></div></div>
  ${footHTML('phasing',`Phasing · CAPEX B27 mensuel réel (Prépa C2-B26) · courbe en S = cumul.`)}`;
  $('#phSel').addEventListener('change',e=>{S.phScope=e.target.value;renderPhasing();});
}
function phasingSVG(series,cum,total,months){
  const W=760,H=240,padL=12,padR=12,padT=16,padB=28;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const n=series.length, slot=plotW/n, bw=slot*0.56;
  const maxM=Math.max(1,...series);
  let bars='',lbls=''; const pts=[];
  for(let i=0;i<n;i++){
    const x=padL+slot*i+slot*0.22;
    const bh=series[i]/maxM*plotH, y=padT+plotH-bh;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="2" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>`;
    lbls+=`<text x="${(padL+slot*i+slot/2).toFixed(1)}" y="${H-9}" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="var(--muted)">${months[i]}</text>`;
    pts.push([padL+slot*i+slot/2, padT+plotH-(total?cum[i]/total*plotH:0)]);
  }
  const poly=pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--copper)"/>`).join('');
  const last=pts[pts.length-1];
  return `<figure style="margin:0"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe en S du CAPEX phasé, barres mensuelles et ligne cumulée" style="width:100%;height:auto">
    <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--line-2)"/>
    ${bars}${lbls}
    <polyline points="${poly}" fill="none" stroke="var(--copper)" stroke-width="2"/>
    ${dots}
    <text x="${(last[0]-4).toFixed(1)}" y="${Math.max(12,last[1]-8).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="600" fill="var(--copper)">cumulé ${fmt(total)} k€</text>
  </svg></figure>`;
}

function parseFR(s){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(String(s||'').trim());if(!m)return null;let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);}
function isOverdue(s){const d=parseFR(s);return d? d<new Date(new Date().toDateString()):false;}
function derivePhase(p){const rg=realGatePhase(p.gateRealRaw); if(rg!=null) return rg;
  const s=norm(p.statut||'');
  if(s.includes('clotur')||s.includes('termin')||s.includes('migr')||s.includes('supprim')) return 5;
  if(s.includes('commission')) return 4;
  if(s.includes('travaux')) return 3;
  if(s==='apd'||s.includes(' apd')) return 2;
  if(s==='aps'||s.includes(' aps')) return 1;
  if(s.includes('cadrage')||s.includes('idee')||s.includes('evalu')) return 0;
  const ym=/(20\d\d)/.exec(p.nom||''); const y=ym?+ym[1]:0;
  if(y>=2028) return 0; if(y===2027) return 1;
  const c1=p.c1||0, act=p.act||0, conso=c1>0?act/c1:(act>0?1:0);
  if(conso>=0.95) return 5; if(conso>=0.6) return 4; if(conso>=0.25) return 3; if(conso>=0.05) return 2; return 1;}

function seedActions(){
  const out=[];
  try{ Object.values(SEED_PASSPORTS).forEach(pp=>{
    (pp.risks||[]).forEach(r=>out.push({origine:'Risque',projet:pp.code,desc:(r.desc||'')+(r.mit?(' — '+r.mit):''),pilote:r.owner||'',echeance:r.date||'',crit:'Haute',statut:'En cours'}));
  }); }catch(e){}
  return out;
}

}

/* ---------- HSE & Réception ---------- */
function ensureHSE(id){
  if(!S.hse) S.hse={};
  if(!S.hse[id]) S.hse[id]={pdp:[],permits:[],reserves:[],transfer:{}};
  const h=S.hse[id]; h.pdp=h.pdp||[]; h.permits=h.permits||[]; h.reserves=h.reserves||[]; h.transfer=h.transfer||{}; return h;
}
function permitStatus(h,pm){
  const pdp=h.pdp.find(x=>x.entreprise&&norm(x.entreprise)===norm(pm.entreprise));
  const ok=pdp&&pdp.accueil&&pdp.habil&&pdp.validite&&!isOverdue(pdp.validite);
  return ok?'AUTORISÉ':'BLOCKED';
}
function clotureStatus(h){
  const reasons=[];
  h.reserves.forEach(r=>{if(r.bloquante&&!r.levee)reasons.push('Réserve bloquante non levée : '+(r.desc||'—'));});
  TRANSFER_ITEMS.forEach(([k,lb])=>{if(!h.transfer[k])reasons.push('Transfert incomplet : '+lb);});
  return {ok:reasons.length===0, reasons};
}

function logChange(objet,champ,oldv,newv){
  if(String(oldv)===String(newv))return;
  if(!S.audit)S.audit=[];
  S.audit.unshift({ts:new Date().toISOString().slice(0,19).replace('T',' '),user:(S.user||'—'),objet:objet,champ:champ,old:String(oldv==null?'':oldv),neu:String(newv==null?'':newv)});
  if(S.audit.length>800)S.audit.length=800;
}

/* ---------- Scénarios What-if ---------- */
function scnFinBand(p,cut){
  const c1=p.c1||0; let c2=(p.c2!=null?p.c2:p.c1)||0; c2=c2*(1-cut/100);
  if(!c1&&!c2) return 'g';
  const dev=c1?Math.abs((c2-c1)/c1)*100:0; let score=100-Math.min(50,dev*2);
  const conso=c1?(p.act||0)/c1*100:0; if(conso>100)score-=Math.min(30,conso-100);
  return score>=75?'g':score>=55?'a':'r';
}
function renderScenario(){
  const sc=S.scenario; const q=sc.q||'';
  const included=PROJ().filter(p=>!sc.excluded[p.id]);
  const baseCapex=PROJ().reduce((a,p)=>a+((p.c2!=null?p.c2:p.c1)||0),0);
  const scnCapex=included.reduce((a,p)=>a+(((p.c2!=null?p.c2:p.c1)||0)*(1-sc.budgetCut/100)),0)
                 + sc.added.reduce((a,x)=>a+(+x.budget||0)*(1-sc.budgetCut/100),0);
  const months=S.months;
  const addCharge=sc.added.reduce((a,x)=>a+(+x.charge||0),0);
  const baseOcc=months.map((_,i)=>S.capacityRT[i]?S.demandRT[i]/S.capacityRT[i]*100:0);
  const scnCap=S.capacityRT.map(v=>v*(1-sc.capCut/100));
  const scnOcc=months.map((_,i)=>scnCap[i]?(S.demandRT[i]+addCharge)/scnCap[i]*100:0);
  const avg=a=>a.filter(x=>x).reduce((s,x)=>s+x,0)/(a.filter(x=>x).length||1);
  const surch=a=>a.filter(x=>x>100).length;
  const baseRed=PROJ().filter(p=>scnFinBand(p,0)==='r').length;
  const scnRed=included.filter(p=>scnFinBand(p,sc.budgetCut)==='r').length + sc.added.filter(x=>scnFinBand({c1:+x.budget,c2:+x.budget,act:0},sc.budgetCut)==='r').length;

  const cmp=(lab,b,s,unit,inv)=>{const d=s-b;const good=inv?d<=0:d>=0;return `<tr><td>${lab}</td><td class="num">${fmt(b,unit==='%'?0:0)}${unit}</td><td class="num" style="font-weight:700">${fmt(s,unit==='%'?0:0)}${unit}</td><td class="num" style="color:${d===0?'var(--muted)':(good?'var(--good)':'var(--bad)')};font-weight:600">${d>0?'+':''}${fmt(d,0)}${unit}</td></tr>`;};

  view.innerHTML=`

          <label style="display:block;font-size:12.5px;margin-bottom:10px">Réduction capacité ressources : <b>${sc.capCut}%</b><br><input type="range" min="0" max="50" value="${sc.capCut}" id="scnCap" style="width:100%"></label>

        </div>

      </div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Impact — baseline vs scénario</h3><span class="meta">k€ · %</span></div>
      <div class="panel-b"><div class="tblwrap"><table><thead><tr><th>Indicateur</th><th class="num">Baseline</th><th class="num">Scénario</th><th class="num">Δ</th></tr></thead>
      <tbody>
        ${cmp('CAPEX C2 total',baseCapex,scnCapex,' k€',true)}

/* ---------- KPI & Audit ---------- */
function kpiCard(lab,val,unit,cible,ok,tab){
  return `<div class="tile ${ok===null?'':(ok?'good':'bad')} ${tab?'click':''}" ${tab?`data-kpitab="${tab}"`:''}><div class="lab">${lab}</div><div class="big">${val}<span class="u">${unit}</span></div><div class="sub">cible ${cible}${tab?' →':''}</div></div>`;

function renderKPIAudit(){
  const t=totals(PROJ());

/* ======================= Extensions — actif / UO / GED / CDO-CdC ======================= */
/* ---- vrai cycle de vie : parse de la colonne Gate réelle ---- */
function realGatePhase(raw){
  const s=norm(raw); if(!s) return null;
  if(/g\s*5|gate\s*5|clotur/.test(s)) return 5;
  if(/g\s*4|gate\s*4|commission/.test(s)) return 4;
  if(/g\s*3|gate\s*3|travaux/.test(s)) return 3;
  if(/g\s*2|gate\s*2/.test(s)) return 2;
  if(/0\/1|g\s*1|gate\s*1|g\s*0\/1|aps/.test(s)) return 1;
  if(/g\s*0|gate\s*0|cadrage/.test(s)) return 0;
  if(/^\d+$/.test(s)){const n=+s; if(n>=0&&n<=5) return n;}
  return null; // "oui/non/na" → non concluant → proxy budgétaire
}
function matchGateCdo(p){
  const G=(typeof SEED_GATECDO!=='undefined')?SEED_GATECDO:{byShine:{},byName:{},byIshift:{}};
  return (p.shine&&G.byShine[p.shine]) || (p.ishift&&G.byIshift[p.ishift]) || (p.nom&&G.byName[norm(p.nom)]) || null;
}
function isActif(p){
  if(!/^P\d{5,}/.test(p.shine||'')) return false;
  const n=norm(p.nom);
  if(!n||n.includes('total')||n.includes('#ref')||n.includes('a creer')||n.includes('vide')) return false;
  if(((p.c2!=null?p.c2:p.c1)||0)<=0) return false;      // budget revise actif
  if(derivePhase(p)>=5) return false;                    // exclut cloture
  const ym=/(20\d\d)/.exec(p.nom||''); const y=ym?+ym[1]:0;
  if(y && y<2025) return false;                          // portefeuille courant (>=2025)
  return true;
}
/* Trois états pour un projet : vivant, archivé (actif=false, écarté par la
   case « Projets actifs ») et en corbeille (deleted, écarté de partout mais
   conservé dans le fichier, donc restaurable). Aucune suppression n'est
   définitive sans un passage par la corbeille. */
function PROJ(){ const v=S.projects.filter(p=>!p.deleted); return S.activeOnly? v.filter(p=>p.actif) : v; }
/* Doublons : même code SHINE ou même intitulé, aux accents et à la ponctuation
   près. Renvoie les rangs dans S.projects — deux projets de même code portent
   le même id, lequel ne les distinguerait donc pas. */
function doublonInfo(){
  const parCode={}, parNom={}, info=new Map();
  S.projects.forEach((p,i)=>{
    if(p.deleted) return;                       // la corbeille ne compte pas
    const c=norm(p.shine).replace(/[^a-z0-9]/g,''); if(c) (parCode[c]=parCode[c]||[]).push(i);
    const n=norm(p.nom).replace(/[^a-z0-9]/g,''); if(n) (parNom[n]=parNom[n]||[]).push(i);
  });
  const noter=(groupes,quoi)=>Object.keys(groupes).forEach(k=>{
    const l=groupes[k]; if(l.length<2) return;
    l.forEach(i=>{ const e=info.get(i)||{code:[],nom:[]}; e[quoi]=l.filter(j=>j!==i); info.set(i,e); });
  });
  noter(parCode,'code'); noter(parNom,'nom');
  return info;
}
function doublonIdx(){ return new Set(doublonInfo().keys()); }
/* Ce que dit la marque : sur quoi porte la collision, et avec quel projet. Un
   doublon dont on ne voit pas le jumeau — archivé, ou plus bas dans une liste
   filtrée — n'est qu'une énigme. */
function doublonLib(e){
  if(!e) return null;
  const etiq = (e.code.length && e.nom.length) ? 'même code et même intitulé'
             : e.code.length ? 'même code SHINE' : 'même intitulé';
  const court = (e.code.length && e.nom.length) ? 'doublon'
             : e.code.length ? 'même code' : 'même intitulé';
  const jumeaux=[...new Set(e.code.concat(e.nom))].map(j=>{
    const q=S.projects[j]||{};
    return '• '+(q.shine||'sans code')+' — '+(q.nom||'sans intitulé')+(q.actif===false?'  (archivé)':'');
  });
  return {court, titre:'Doublon — '+etiq+'. Autre(s) projet(s) concerné(s) :\n'+jumeaux.join('\n')
          +'\n\nLa détection ignore accents, majuscules et ponctuation, et couvre aussi les projets archivés.'};
}
function projArchiver(gi){
  const p=S.projects[gi]; if(!p) return;
  p.actif=!p.actif;
  logChange('Projet '+(p.shine||p.nom), p.actif?'réactivation':'archivage', p.actif?'archivé':'actif', p.actif?'actif':'archivé');
  render(); scheduleSave();
}
function projCorbeille(gi){
  const p=S.projects[gi]; if(!p) return;
  p.deleted=true; p.deletedAt=Date.now();
  if(S.currentProj===p.id){ const n=S.projects.find(x=>!x.deleted); S.currentProj=n?n.id:''; }
  logChange('Projet '+(p.shine||p.nom),'mise à la corbeille','présent','corbeille');
  render(); scheduleSave();
}
function projRestaurer(gi){
  const p=S.projects[gi]; if(!p) return;
  delete p.deleted; delete p.deletedAt;
  logChange('Projet '+(p.shine||p.nom),'restauration','corbeille','présent');
  render(); scheduleSave();
}
function projPurger(gi){
  const p=S.projects[gi]; if(!p) return;
  if(!confirm('Supprimer définitivement « '+(p.shine||'')+' '+(p.nom||'')+' » ?\n\nCette suppression est irréversible : le projet, son passeport et son phasing quittent le fichier.')) return;
  S.projects.splice(gi,1);
  logChange('Projet '+(p.shine||p.nom),'suppression définitive','corbeille','—');
  render(); scheduleSave();
}

/* Choisir un projet en le cherchant, plutot qu'en le deroulant : le
   portefeuille compte trop de lignes pour une liste deroulante. Chaque mot
   saisi doit se retrouver quelque part dans la fiche — code SHINE, intitule,
   pole, secteur, PM ou PL — accents et casse indifferents. */
function projSearch(q){
  const mots=norm(q).split(/\s+/).filter(Boolean);
  const tous=(S.projects||[]).filter(p=>p.shine);
  if(!mots.length) return tous;
  return tous.filter(p=>{
    const t=norm([p.shine,p.nom,p.pole,p.group,p.secteur,p.pm,p.pl,p.ishift,p.sponsor].join(' '));
    return mots.every(m=>t.includes(m));
  });
}

async function renderSheet(body,d,mime,name){

async function gedOpen(i){
  const d=S.ged[i]; if(!d) return;
  const name=(d.file&&d.file.name)||((d.code||'document')+'.html');
  const mime=(d.file&&(d.file.mime||''))||'text/html';

      <div class="gmhead"><h4>${esc(name)}</h4>

        <button class="iconbtn" data-gm="close">✕ Fermer</button></div>
      <div class="gmbody"></div></div>`;
  document.body.appendChild(ov);
  const body=ov.querySelector('.gmbody');
  let objUrl=null;
  const close=()=>{ if(objUrl) URL.revokeObjectURL(objUrl); ov.remove(); document.removeEventListener('keydown',onEsc); };
  const onEsc=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',onEsc);
  ov.addEventListener('click',e=>{ const a=e.target.dataset?e.target.dataset.gm:null;
    if(e.target===ov||a==='close') close(); else if(a==='dl') gedDownload(i); });
  try{
    if(!d.file){ // document HTML créé depuis un modèle
      const f=document.createElement('iframe'); f.srcdoc='<!DOCTYPE html><meta charset="UTF-8">'+(d.html||'<p style="font-family:sans-serif;color:#666">(document vide)</p>'); body.appendChild(f);
    } else {
      let src=d.file.data;
      try{ const b=await (await fetch(d.file.data)).blob(); objUrl=URL.createObjectURL(new Blob([b],{type:mime||b.type||'application/octet-stream'})); src=objUrl; }catch(_){}
      if(/^image\//.test(mime)){ const im=document.createElement('img'); im.src=src; body.appendChild(im); }
      else if(/^video\//.test(mime)){ const v=document.createElement('video'); v.src=src; v.controls=true; body.appendChild(v); }
      else if(/^audio\//.test(mime)){ const a2=document.createElement('audio'); a2.src=src; a2.controls=true; body.appendChild(a2); }
      else if(/^(application\/pdf|text\/)/.test(mime)||/\.(pdf|txt|html?|svg)$/i.test(name)){ const f=document.createElement('iframe'); f.src=src; body.appendChild(f); }
      else if(/wordprocessingml/i.test(mime)||/\.docx$/i.test(name)){
        try{ await renderDocx(body,d); }
        catch(err){ body.innerHTML=`<div style="margin:auto;padding:28px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6">
            Impossible d'afficher ce document Word (${esc(err.message)}).<br>La lecture .docx nécessite un accès Internet la première fois.<br><br>
            Utilisez <b>⭳ Télécharger</b> pour l'ouvrir dans Word.</div>`; } }
      else if(/sheet|excel|ms-excel|spreadsheet/i.test(mime)||/\.(xls|xlsx|xlsm|xlsb|csv|ods)$/i.test(name)){
        try{ await renderSheet(body,d,mime,name); }
        catch(err){ body.innerHTML=`<div style="margin:auto;padding:28px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6">
            Impossible d'afficher ce tableur (${esc(err.message)}).<br>La lecture .xls/.xlsx nécessite un accès Internet la première fois.<br><br>
            Utilisez <b>⭳ Télécharger</b> pour l'ouvrir dans Excel.</div>`; } }
      else { body.innerHTML=`<div style="margin:auto;padding:28px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6">
          Le navigateur ne sait pas afficher ce format<br><b style="color:var(--ink)">${esc(mime||d.type||'inconnu')}</b><br><br>
          Utilisez <b>⭳ Télécharger</b> pour l'ouvrir dans Word / Excel / PowerPoint.</div>`; }
    }
    logChange('GEDT '+(d.code||''),'ouverture','',name);
  }catch(e){ body.innerHTML=`<div style="margin:auto;padding:28px;color:var(--bad)">Impossible d'ouvrir ce document : ${esc(e.message)}</div>`; }
}
/* Televersement en vrac : plusieurs fichiers d'un coup, sans projet impose.
   Le tri vient ensuite, par selection dans le registre. */
function gedUpload(){
  const f=S.gedFilter||{}; S.gedFilter=f;
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true;
  inp.onchange=()=>{
    const files=Array.from(inp.files||[]); if(!files.length) return;
    const mo=files.reduce((a,x)=>a+x.size,0)/1048576;
    if(mo>8 && !confirm(files.length+' fichier(s), '+mo.toFixed(1)+' Mo au total. Les intégrer alourdira la sauvegarde du fichier de suivi. Continuer ?')) return;
    const sous=f.sousens||'Divers';     // sans sous-ensemble choisi, le vrac va dans « Divers »
    let reste=files.length; const ajoutes=[];
    const fin=()=>{
      f.q=''; f.fav=false; f.arch=false; f.trash=false;
      renderGED(); scheduleSave();
      alert('✓ '+ajoutes.length+' document(s) ajouté(s) dans « '+sous+' »'
        +(f.proj?(' — projet '+f.proj+'.'):'.\n\nAucun projet associé : cochez-les dans le registre, puis « 🔗 Lier à un projet » pour les rattacher.'));
    };
    files.forEach(file=>{
      const rd=new FileReader();
      rd.onload=()=>{
        S.ged.unshift({code:(file.name.replace(/\.[^.]+$/,'').slice(0,40))||('DOC-'+(S.ged.length+1)),projet:f.proj||'',sousens:sous,rubrique:f.rubrique||'',phase:f.phase||'APD',dossier:'10_ETUDES',type:(file.name.split('.').pop()||'').toUpperCase(),version:'A',statut:'Draft',auteur:S.user||'',date:new Date().toLocaleDateString('fr-FR'),fav:false,archived:false,file:{name:file.name,mime:file.type,size:file.size,data:rd.result},html:null});
        ajoutes.push(file.name);
        logChange('GEDT '+file.name,'téléversement','',fmtSize(file.size));
        if(--reste===0) fin();
      };
      rd.onerror=()=>{ if(--reste===0) fin(); };
      rd.readAsDataURL(file);
    });
    f.sousens=sous;
  };
  inp.click();
}

  $$('[data-gd]').forEach(el=>el.addEventListener('blur',()=>{const[i,k]=el.dataset.gd.split('|');S.ged[+i][k]=el.textContent.trim();scheduleSave();}));

  $$('[data-fav]').forEach(b=>b.onclick=()=>{S.ged[+b.dataset.fav].fav=!S.ged[+b.dataset.fav].fav;renderGED();scheduleSave();});

  $$('[data-gopen]').forEach(b=>b.onclick=e=>{e.stopPropagation();gedOpen(+b.dataset.gopen);});
  $$('[data-gfn]').forEach(el=>{
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
    el.addEventListener('blur',()=>{ const d=S.ged[+el.dataset.gfn]; if(!d||!d.file) return;
      const anc=d.file.name||''; let nv=el.textContent.trim();
      if(!nv){ el.textContent=anc; return; }
      const extA=(anc.match(/\.[A-Za-z0-9]{1,6}$/)||[''])[0];
      if(extA && !/\.[A-Za-z0-9]{1,6}$/.test(nv)) nv+=extA;   // conserve l'extension
      if(nv===anc){ el.textContent=anc; return; }

  });

  function gSelSync(){
    const n=gIdx().length, bar=$('#gSelBar'); if(!bar) return;
    bar.hidden=!n; const lab=$('#gSelN'); if(lab) lab.textContent=n;
    const all=$('#gAll'); if(all){ const t=gBoxes().length; all.checked=n>0&&n===t; all.indeterminate=n>0&&n<t; }
  }
  gBoxes().forEach(c=>c.addEventListener('change',gSelSync));
  const gAll=$('#gAll'); if(gAll) gAll.addEventListener('change',()=>{ gBoxes().forEach(c=>{c.checked=gAll.checked;}); gSelSync(); });
  const gClear=$('#gSelClear'); if(gClear) gClear.onclick=()=>{ gBoxes().forEach(c=>{c.checked=false;}); gSelSync(); };
  const gLink=$('#gSelLink'); if(gLink) gLink.onclick=()=>gedLier(gIdx());
  /* Telechargement groupe : un seul clic pour toute la selection. Les
     navigateurs refusent une rafale de telechargements simultanes — ils en
     retiennent un seul — d'ou l'envoi espace, un fichier a la fois. */
  const gDl=$('#gSelDl'); if(gDl) gDl.onclick=()=>{
    const idx=gIdx(); if(!idx.length) return;
    if(idx.length>12 && !confirm(idx.length+' téléchargements vont se déclencher l\'un après l\'autre. Continuer ?')) return;
    gDl.disabled=true; const av=gDl.textContent;
    idx.forEach((i,n)=>setTimeout(()=>{
      gedDownload(i);
      gDl.textContent='⭳ '+(n+1)+'/'+idx.length;
      if(n===idx.length-1) setTimeout(()=>{ gDl.disabled=false; gDl.textContent=av; },600);
    }, n*350));

  $$('[data-arch]').forEach(b=>b.onclick=()=>{const d=S.ged[+b.dataset.arch];d.archived=!d.archived;logChange('GEDT '+d.code,'archivage',d.archived?'non':'oui',d.archived?'oui':'non');renderGED();scheduleSave();});
  $$('[data-gdel]').forEach(b=>b.onclick=()=>{const d=S.ged[+b.dataset.gdel];d.deleted=true;d.deletedAt=new Date().toLocaleString('fr-FR');logChange('GEDT '+d.code,'mise à la corbeille',d.code,'');renderGED();scheduleSave();});
  $$('[data-grestore]').forEach(b=>b.onclick=()=>{const d=S.ged[+b.dataset.grestore];d.deleted=false;delete d.deletedAt;logChange('GEDT '+d.code,'restauration','',d.code);renderGED();scheduleSave();});

}

/* ---- CDO / CdC / RTM ---- */
const SIG_ROLES=[
  {k:'uf',lab:'Utilisateur final',req:true},
  {k:'hse',lab:'Représentant HSE',reqBpx:false},
  {k:'qo',lab:'Resp. qualité opérationnelle',reqBpx:true},
  {k:'maint',lab:'Resp. maintenance',reqBpx:false},
  {k:'eia',lab:'Représentant EIA',reqBpx:false},
  {k:'qv',lab:'Qualification-Validation',reqBpx:true},
  {k:'cp',lab:'Chef / Directeur de projet',req:true},
  {k:'sp',lab:'Responsable de projet (Sponsor)',req:true}
];
const RTM_COLS=[['cdc','CdC'],['spe','SPE'],['essai','Essai'],['recep','Réception']];
function ensureCDC(id){
  if(!S.cdc)S.cdc={};
  if(!S.cdc[id]){
    const p=S.projects.find(x=>x.id===id)||{};
    const has=norm(p.cdoReal).startsWith('oui');
    S.cdc[id]={cdo:{version:'1.0',statut:has?'Approuvé':'Draft',bpx:true,date:'',auteur:'',sigs:{}},reqs:[]};
  }
  const c=S.cdc[id]; c.cdo=c.cdo||{sigs:{}}; c.cdo.sigs=c.cdo.sigs||{}; c.reqs=c.reqs||[]; return c;
}
function sigRequired(role,bpx){ return role.req || (bpx && role.reqBpx); }
function renderCDC(){
  const opts=S.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===S.currentProj?'selected':''}>${esc(p.shine?p.shine+' — ':'')}${esc(p.nom)}</option>`).join('');
  const p=S.projects.find(x=>x.id===S.currentProj)||S.projects[0];
  if(!p){ view.innerHTML=`<div class="sec-title"><h2>Aucun projet</h2><span class="hint">ajoutez des projets dans &laquo; Project Portfolio &raquo; pour activer cet onglet</span></div><div class="panel"><div class="panel-b"><div class="hint" style="padding:14px 4px">Cet onglet s'appuie sur un projet sélectionné. Commencez par créer un projet.</div></div></div>`; return; }
  const c=ensureCDC(p.id); const cdo=c.cdo;
  const missing=SIG_ROLES.filter(r=>sigRequired(r,cdo.bpx)).filter(r=>!(cdo.sigs[r.k]&&cdo.sigs[r.k].ok&&cdo.sigs[r.k].nom));
  const validable=missing.length===0;
  const covered=c.reqs.filter(r=>RTM_COLS.every(([k])=>r.trace&&r.trace[k])).length;

  view.innerHTML=`
  <div class="sec-title"><h2>CDO / CdC &amp; traçabilité</h2><span class="hint">CDO digital · exigences · matrice Exigence → CdC → SPE → Essai → Réception</span></div>
  <div class="toolbar"><select id="cdcSel" style="min-width:420px;max-width:640px">${opts}</select></div>
  <div class="col3">
    <div class="panel"><div class="panel-h"><h3>CDO digital</h3><span class="meta">CDO fichier : ${esc(p.cdoReal||'—')}</span></div>
      <div class="panel-b">
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px">
          <label>Version <span contenteditable data-cdo="version" style="border-bottom:1px dashed var(--line-2);padding:0 5px" class="mono">${esc(cdo.version)}</span></label>
          <label>Statut <select data-cdostatut style="padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:inherit">${['Draft','En vérification','Approuvé','Obsolete'].map(s=>`<option ${cdo.statut===s?'selected':''}>${s}</option>`).join('')}</select></label>
          <label>Environnement <select data-cdobpx style="padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:inherit"><option value="1" ${cdo.bpx?'selected':''}>BPx</option><option value="0" ${!cdo.bpx?'selected':''}>non-BPx</option></select></label>
          <label>Date <span contenteditable data-cdo="date" class="mono" style="border-bottom:1px dashed var(--line-2);padding:0 5px">${esc(cdo.date||'')}</span></label>
        </div>
        <div class="tblwrap"><table><thead><tr><th>Circuit de signatures</th><th style="width:130px">Nom</th><th style="width:60px">Requis</th><th style="width:56px">Signé</th></tr></thead>
        <tbody>${SIG_ROLES.map(r=>{const req=sigRequired(r,cdo.bpx);const sg=cdo.sigs[r.k]||{};return `<tr>
          <td style="font-size:12.5px">${esc(r.lab)}</td>
          <td contenteditable data-sig="${r.k}|nom">${esc(sg.nom||'')}</td>
          <td>${req?'<span class="pill a">oblig.</span>':'<span class="pill n">si applic.</span>'}</td>
          <td style="text-align:center"><input type="checkbox" data-sigok="${r.k}" ${sg.ok?'checked':''}></td></tr>`;}).join('')}</tbody></table></div>
        <div style="margin-top:10px;font-family:Archivo;font-weight:800;font-size:18px;color:${validable?'var(--good)':'var(--bad)'}">${validable?'✓ CDO validable':'✕ Validation bloquée'}</div>
        ${missing.length?`<div style="font-size:12px;color:var(--bad);margin-top:4px">Signataires obligatoires manquants : ${missing.map(m=>esc(m.lab)).join(', ')}</div>`:''}
        <div class="onepage-note" style="margin-top:8px">Circuit ${cdo.bpx?'<b>BPx</b> : utilisateur final + fonctions soulignées':'<b>non-BPx</b> : utilisateur final + certaines fonctions'} (CDO ETU2601).</div>
      </div></div>
    <div class="panel"><div class="panel-h"><h3>Couverture RTM</h3></div>
      <div class="panel-b">
        <div style="font-family:Archivo;font-weight:800;font-size:30px;color:var(--accent);margin-bottom:2px">${c.reqs.length?fmt(covered/c.reqs.length*100,0):0}%</div>
        <div class="hint">${covered}/${c.reqs.length} exigences couvertes jusqu'à la réception</div>
        <div class="legend" style="margin-top:10px"><span><span class="hdot g"></span>couverte</span><span><span class="hdot r"></span>lacune</span></div>
        <div class="onepage-note" style="margin-top:10px">« Cette exigence du CDO a-t-elle été couverte jusqu'à la réception ? » — matrice ci-dessous.</div>

function setDMsg(el,kind,txt){ if(!el)return; el.className='dmsg '+kind; el.textContent=txt; }
// Enregistre un fichier là où c'est possible : capacité « downloads » de l'artefact
// (fenêtre de confirmation Claude) sinon téléchargement navigateur classique (mode serveur/local).
// Renvoie {ok, how:'capability'|'download', status?, code?}. Aucun repli deviné.
async function saveFile(filename, data){
  let cd=null;
  try{ if(window.claude && typeof window.claude.use==='function') cd=await window.claude.use('downloads'); }catch(_){}
  if(cd){
    try{ const r=await cd.save({filename:filename, data:data}); return {ok:true, how:'capability', status:r&&r.status}; }
    catch(e){ return {ok:false, how:'capability', code:(e&&e.code)||'unavailable'}; }
  }
  try{
    const blob = (data instanceof Blob)? data : new Blob([data],{type:'application/octet-stream'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(_){} },2000);
    return {ok:true, how:'download'};
  }catch(e){ return {ok:false, how:'download', code:String(e&&e.message||e)}; }
}

/* Deux formats circulent : l'export de l'application (l'etat nu) et le
   fichier du serveur local, _ppm_state.json, qui enveloppe ce meme etat dans
   {version, enc, savedAt, state}. Refuser le second n'avait aucun sens : c'est
   precisement le fichier que l'utilisateur a sous la main. */
function etatDuFichier(obj){
  if(!obj || typeof obj!=='object') return null;
  if(Array.isArray(obj.projects)) return obj;
  if(obj.state && Array.isArray(obj.state.projects)) return obj.state;
  return null;
}
function importJSONFile(file, msgEl, confBox){
  if(!file){ return; }
  if(!/\.json$/i.test(file.name)){ setDMsg(msgEl,'err','Sélectionnez un fichier .json.'); return; }
  setDMsg(msgEl,'info','Lecture de « '+file.name+' »…');
  const rd=new FileReader();
  rd.onload=()=>{
    let obj=null; try{ obj=JSON.parse(rd.result); }catch(e){ setDMsg(msgEl,'err','JSON invalide : fichier illisible.'); return; }
    if(obj && obj.enc===1){
      setDMsg(msgEl,'err','Ce fichier est chiffré : il ne peut être lu que par le dossier qui l’a produit. Depuis ce dossier, exportez-le en clair — py -3 _ppm_save_server.py --export-state — ou, dans l’application ouverte par Lancer_PPM.bat, « ⇄ Données → Exporter ».');
      return;
    }
    const etat=etatDuFichier(obj);
    if(!etat){ setDMsg(msgEl,'err','Ce fichier n’est pas un état PPM valide (clé « projects » absente).'); return; }
    askReplace(etat, file.name, msgEl, confBox);
  };
  rd.onerror=()=>setDMsg(msgEl,'err','Lecture du fichier impossible.');
  rd.readAsText(file);
}
