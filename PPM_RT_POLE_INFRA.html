<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPM RT Pôle INFRA — Pilotage portefeuille</title>
<!-- PPM_BUILD:2026-10-16.16 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#eaeff5; --panel:#ffffff; --panel-2:#eef3f7; --panel-3:#e4ebf1;
    --ink:#11202e; --ink-2:#33485a; --muted:#5e7485; --faint:#8499a7;
    --line:#e0e7ee; --line-2:#ccd7e0;
    --accent:#115e75; --accent-soft:#e1edf1; --accent-ink:#0b4658;
    --copper:#b0651f; --copper-soft:#f5e9dd;
    --good:#1d7a52; --good-soft:#e0f0e8;
    --warn:#bd8413; --warn-soft:#f7edd7;
    --bad:#c0392b; --bad-soft:#f8e3e0;
    --radius:10px;
    --sidebar-bg:linear-gradient(180deg,#ffffff 0%,#f3f8fc 100%); --app-bg:linear-gradient(180deg,#f2f6fa 0%,#e8eef5 100%);
    --shadow:0 1px 2px rgba(16,42,67,.05), 0 6px 18px rgba(16,42,67,.07);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --ground:#0c1620; --panel:#12202c; --panel-2:#0f1b25; --panel-3:#172835;
    --ink:#e8eef2; --ink-2:#bccdd7; --muted:#8ba1ad; --faint:#637885;
    --line:#24363f; --line-2:#31454f;
    --accent:#4fb3cf; --accent-soft:#11323d; --accent-ink:#9ad7e6;
    --copper:#d99a5b; --copper-soft:#3a2a19;
    --good:#57c394; --good-soft:#113026;
    --warn:#e0b45a; --warn-soft:#33280f;
    --bad:#e8766a; --bad-soft:#381e1b;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.25); --sidebar-bg:var(--panel); --app-bg:var(--ground);
  }}
  :root[data-theme="dark"]{
    --ground:#0c1620; --panel:#12202c; --panel-2:#0f1b25; --panel-3:#172835;
    --ink:#e8eef2; --ink-2:#bccdd7; --muted:#8ba1ad; --faint:#637885;
    --line:#24363f; --line-2:#31454f;
    --accent:#4fb3cf; --accent-soft:#11323d; --accent-ink:#9ad7e6;
    --copper:#d99a5b; --copper-soft:#3a2a19;
    --good:#57c394; --good-soft:#113026;
    --warn:#e0b45a; --warn-soft:#33280f;
    --bad:#e8766a; --bad-soft:#381e1b;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.25); --sidebar-bg:var(--panel); --app-bg:var(--ground);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--ink);overflow-x:hidden;
    font-family:"IBM Plex Sans",system-ui,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.5}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  h1,h2,h3,.ar{font-family:"Archivo",system-ui,sans-serif}
  button{font:inherit;cursor:pointer;color:inherit}
  [hidden]{display:none!important}
  ::selection{background:var(--accent-soft)}

  /* Top bar */
  .app{display:flex;min-height:100vh}
  .sidebar{flex:0 0 262px;width:262px;background:var(--sidebar-bg);border-right:1px solid var(--line);box-shadow:2px 0 16px rgba(16,42,67,.05);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:14px 0;overflow:hidden;z-index:30}
  .sb-brand{position:relative;display:flex;align-items:center;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--accent-soft) 0%,transparent 70%)}
  .sb-brand::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 55%,var(--copper) 100%)}
  .sb-brand .mk{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));box-shadow:0 3px 10px rgba(17,94,117,.4);display:grid;place-items:center;color:#fff;font-family:Archivo;font-weight:800;font-size:18px;flex:0 0 auto}
  .sb-brand .bt{font-family:Archivo;font-weight:800;font-size:16.5px;letter-spacing:.2px;line-height:1.05;color:var(--ink)}
  .sb-brand .bs{font-size:10.5px;color:var(--muted);line-height:1.3;margin-top:2px}
  .sb-nav{flex:1;min-height:0;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
  .sb-sec{display:flex;align-items:center;font-family:Archivo;font-size:13px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);padding:15px 8px 6px 10px;cursor:pointer;user-select:none}
  .sb-sec:hover{color:var(--accent-ink)}
  .sb-sec .sb-chev{color:var(--muted);font-size:10px}
  .sb-secwrap{position:relative;margin:2px 0 4px 10px;border-left:2px solid var(--line-2);display:flex;flex-direction:column;gap:1px}
  .sb-secwrap.collapsed{display:none}
  .sb-secwrap > button{position:relative;padding-left:16px}
  .sb-secwrap > button::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:9px;height:2px;background:var(--line-2)}
  .sb-secwrap .sb-subwrap{margin-left:9px}
  .nav-ic{flex:0 0 auto;width:18px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1;margin-right:3px}
  .sb-sec .nav-ic{font-size:14px;width:20px}
  .sb-nav button{display:flex;align-items:center;gap:9px;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px;color:var(--ink-2);width:100%;transition:background .13s,color .13s,box-shadow .13s}
  .sb-nav button:hover{background:var(--panel-2);color:var(--ink)}
  .sb-nav button.on{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 3px 0 0 var(--accent)}
  .sb-nav .step{font-family:"IBM Plex Mono";font-size:10px;font-weight:600;color:var(--faint);width:15px;text-align:center;flex:0 0 auto}
  .sb-nav button.on .step{color:var(--accent)}
  .sb-chev{margin-left:auto;font-size:9px;color:var(--faint);transition:transform .15s;padding:0 2px;cursor:pointer}
  .sb-chev:hover{color:var(--ink)}
  .sb-chev.rot{transform:rotate(-90deg)}
  .sb-subwrap{position:relative;margin:1px 0 1px 19px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:1px}
  .sb-subwrap.collapsed{display:none}
  .sb-nav .sb-sub{position:relative;padding:5px 10px 5px 18px;font-size:12px;font-weight:500;color:var(--muted)}
  .sb-nav .sb-sub::before{content:"";position:absolute;left:0;top:50%;width:11px;height:1px;background:var(--line-2)}
  .sb-nav .sb-sub:hover{background:var(--panel-2);color:var(--ink)}
  .sb-nav .sb-sub.on{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 3px 0 0 var(--accent)}
  .sb-nav .sb-sub.on::before{background:var(--accent)}
  .sb-nav .sb-par{font-weight:600;color:var(--ink-2)}
  .sb-nav .sb-par:hover{background:var(--panel-2);color:var(--ink)}
  .sb-nav .sb-par .sb-chev{color:var(--muted)}
  .sb-foot{padding:10px 12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .sb-endline{height:3px;border-radius:2px;margin:8px -12px -10px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 55%,var(--copper) 100%)}
  .sb-foot .row{display:flex;gap:8px}
  .sb-foot .iconbtn{flex:1;justify-content:center}
  .main{flex:1;min-width:0;height:100vh;overflow:hidden;background:var(--app-bg);display:flex;flex-direction:column}
  @media (max-width:820px){
    .app{flex-direction:column}
    .sidebar{width:auto;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:0;overflow:visible}
    .sb-brand::before{display:none}
    .sb-endline{display:none}
    .sb-brand{border-bottom:0;padding:8px 12px}
    .sb-nav{flex-direction:row;flex-wrap:wrap;flex:1 1 100%;order:3;padding:6px 8px;overflow:visible;min-height:0}
    .sb-sec{width:100%;padding:6px 6px 2px}
    .sb-nav button{width:auto}
    .sb-foot{border-top:0;flex-direction:row;align-items:center;padding:8px 12px;order:2;margin-left:auto;gap:8px}
    .sb-foot .iconbtn{flex:none}
    .main{height:auto;overflow:visible}
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mk{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;
    color:#fff;font-family:Archivo;font-weight:800;font-size:15px}
  .brand .bt{font-family:Archivo;font-weight:800;font-size:15px;letter-spacing:.2px}
  .brand .bs{font-size:11px;color:var(--muted)}
  .tabs{display:flex;flex-wrap:wrap;gap:3px;margin-left:6px}
  .tabs button{border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 13px;
    font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
  .tabs button:hover{background:var(--panel-2);color:var(--ink)}
  .tabs button.on{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
  .tabs button .mono{font-size:10px;opacity:.7}
  .topright{margin-left:auto;display:flex;align-items:center;gap:10px}
  .savestate{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-width:92px;justify-content:flex-end}
  .savestate .d{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .savestate.ok .d{background:var(--good)} .savestate.ok{color:var(--good)}
  .savestate.pend .d{background:var(--warn)} .savestate.pend{color:var(--warn)}
  .savestate.err .d{background:var(--bad)} .savestate.err{color:var(--bad)}
  .iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
  .iconbtn:hover{background:var(--panel-2)}
  .savebtn{width:100%;border:0;border-radius:9px;padding:9px 12px;font-family:Archivo,inherit;font-size:12.5px;font-weight:800;letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-ink));box-shadow:0 2px 8px rgba(17,94,117,.35);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .07s,box-shadow .14s,filter .12s}
  .savebtn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(17,94,117,.45)}
  .savebtn:active{transform:translateY(0)}
  .savebtn.saved{background:linear-gradient(135deg,var(--good),#155e3f)}
  .savebtn.dirty{background:linear-gradient(135deg,var(--warn),var(--copper))}
  @media(max-width:1000px){.sb-foot .savebtn{width:auto}}

  .view{padding:12px 14px 16px;max-width:1680px;margin:0;flex:1;overflow-y:auto;display:flex;flex-direction:column}
  .view>*{flex:0 0 auto}
  .sec-title{position:relative;order:-3;display:flex;align-items:baseline;gap:12px;margin:2px 0 16px;padding:13px 14px 0}
  #bddMembres{order:-2} #planPresence{order:-1}
  .sec-title::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 55%,var(--copper) 100%)}
  .sec-title h2{font-size:19px;margin:0;font-weight:700}
  .sec-title .hint{color:var(--muted);font-size:12.5px}

  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:11px;margin-bottom:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
  .tile .lab{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .tile .big{font-family:Archivo;font-weight:800;font-size:26px;margin-top:5px;line-height:1;font-variant-numeric:tabular-nums}
  .tile .u{font-size:12px;color:var(--faint);font-weight:600;margin-left:3px}
  .tile .sub{font-size:11.5px;color:var(--muted);margin-top:4px}
  .tile.a .big{color:var(--accent)} .tile.c .big{color:var(--copper)}
  .tile.good .big{color:var(--good)} .tile.bad .big{color:var(--bad)} .tile.warn .big{color:var(--warn)}
  .tile.click{cursor:pointer;transition:border-color .12s,transform .05s}
  .tile.click:hover{border-color:var(--accent);transform:translateY(-1px)}
  /* ===== Cockpit hero header ===== */
  .dash-hero{position:relative;border:1px solid var(--line);border-radius:16px;background:radial-gradient(130% 150% at 0% 0%,var(--accent-soft) 0%,transparent 52%),linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);box-shadow:var(--shadow);padding:18px 20px 16px;margin:2px 0 16px;overflow:hidden}
  .dash-hero::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 55%,var(--copper) 100%)}
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-bottom:15px}
  .hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:9px}
  .hero-eyebrow::before{content:"";width:22px;height:2px;background:var(--accent);border-radius:2px}
  .hero-title{font-family:Archivo;font-weight:800;font-size:26px;line-height:1.04;margin:8px 0 5px;letter-spacing:-.01em;color:var(--ink)}
  .hero-sub{font-size:12.5px;color:var(--muted)}
  .hero-gauge{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px 16px 9px 11px;box-shadow:var(--shadow)}
  .gauge-ring{width:54px;height:54px;border-radius:50%;flex:0 0 auto;position:relative;display:grid;place-items:center;background:conic-gradient(var(--good) 0 calc(var(--g,0)*1deg),var(--warn) calc(var(--g,0)*1deg) calc(var(--a,0)*1deg),var(--bad) calc(var(--a,0)*1deg) 360deg)}
  .gauge-ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel)}
  .gauge-ring b{position:relative;z-index:1;font-family:Archivo;font-weight:800;font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .gauge-meta .gm-t{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .gauge-meta .gm-v{font-family:Archivo;font-weight:800;font-size:15px;color:var(--ink);margin-top:2px}
  .gauge-legend{display:flex;gap:11px;margin-top:5px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .gauge-legend span{display:inline-flex;align-items:center;gap:4px}
  .gauge-legend i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .hero-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px}
  @media(max-width:1180px){.hero-kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:680px){.hero-kpis{grid-template-columns:repeat(2,1fr)}}
  .hero-kpis .tile{position:relative;padding:12px 13px 12px 16px;border-radius:11px;overflow:hidden}
  .hero-kpis .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.9}
  .hero-kpis .tile.c::before{background:var(--copper)}
  .hero-kpis .tile.good::before{background:var(--good)}
  .hero-kpis .tile.warn::before{background:var(--warn)}
  .hero-kpis .tile.bad::before{background:var(--bad)}
  .hero-kpis .tile.click{cursor:pointer;transition:transform .09s,box-shadow .14s,border-color .14s}
  .hero-kpis .tile.click:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 5px 18px rgba(16,42,67,.13)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .col3{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:16px}
  .cols-dash{display:grid;grid-template-columns:minmax(0,1fr) 224px 224px;gap:10px;margin-bottom:8px;align-items:stretch}
  .cols-dash>div{display:flex;flex-direction:column;gap:12px}
  .cols-dash>div:nth-child(2)>.panel:nth-child(1){order:2;flex:1;margin-bottom:0!important}
  .cols-dash>div:nth-child(2)>.panel:nth-child(2){order:1;margin-bottom:0}
  .cols-dash>div:nth-child(3)>.panel{flex:1}
  @media(max-width:1200px){.cols-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
  @media(max-width:880px){.cols-dash{grid-template-columns:1fr}}
  @media (max-width:900px){.cols,.col3{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .panel-h h3{margin:0;font-size:13.5px;font-weight:700}
  .panel-h .meta{font-size:11px;color:var(--muted);font-weight:600}
  .panel-b{padding:11px 12px}

  /* bar chart */
  .bars{display:flex;flex-direction:column;gap:8px}
  .bar-row{display:grid;grid-template-columns:84px 1fr 44px;align-items:center;gap:6px;font-size:11.5px}
  .bar-row .nm{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .bar-row .nm:hover{color:var(--accent)}
  .bar-track{height:18px;background:var(--panel-3);border-radius:5px;overflow:hidden;position:relative}
  .bar-fill{height:100%;border-radius:5px;background:var(--accent)}
  .bar-row .val{text-align:right;font-family:"IBM Plex Mono";font-size:11px;color:var(--ink-2)}

  /* tables */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:13px}
  .toolbar input.search{min-width:220px}
  .toolbar .sp{margin-left:auto}
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  thead th{background:var(--panel-2);font-family:Archivo;font-size:11px;letter-spacing:.03em;text-transform:uppercase;
    color:var(--ink-2);font-weight:700;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
  thead th .sortar{opacity:.4;font-size:9px;margin-left:3px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--accent-soft)}
  tbody tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono";font-size:12px}
  td.wrap{white-space:normal;min-width:160px;max-width:300px}
  .code{font-family:"IBM Plex Mono";font-size:11.5px;color:var(--accent-ink)}
  .hdot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px}
  .hdot.g{background:var(--good)} .hdot.a{background:var(--warn)} .hdot.r{background:var(--bad)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
  .pill.g{background:var(--good-soft);color:var(--good)} .pill.a{background:var(--warn-soft);color:var(--warn)}
  .pill.r{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--panel-3);color:var(--muted)}
  [contenteditable]{outline:none;border-radius:4px}
  [contenteditable]:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
  [contenteditable]:focus{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--panel)}

  /* heatmap */
  .heat td.hc{text-align:center;font-family:"IBM Plex Mono";font-size:11.5px;min-width:44px}
  .heat td.rname{font-weight:600;color:var(--ink-2);position:sticky;left:0;background:var(--panel);z-index:1}
  .heat thead th.num{text-align:center}

  /* passport */
  .pp-grid{display:grid;grid-template-columns:1fr 250px;gap:14px}
  @media (max-width:860px){.pp-grid{grid-template-columns:1fr}}
  .pp-id{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
  .pp-id .c{font-family:"IBM Plex Mono";color:var(--accent-ink);font-size:15px;font-weight:600}
  .pp-id h2{margin:0;font-size:21px}
  .pp-meta{display:flex;flex-wrap:wrap;gap:4px 22px;color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .pp-meta b{color:var(--ink-2);font-weight:600}
  .ppedit{outline:none;border-radius:4px;padding:0 4px;min-width:26px;display:inline-block;border-bottom:1px dashed var(--line-2);color:var(--ink);cursor:text}
  .ppedit:hover{background:var(--panel-2)}
  .ppedit:focus{background:var(--panel);border-bottom-color:var(--accent);box-shadow:inset 0 -1px 0 var(--accent)}
  .ppedit:empty::before{content:'—';color:var(--faint)}
  td.edc{cursor:text;white-space:normal;min-width:122px;max-width:160px;line-height:1.3;overflow-wrap:break-word;vertical-align:middle}
  td.edc:hover{background:var(--panel-2)}
  td.edc:focus{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--accent);outline:none}
  td.edc:empty::before{content:'—';color:var(--faint)}
  .pp-id h2[contenteditable]:hover{background:var(--panel-2);border-radius:4px}
  .pp-id h2[contenteditable]:focus{outline:1px solid var(--accent);outline-offset:2px;border-radius:4px}
  .health-tiles{display:flex;flex-direction:column;gap:8px}
  .ht{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel)}
  .ht .dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
  .ht .lb{font-size:12px;color:var(--ink-2)} .ht .sc{margin-left:auto;font-family:"IBM Plex Mono";font-weight:600;font-size:13px}
  .ht.main{border-width:2px} .ht.g{border-color:var(--good)} .ht.a{border-color:var(--warn)} .ht.r{border-color:var(--bad)}
  .ht.g .dot{background:var(--good)} .ht.a .dot{background:var(--warn)} .ht.r .dot{background:var(--bad)}
  .budget-mini td{padding:6px 10px}
  .budget-mini tr.tot td{font-weight:700;border-top:2px solid var(--line-2)}
  .drivers{font-size:12px;color:var(--ink-2);line-height:1.5}
  .drivers li{margin:2px 0}
  .km-done{color:var(--good);font-weight:700;margin-right:5px}
  .onepage-note{font-size:11.5px;color:var(--muted);background:var(--panel-2);border:1px dashed var(--line-2);border-radius:8px;padding:8px 11px;margin-bottom:12px}

  /* weights config */
  .weights{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px}
  .weights>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:600;font-family:"IBM Plex Mono";min-width:0;overflow:hidden}

  .empty{color:var(--muted);font-size:13px;padding:20px;text-align:center}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .foot{color:var(--muted);font-size:11.5px;text-align:center;padding:22px 0 0}
  /* ===== App footer (per-tab, editable + actions) ===== */
  .appfoot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:relative;margin:0 14px 18px;padding:11px 16px;border:1px solid var(--line);border-radius:14px;background:radial-gradient(120% 200% at 100% 0%,var(--accent-soft) 0%,transparent 55%),linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);box-shadow:var(--shadow);overflow:hidden}
  .appfoot:empty{display:none}
  /* ===== Capacité : BDD membres + planning présence ===== */
  .mtbl{width:100%;border-collapse:collapse}
  .mtbl th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:1}
  .mtbl td{padding:4px 8px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
  .mtbl td.mce{cursor:text} .mtbl td.mce:hover{background:var(--panel-2)} .mtbl td.mce:focus{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--accent);outline:none}
  .mtbl td.mce:empty::before{content:'—';color:var(--faint)}
  .mtbl select{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:inherit;font:inherit;font-size:12px;padding:2px 5px}
  .mtag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
  .mtag.int{background:var(--accent-soft);color:var(--accent-ink)} .mtag.pre{background:var(--copper-soft);color:var(--copper)}
  .xdel{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:13px;padding:2px 7px;border-radius:6px}
  .xdel:hover{background:var(--bad-soft);color:var(--bad)}
  .mtbl th.selc,.mtbl td.selc{width:30px;text-align:center;padding-left:7px;padding-right:2px}
  .mtbl input[type=checkbox]{cursor:pointer;accent-color:var(--accent);width:14px;height:14px;vertical-align:middle}
  .mtbl tr.selrow td{background:var(--accent-soft)}
  .selbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px;padding:8px 12px;
    border:1px solid var(--accent);background:var(--accent-soft);border-radius:9px;font-size:12.5px;color:var(--accent-ink)}
  .selbar b{font-family:Archivo;font-size:13.5px}
  .selbar .sp{margin-left:auto}
  .iconbtn.danger{border-color:var(--bad);color:var(--bad)}
  .iconbtn.danger:hover{background:var(--bad-soft);color:var(--bad)}
  .filewarn{display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding:11px 16px;
    background:var(--warn-soft);border-bottom:2px solid var(--warn);color:var(--ink);font-size:12.5px;line-height:1.45}
  .filewarn .fw-ic{font-size:19px;color:var(--copper);flex:0 0 auto}
  .filewarn .fw-txt{flex:1 1 320px;min-width:0}
  .filewarn .fw-txt b{display:block;font-family:Archivo;font-size:13.5px;margin-bottom:2px}
  .filewarn .fw-go{flex:0 0 auto;text-decoration:none;font-family:Archivo;font-weight:800;font-size:12.5px;
    color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-ink));border-radius:9px;padding:9px 15px;
    box-shadow:0 2px 8px rgba(17,94,117,.35)}
  .filewarn .fw-go:hover{filter:brightness(1.08)}
  .filewarn .fw-x{flex:0 0 auto;border:1px solid var(--line-2);background:transparent;border-radius:8px;
    padding:6px 10px;font-size:12px;color:var(--ink-2)}
  .filewarn .fw-x:hover{background:var(--panel)}
  /* Meme bandeau, autre propos : informer plutot qu'avertir. */
  .shellwarn{background:var(--accent-soft);border-bottom-color:var(--accent)}
  .shellwarn .fw-ic{color:var(--accent)}
  .shellwarn .fw-go{border:0;cursor:pointer;font-family:Archivo}
  /* Capacité : la vue est une colonne flex dont les enfants ne grandissent pas
     (.view>*{flex:0 0 auto}). Un tableau court laissait donc un vide entre le bas
     du bloc et la barre de pied de page. Ces blocs occupent la hauteur restante,
     et c'est leur tableau qui défile. */
  #bddMembres,#planPresence{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  #bddMembres>.panel-b,#planPresence>.panel-b{flex:1;display:flex;flex-direction:column;min-height:0}
  #bddMembres .tblwrap,#planPresence .tblwrap{flex:1 1 auto;max-height:none;min-height:140px}
  .pleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:9px}
  .pleg span{display:inline-flex;align-items:center;gap:6px}
  .pdot{width:12px;height:12px;border-radius:3px;display:inline-block}
  .ptbl{border-collapse:collapse}
  .ptbl th{font-size:10px;color:var(--muted);padding:4px 3px;text-align:center;white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:1}
  .ptbl td.pcell{text-align:center;min-width:30px;padding:4px 2px;border:1px solid var(--line);font-size:10.5px;cursor:pointer}
  .ptbl td.rname{position:sticky;left:0;background:var(--panel);white-space:nowrap;font-size:11.5px;padding:4px 10px 4px 4px;border-bottom:1px solid var(--line);z-index:1}
  .ptbl th.rname{left:0;z-index:2;text-align:left;padding-left:4px}
  /* En-tete a deux etages : la semaine coiffe ses jours. Le second etage se
     fige sous le premier, d'ou le decalage vertical. */
  .ptbl th.psem{top:0;border-left:2px solid var(--line-2);color:var(--ink-2);font-weight:600;padding:3px 2px}
  .ptbl th.pjour{top:21px;min-width:22px;padding:2px 1px;line-height:1.1;font-weight:500;color:var(--ink-2)}
  .ptbl th.pjour .pnum{display:block;font-size:9px;font-weight:400;color:var(--faint)}
  .ptbl th.pwe{background:var(--panel-3);color:var(--faint)}
  .ptbl th.pfer{background:var(--warn-soft);color:var(--warn)}
  .ptbl td.poff{background:var(--panel-3);cursor:default}
  .ptbl td.poff.pfer{background:var(--warn-soft)}
  .ptbl .pw1{border-left:2px solid var(--line-2)}
  .pdot-off{background:var(--panel-3);border:1px solid var(--line-2)}
  /* ===== Kit projet : check-list, organigramme, chiffrage, charge, macroplanning ===== */
  .ktabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .ktabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:9px;
    padding:7px 13px;font-family:Archivo;font-weight:700;font-size:12.5px;cursor:pointer}
  .ktabs button:hover{border-color:var(--accent)}
  .ktabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff;border-color:var(--accent)}
  .kstats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .kstat{flex:1 1 120px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 13px;box-shadow:var(--shadow)}
  .kstat b{display:block;font-family:Archivo;font-size:19px;font-weight:800;color:var(--accent-ink);line-height:1.1}
  .kstat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .kbar-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px;font-size:12px;color:var(--muted)}
  .kbar-tools input,.kbar-tools select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:inherit;font-size:12px}
  .ktbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .ktbl th{background:var(--panel-2);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
  .ktbl td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .ktbl tr.kgrp td{background:var(--panel-2);font-weight:700}
  .ktbl tr.ktot td{background:var(--panel-2);font-weight:800;font-family:Archivo}
  .ktbl tr.kna{opacity:.5}
  .ktbl .num{text-align:right;font-variant-numeric:tabular-nums}
  .kin{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;color:inherit;
    font:inherit;font-size:12.5px;padding:3px 5px;resize:vertical}
  .kin:hover{border-color:var(--line)}
  .kin:focus{border-color:var(--accent);background:var(--panel);outline:none}
  textarea.kin{min-height:26px;line-height:1.45;white-space:pre-wrap}
  .kdel{border:0;background:transparent;color:var(--bad);font-size:14px;cursor:pointer;opacity:.35;padding:0 4px}
  tr:hover .kdel{opacity:1}
  .kadd{border:1px dashed var(--line-2);background:transparent;color:var(--accent-ink);border-radius:8px;
    padding:5px 11px;font-size:11.5px;font-weight:700;cursor:pointer}
  .kadd:hover{border-color:var(--accent);background:var(--accent-soft)}
  .kst-Fait{background:var(--good-soft);color:var(--good)}
  .kst-En{background:var(--warn-soft);color:var(--warn)}
  .kst-A{background:var(--panel-2);color:var(--muted)}
  .kst-NA{background:var(--panel-3);color:var(--faint)}
  .ktbl select.kin{padding:3px 4px;font-weight:600}
  /* une couleur par lot / par pôle, comme dans l'outil d'origine */
  .lc0{border-left:3px solid #115e75}.lc1{border-left:3px solid #b0651f}.lc2{border-left:3px solid #1d7a52}
  .lc3{border-left:3px solid #7d4f9e}.lc4{border-left:3px solid #bd8413}.lc5{border-left:3px solid #c0392b}
  .lc6{border-left:3px solid #2b7e97}.lc7{border-left:3px solid #6a8a99}
  /* Organigramme : un bandeau par niveau */
  .ktier{margin-bottom:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .ktier h4{margin:0;padding:7px 12px;background:var(--panel-2);font-family:Archivo;font-size:12px;
    text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
  .ktier.n1 h4{background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff}
  .kgrid{display:grid;gap:9px;padding:11px}
  .kperson{border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:var(--panel-2);min-width:0}
  .kperson .kph{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .kperson small{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
  .kperson .krole{font-weight:700;font-size:12px}
  /* Macroplanning */
  .kgantt{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
  .kaxis{display:flex;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}
  .kaxis div{padding:4px 2px;text-align:center;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden}
  .krow{position:relative;height:30px;border-bottom:1px solid var(--line)}
  .krow:last-child{border-bottom:0}
  .kmonth{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.7}
  .kbar{position:absolute;top:5px;height:20px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));
    color:#fff;font-size:10.5px;display:flex;align-items:center;padding:0 7px;white-space:nowrap;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .kbar.coordination{background:linear-gradient(135deg,#b0651f,#8a4e18)}
  .kbar.gate{background:linear-gradient(135deg,#7d4f9e,#5d3a76)}
  .kbar i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28);border-radius:5px 0 0 5px}
  .kbar span{position:relative}
  .kms{position:absolute;top:3px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;
    border:0;background:transparent;cursor:grab;color:inherit;font:inherit;padding:0}
  .kms:active{cursor:grabbing}
  .kms.libre{transform:none;flex-direction:row;align-items:center;gap:5px;padding-left:7px;opacity:.75}
  .kms.libre i{background:var(--faint)}
  .kms i{width:13px;height:13px;background:var(--copper);transform:rotate(45deg);border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .kms span{font-size:9.5px;color:var(--ink-2);white-space:nowrap;margin-top:1px}
  .knodate{padding:6px 10px;font-size:11.5px;color:var(--faint);font-style:italic}
  .klegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
  .klegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  /* ===== One Page projet : reprise de l'outil « One Page — CSD » ===== */
  .op{--q1:#dbeafe;--q2:#dcfce7;--q3:#fef9c3;--q4:#fce7f3;--opg:#16a34a;--opp:#8b5cf6;
      --opo:#f59e0b;--opr:#ef4444;--opb:#3b82f6;font-size:12.5px}
  :root[data-theme="dark"] .op{--q1:#1e3a5f;--q2:#14361f;--q3:#3a3410;--q4:#3d1c30}
  .op .ophead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border:1px solid var(--line);
    border-radius:11px;background:var(--panel);margin-bottom:10px;font-family:Archivo}
  .op .ophead .pid{font-weight:800;color:var(--accent-ink)}
  .op .ophead .pname{font-weight:800;font-size:15px}
  .op .ophead .pcode{font-weight:700;color:var(--copper)}
  .op .ophead .opdate{margin-left:auto;font-family:'IBM Plex Sans';font-size:11.5px;color:var(--muted)}
  .op .opgrid{display:grid;grid-template-columns:1fr 268px;gap:10px;align-items:start}
  .op .oprow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .op .oprow3{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:10px;margin-top:10px}
  .op .oppan{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
  .op .oph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 11px;
    color:#fff;font-family:Archivo;font-weight:800;font-size:11.5px;letter-spacing:.05em}
  .op .oph .add{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:6px;width:21px;height:21px;
    font-size:14px;line-height:1;cursor:pointer}
  .op .h-green{background:var(--opg)}.op .h-purple{background:var(--opp)}.op .h-orange{background:var(--opo)}
  .op .h-red{background:var(--opr)}.op .h-blue{background:var(--opb)}
  .op table{width:100%;border-collapse:collapse;font-size:11.5px}
  .op th{background:var(--panel-2);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;
    padding:5px 7px;text-align:left;border-bottom:1px solid var(--line)}
  .op td{padding:4px 7px;border-bottom:1px solid var(--line);vertical-align:top}
  .op .num{text-align:right;font-variant-numeric:tabular-nums}
  .op .opbody{padding:7px 9px;display:flex;flex-direction:column;gap:5px}
  .op .opitem{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;line-height:1.45}
  .op .opitem .b{color:var(--opg);font-weight:800}
  .op .opitem.ns .b{color:var(--opb)}
  /* frise */
  .op .gq{display:grid}
  .op .gq div{text-align:center;font-size:9.5px;font-weight:700;color:#334155;padding:2px 0;border-right:1px solid var(--line)}
  .op .gm{display:grid;border-top:1px solid var(--line)}
  .op .gm div{text-align:center;font-size:9px;color:var(--muted);padding:2px 0;border-right:1px solid var(--line)}
  .op .garea{position:relative;height:26px}
  .op .garea.ms{height:78px;overflow:visible}
  .op .gbg{position:absolute;inset:0;display:grid}
  .op .gbg div{border-right:1px solid var(--line)}
  .op .gbar{position:absolute;top:4px;height:18px;border-radius:4px;color:#fff;font-size:10px;
    display:flex;align-items:center;justify-content:center;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.25);white-space:nowrap;overflow:hidden}
  .op .gbar:active,.op .gbar.dragging{cursor:grabbing;filter:brightness(1.08)}
  .op .gdia{position:absolute;width:12px;height:12px;transform:translateX(-50%) rotate(45deg);border-radius:2px;
    cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .op .gdia:active{cursor:grabbing}
  .op .gdl{position:absolute;transform:translateX(-50%);font-size:9px;white-space:nowrap;color:var(--ink-2);pointer-events:none}
  .op .gdl.sub{color:var(--muted);font-size:8.5px}
  .op .gmk{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.85}
  .op .gmk.end{background:var(--accent)}
  .op .gmk .lab{position:absolute;top:-1px;left:3px;font-size:8.5px;color:var(--bad);white-space:nowrap}
  .op .gmk.end .lab{color:var(--accent)}
  .op .oplegend{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:6px 10px;font-size:10px;color:var(--muted);border-top:1px solid var(--line)}
  .op .sw{display:inline-block;width:13px;height:9px;border-radius:2px}
  /* pastilles de statut */
  .op .pill{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:10px;font-weight:700;background:var(--panel)}
  .op select.pill{cursor:pointer}
  .op .p-done{background:var(--good-soft);color:var(--good);border-color:var(--good)}
  .op .p-wip{background:var(--blue-soft,#dbeafe);color:#1d4ed8;border-color:#93c5fd}
  .op .p-late{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
  .op .p-ns{background:var(--panel-2);color:var(--muted)}
  /* statut projet */
  .op .pstat{padding:9px;display:flex;flex-direction:column;gap:7px}
  .op .tile{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer;background:var(--panel-2)}
  .op .tile .dot{width:13px;height:13px;border-radius:50%}

  /* ===== CSD — Comité Schéma Directeur ===== */
  .csd-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:14px}
  .csd-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow)}

  .csd-card .ic{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-size:14px}
  .csd-card .v{font-family:Archivo;font-size:25px;font-weight:800;line-height:1.1;margin-top:5px}
  .csd-alerts{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
  .csd-alerts .ah{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--warn-soft);
    color:var(--warn);font-family:Archivo;font-weight:800;font-size:12px;border-bottom:1px solid var(--line)}
  .csd-alerts .badge{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:10.5px}
  .csd-alert{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .csd-alert:last-child{border-bottom:0}
  .csd-alert:hover{background:var(--panel-2)}
  .csd-alert .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:0 0 auto}
  .csd-alert .n{font-size:12px;font-weight:600;line-height:1.35}
  .csd-alert .s{font-size:10.5px;color:var(--muted);margin-top:1px}
  .csd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:10px}
  .pcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;
    padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,box-shadow .14s}
  .pcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,42,67,.14)}

  .pcard .ti{font-size:12.5px;font-weight:700;line-height:1.3}

  .pcard .bd{margin-top:7px;font-size:11px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
  .pcard .rw{display:flex;justify-content:space-between;gap:8px}
  .pcard .bg2{background:var(--panel-2);border-radius:5px;padding:0 6px;font-size:10px;color:var(--muted)}
  .pcard .dl{border-radius:6px;padding:2px 7px;font-size:10px;align-self:flex-start}
  .csd-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
  .plist{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .plist:last-child{border-bottom:0}
  .plist:hover{background:var(--panel-2)}
  .plist .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .plist .n{font-size:12px;font-weight:600}
  .plist .s{font-size:10.5px;color:var(--muted)}
  .csd-sec{margin-bottom:20px}
  .csd-sech{display:flex;align-items:center;gap:10px;margin-bottom:9px;padding-bottom:7px;border-bottom:2px solid var(--line)}
  .csd-sech .ti{font-family:Archivo;font-weight:800;font-size:13.5px}
  .csd-sech .su{font-size:11px;color:var(--muted)}
  .csd-det{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;padding:12px}
  .csd-f{display:flex;flex-direction:column;gap:2px}

  /* ===== Organigramme projet : un arbre, pas une grille ===== */
  .orgc{--n1:#0b4658;--n2:#115e75;--n3:#b0651f;--n4:#1d7a52;padding:6px 2px 10px}
  .orgc .orgtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .orgc .orgkpi{display:flex;gap:8px;flex-wrap:wrap}
  .orgc .orgk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 11px;box-shadow:var(--shadow)}
  .orgc .orgk b{font-family:Archivo;font-size:16px;font-weight:800;color:var(--accent-ink);margin-right:5px}
  .orgc .orgk span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .orgl{position:relative}
  .orgl+.orgl{margin-top:4px}
  /* le tronc entre deux niveaux */
  .orgl+.orgl::before{content:"";display:block;width:2px;height:20px;margin:0 auto;
    background:linear-gradient(var(--line-2),var(--line-2))}
  .orgh{display:flex;align-items:center;gap:9px;justify-content:center;margin:8px 0 4px}

    color:#fff;border-radius:999px;padding:3px 10px}
  .orgl.l1 .orgh .tag{background:var(--n1)}.orgl.l2 .orgh .tag{background:var(--n2)}
  .orgl.l3 .orgh .tag{background:var(--n3)}.orgl.l4 .orgh .tag{background:var(--n4)}
  .orgh .lb{font-size:12px;color:var(--ink-2);font-weight:600}
  .orgh .cnt{font-size:10.5px;color:var(--faint)}
  /* la rangée de cartes et sa barre de liaison */
  /* Une grille plutôt qu'un flux : les cartes reportées à la ligne s'alignent
     sous les colonnes du dessus, au lieu de flotter seules au centre. */
  .orgr{display:grid;grid-template-columns:repeat(auto-fit,196px);justify-content:center;
    gap:24px 10px;position:relative;padding-top:20px;border-radius:12px;transition:background .15s}
  .orgr.over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:4px}
  .orgl.l1 .orgr{padding-top:4px}
  .orgr::before{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;background:var(--line-2);border-radius:2px}
  .orgl.l1 .orgr::before,.orgr.solo::before{display:none}
  .orgcard{position:relative;width:auto;background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:11px 12px 10px;box-shadow:var(--shadow);cursor:grab;transition:transform .12s,box-shadow .18s,border-color .18s}
  .orgcard::before{content:"";position:absolute;top:-20px;left:50%;width:2px;height:20px;background:var(--line-2)}
  .orgl.l1 .orgcard::before,.orgcard.nostub::before{display:none}
  /* carte reportée à la ligne : un simple liseré de rattachement, pas un
     trait qui monterait dans le vide. */
  .orgcard.nostub{box-shadow:var(--shadow),inset 3px 0 0 var(--line-2)}
  .orgcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(16,42,67,.16);border-color:var(--accent)}
  .orgcard.dragging{opacity:.5;cursor:grabbing}
  .orgcard .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;
    font-family:Archivo;font-weight:800;font-size:14.5px;letter-spacing:.02em;box-shadow:0 3px 9px rgba(0,0,0,.18)}
  .orgcard.l1 .av{background:linear-gradient(135deg,var(--n1),#06303d)}
  .orgcard.l2 .av{background:linear-gradient(135deg,var(--n2),var(--n1))}
  .orgcard.l3 .av{background:linear-gradient(135deg,var(--n3),#8a4e18)}
  .orgcard.l4 .av{background:linear-gradient(135deg,var(--n4),#145a3c)}
  .orgcard.vide{border-style:dashed;background:var(--panel-2)}
  .orgcard.vide .av{background:var(--panel-3);color:var(--faint);box-shadow:none}
  .orgcard .hd{display:flex;gap:10px;align-items:center}
  .orgcard .ro{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    line-height:1.25;border:1px solid transparent;border-radius:5px;padding:1px 3px;margin:0 -3px}
  .orgcard .na{font-size:13px;font-weight:700;line-height:1.3;color:var(--ink);
    border:1px solid transparent;border-radius:5px;padding:1px 3px;margin:1px -3px 0}

  .orgcard .ro:hover,.orgcard .na:hover{border-color:var(--line)}
  .orgcard .ro:focus,.orgcard .na:focus{border-color:var(--accent);background:var(--panel);outline:none}
  .orgcard .ft{display:flex;align-items:center;gap:6px;margin-top:9px;opacity:0;transition:opacity .15s}
  .orgcard:hover .ft,.orgcard:focus-within .ft{opacity:1}

    background:var(--panel-2);color:var(--ink-2);font-size:10.5px;font-weight:700}
  .orgempty{border:1px dashed var(--line-2);border-radius:11px;padding:9px 14px;color:var(--faint);
    font-size:11.5px;font-style:italic;background:var(--panel-2)}
  @media(max-width:860px){.orgr{grid-template-columns:repeat(auto-fit,164px)}}
  /* ===== GEDT : recherche de projet ===== */

  .appfoot::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 55%,var(--copper) 100%)}
  .af-left{display:flex;align-items:center;gap:11px;min-width:0;flex:1 1 340px}
  .af-mk{width:30px;height:30px;flex:0 0 auto;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff;font-family:Archivo;font-weight:800;font-size:14px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(17,94,117,.35)}

  .af-act{font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;transition:transform .07s,border-color .12s,color .12s,background .12s;white-space:nowrap}
  .af-act:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}

  .addrow{margin-top:10px}

  .addrow button:hover{border-color:var(--accent);color:var(--accent)}
  /* Risques : des paragraphes, pas des cellules de tableur. Les retours à la
     ligne saisis sont rendus (pre-wrap), le texte respire, et la colonne
     s'aligne en haut pour que deux cellules de hauteurs différentes se lisent
     ensemble. */
  .rktbl{table-layout:fixed;width:100%}
  .rktbl td,.rktbl th{vertical-align:top}
  .rkcell{white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:12.5px;
    padding:8px 10px;min-width:200px}
  .rkcell:focus{background:var(--accent-soft);outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
  .rkmeta{padding-top:8px;font-size:12px;white-space:pre-wrap}

  .rkcell:empty:before,.rkmeta:empty:before{content:attr(data-vide);color:var(--faint);font-style:italic}
  .orgcard .na:empty:before{content:attr(data-vide);color:var(--faint);font-style:italic}
  .bmini{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:1px}
  /* Plein écran : l'espace gagné va au contenu, pas aux marges. */
  :root.plein .view{padding-top:10px}
  :root.plein #fsBtn{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
  /* Poignée de déplacement : discrète, visible à l'approche de la ligne. */
  #projTbl td.pgrab{width:26px;text-align:center;cursor:grab;user-select:none;padding:0}
  #projTbl td.pgrab .grabdot{color:var(--line-2);font-size:14px;letter-spacing:-1px}
  #projTbl tbody tr:hover td.pgrab .grabdot{color:var(--muted)}
  #projTbl td.pgrab:active{cursor:grabbing}
  #projTbl tbody tr.dragging{opacity:.45}
  #projTbl tbody tr.dropav td{box-shadow:inset 0 3px 0 -1px var(--accent)}
  #projTbl tbody tr.dropap td{box-shadow:inset 0 -3px 0 -1px var(--accent)}
  /* Une ligne qui vient d'être créée s'annonce, le temps qu'on la repère. */
  @keyframes flashrow{from{background:var(--accent-soft)}to{background:transparent}}
  tr.flashrow td{animation:flashrow 2.4s ease-out}
  .dupmk{font-size:9.5px;font-weight:700;letter-spacing:.02em;padding:1px 6px;border-radius:5px;
    background:var(--copper-soft);color:var(--copper);white-space:nowrap}

    background:var(--panel-3);color:var(--muted);white-space:nowrap}
  /* Le tableau du portefeuille défile horizontalement dans sa colonne : sans
     ancrage, les actions sortaient de l'écran et restaient introuvables. */
  #projTbl .pact{position:sticky;right:0;background:var(--panel);z-index:1;
    box-shadow:-6px 0 8px -7px rgba(16,42,67,.35);text-align:center}
  /* Les autres en-têtes sont figés en haut avec z-index 2 et défilent sous le
     doigt : sans rang supérieur, ils recouvraient « Actions ». */
  #projTbl thead th.pact{background:var(--panel-2);z-index:3}
  #projTbl tbody tr:hover .pact{background:var(--panel-2)}
  td.pact .iconbtn{opacity:.45} tr:hover td.pact .iconbtn{opacity:1}

  /* ---- Achats & Engagements · Actions de suivi · Macroplanning ---- */

    background:var(--panel-3);color:var(--muted);font-size:10.5px;font-weight:800}

  /* ---- Actions ---- */

  /* ---- Macroplanning portefeuille ---- */

/* Redessiner la vue remplace tout son contenu, y compris le champ en cours de
   frappe : le curseur s'y perdait a chaque caractere, et un filtre de recherche
   n'acceptait qu'une lettre. On retient quel champ avait le curseur et a quelle
   position, pour le rendre a l'identique apres le rendu. */
function renderGardeFocus(fn){
  const a=document.activeElement, id=a&&a.id;
  let deb=null, fin=null;
  try{ deb=a.selectionStart; fin=a.selectionEnd; }catch(_){}
  fn();
  if(!id) return;
  const n=document.getElementById(id);
  if(!n || n===document.activeElement) return;
  try{ n.focus({preventScroll:true}); }catch(_){ n.focus(); }
  try{ if(deb!=null && n.setSelectionRange) n.setSelectionRange(deb,fin); }catch(_){}
}

function poleGroup(p){
  const s=norm(p);
  if(s.includes('plan tr')||s.startsWith('blp-plan')) return 'Plan Transfo';
  if(s.startsWith('blp')) return 'BLP';
  if(s.startsWith('site')||s==='infra'||s==='campagne ktop'||s==='housekeeping'||s==='vacancy rate') return 'INFRA';
  if(s==='ee') return 'EE';
  if(s.startsWith('digital')||s==='mars') return 'Digital';
  if(s.includes('qc')||s==='sc'||s==='fu'||s.includes('fu qc sc')||s==='npi') return 'SC/QC/FU';
  if(s==='autom'||s==='hse'||s==='qa') return 'Transverse';
  return 'Autres';
}

/* Les pôles du portefeuille. poleGroup() les déduit du libellé d'origine ;
   cette liste est celle qu'on propose à la main, quand un projet doit changer
   de pôle (un Housekeeping rattaché à INFRA qui relève en fait du BLP). */
const POLES=['INFRA','EE','BLP','Plan Transfo','SC/QC/FU','Digital','Transverse','Autres'];
function polesConnus(){
  return [...new Set(POLES.concat((S&&S.projects||[]).filter(p=>!p.deleted).map(p=>p.group).filter(Boolean)))];
}
/* Changer le pôle d'un projet. Le choix est marqué (p.poleFixe) pour que les
   déductions de migrate() ne le défassent pas au chargement suivant : sans
   cela, « Housekeeping » redeviendrait INFRA et le changement paraîtrait ne
   jamais s'enregistrer. Le libellé d'origine (p.pole) est conservé — c'est la
   provenance de la donnée, et elle garde sa valeur une fois le pôle corrigé ;
   le secteur n'est repris que s'il ne disait rien de plus que l'ancien pôle. */
function changerPole(p,nouveau){
  if(!p || !nouveau) return false;
  const av=p.group||'';
  if(nouveau===av) return false;
  p.group=nouveau;
  p.poleFixe=true;
  if(!p.secteur || norm(p.secteur)===norm(av)) p.secteur=nouveau;
  logChange('Projet '+(p.shine||p.nom),'pôle',av||'—',nouveau);
  return true;
}
function selPole(p,attr,extra){
  return `<select class="polesel" ${attr} ${extra||''} title="Changer le pôle : le projet quitte cette section et rejoint celle du pôle choisi">`
    + polesConnus().sort((a,b)=>a.localeCompare(b,'fr')).map(g=>`<option value="${esc(g)}" ${g===p.group?'selected':''}>${esc(g)}</option>`).join('')
    + `</select>`;
}

/* Jours fériés français : quatre dates fixes plus celles calées sur Pâques.
   Algorithme de Meeus/Butcher, purement arithmétique, aucun tableau à tenir à jour. */
function paquesFR(a){
  const g=a%19, c=Math.floor(a/100);
  const h=(c-Math.floor(c/4)-Math.floor((8*c+13)/25)+19*g+15)%30;
  const i=h-Math.floor(h/28)*(1-Math.floor(29/(h+1))*Math.floor((21-g)/11));
  const j=(a+Math.floor(a/4)+i+2-c+Math.floor(c/4))%7;
  const pp=i-j, mois=3+Math.floor((pp+40)/44), jour=pp+28-31*Math.floor(mois/4);
  return new Date(a,mois-1,jour);
}
function feriesFR(a){
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const P=paquesFR(a), dec=(n)=>{const d=new Date(P); d.setDate(d.getDate()+n); return d;};
  const f={};
  f[iso(new Date(a,0,1))]="Jour de l'an";      f[iso(dec(1))]="Lundi de Pâques";
  f[iso(new Date(a,4,1))]="Fête du Travail";   f[iso(new Date(a,4,8))]="Victoire 1945";
  f[iso(dec(39))]="Ascension";                 f[iso(dec(50))]="Lundi de Pentecôte";
  f[iso(new Date(a,6,14))]="Fête nationale";   f[iso(new Date(a,7,15))]="Assomption";
  f[iso(new Date(a,10,1))]="Toussaint";        f[iso(new Date(a,10,11))]="Armistice";
  f[iso(new Date(a,11,25))]="Noël";
  return f;
}
/* Les jours de l'année, groupés en semaines commençant le lundi. La première
   semaine est tronquée au 1er janvier : en 2026 elle ne porte que du jeudi 1
   au dimanche 4, ce qui fait deux jours ouvrés. */
const MOIS_CT=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const JOURS_LB=['D','L','M','M','J','V','S'];   // getDay() : 0 = dimanche
const JOURS_NOM=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
function calendrierAnnee(a){
  const fer=feriesFR(a), out=[]; let sem=1;
  const d=new Date(a,0,1);
  while(d.getFullYear()===a){
    // nouveau lundi (hors tout premier jour) : on passe à la semaine suivante
    if(d.getDay()===1 && out.length) sem++;
    const k=`${a}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const we=(d.getDay()===0||d.getDay()===6);
    out.push({iso:k, jour:d.getDay(), num:d.getDate(), mois:d.getMonth(),
              sem, we, ferie:fer[k]||null, ouvre:!we && !fer[k]});
    d.setDate(d.getDate()+1);
  }
  return out;
}

function suiviDateAuto(v){
  if(v==null||v==='') return '';
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){ const y=+m[3]<100?2000+ +m[3]:+m[3]; return y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'); }
  return '';
}

  r.uoFilter=r.uoFilter||{scope:'',q:''}; r.gedFilter=r.gedFilter||{proj:'',dossier:'',statut:'',q:''}; if(r.gedFilter.rubrique===undefined)r.gedFilter.rubrique=''; if(r.gedFilter.rubrique==='D.O.E Fournisseur & Autres')r.gedFilter.rubrique='D.O.E Fournisseur'; if(r.gedFilter.nolink===undefined)r.gedFilter.nolink=false; r.footNotes=r.footNotes||{};
  if(!r.phScope) r.phScope='__all__'; if(!r.actFilter) r.actFilter={proj:'',statut:'',crit:''};
  migrerSuivi(r);

  // recreerait a chaque chargement tout PM|PL d'un projet, et une suppression

  r.membersRemoved = Array.isArray(r.membersRemoved) ? r.membersRemoved : [];
  r.members = (r.members && r.members.length) ? r.members

  // son ancien nom au chargement suivant.
  if((r.seedRoster||0) < SEED_ROSTER_VERSION){
    const kk=s=>norm(s).replace(/[^a-z0-9]/g,'');

    const have=new Set((r.members||[]).map(m=>kk(m.nom)));
    SEED_MEMBERS.forEach(m=>{ const k=kk(m.nom);
      if(k && !have.has(k) && !gone.has(k)){ have.add(k); r.members.push({...m}); } });

      (x && typeof x==='object') ? {t:String(x.t||''), st:x.st||'À faire'} : {t:String(x==null?'':x), st:'À faire'});
    if(Array.isArray(pp.milestones)) pp.milestones.forEach(m=>{ if(m && !m.st) m.st='In progress'; });
  });

     hebdomadaire ancienne est reportee sur les jours ouvres de sa semaine,

    const ouvres={}; CAL.forEach(j=>{ if(j.ouvre) (ouvres[j.sem]=ouvres[j.sem]||[]).push(j.iso); });
    Object.keys(r.presence).forEach(nom=>{
      const src=r.presence[nom]||{}, out={};

        if(/^\d{4}-\d{2}-\d{2}$/.test(k)){ out[k]=src[k]; return; }   // deja au jour
        if(/^\d{1,2}$/.test(k)) (ouvres[+k]||[]).forEach(iso=>{ out[iso]=src[k]; });

      r.presence[nom]=out;

    const ok=n=>/^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’.-]+(?:\s+[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’.-]+)+$/.test(n) && !/(.)\1\1/i.test(n);
    const have=new Set(r.members.map(m=>key(m.nom))), gone=new Set(r.membersRemoved.map(key));
    (r.projects||[]).forEach(p=>{ [p.pm,p.pl].forEach(v=>{ if(!v)return; String(v).split('/').map(x=>x.trim()).filter(Boolean).forEach(n=>{ const k=key(n); if(k && ok(n) && !have.has(k) && !gone.has(k)){ have.add(k); r.members.push({nom:n,ini:'',role:'',pole:(p.group||'INFRA'),type:'',societe:'',tel:'',dispo:100,depart:''}); } }); }); }); })();
  return r;
}

/* ======================= Health engine ======================= */
// Finance-driven (real data); planning/risk/res/qual/doc use passport signal or neutral.
function financeHealth(p){
  const c1=p.c1||0, c2=(p.c2!=null?p.c2:p.c1)||0, act=p.act||0;
  if(!c1 && !c2) return {score:70,label:'n/a'};
  const dev = c1? Math.abs((c2-c1)/c1)*100 : 0;      // révision budgétaire vs C1
  const conso = c1? (act/c1)*100 : 0;                 // consommation
  let score=100;
  score -= Math.min(50, dev*2);                       // 5% écart => -10
  if(conso>100) score -= Math.min(30,(conso-100));
  return {score:Math.max(0,Math.round(score)), dev:Math.round(dev), conso:Math.round(conso)};
}
function projHealth(p){
  const w=S.config.weights;
  const fin=financeHealth(p);
  // neutral baselines where no operational data yet
  const pp=S.passports[p.id];
  const planning = pp? 78 : 75;
  const risk = pp&&pp.risks&&pp.risks.length? Math.max(40,90-pp.risks.length*12):80;
  const res=80, qual=85, doc = pp?85:70;
  let composite = (w.plan*planning + w.fin*fin.score + w.risk*risk + w.res*res + w.qual*qual + w.doc*doc)/(w.plan+w.fin+w.risk+w.res+w.qual+w.doc);
  composite=Math.round(composite);
  let band = composite>=75?'g':composite>=55?'a':'r';
  // statut override
  const st=norm(p.statut);
  if(st && st!=='ok' && st!=='' ) { if(band==='g') band='a'; }
  if(p.hoverride) band=p.hoverride;
  if(pp&&pp.health&&pp.health.override) band=pp.health.override;
  return {composite,band,fin,planning,risk,res,qual,doc};
}

/* ---- Persistance navigateur : IndexedDB (l'état dépasse le plafond ~5 Mo de localStorage) ----
   Utilisé UNIQUEMENT en mode coquille (sans serveur, SRV vide) : sauvegarde et
   rechargement des données importées. En mode serveur, la source de vérité reste le fichier. */
const IDB_NAME='ppm_store', IDB_STORE='kv', IDB_KEY='state';
function idbOpen(){
  return new Promise((res,rej)=>{
    let r; try{ r=indexedDB.open(IDB_NAME,1); }catch(e){ return rej(e); }
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function idbSave(obj){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(obj,IDB_KEY);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  }));
}
function idbLoad(){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const g=tx.objectStore(IDB_STORE).get(IDB_KEY);
    g.onsuccess=()=>res(g.result||null); g.onerror=()=>rej(g.error);
  }));
}
/* ---- Verrou par mot de passe (mode coquille uniquement) : WebCrypto AES-256-GCM ----
   Sans serveur, la seule vraie protection est de CHIFFRER les données. La clé est
   dérivée du mot de passe (PBKDF2 210k, SHA-256) et n'est jamais stockée ; un mot de
   passe faux échoue au déchiffrement (pas de hash à comparer). Métadonnée en clair
   (sel + e-mail affiché) dans localStorage ('ppm_lock') ; données chiffrées dans
   IndexedDB. Sans serveur, aucune copie localStorage en clair. */
const LOCK={active:false, key:null, email:'', salt:''};
const LOCK_OK=!!(window.crypto && window.crypto.subtle);
function lockB64(buf){ let s='', b=new Uint8Array(buf); for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function lockB64d(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
function lockMeta(){ try{ return JSON.parse(localStorage.getItem('ppm_lock')||'null'); }catch(_){ return null; } }
async function lockDeriveKey(password, saltB64){
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:lockB64d(saltB64), iterations:210000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function lockEncrypt(stateObj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, LOCK.key, new TextEncoder().encode(JSON.stringify(stateObj)));
  return { enc:1, email:LOCK.email||'', salt:LOCK.salt, iv:lockB64(iv), ct:lockB64(ct) };
}
async function lockDecrypt(blob, key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:lockB64d(blob.iv)}, key, lockB64d(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
// Active le verrou : dérive la clé, chiffre l'état courant, purge tout clair local.
async function lockActivate(password, email){
  const salt=lockB64(crypto.getRandomValues(new Uint8Array(16)));
  LOCK.key=await lockDeriveKey(password, salt); LOCK.salt=salt; LOCK.email=email||''; LOCK.active=true;
  try{ localStorage.setItem('ppm_lock', JSON.stringify({active:true, salt:salt, email:LOCK.email})); }catch(_){}
  try{ localStorage.removeItem('ppm_vitry_state'); }catch(_){}
  await doSave();
}
async function lockRemove(){
  LOCK.active=false; LOCK.key=null; LOCK.salt=''; LOCK.email='';
  try{ localStorage.removeItem('ppm_lock'); }catch(_){}
  await doSave();
}
// Au démarrage en mode coquille : si un verrou existe -> écran de déverrouillage ;
// sinon adopte l'état IndexedDB s'il est plus récent que l'amorçage.
async function idbHydrate(){
  if(SRV) return;
  const lk=lockMeta();
  if(lk && lk.active){ showUnlock(lk); return; }
  let rec=null; try{ rec=await idbLoad(); }catch(_){}
  if(!rec) return;
  const st = (rec.enc===0) ? rec.state : (rec.enc===1 ? null : rec);   // enc:0 = clair enveloppé ; sinon état brut hérité
  if(st && (st._savedAt||0) > ((S&&S._savedAt)||0)) adoptServerState(st,'Données locales chargées '+hhmm());
}

// Adopte un état venu du serveur (plus récent) — ne écrase jamais silencieusement.
function adoptServerState(st,msg){
  try{ S=migrate(st); }catch(_){ return false; }
  try{ const a=appliquerSeedOP(), b=migrerBudgetOP(), c=appliquerCorrSeed(); if(a||b||c) scheduleSave(); }
catch(e){ S._seedErr=String(e&&e.message||e); console.warn('Amorce des One Pages interrompue :',e); }
  baselineSavedAt=(S&&S._savedAt)||0; dirty=false;
  try{ const a=appliquerSeedOP(), b=migrerBudgetOP(), c=appliquerCorrSeed(); if(a||b||c) scheduleSave(); }
catch(e){ S._seedErr=String(e&&e.message||e); console.warn('Amorce des One Pages interrompue :',e); }
  // Aucune copie navigateur en clair quand l'auth serveur OU le verrou local est actif.
  if(!AUTH.enforced && !(typeof LOCK!=='undefined' && LOCK.active)){ try{ localStorage.setItem('ppm_vitry_state',JSON.stringify(S)); }catch(_){} }
  try{ render(); }catch(_){}
  setSave('ok', msg||('Synchronisé '+hhmm()));
  return true;
}
// Au démarrage : récupère l'état partagé (_ppm_state.json) — continuité multi-postes.
// force=true : le serveur fait autorite quoi qu'il arrive (juste apres connexion).
// Sinon une copie navigateur plus recente mais perimee gagnerait, puis ecraserait
// le fichier partage a la sauvegarde suivante.
async function syncFromServer(force){
  try{
    const r=await api('/state?_ts='+Date.now());
    if(r.status===401){ showLogin('Session expirée. Reconnectez-vous.'); return; }
    if(!r.ok) return;
    const j=await r.json(); const st=j&&j.state;
    if(!st) return;
    if(force || (st._savedAt||0) > ((S&&S._savedAt)||0)) adoptServerState(st,'À jour (serveur) '+hhmm());
    else baselineSavedAt=Math.max(baselineSavedAt,(st._savedAt||0));
  }catch(_){ /* serveur absent : mode local seul */ }
}
function setSave(state,txt){
  const el=$('#saveState'); if(el){ el.className='savestate '+state; const t=$('.t',el); if(t)t.textContent=txt; }
  const b=document.getElementById('saveBtn');
  if(b){ b.classList.toggle('dirty',state==='pend'||state==='err'); b.classList.toggle('saved',state==='ok');
    b.textContent = state==='pend'?'💾 Enregistrer •' : state==='err'?'⚠ Réessayer' : state==='ok'?'✓ Enregistré':'💾 Enregistrer';
    b.title = state==='err' && SAVE_MOTIF ? ('Échec de l\'enregistrement — '+SAVE_MOTIF+'\n\nCliquez pour réessayer. Pour ne rien perdre : ⇄ Données → Exporter.')
            : 'Enregistrer maintenant (Ctrl+S)'; }
}
function scheduleSave(){
  dirty=true; setSave('pend','Modifié…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,1000);
}
// Enregistrement en profondeur : localStorage TOUJOURS (copie de secours, même hors-ligne)
// PUIS le fichier via le serveur local. Horodatage pour départager les sources au chargement.
async function doSave(){
  clearTimeout(saveTimer);
  if(typeof AUTH!=='undefined' && AUTH.locked) return false;   // pas de session : aucune ecriture
  S._savedAt=Date.now();
  const payload=JSON.stringify(S);
  let ls=false;
  if(!AUTH.enforced){
    if(!SRV && LOCK.active && LOCK.key){
      try{ await idbSave(await lockEncrypt(S)); ls=true; }catch(_){}       // coquille verrouillée : chiffré
    } else {
      try{ localStorage.setItem('ppm_vitry_state',payload); ls=true; }catch(_){}
      if(!SRV){ try{ await idbSave({enc:0,state:S}); ls=true; }catch(_){} } // coquille : IndexedDB (>5 Mo)
    }
  }
  let motif='';                 // pourquoi l'enregistrement a échoué, pour pouvoir le dire
  try{
    if(!SRV) throw new Error('mode-coquille');                // pas de serveur : persistance navigateur seule
    const r=await api('/save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({baseSavedAt:baselineSavedAt,state:S})});
    if(r.status===401){ setSave('err','Session expirée'); showLogin('Session expirée. Reconnectez-vous.'); return false; }
    if(r.status===409){ // ANTI-ÉCRASEMENT : un autre poste a enregistré plus récemment
      const j=await r.json().catch(()=>null);
      try{ localStorage.setItem('ppm_vitry_state_conflit',payload); }catch(_){}
      if(j&&j.state){
        adoptServerState(j.state,'Conflit — version serveur chargée');
        alert("Un autre poste a enregistré des données plus récentes.\n\nLa version du serveur vient d'être chargée (rien n'a été écrasé).\nVotre saisie non enregistrée est sauvegardée localement sous « ppm_vitry_state_conflit ».");
      } else setSave('err','Conflit — rechargez');
      return false;
    }
    if(r.ok){ dirty=false; baselineSavedAt=S._savedAt; setSave('ok','Enregistré '+hhmm()); return true; }
    const j=await r.json().catch(()=>null);
    motif=(j&&j.error)||('erreur '+r.status+' du serveur');
    SAVE_TAILLE=payload.length;
  }catch(e){
    // Serveur injoignable : fenêtre noire fermée, port occupé, machine en veille.
    motif = (e&&e.message==='mode-coquille') ? '' : 'serveur local injoignable — la fenêtre noire « Serveur PPM » est-elle encore ouverte ?';
  }
  if(ls){ dirty=false; baselineSavedAt=S._savedAt; setSave('ok','Enregistré (local) '+hhmm()); return true; }
  SAVE_MOTIF=motif||'cause inconnue';
  setSave('err','Échec — '+(motif?motif.slice(0,38)+(motif.length>38?'…':''):'non enregistré'));
  alerterEchec();
  return false;
}
/* Un enregistrement qui échoue sans dire pourquoi laisse l'utilisateur devant
   un bouton rouge et rien d'autre. On nomme la cause, une fois, et on propose
   la seule parade qui ne dépende de personne : écrire les données dans un
   fichier. */
let SAVE_MOTIF='', SAVE_TAILLE=0, SAVE_ALERTE=0;
function alerterEchec(){
  const t=Date.now();
  if(t-SAVE_ALERTE < 60000) return;          // une fois par minute au plus
  SAVE_ALERTE=t;
  const taille=SAVE_TAILLE?('\n\nTaille des données : '+Math.round(SAVE_TAILLE/1024/1024*10)/10+' Mo.'):'';
  const ok=confirm('Vos données n\'ont PAS été enregistrées.\n\nMotif : '+SAVE_MOTIF+taille
    +'\n\nRien n\'est perdu tant que cette fenêtre reste ouverte. Voulez-vous exporter vos données dans un fichier maintenant, par sécurité ?');
  if(ok) openDataHub('export');
}

  if(!AUTH.enforced){ showRegister(); return; }    // premier lancement : creation du compte
  try{ localStorage.removeItem('ppm_vitry_state'); }catch(_){}
  if(s.authenticated){
    AUTH.locked=false; AUTH.user=s.user; AUTH.expiresAt=s.expiresAt||0;
    startSessionWatch();
    await syncFromServer(); render();
  } else showLogin();
}

function totals(list){
  const t={c1:0,c2:0,b27:0,act:0,spe:0,n:list.length,red:0,amber:0};
  list.forEach(p=>{t.c1+=p.c1||0;t.c2+=(p.c2!=null?p.c2:p.c1)||0;t.b27+=p.b27||0;t.act+=p.act||0;t.spe+=p.spe||0;
    const h=projHealth(p).band; if(h==='r')t.red++; else if(h==='a')t.amber++;});
  return t;
}

function filtered(){
  const f=S.filters;
  const base = f.trash ? S.projects.filter(p=>p.deleted)
             : (f.dup ? S.projects.filter((p,i)=>!p.deleted && doublonIdx().has(i))
                      : PROJ());
  return base.filter(p=>{
    if(f.pole){ if(p.group!==f.pole) return false; }
    if(f.statut && p.statut!==f.statut) return false;
    if(f.q){
      const q=norm(f.q);
      const champs = f.qscope==='pm' ? [p.pm]
                   : f.qscope==='pl' ? [p.pl]
                   : f.qscope==='sponsor' ? [p.sponsor]
                   : [p.nom,p.shine,p.pm,p.pl,p.sponsor,p.ishift];
      if(!champs.some(v=>norm(v).includes(q))) return false;
    }
    return true;
  });
}

function wireRows(){ $$('#projTbl tbody tr[data-id]').forEach(tr=>tr.addEventListener('click',()=>{S.currentProj=tr.dataset.id; S.tab='pass'; render();}));
  /* Glisser-déposer : la ligne n'est saisissable que par sa poignée, sinon le
     moindre glissement sur une cellule éditable deviendrait un déplacement. */

  const nettoyer=()=>$$('#projTbl tbody tr').forEach(t=>t.classList.remove('dropav','dropap','dragging'));
  $$('#projTbl tbody tr[data-gi]').forEach(tr=>{
    const poignee=tr.querySelector('.pgrab');

    });
    tr.addEventListener('dragend',()=>{ tr.draggable=false; source=null; nettoyer(); });
    tr.addEventListener('dragover',e=>{

      e.preventDefault(); try{ e.dataTransfer.dropEffect='move'; }catch(_){}
      const r=tr.getBoundingClientRect(), apres=(e.clientY-r.top)>r.height/2;
      tr.classList.toggle('dropap',apres); tr.classList.toggle('dropav',!apres);
    });
    tr.addEventListener('dragleave',()=>tr.classList.remove('dropav','dropap'));
    tr.addEventListener('drop',e=>{
      if(source==null) return;
      e.preventDefault(); e.stopPropagation();
      const r=tr.getBoundingClientRect(), apres=(e.clientY-r.top)>r.height/2;
      const src=source; source=null; nettoyer();
      deplacerProjet(src,+tr.dataset.gi,apres);
    });
  });
  // Les actions de ligne ne doivent pas ouvrir le passeport au passage.
  const agir=(sel,fn)=>$$('#projTbl ['+sel+']').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); fn(+b.dataset[sel.replace('data-','')]); }));
  agir('data-parch', projArchiver); agir('data-pdel', projCorbeille);

  $$('#projTbl [data-dpf]').forEach(el=>{ el.addEventListener('click',e=>e.stopPropagation()); el.addEventListener('blur',()=>{const parts=el.dataset.dpf.split('|'); const f=parts[0], id=parts.slice(1).join('|'); const pr=S.projects.find(x=>x.id===id); if(pr){pr[f]=el.textContent.trim(); scheduleSave();}}); }); }

/* ---- Installation des One Pages fournis ----------------------------------
   Appelée après chaque chargement d'état. Elle ne fait rien deux fois : le
   projet servi est retenu dans S.opSeeded, et rien n'est écrit sur une page
   déjà travaillée. Objectif : ces deux projets s'ouvrent renseignés, tous les
   autres gardent la page vierge qu'ils avaient. */
/* Le cahier des objectifs qui concerne un projet donne, s'il y en a un. On
   interroge dans l'autre sens que l'amorce : elle part du cahier et cherche
   son projet — et renonce quand le mot-cle en designe plusieurs ; ici on part
   du projet, et la question n'a plus d'ambiguite. */
function idcCDOde(p){
  if(!p||typeof SEED_OP!=='object'||!SEED_OP) return null;
  const mien=[p.id,p.shine,p.ishift,p.code].filter(Boolean).map(norm);
  let parMot=null;
  for(const cle of Object.keys(SEED_OP)){
    const e=SEED_OP[cle];
    if(!e.idc||((e.idc.lignes||[]).length)) continue;     // une bucket ne se reprend pas ainsi
    const codes=((e.cles&&e.cles.codes)||[]).map(norm);
    if(codes.some(c=>mien.includes(c))) return {cle,e};
    const mots=((e.cles&&e.cles.nom)||[]).map(norm);
    if(!parMot && mots.some(x=>norm(p.nom||'').includes(x))) parMot={cle,e};
  }
  return parMot;
}
/* Poser un cahier sur une carte : zone par zone, et seulement sur du blanc.
   Rend le nombre de zones comblees — zero veut dire « tout y etait deja ». */
function idcPoserCDO(d,src,p,essai){
  const s=JSON.parse(JSON.stringify(src||{}));
  const comble=(k,v)=>{ if(v && !String(d[k]||'').trim()){ if(!essai) d[k]=v; return 1; } return 0; };
  const vierge=!idcRempli(d);
  let k=0;
  ['description','benefits','rationale','timeline'].forEach(x=>{ k+=comble(x,s[x]); });
  if(s.gap && (!String(d.gap||'').trim() || d.gap===IDC_GAP0)){ if(!essai) d.gap=s.gap; k++; }
  if(s.fin) ['capex','opex'].forEach(y=>{ if(!s.fin[y]) return;
    ['b','r'].forEach(z=>{ if(!Array.isArray(s.fin[y][z])) return;
      s.fin[y][z].slice(0,4).forEach((v,i)=>{
        if(v!=='' && !String(d.fin[y][z][i]||'').trim()){ if(!essai) d.fin[y][z][i]=v; k++; } }); }); });
  if(vierge && s.statut && IDC_STATUTS.includes(s.statut) && !essai) d.statut=s.statut;
  k+=comble('nom', s.nom||(p&&p.nom)); k+=comble('code', s.code||(p&&(p.shine||p.ishift)));
  k+=comble('pm', s.pm||(p&&p.pm)); k+=comble('sponsor', s.sponsor||(p&&p.sponsor));
  /* Les approbateurs portent une valeur par defaut : la liste du cahier la
     remplace, mais jamais une liste saisie a la main. */
  if(s.approvers && (!String(d.approvers||'').trim() || d.approvers==='PPM, finance, Resp secteur')
     && d.approvers!==s.approvers){ if(!essai) d.approvers=s.approvers; k++; }
  k+=comble('maj', s.maj);
  return k;
}
function opSeedProjet(e){
  const codes=(e.cles&&e.cles.codes||[]).map(norm);
  const mots=(e.cles&&e.cles.nom||[]).map(norm);
  const vivants=(S.projects||[]).filter(p=>!p.deleted);
  /* Un code identifie sans ambiguïté ; le mot-clé ne sert qu'à défaut, et
     seulement s'il ne désigne qu'un projet — sinon on ne devine pas. */
  let p=vivants.find(x=>[x.id,x.shine,x.ishift,x.code].some(v=>v&&codes.includes(norm(v))));
  if(!p && mots.length){
    const cand=vivants.filter(x=>mots.some(m=>norm(x.nom||'').includes(m)));
    if(cand.length===1) p=cand[0];
  }
  return p||null;
}
/* Frise vierge : ni date, ni jalon, ni réalisation, ni fenêtre fixée. On ne se
   fie pas au nombre de lignes — le gabarit en pose deux, vides. */
function opVierge(o){
  if((o.wbs||[]).reduce((n,w)=>n+((w.milestones||[]).length),0)) return false;
  if((o.wbs||[]).some(w=>w.type==='bar'&&(w.start||w.end))) return false;
  if((o.ach||[]).length) return false;
  if(o.endMarker||o.ganttStart||o.ganttEnd) return false;
  return true;
}
/* Les blocs partagés avec la fiche (jalons, risques, étapes) sont complétés,
   jamais remplacés : une ligne déjà saisie reste telle quelle, et seules les
   lignes absentes sont ajoutées. Comparaison sur le libellé, accents et casse
   ignorés, pour ne pas créer de doublon sur une reprise. */
function opFondre(cible,ajouts,cle){
  const vus=new Set((cible||[]).map(x=>norm(cle(x))));
  let n=0;
  (ajouts||[]).forEach(x=>{ const k=norm(cle(x)); if(!k||vus.has(k))return; vus.add(k); cible.push(x); n++; });
  return n;
}
/* Reprise des blocs budget enregistrés avant la refonte des lignes.
   Les libellés que l'application posait elle-même (« Budget », « YTD
   Commit. », « Spent ») prennent les nouveaux ; un libellé saisi à la main
   garde le sien, et ne reçoit qu'un rôle — sans quoi renommer la ligne de
   quelqu'un reviendrait à décider à sa place. La ligne « Available Amount »
   est insérée avant l'atterrissage quand elle manque. */
const OP_BLABELS={'budget':'Budget Value','ytd commit.':'Open Commitments','ytd commitment':'Open Commitments',
                  'spent':'Actuals Amount'};
function migrerBudgetOP(){
  if(!S.kits) return 0;
  let n=0;
  Object.keys(S.kits).forEach(id=>{
    const k=S.kits[id]; const o=k&&k.op; if(!o||!o.budget||!Array.isArray(o.budget.rows)) return;
    const av=JSON.stringify(o.budget.rows.map(r=>[r.role||'',r.label]));
    o.budget.rows.forEach(rw=>{
      const std=OP_BLABELS[String(rw.label||'').trim().toLowerCase()];
      if(std) rw.label=std;
      const r=opRole(rw); if(r) rw.role=r;
    });
    /* Aucune ligne ne se donne pour la dotation : c'est la première, par
       convention de l'outil comme de la lecture. Sans ce repli, le disponible
       se calculerait sur un budget nul dès qu'une ligne a été renommée. */
    if(!o.budget.rows.some(rw=>rw.role==='budget')){
      const p=o.budget.rows.find(rw=>!rw.role);
      if(p) p.role='budget';
    }
    if(!o.budget.rows.some(rw=>rw.role==='dispo'))
      o.budget.rows.push({id:kuid(),role:'dispo',label:'Available Amount',values:o.budget.years.map(()=>0)});

    o.budget.rows=o.budget.rows.map((r,i2)=>({r,i2}))
